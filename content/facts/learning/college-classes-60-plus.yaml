slug: college-classes-60-plus
text: "**College classes for 60 and older:** state law says each public college in West Virginia must offer lower tuition to state residents who are 60 or older, when there is room in the class. You can sit in on a class with no grade or credit, or take it for credit for no more than half the usual in-state rate. Each college sets its own rules, so ask the college's admissions office."
quote: >-
  "Each governing board shall promulgate a rule establishing a reduced tuition and fee program for senior citizens. The rule shall include at least the following: (1) One option for individuals who attend undergraduate and graduate courses without receiving credit and one option for those who attend undergraduate and graduate courses for credit; (2) ... (A) The participant is a resident of West Virginia or classified as a metro area student at the institution; (B) The participant is 60 years of age or older; and (C) Classroom space is available; ... (7) ... tuition and fee rates may not exceed 50 percent of the normal rates charged to state residents by the institution."
sources:

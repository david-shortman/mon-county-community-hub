slug: mit-living-wage
text: "**MIT Living Wage Calculator, updated February 15, 2026:** a single adult needs **$42,121 a year** before taxes, about $20.25 an hour at a full-time job. One adult with one child needs $71,638. Two adults who both work, with two children, need $100,600 together, about $24.18 an hour each. For a single adult, the yearly costs include $11,036 for housing, $4,335 for food, $8,367 for transportation and $3,269 for medical care, plus civic costs, internet and phone, other costs and taxes. Living wage data sourced from the Living Wage Institute via [livingwage.mit.edu](https://livingwage.mit.edu)."
quote: "Living Wage Calculation for Monongalia County, West Virginia ... The data on this page was last updated on February 15, 2026. ... Living Wage $20.25 [1 adult, 0 children] ... $24.18 [2 adults both working, 2 children] ... Food $4,335 ... Medical $3,269 ... Housing $11,036 ... Transportation $8,367 ... Required annual income before taxes $42,121 [1 adult, 0 children] ... $71,638 [1 adult, 1 child] ... $100,600 [2 adults both working, 2 children]. all data used in calculating a living wage is adjusted for inflation to December 2025 dollars"

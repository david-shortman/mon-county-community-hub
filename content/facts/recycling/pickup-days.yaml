slug: pickup-days
text: "**Inside Morgantown city limits,** Republic Services is the hauler. Its [Morgantown page](https://www.republicservices.com/municipality/morgantown-wv) has a \"View my service schedule\" button: enter your address to see your pickup and holiday days. **In Granville,** the town says pickup is every Monday or Tuesday, depending on where you live. **Westover, Star City and outside the towns:** we could not find a public list or lookup of pickup days."
quote: "View your pickup and holiday schedule. This button will take you to the national Republic Services website where you will enter your service address to see your holiday and pickup schedule. ... Trash pickup is provided by the Town of Granville and runs every Monday or Tuesday, depending on your location. ... Recycling - City of Morgantown (within city limits) ... Republic Services of City of Morgantown website"

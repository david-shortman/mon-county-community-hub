slug: electronics
text: "**Electronics:** the county holds free electronics recycling events in the spring and fall (see Coming up below). West Virginia also has a free take-back list for certain devices, linked from the [county recycling page](https://www.monongaliacountyswa.com/recycling)."
quote: "The Monongalia County SWA's Our Spring and Fall Paper and Electronics Recycling Events ... 2026 FALL FREE Electronics Recycle Collection Event" and (recycling page) "review the 2024 WV Covered Electronics Device (CED) Free Recycling Take-back Program list"

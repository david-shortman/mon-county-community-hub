slug: electronics
text: "**Electronics:** the county holds free electronics recycling events in the spring and fall (see Coming up below). West Virginia also has a free take-back list for certain devices, linked from the [county recycling page](https://www.monongaliacountyswa.com/recycling)."
quote: 'Events page: "The Monongalia County SWA''s Our Spring and Fall Paper and Electronics Recycling Events ... 2026 Electronics Collection Events". E-cycle page: "The Monongalia County SWA next FREE Electronics (E-cycle) Collection Event ... will hold another e-cycle event in Spring 2027". Recycling page: "review the 2024 WV Covered Electronics Device (CED) Free Recycling Take-back Program list"'

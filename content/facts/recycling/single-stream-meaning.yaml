slug: single-stream-meaning
text: "**Single-stream** means all your recyclables (paper, cardboard, plastic, cans) go in one bin, with no sorting. A **sorted** site has a separate bin for each kind."
quote: "Single stream recycling: (also referred to as commingled recycling) is a system in which all recyclables, including newspaper, cardboard, plastic, aluminum, junk mail, etc., are placed in a single bin or cart for recycling"
sources:

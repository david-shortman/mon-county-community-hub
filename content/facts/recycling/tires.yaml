slug: tires
text: "**Tires:** a state tire collection runs monthly in Morgantown, except December, January and February. The county's [tire page](https://www.monongaliacountyswa.com/tires) has the yearly schedule."
quote: "Starting June 10, 2023 the City of Morgantown began hosting the WV DEP monthly tire drop-off program. ... The Tire Collection Events are NOT operated in December, January or February."

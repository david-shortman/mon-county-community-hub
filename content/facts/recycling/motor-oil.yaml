slug: motor-oil
text: "**Used motor oil and oil filters:** never pour oil on the ground or down a drain. The EPA says to pour it into a can or container that will not leak, and ask auto repair shops, waste haulers or local government where to drop it off. Drain oil filters too. They usually go to the same place as the oil. Here, the Solid Waste Authority points to MUB's yearly [household hazardous waste day](/recycling/#fact-hhw-day), which took used motor oil and oil filters in 2025. We could not find a year-round local government drop-off for oil, so you can also ask the Solid Waste Authority. The Mountaineer Transfer Station does not take oil."
quote: '"If you plan to recycle your used oil, take care not to spill any when you collect it and place it in a leak-proof can or container. Check with local automobile maintenance facilities, waste collectors, and government waste officials to find out when and where you can drop off your used oil for recycling. Don''t forget to drain and recycle used oil filters as well ... usually you can drop off the filters at the same collection centers where you deposit used oil." ... SWA 2026 calendar, inside back: "Some of the Items NOT Accepted at the Mountaineer Transfer Station ... Hazardous Waste (including pesticides, oil) – view MUB''s Annual Residential Household Hazardous Waste Collection Day Event details" ... SWA 2025 calendar, list of accepted items: "Motor Oil (Used)" ... "Oil Filters (used)" ... Mountaineer Transfer Station information sheet: "WE DO NOT ACCEPT THE FOLLOWING: ... OILS OR OIL CONTAMINATED SOILS"'

slug: motor-oil
text: "**Used motor oil and oil filters:** never pour oil on the ground or down a drain. The EPA says to pour it into a can or container that will not leak, and ask auto repair shops, waste haulers or local government where to drop it off. Drain oil filters too. They usually go to the same place as the oil. We could not find a local government drop-off for oil, so you can also ask the Solid Waste Authority."
quote: '"If you plan to recycle your used oil, take care not to spill any when you collect it and place it in a leak-proof can or container. Check with local automobile maintenance facilities, waste collectors, and government waste officials to find out when and where you can drop off your used oil for recycling. Don''t forget to drain and recycle used oil filters as well ... usually you can drop off the filters at the same collection centers where you deposit used oil." Page also links the poster "You Dump It, You Drink It".'

slug: appliances
text: "**Fridges, freezers and air conditioners:** the Mountaineer Transfer Station does not take appliances that hold refrigerant unless a licensed vendor has removed the Freon and tagged the appliance. For other appliances and scrap metal, we could not find a local official page. Call the transfer station or the Solid Waste Authority to ask."
quote: "Disposal page: \"They do not accept tires and other items which are listed in the letter. If you have questions about what they accept and how contact them at the number listed below.\" ... MTS info sheet: \"WE DO NOT ACCEPT THE FOLLOWING: ... APPLIANCES CONTAINING REFRIGERANT o EXAMPLES INCLUDE AIR CONDITIONERS, REFRIGERATORS, FREEZERS, ETC. UNLESS FREON IS REMOVED AND TAGGED BY A LICENSED VENDOR\""

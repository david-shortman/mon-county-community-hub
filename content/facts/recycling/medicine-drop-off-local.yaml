slug: medicine-drop-off-local
text: "**Year-round drop-off in Mon County:** the county health department says the Morgantown and Granville police departments both have year-round medicine drop-off bins. Call the police department before you go to ask when you can use it. Morgantown police: 304-284-7522, ext. 0."
quote: 'Health department, April 2026: "both the Morgantown and Granville police departments have year-round drop-off bins." City police page: "MPD Non-Emergency: 304-284-7522 , ext. 0".'

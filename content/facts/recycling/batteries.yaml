slug: batteries
text: "**Batteries:** the EPA says never to put lithium, lithium-ion, button or coin, or rechargeable batteries in the trash or a recycling bin, since they can start fires. Tape the ends or put each one in its own plastic bag, then take them to a battery recycler, a store that takes batteries back, or a household hazardous waste collection. Car batteries go back to a battery seller. The EPA says most places allow everyday alkaline batteries (AA, AAA, C, D, 9 volt) in household trash, but it suggests recycling them. Find a drop-off with [The Battery Network](https://batterynetwork.org/) (the EPA links it by its old name, Call2Recycle) or [Earth911](https://search.earth911.com/?what=Batteries), which the EPA also links. We could not find a local government drop-off, so you can also ask the Solid Waste Authority."
quote: '"To prevent fires from lithium-ion batteries, tape battery terminals and/or place batteries in separate plastic bags and never put these batteries in household garbage or recycling bins." ... Alkaline: "In most communities, alkaline and zinc carbon batteries can be safely put in your household trash. EPA recommendation: send used alkaline and zinc carbon batteries to battery recyclers or check with your local or state solid waste authority." ... Button and lithium: "Do not put button-cell, coin, or lithium single use batteries in the trash or municipal recycling bins." ... Rechargeable: "can be brought to specialized battery recyclers, participating retailers that provide battery takeback services" ... "Do not put rechargeable batteries in the trash or municipal recycling bins." ... Lead-acid: "Return lead-acid batteries to a battery retailer" ... "Find a Recycling Location Near You: Earth911, Call2Recycle"'

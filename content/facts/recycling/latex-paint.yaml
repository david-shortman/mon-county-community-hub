slug: latex-paint
text: "**Latex paint:** the county plans a collection in 2027 but has no date yet. For oil-based paint and other household chemicals, the county points to the Morgantown Utility Board's yearly household hazardous waste day."
quote: "October 10, 2026 UPDATE: We are in the process of planning a collection event for latex paint in 2027. ... MUB's Annual Household Hazardous Waste Collection Day Event where you can take oil based paint"

slug: needles
text: "**Used needles and other sharps:** the FDA says to put them in a sharps container right after you use them. When the container is about three-quarters full, get rid of it the way your community says. The rules depend on where you live, so the FDA says to ask your trash service or health department. Do not reuse a sharps container. For state rules, the FDA lists Safe Needle Disposal at [1-800-643-1643](tel:+18006431643)."
quote: '"Step 1: Place all needles and other sharps in a sharps disposal container immediately after they have been used." ... "When your sharps disposal container is about three-quarters (3/4) full, follow your community guidelines" ... "DO NOT reuse sharps disposal containers." ... "Sharps disposal guidelines and programs vary depending on where you live. Check with your local trash removal services or health department" ... "For more information specific to your state, call Safe Needle Disposal at 1-800-643-1643"'

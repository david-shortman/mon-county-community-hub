slug: yard-waste
text: "**Yard waste and brush:** we could not find a local drop-off on an official page. The Solid Waste Authority has a small community compost demonstration site in Westover's city park. Spots are limited, Westover residents come first, and you volunteer to share in the compost."
quote: "\"The Community Compost Demonstration Site, with a garden and pollinator garden, will be located in the City of Westover Park.\" ... \"City of Westover residents have priority\" ... \"Participation is limited\" ... \"Participants interested in the compost and/or flowers will need to volunteer hours with the composting or with the gardening.\""

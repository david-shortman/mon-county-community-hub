slug: city-recycling-event
text: "**City residents:** the county lists a Republic Services recycling event every second Saturday. Confirm the place and time with the hauler."
quote: "City of Morgantown residents living within the city limits of Morgantown can attend every 2nd Saturday for the City of Morgantown recycling event."

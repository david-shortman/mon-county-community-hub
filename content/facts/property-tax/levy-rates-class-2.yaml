slug: levy-rates-class-2
text: "**Levy rates for a home you own and live in (Class II):** $1.3176 for each $100 of assessed value inside Blacksville, Granville, Star City, Westover and Morgantown, and $1.0676 for each $100 in the rest of the county. These are from the Assessor's 2026 levy rate table."
quote: "RATE ON EACH $100.00 VALUATION / MONONGALIA COUNTY / 2026 ... CLASS II ... BATTELLE [and Cass, Clay, Clinton, Grant, Morgan, Osage, Union] 0.0050 0.2200 0.0954 0.7472 [blank] 1.0676 ... BLACKSVILLE [and Granville, Star City, Westover, Morgantown] 0.0050 0.2200 0.0954 0.7472 0.2500 1.3176"
sources:
  - url: https://assessor.org/DocumentCenter/View/16134/2026-Levy-Rates-PDF
    name: Monongalia County Assessor, 2026 Levy Rates (PDF), linked from the Assessor's home page
    checked: 2026-11-14
recheck_days: 90   # new rates each tax year (#1520 settled 2026-11-14: the Assessor now posts a 2026 table)
# The rates as numbers, for the "See how your bill is figured" tool on
# /property-tax/ (#1446). Dollars for each $100 of assessed value, exactly as
# the table prints them. parts must add up to total (check-content checks it).
rates:
  - id: towns
    label: Inside Blacksville, Granville, Star City, Westover or Morgantown

slug: intermediate-hours
text: "You may drive alone between 5 a.m. and 10 p.m. From 10 p.m. to 5 a.m., a supervising adult must be with you, unless you are going to or from work, a school activity, a religious activity, or an emergency where you must drive to keep someone from being hurt or killed."
quote: "May drive without supervising adult between 5:00 am and 10:00 pm ... Must be accompanied by a supervising adult driver between the hours of 10:00 pm and 5:00 am EXCEPT when the licensee is participating in or returning from:Employment ... A school sanctioned activity ... A religious activity ... An emergency situation requiring the licensee to operate a motor vehicle to prevent bodily injury or death of another"

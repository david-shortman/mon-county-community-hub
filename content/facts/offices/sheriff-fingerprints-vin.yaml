text: "Monongalia County Sheriff's Office, [304-291-7260](tel:+13042917260). **$5** each, cash or check only. Fingerprints Tuesday and Thursday only, 8:30 a.m. to 4 p.m., no appointment needed. VIN checks Monday to Friday, 8:30 a.m. to 4 p.m."

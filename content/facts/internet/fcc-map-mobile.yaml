slug: fcc-map-mobile
text: "The map shows home internet first. For cell phone coverage, pick the **Mobile Broadband** tab. Mobile coverage is for outdoors or in a moving car, not inside a building."
quote: "If you want to view a map showing “mobile” or cellular broadband coverage select the Mobile Broadband tab on the upper right-hand side of the page. ... The coverage areas reflect where consumers should be able to connect to the mobile network when outdoors or in a moving vehicle; they do not show indoor coverage."

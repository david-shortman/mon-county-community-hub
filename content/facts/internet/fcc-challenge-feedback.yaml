slug: fcc-challenge-feedback
text: "The form also lets you choose **Just giving feedback** instead. Then the company is not challenged, but the FCC keeps what you sent. You can also add a company that serves you but is missing from the map."
quote: "If you select option 2, your submission will not be shared with the selected provider as a challenge; it will be considered as a crowdsource data submission"

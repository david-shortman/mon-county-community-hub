slug: fcc-map-slow-hidden
text: "The map starts out hiding service slower than 25 Mbps download. To see it, change the speed choices under **Service Filters** above the map."
quote: "Services with download speeds below 25 Mbps are not shown on the default map, but can be found by using the filtering function described below."

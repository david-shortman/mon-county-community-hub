slug: underserved
text: "**Underserved:** the place can get internet faster than 25 Mbps download and 3 Mbps upload, but slower than 100 and 20."
quote: "Underserved : A location receiving broadband speeds less than 100 Mbps download and 20 Mbps upload and greater than 25 Mbps download and 3 Mbps upload"

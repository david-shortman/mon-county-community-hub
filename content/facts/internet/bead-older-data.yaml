slug: bead-older-data
text: "The state's map uses newer FCC data than the state used to pick places for its BEAD grants. So the state says some places the map shows as unserved or underserved may not have been eligible for BEAD money."
quote: "some locations shown as unserved or underserved on this map may not have been eligible for BEAD funding"

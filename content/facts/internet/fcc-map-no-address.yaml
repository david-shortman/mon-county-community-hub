slug: fcc-map-no-address
text: "No street address yet? Type a town name and state, then zoom in on the map and click the building."
quote: "If you don’t have a street address, you can enter a town name and state, or select “Location” underneath the search bar on the home page. You can then zoom on the map to find a particular location."

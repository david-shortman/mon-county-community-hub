slug: council-agenda
text: "The agenda packet goes online the Thursday afternoon before each meeting. Meetings stream live on the city's YouTube channel and Comcast Channel 14."
quote: "Copies of the Meeting Agenda are available in the City Clerk's office in the afternoon on the Thursday before a meeting ... Comcast Cable Channel 14 ... Meetings can also be viewed live and on demand online from the city's YouTube Channel."

slug: mpo-meets
text: "Each agenda gives the date, time and place. Meetings stream live on the MPO's YouTube channel and air on Morgantown's Channel 14. The Policy Board approves the area's long-range transportation plan and the list of road, bus, walking and biking projects that use federal money."
quote: "Meetings are shown on public access television (Morgantown’s Channel 14) and also streamed live on the MPO's YouTube Channel."

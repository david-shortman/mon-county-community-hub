slug: mpo-plan-comment
text: "Before the MPO adopts a major plan, like the long-range transportation plan, it opens a 45-day comment period. Federal rules require at least 30 days."
quote: "Federal regulations require a minimum of at least 30 days before key decisions are made and documents are adopted. MMMPO allows a 45-day comment period for major planning deliverables."

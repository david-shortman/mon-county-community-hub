slug: mountain-line-comment
text: "Each monthly board meeting has up to 30 minutes for public comment on Mountain Line or other transportation topics. Each person gets up to 5 minutes. Give your name, address and topic before you speak. To leave written comments, bring a copy to hand to the board. The board does not answer questions during this time."
quote: "Each person wishing to make a public comment shall be limited to 5 minutes"
sources:

slug: mpo-comment
text: "Each Policy Board meeting starts with a public comment period. You can comment in person, by phone or video through Webex, or in writing. Comments are limited to 4 minutes, and you give your name and address first. You can watch the two advisory committee meetings, but the public does not comment at those."
quote: "There is a public comment period at the beginning of the Policy Board meeting. The public is allowed to 'sit-in' (virtually or in person) at the TTAC and CAC meetings, but not allowed to comment."

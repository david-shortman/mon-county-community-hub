slug: planning-speak
text: "You can speak during the public hearing on a case, for up to 5 minutes. If many people from a group want to speak, the chair may ask one person to speak for the group."
quote: "All speakers are limited to five (5) minutes ... ask a representative to speak on behalf of the group or organization"

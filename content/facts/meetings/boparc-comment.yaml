slug: boparc-comment
text: "Each public comment is limited to 3 minutes. If several people want to speak on the same subject, they pick one person to speak for them. The board does not act on public comments unless the subject is already on the agenda."
quote: "Each comment is limited to three minutes. If there is multi-person interest in one subject, a single representative must be appointed to speak. There will be no official action taken on Public comment (except in instances where the subject of interest is already an Action Item on the Agenda)."

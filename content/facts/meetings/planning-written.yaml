slug: planning-written
text: "You can also send written comments or evidence, like reports or photos, to the Planning Division before the meeting. Send evidence and long comments at least 5 days before."
quote: "Written comments may be submitted to the Office of the Planning Division prior to the public meeting ... up to five (5) days prior to the public meeting"

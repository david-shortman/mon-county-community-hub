slug: council-meets
text: "Regular meetings on the 1st and 3rd Tuesday of the month at 7 p.m. in Council Chambers at City Hall. A Committee of the Whole meets the last Tuesday at 7 p.m. It is a work session where Council talks but takes no formal action."
quote: "1st and 3rd Tuesdays of the month ... 7 p.m. ... Council Chambers ... Last Tuesday of the month ... Committee of the Whole meetings are work sessions of Council. No formal actions are taken at these meetings."

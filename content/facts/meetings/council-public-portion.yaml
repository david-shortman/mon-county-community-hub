slug: council-public-portion
text: "Regular meeting agendas have a \"public portion,\" which follows rules Council sets by resolution. We could not find those rules on a city page, so ask the City Clerk how to sign up and how long you can speak."
quote: "PUBLIC PORTION WHICH SHALL BE SUBJECT TO RULES ESTABLISHED BY COUNCIL AND ADOPTED BY RESOLUTION"

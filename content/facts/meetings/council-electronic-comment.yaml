slug: council-electronic-comment
text: "A Council policy adopted May 6, 2025 says that when a meeting has a public comment time, you may also comment by phone or send a written comment electronically. Written comments do not have to be read aloud."
quote: "Members of the public that would like to provide comments during the meeting may do so telephonically or by submitting written comments electronically, but comments submitted in writing need not be read aloud during the meeting. ... Adopted: May 6, 2025"

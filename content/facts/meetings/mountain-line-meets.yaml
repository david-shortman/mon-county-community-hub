slug: mountain-line-meets
text: "Official pages give different days and times for the board's meetings in Westover. The City's page says the 3rd Wednesday at noon at the Mountain Line depot. The County's page says the 2nd Wednesday at 6 p.m. at the transit station. Call Mountain Line before you go."
quote: "12:00 p.m. 3rd Wednesday of each month MountainLine Transit Depot - Westover"

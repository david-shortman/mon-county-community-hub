slug: county-west-run-zoning
text: "**Zoning, only in the West Run district.** Only the West Run Planning District, north of Morgantown, is zoned. There, building or adding on to a home, a new or replaced deck, a shed or garage, a patio, a paved driveway or an in-ground pool needs a **Land Use Permit**. The county says a fence, landscaping, a retaining wall, a new roof or siding, new windows or doors, and work inside the home do not. Check the County GIS map to see if the property is zoned."
quote: >-
  Only the West Run Planning District is zoned at this time. ... As a basic guideline within the West Run Zoning District the following items require a permit: Construction of or addition to a residence ... Construction of a patio or sidewalk Construction or complete replacement of a deck Construction of or addition to a paved driveway Installation of outbuildings such as sheds, garages, or shelters Installation of an in-ground pool ... the following projects do not require a Land Use Permit: Construction of a fence Installation of landscaping such as flowers, woodchips, trees or the like Installation of a retaining wall ... Maintenance of onsite structures including residing, reroofing, replacement of windows or doors ... Interior work only ... The zoned areas of the county can be found on the County GIS Website. The West Run Zoning Layer is found at the bottom of the legend. ... zoom in ... over the north end of Morgantown.

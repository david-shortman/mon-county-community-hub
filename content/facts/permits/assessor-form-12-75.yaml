slug: assessor-form-12-75
text: "If you build, add on or remodel and the property's value goes up by more than $1,000, you must tell the Assessor on **Form 12:75**, within 60 days of when the work started. If you got a permit from a town, that counts as telling the Assessor. Forms are at the Assessor's office."
quote: >-
  All individuals or contractors who erect, add, enlarge, move, alter, convert, remodel or build whereby the value increases by more than $1,000 must notify the Assessor on Form 12:75 within 60 days from the date the work has commenced. If a municipality permit has been obtained this will be sufficient notice under section (11-3-3a of the WV Code). Forms are available in the County Assessor's office.

slug: county-septic-wells
text: "**Septic systems and wells.** A new, changed or failing septic system starts with a certified installer, and a new well starts with a certified well driller. Each one sends an application to the Monongalia County Health Department, which issues a construction permit. Call [304-598-5131](tel:+13045985131), or see [Septic systems and well water](/septic-and-wells/)."
quote: >-
  The process for installing a new on-site sewage system, modifying an existing on-site sewage system or repairing a failing on-site sewage system starts with choosing a certified installer. ... The homeowner/property owner and/or certified installer will fill out an on-site sewage system application and submit it to the health department. ... Once the sanitarian has approved the site, a construction permit for the new system, modification or repair will be issued by the health department. ... If you are installing a new water well ... the first step is to contact a certified well driller. ... The certified water well driller will then fill out a water well application and submit it to the health department. ... a construction permit will be issued by the health department. ... (304) 598-5131

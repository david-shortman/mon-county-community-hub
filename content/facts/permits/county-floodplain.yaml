slug: county-floodplain
text: "**Floodplain.** If any part of the property is in the floodplain, contact the county Floodplain Administrator. See [Is my home in a flood zone?](/flood-zone/#permit)"
quote: >-
  Within Mon County all areas prone to flooding fall under the Floodplain Ordinance. If, when looking up the property on the Mon County GIS Website, you find that all or part of your property falls within the designated floodplain area, please contact Floodplain Administrator at floodplain@monongaliacounty.gov.
sources:

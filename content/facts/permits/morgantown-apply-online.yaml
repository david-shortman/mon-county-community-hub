slug: morgantown-apply-online
text: "**Apply online.** All building permit applications go through the **Morgantown Access Portal**. You make an account, apply, pay fees and track it there. The city does not take paper permit applications."
quote: >-
  To apply for a building permit, vacant or rental property registration, business license, or planning and zoning application, you must create an account and complete your application through the Morgantown Access Portal. ... The platform allows citizens to submit applications, pay fees, track progress, and communicate with City staff all in one place. ... Does the City of Morgantown accept paper permit applications? No. All building permit applications must be submitted through the Morgantown Access Portal.

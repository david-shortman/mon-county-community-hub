slug: county-no-building-code
text: "The county says there is no local enforcement of the state building code outside the towns. These can still apply:"
quote: >-
  While West Virginia has a State Building Code, as administered by the State Fire Marshal via Title 87 Series 4, but within County jurisdiction, there is no local enforcement of building code at this time. Please see the municipal jurisdictions of Morgantown, Star City, Granville, and Westover.
sources:

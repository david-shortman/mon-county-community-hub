slug: morgantown-one-per-scope
text: "**One application for each kind of work.** Electrical work and plumbing work, for example, each need their own permit application."
quote: >-
  Do I need to submit a different permit application for each scope of work? Yes. For each proposed scope of work (i.e. electrical work, plumbing work, etc.) a separate permit application type will be required.

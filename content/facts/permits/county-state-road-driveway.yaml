slug: county-state-road-driveway
text: "**A new driveway onto a state road** needs a Division of Highways encroachment permit."
quote: >-
  Besides the State Fire Marshal, within Mon County, a Division of Highways Encroachment Permit must be applied for, for all new access points onto DOH maintained roads.

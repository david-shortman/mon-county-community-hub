slug: star-city
text: "Download the application from the town's Building Permits page, print it, fill it out and return it to the town office at 370 Broadway Ave. Fees must be paid in full before the permit is issued. Allow 72 hours. Do not start work until you have the approved permit. The town calls you when it is ready to pick up. Questions go to the Code Enforcement Officer at [304-599-3550](tel:+13045993550), Monday to Friday, 8 a.m. to 4:30 p.m."
quote: >-
  Please Allow 72 hours Processing Time to Issue Permit. Please select the links below to download the appropriate application. You will need to print and fill out this form and return it to our office for review and approval. All fees must be paid, in full, before building permit will be issued. Please keep in mind that you may not begin work on a job prior to receiving an approved permit. You will be notified by phone when the permit is available for pick-up. Should you have questions you may contact our Code Enforcement Officer during normal business hours at 304-599-3550. ... 370 Broadway Ave | Star City, WV 26505 | 304-599-3550 | ... Hours: 8:00AM - 4:30PM, M-F

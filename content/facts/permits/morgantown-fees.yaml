slug: morgantown-fees
text: "**Fees.** The city posts its permit fee schedule on the same page. B&O taxes are separate from permit fees."
quote: >-
  Fee Schedule ... Are my B&O Taxes included in my permit fee? No, your B&O Taxes are not included in the fee(s) associated with your building permit application.

slug: lost-wallet
text: "Lost your wallet but see no problems yet? The WV Attorney General says to act anyway: put a fraud alert on your credit, watch your bank and card statements, and order your credit reports."
quote: "Take immediate action even if your accounts show no problems ... Place a fraud alert with the three credit bureaus ... Monitor your bank and credit card statements and order your credit reports."
sources:

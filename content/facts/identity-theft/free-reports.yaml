slug: free-reports
text: "You can get a free credit report each year from Equifax, Experian and TransUnion. USA.gov says AnnualCreditReport.com is the only website the federal government authorizes for these free reports. Or call [1-877-322-8228](tel:+18773228228) (TTY 1-800-821-7232). Look for accounts you did not open."
quote: "By law, you can get a free credit report each year from the three credit reporting agencies ... AnnualCreditReport.com is the only website authorized by the federal government ... Call 1-877-322-8228 (TTY: 1-800-821-7232)"

slug: extended-fraud-alert
text: "**An extended fraud alert** lasts seven years and is free for identity theft victims. To get one, you need an Identity Theft Report filed with law enforcement. It also gives you two free credit reports from each company within 12 months, the Attorney General says."
quote: "Lasts for seven years instead of the standard alert period ... Extended fraud alerts are provided at no cost to identity theft victims."

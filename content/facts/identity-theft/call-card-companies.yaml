slug: call-card-companies
text: "Call the fraud department at your bank, your credit card companies and other places where you have accounts. Use the card company's 24 hour fraud number, then follow up in writing."
quote: "The fraud department at your credit card issuers, bank, and other places where you have accounts ... Contact your card issuer immediately using their 24-hour fraud reporting number."

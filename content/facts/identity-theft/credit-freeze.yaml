slug: credit-freeze
text: "**A credit freeze** stops lenders from seeing your credit report, so no one can open a new account in your name. USA.gov says you can freeze and unfreeze for free with each company. A freeze asked for online or by phone must start within one business day (three by mail). To apply for credit later, you lift the freeze. A lift asked for online or by phone must happen within one hour."
quote: "Freeze or lift the freeze on your credit report for free ... Online or by phone: agencies must freeze your credit report within one business day ... By mail: agencies must freeze your credit report within three business days ... Online or by phone: agencies must lift the freeze within one hour"
sources:

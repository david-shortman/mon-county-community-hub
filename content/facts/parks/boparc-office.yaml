slug: boparc-office
text: "BOPARC (the Morgantown Board of Parks and Recreation Commissioners) runs these parks. Its customer service desk is at the Wiles Hill Community Center, 287 Eureka Drive, on Monday, Tuesday, Thursday and Friday, and at the Marilla office in upper Marilla Park, 705 East Brockway Avenue, on Wednesday. Both are open 8 a.m. to 4 p.m. and close for lunch from noon to 1 p.m."
quote: "BOPARC Customer Service: Wiles Hill Community Center Monday, Tuesday, Thursday & Friday 8:00 AM–4:00 PM 287 Eureka Drive, Morgantown, WV Closed daily for lunch from noon to 1:00 PM. Marilla Customer Service Office Wednesday 8:00 AM–4:00 PM 705 East Brockway Ave., Morgantown, WV (Upper Marilla Park) ... Contact Us: 304-296-8356"

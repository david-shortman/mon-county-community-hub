slug: boparc-pavilions
text: "City pavilions: call BOPARC at [304-296-8356](tel:+13042968356). You pay and get a permit before you use the pavilion, and BOPARC does not rent pavilions the same day. Some small pavilions, like the ones at Jack Roberts Park, are first come, first served."
quote: "Pavilion Usage Requires Rental Fees to be Paid and Permit Secured Prior to Usage ... RESERVATIONS: (304) 296-8356, in-person OR book online ! PLEASE NOTE: BOPARC does not process same day rentals for shelters ... 3 small picnic pavilions (first come, first serve- rental fee not required)"

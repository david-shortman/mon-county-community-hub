slug: county-parks-office
text: "Monongalia County Parks and Recreation runs these three parks. Its office is at 270 Mylan Park Lane, Suite 150. Call [304-291-7013](tel:+13042917013) or email [parks@monongaliacounty.gov](mailto:parks@monongaliacounty.gov) (see the [county parks page](https://www.monongaliacounty.gov/departments/parks_and_recreation/))."

slug: free-fishing-days
text: "Free Fishing Days: in 2026 they were June 13 to 14, when anyone could fish public waters in West Virginia with no license. The DNR has not posted next year's dates yet. Check the [Free Fishing Days page](https://wvdnr.gov/free-fishing-days/)."
quote: "residents and nonresidents to cast their lines in public waters for free without having to buy a fishing license. West Virginia’s Free Fishing Days return June 13-14, 2026."

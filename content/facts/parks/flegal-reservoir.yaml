slug: flegal-reservoir
text: "Flegal Reservoir is another city park, still being built. BOPARC expects work to finish in December 2026. It is open from daylight to dark, and fishing is allowed. See the [BOPARC page](https://www.boparc.org/flegal-reservoir.html)."
quote: "the park is still under construction, so please use caution while visiting. ... Fishing is permitted ... Park is open from daylight to dark. ... expected completion is December 2026."

slug: nfip-not-covered
text: "**Regular insurance usually does not cover floods.** FloodSmart, the federal flood insurance program's site, says most homeowners and renters insurance does not cover flood damage. Flood insurance is a separate policy."
quote: >-
  Most homeowners and renters insurance does not cover flood damage. ... Most homeowners and renters insurance do not cover flood damage. Only a flood insurance policy will help you recover after a flood.

slug: county-floodplain-office
text: "Questions or an application: the **Monongalia County Floodplain Office**, [304-599-6332](tel:+13045996332) ext. 2, or email [floodplain@monongaliacounty.gov](mailto:floodplain@monongaliacounty.gov). The office is at the county Emergency Management Office. The county's application form lists a $20 fee."

slug: nfip-30-day-wait
text: "**There is usually a 30 day wait.** A new flood policy goes into effect 30 days after you buy it. There are a few exceptions, like buying it while you get or renew a mortgage. Do not wait for a storm to buy it."
quote: >-
  Your flood insurance coverage will go into effect 30 days after your date of purchase. There are four exceptions to this rule: There is no wait if you buy flood insurance while making, increasing, extending or renewing a mortgage.
sources:

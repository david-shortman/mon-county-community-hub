slug: county-red-shaded-area
text: "Monongalia County sends people to this map. The county says that if the red shaded area crosses any part of your property, the property falls under the County Floodplain Ordinance (see step 3)."
quote: >-
  To find out if your property is in the floodplain visit the West Virginia Flood Tool website. If the red shaded area crosses any part of your property, that property is subject to the County Floodplain Ordinance.

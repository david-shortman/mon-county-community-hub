slug: nfip-renters
text: "**Renters can get it too.** A renters flood policy covers the things you own inside your home, up to $100,000 of damage. This is called contents coverage."
quote: >-
  Renters flood insurance policies protect the things you own inside your home. ... This type of coverage protects your belongings for up to $100,000 of damage, this is also called Contents Coverage.

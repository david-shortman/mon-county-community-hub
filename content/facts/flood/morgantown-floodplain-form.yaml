slug: morgantown-floodplain-form
text: "Inside Morgantown city limits, the city has its own application to develop in a floodplain area. Its form says no work may begin until a permit is issued. We could not confirm which city office takes it, so ask the city when you call."
quote: >-
  APPLICATION ... TO DEVELOP IN A FLOODPLAIN AREA ... 1. No work may begin until a permit is issued.

slug: vending-business-license
text: "The City of Morgantown says vending trucks and vending carts both need a City of Morgantown Business License, even if the business is based outside city limits."
quote: "Vendors are divided into two categories: Vending Trucks and Vending Carts. Both are required to operate with a City of Morgantown Business License, even if their headquarters are outside City Limits."

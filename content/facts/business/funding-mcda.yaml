slug: funding-mcda
text: "The **Monongalia County Development Authority**, part of the Morgantown Area Partnership, says it helps new and existing businesses with capital financing, tax incentives, hiring and training workers, and sites and buildings. Its page does not list loan programs or amounts, so call the Partnership at [304-292-3311](tel:+13042923311)."
phone: "304-292-3311"

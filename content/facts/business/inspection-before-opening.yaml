slug: inspection-before-opening
text: "Contact Code Enforcement and the Fire Marshal early enough to be inspected no less than **one week before opening day**. Restaurants, bars and nightclubs have stricter Fire Code rules, so contact the Fire Marshal's Office."
quote: >-
  no less than one week before opening day. Bars, nightclubs, and restaurants are considered to be assembly occupancies under the
  Fire Code.
sources:

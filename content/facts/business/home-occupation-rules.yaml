slug: home-occupation-rules
text: "Some of the packet's rules for every home business in the city: it may use no more than **a quarter of the home's floor space**; the work happens inside the home, not in a garage or outdoors; no outside signs; no more than one business vehicle and no trailer; no more than **four deliveries or pickups a day**; and no workers who do not live there, unless the zoning rules allow it. If you rent, you must show that you told the owner in writing."
quote: >-
  A home occupation may not occupy more than twenty-five (25) percent of the floor area of the principal structure ... shall be
  conducted entirely within the principal building. No home occupation shall be conducted outdoors or in any accessory building or
  garage ... may have no more than one vehicle with business identification, and shall have no vehicle with greater than one (1.0)
  ton capacity and shall not have any trailer ... there shall be no exterior indication of the home occupation, no exterior signs ...
  shall not involve on-site employment of persons not residing in the dwelling, except as otherwise provided the City of Morgantown
  Zoning Ordinance ... If the applicant is not the owner of the property ... written notice of intention to conduct the home
  occupation has been given to the owner of the property ... Merchandise delivery and/or pick-ups ... shall not exceed four (4) per day.

text: "**WV Grant Resource Center:** help writing grant applications for businesses, local governments and others working on economic, workforce and community development. Its Morgantown office is at 83 Beechurst Avenue. [304-293-6444](tel:+13042936444)."
quote: "Tailored pre-award support to help develop competitive grant proposals and maximize state, federal and private funding ... Businesses, local governments, and other entities focusing on economic, workforce and community development ... 83 Beechurst Ave ... (304) 293-6444"

slug: funding-pcap
text: "**Partner Community Capital (PCAP):** a nonprofit lender that has served all of West Virginia since 2004. It lends to small businesses and nonprofits, including owners who could not get a \"yes\" from a bank. Loans start at **$5,000**. Owners must be 18 or older, and anyone who owns 20% or more must co-sign. PCAP says SBA named it a West Virginia microloan lender. The state's WVCAP program also offers help with accounting, legal and financial questions, records, and licenses through PCAP. Start on PCAP's [apply page](https://partnercap.org/apply/)."
quote: >-
  Partner Community Capital gives entrepreneurs who can't get a "yes" from traditional lenders the capital and strategic advice they
  need to grow. ... in 2004, we expanded to serve all of West Virginia ... PCAP offers a range of loan sizes starting at $5,000 ...
  All owners with 20%+ ownership in the business must co-sign the loan. Business owners must be at least 18 years of age ... Partner
  Community Capital has been designated as a new SBA Microloan lender in West Virginia ... Do you need Accounting, Legal, or
  Financial Advisory Services? ... Digitizing Financial Records Obtaining Registrations, Licenses, Filing, or Certifications ... Apply for Technical Assistance through
  Partner Community Capital and learn how you can improve your small business.

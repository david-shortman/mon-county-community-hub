slug: food-permits
text: "The **Monongalia County Health Department's** Environmental Health office lists food and retail establishment permits and mobile food units among its services, with a permit application. Call [304-598-5131](tel:+13045985131) or see the [Environmental Health page](https://www.monchd.org/departments-programs/environmental-health)."

slug: home-occupation-county
text: "Outside any town, the county says only the **West Run Planning District**, north of Morgantown, is zoned. In West Run, the County Planning Office has a **Home Occupation Application**: Level I for up to 2 employees using no more than a quarter of the home, and Level II for up to 6 employees using no more than a third. Staff will look over your papers before you apply, at no charge. Call [304-284-7302](tel:+13042847302) or email [planning@monongaliacounty.gov](mailto:planning@monongaliacounty.gov)."
phone: "304-284-7302"
phone_label: the County Planning Office

slug: state-certificate-lasts
text: "**How long it lasts:** it does not expire. It ends if the business name, location or owner changes. **Post it** where you do business."
quote: >-
  permanent and remains valid until ... a change in the legal name, physical location, or ownership ... must be posted
  conspicuously in the place where you are conducting business
sources:

slug: occupancy-bring
text: "Bring four things: a completed Municipal Business License application; a scaled floor plan with measurements, on 8.5 by 11 inch paper, showing the total square feet and how you will use the space; the **$65** application fee (cash, check or credit); and signatures from the Planning Division and the Engineering Department."
quote: >-
  8 ½ " x 11 inches scaled and dimensional floor plan ... A $65 Certificate of Occupancy application fee made out to the City ...
  Certificate of Occupancy requires sign-off by both the Engineering Department and the Planning Department.

slug: state-fee-exempt
text: "**Some groups pay no fee** but still register, such as qualifying 501(c) nonprofits and farming businesses. See the full list on the Tax Division page."
quote: >-
  A non-profit organization which qualifies, or would qualify, for exemption from federal income taxes under section 501 ...
  A person engaged in the business of agriculture or farming.

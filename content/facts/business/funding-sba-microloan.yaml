slug: funding-sba-microloan
text: "**SBA microloans:** loans of up to **$50,000** to start or grow a small business. SBA says the average is about **$13,000**. Nonprofit lenders make the loans and set the terms, not SBA. You have up to 7 years to pay back, and SBA says rates are generally **8% to 13%**. A microloan cannot be used to pay old debts or buy real estate."
quote: >-
  The microloan program provides loans up to $50,000 to help small businesses and certain not-for-profit childcare centers start up
  and expand. The average microloan is about $13,000. SBA provides funds to specially designated intermediary lenders, which are
  nonprofit community-based organizations ... Proceeds from an SBA microloan cannot be used to pay existing debts or to purchase real
  estate. ... SBA-approved lenders make all credit decisions and set all terms for your microloan. ... Maximum repayment term allowed
  for an SBA microloan is seven years ... Generally, between 8%-13%
sources:

slug: city-license
text: "Apply after you have your state Business Registration Certificate. Create an account and apply through the **Morgantown Access Portal**. The portal's web address changed, so old bookmarks may not work. If your business has a place inside city limits, you need a Certificate of Occupancy (step 4) before the city issues the license."
quote: >-
  After you receive your State Business License Registration Certificate ... you must create an account and complete your
  application through the Morgantown Access Portal ... If your proposed business is physically within city limits, a Certificate
  of Occupancy will be required ... the portal URL has changed

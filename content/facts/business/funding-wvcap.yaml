slug: funding-wvcap
text: "**WV Capital Access Program (WVCAP):** for creditworthy small businesses of any size or age. It has three funds: seed capital, subordinated debt and collateral support. Generally **$10,000 to $2 million** per business. Email [WVCAP@wv.gov](mailto:WVCAP@wv.gov), or see [its page](https://wvjit.wv.gov/wvcap/)."
quote: "Creditworthy small businesses of all sizes and maturities ... Seed Capital Co-Investment Fund, Subordinated Debt Fund, and Collateral Support Fund ... Generally $10,000 to $2MM per EIN ... WVCAP@wv.gov"

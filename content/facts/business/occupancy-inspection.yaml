slug: occupancy-inspection
text: "You get a card with contacts for the Fire Marshal and Code Enforcement. If you are not changing the space, contact Code Enforcement within **10 days** of applying to set up an inspection. Once all departments inspect and approve, the city mails the Certificate of Occupancy. If you are changing the space, ask Code Enforcement about permits first."
quote: >-
  At submission, you will receive a card with contact information for the Fire Marshal and your assigned Code Enforcement Officer
  ... contact the Code Enforcement Office within 10 days of submitting your Certificate of Occupancy application ... Once inspected and approved by all departments, an official Certificate
  of Occupancy will be mailed.

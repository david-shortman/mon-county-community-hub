slug: hire-ui-account
text: "**State unemployment tax:** employers may owe state unemployment insurance tax. To set up an account, apply on the [One Stop Business Portal](https://business4.wv.gov/Pages/default.aspx) and fill out the **Employer's Initial Statement**. WorkForce West Virginia uses that form to decide if your business owes the tax. A new business is given a tax rate once it applies. Questions: [uctaxunit@wv.gov](mailto:uctaxunit@wv.gov)."
quote: >-
  How do I apply for West Virginia Unemployment Compensation Account? You can apply online at business4.wv.gov and complete the
  Employer's Initial Statement or you may contact the Status Determination Unit at uctaxunit@wv.gov and the application can be
  mailed to you. New business will be assigned a rate once they've applied. ... Initial statement form for employers to determine
  UI tax liability.

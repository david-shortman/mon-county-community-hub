slug: home-occupation-city
text: "In Morgantown, a business run from your home is called a **home occupation**. The city's Home Occupation Application Packet says to get **Home Occupation Approval** from the Planning Department first, at [304-284-7431](tel:+13042847431). Then bring a copy of that approval to the Finance Department to register for the city business license. If no customers come to your home (for example, you work online or at your customers' places), city staff can approve it (Class 1). If customers visit or goods are delivered, it is a Class 2 conditional use, and the Board of Zoning Appeals decides. The packet is a scan from 2013, so ask the Planning Division if anything has changed."
phone: "304-284-7431"
phone_label: the Planning Division
quote: >-
  Step 1 Home Occupation Approval - Contact the Planning Department (phone 304.284.7431) for a Home Occupation Application ...
  Home Occupations, Class 1 approvals may be granted administratively. Home Occupations, Class 2 are considered "Conditional Uses"
  that require a separate application and approval by the Board of Zoning Appeals. Step 2 Business License Registration - Once
  administrative or BZA approval for the Home Occupation is granted, bring a copy of your Home Occupation Approval to the Finance
  Department

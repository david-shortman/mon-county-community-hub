slug: occupancy-who
text: "The city says new and existing businesses inside city limits need one, and so do businesses that change name, owner or location. You cannot legally use the building or open until you have it."
quote: >-
  A Certificate of Occupancy is required for new businesses within city limits, and for businesses changing names, owners, or
  locations ... This is also required before you can legally occupy your building and conduct business operations

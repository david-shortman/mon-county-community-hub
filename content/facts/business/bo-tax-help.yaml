slug: bo-tax-help
text: "The city's permitting page gives [304-284-7401](tel:+13042847401) for help paying B&O. The Finance page lists [304-284-7408](tel:+13042847408) and the email [BandO@morgantownwv.gov](mailto:BandO@morgantownwv.gov). The B&O forms page lists [304-284-7405](tel:+13042847405)."
quote: >-
  Please contact the Finance Department at 304-284-7401 to gather information on paying your B&O fees ... Phone: 304-284-7408 ...
  B&O Tax questions may be sent to BandO@morgantownwv.gov ... Phone: 304-284-7405

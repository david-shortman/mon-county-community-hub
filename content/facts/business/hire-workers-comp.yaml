slug: hire-workers-comp
text: "**Workers' compensation:** the WV Offices of the Insurance Commissioner says all West Virginia employers must, by law, keep workers' compensation insurance. You buy it from an insurance company; the state says more than 350 companies sell it here. Some employers can apply to be exempt, and the state's Employer Coverage Unit reviews those requests. Call [304-414-0539](tel:+13044140539) or email [OICEmployerCoverage@wv.gov](mailto:OICEmployerCoverage@wv.gov)."
phone: "304-414-0539"
phone_label: the Employer Coverage Unit
quote: >-
  All WV employers are statutorily required to maintain workers' compensation insurance coverage. Compliance related activities
  include reviewing employer applications for exemption from workers' compensation insurance ... (304) 414-0539 ...
  OICEmployerCoverage@wv.gov ... The West Virginia workers' compensation market has over 350 carriers offering workers'
  compensation insurance to West Virginia employers.

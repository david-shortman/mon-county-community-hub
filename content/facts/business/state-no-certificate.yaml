slug: state-no-certificate
text: "**Some very small businesses need no certificate.** The page lists three conditions that must all be true. One is business gross income of $4,000 or less in the last tax year."
quote: >-
  all three (3) ... Is not required by law to collect any tax or withhold a tax; and Does not claim exemption from payment of the
  West Virginia Consumers Sales and Service Tax or Use Tax; and Had a gross income from business activity of $4,000.00 dollars or
  less from operations in all states
sources:

slug: irs-separate-step
text: "Federal tax-exempt status, such as 501(c)(3), is a separate step with the IRS. The Secretary of State's charities page sends you to the IRS website and IRS Publication 557 to learn the rules."
quote: "To learn about the general requirements for federal tax-exempt status, visit the IRS website, or download IRS Publication 557, Tax-Exempt Status for Your Organization."

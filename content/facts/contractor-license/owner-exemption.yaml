slug: owner-exemption
text: "The law lists jobs that do not need a contractor license in [WV Code §30-42-6](https://code.wvlegislature.gov/30-42-6/). One of them is \"work personally performed on a structure by the owner or occupant thereof.\" See the full list at the link."
quote: "Work personally performed on a structure by the owner or occupant thereof"

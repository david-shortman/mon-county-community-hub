slug: city-license
text: "The City of Morgantown asks for a state business registration first, then a **Municipal Business License**. Apply through the Morgantown Access Portal. The city's steps page lists a separate contractor application for the business license."
quote: "Once you have obtained a State Business License Registration Certificate, you must submit an application for a Municipal Business License. ... Contractor Application for Municipal Business License (PDF)"

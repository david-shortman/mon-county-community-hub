slug: law-definition
text: "State law says which jobs need a contractor license. It depends on the kind of work and the total cost of the job. Read the definition of \"contractor\" in [WV Code §30-42-3](https://code.wvlegislature.gov/30-42-3/), or ask the board."
quote: "“Contractor” means a person who in any capacity for compensation, other than as an employee of another, undertakes"

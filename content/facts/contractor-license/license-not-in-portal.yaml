slug: license-not-in-portal
text: "If your contractor's license does not show in the portal, call the Finance Department at [304-284-7408](tel:+13042847408). B&O taxes are not part of permit fees: call Finance at [304-284-7401](tel:+13042847401)."
quote: "Why is my business/contractor’s license not showing on the portal? To add your Morgantown Municipal License to the Morgantown Access Portal, please contact the Finance Department at 304-284-7408. ... Please contact the Finance Department at 304-284-7401"

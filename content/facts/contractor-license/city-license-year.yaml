slug: city-license-year
text: "City licenses run for a fiscal year and expire June 30 each year. The city also charges a business and occupation (B&O) tax on gross income, and a municipal service fee on people working in city limits."
quote: "All municipal licenses are issued for a fiscal year and expire June 30 of each year. ... The City levies a business and occupation tax on all gross income generated from business activity. The City imposes a municipal service fee on all employees and self-employed owners working within city limits."

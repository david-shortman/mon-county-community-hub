slug: hvac-license
text: "The **Division of Labor** also certifies HVAC technicians. Its page says that since January 1, 2016, no person may do or offer heating, ventilating and cooling work in West Virginia without its certification. The law lists some exceptions."
quote: "Effective January 1, 2016, no person may perform or offer to perform heating, ventilating and cooling system work in West Virginia without a certification issued by the West Virginia Division of Labor."

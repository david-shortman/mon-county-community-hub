slug: plumber-license
text: "The **West Virginia Division of Labor** licenses plumbers. Its page says that since January 1, 2009, \"no plumber may perform or offer to perform plumbing work in West Virginia without a plumber license.\" The law lists some exceptions."
quote: "Effective January 1, 2009, no plumber may perform or offer to perform plumbing work in West Virginia without a plumber license issued by the West Virginia Division of Labor."

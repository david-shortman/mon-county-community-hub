slug: post-license
text: "The same section says a licensed contractor \"shall keep the license or a copy thereof posted in a conspicuous position at every construction site,\" and that the license number \"shall be included in all contracting advertisements and all fully executed and binding contracts.\""
quote: "shall keep the license or a copy thereof posted in a conspicuous position at every construction site ... The contractor’s license number shall be included in all contracting advertisements and all fully executed and binding contracts."

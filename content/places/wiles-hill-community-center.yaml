story: A BOPARC community center with a gym and fitness room on Eureka Drive.
facilities:
  gym: true
  other: [fitness floor, Studio 287 art and pottery studio, Eureka Cafe]
opening_hours:
  - days: [mon, tue, wed, thu, fri]
    opens: "08:00"

regular:
  - Eureka Cafe, in the building, open Monday to Friday, 8 a.m. to 4 p.m. The kitchen closes at 3:45 p.m.
  - Studio 287, a community art and pottery studio in the basement, with weekly classes for kids, adults and seniors. You can pay to drop in or buy a monthly membership
  - Wellness classes for older adults, such as yoga, ballet, line dancing and tai chi
drop_in: Anyone. BOPARC says the center is open to the public and lists no fee to come in. The fitness room, Studio 287 classes and gym rentals have fees
membership:
  dues: Fitness floor $15 a year for one person 50 or older ($25 for two in the same home), $50 a year for one person 18 to 49 ($75 for two in the same home). These are BOPARC's 2024 prices
  covers: You must be 18 or older to use the fitness floor. Staff can set up a free first session
rentals:
  - space: Gym (weekends, 9 a.m. to 9 p.m.)
    outdoor: false
    price: $35 an hour, 3-hour minimum, plus sales tax
    book: Call BOPARC at 304-296-8356 and choose the customer service option. Fees are due when you book.
    source: https://www.boparc.org/wiles-hill-community-center.html
  - space: Gym for basketball practice (Monday to Friday only)
    outdoor: false
    price: $35 an hour, 1-hour minimum
    book: Call BOPARC at 304-296-8356 and choose the customer service option. Fees are due when you book.
    source: https://www.boparc.org/wiles-hill-community-center.html

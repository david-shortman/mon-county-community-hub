story: A senior center on the Mason-Dixon Highway in Blacksville, open to new members.
regular:
  - Open 8 a.m. to 2 p.m. Monday, Tuesday, Wednesday and Friday. Closed most holidays and when schools close for weather
  - Lunch at 11:30 a.m. Monday, Wednesday and Friday. Call 8:30 to 10 a.m. to reserve a carry-out
  - Covered-dish dinner the third Tuesday of each month at 6 p.m. Bring a dish and a friend. Everyone welcome
  - Bingo the first and third Wednesday at 10 a.m. Sewing group Wednesdays at 10 a.m.
membership:
  dues: $2 a year, or $20 for life

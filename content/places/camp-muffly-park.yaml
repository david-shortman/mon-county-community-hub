name: Camp Muffly Park
slug: camp-muffly-park
kind: park
area: south
community: South of Morgantown, off Four-H Camp Road
run_by:
  kind: county
  text: Monongalia County Parks and Recreation
story: A county park with pavilions, playgrounds and a pool, also home to the 4-H camp.
drop_in: Anyone. The county says the park is open to the public every day, and no reservation is needed to visit. You may picnic at a pavilion when it is not reserved
contact:
  phone: "304-284-8484"
  url: https://www.monongaliacounty.gov/departments/parks_and_recreation/camp_muffly_park/index.php
  url_label: Park page
  place: 1474 Four-H Camp Road, Morgantown, WV 26508
status: active
notes:
  - Park hours are 8 a.m. to dusk. The gates are locked outside those hours.
  - 4-H camp takes up the park for about two weeks in June. The county posts the dates on the park's Facebook page.
  - Most pavilions are reserved on weekends. A reserved pavilion has a sign by 10 a.m.

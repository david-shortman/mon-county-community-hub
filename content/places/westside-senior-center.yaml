regular:
  - Open 9 a.m. to noon, Monday to Friday, and 6 to 8 p.m. Tuesday, Wednesday and Thursday
  - Bingo every Wednesday. Doors open at 4 p.m., first game at 6 p.m., $5 a book
  - Cards Tuesday and Thursday mornings, dulcimers Tuesday mornings, line dancing Wednesday at 10:15 a.m., mahjong Thursday at 9 a.m.
  - Movie night the second Friday and music bingo the third Friday, both at 6 p.m.
membership:
  dues: $10 a year for people 50 and older ($20 for you and a spouse), running through June 30
  covers: Includes the fitness room

notes:
  - BOPARC says the center is closed for reservations and a reopening date will be set later. Its park project page estimates the work will finish in early 2027. Rental rates will change after the work.
  - Until early 2027, you cannot walk or drive through Marilla Park from the bridge under the road to the new pool parking lot. That includes people coming off the Deckers Creek Trail. BOPARC posts detours on its notices page. To reach the pool, splash pad, playground or BOPARC customer service office, use either end of the pool parking lot. The middle of the lot is closed.

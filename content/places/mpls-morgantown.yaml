notes:
  - Free Wi-Fi and public computers. Computers can be used for up to 60 minutes.
  - Board games for kids and adults can be borrowed with a library card. They are on the first floor, as part of the Library of Things. Library of Things items go out for 21 days, one item per card, with no renewals or holds.
  - All branches are closed November 26 and 27, December 24 and 25, and December 31 and January 1.

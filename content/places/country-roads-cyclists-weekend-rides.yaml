status: active
last_activity_seen: 2026-10-30
notes:
  - The club posts a ride schedule every two months. The September to October 2026 schedule ends on Sunday, November 1. The next season starts in March.
  - Rides are rated easy to difficult and run about 20 to 40 miles. Some start outside Mon County (Mount Morris, Fairmont, and Pennsylvania trailheads).
  - Ride starts in Mon County on the fall 2026 schedule included the Star City restrooms on the Mon River Trail and the parking lot behind Wendy's in Sabraton for the Deckers Creek Trail.
  - The schedule says to contact the ride leader for details and to wear a helmet. Membership is joined by mail; the fee is not listed.

# Personas (#1036): people in a moment, not profiles. Each is tied to a need
# in content/needs/ or a life area, with public evidence, the words they would
# search, the page search should land them on, and two or three next steps.
# Pages only: no phones, dates or costs here. Read by
# site/scripts/check-personas.mjs after every build (#1042): the landing page
# must exist and each next step must be one or two taps from it.
# not_linked_yet: next steps from the plan that the landing page does not reach
# in two taps yet (#1338). questions: ids in content/findability/questions.yaml.

gaps:
  - Free and low-cost clinics, hospital financial help and prescription programs are spread across many sites.
  - Plain steps for keeping Medicaid under the 2027 rules are not yet in one place (issues 221 and 214).
  - Dental care is on the health department's list of the hardest care to get.
topics: [health]
rank: 2
rank_why: "Score 12 of 12: severity 3, reach 3, agreement 3, room to help 3 (programs exist that people miss, and the Medicaid change is time sensitive). Ranked below food because its reach comes from a small survey, not a county-wide estimate."
questions: [q05, q08]
issues: [221, 403, 478, 985]

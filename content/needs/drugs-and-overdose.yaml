title: Drug and alcohol use, and overdose deaths
slug: drugs-and-overdose
summary: Drug and alcohol use was the third top health problem in a 2025 hospital survey here. Overdose deaths in the county fell from 77 in 2023 to 49 in 2024, but the rate is still above the US rate.

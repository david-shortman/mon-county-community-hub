    figure: "77 deaths in 2023, 49 in 2024"
    data_date: 2023 and 2024
    publisher: West Virginia Office of Drug Control Policy, At-A-Glance 2025
  - url: https://www.countyhealthrankings.org/sites/default/files/media/document/analytic_supplement_20260325%5B1%5D.csv
    checked: 2026-11-01
    shows: Drug overdose deaths for each 100,000 people.
    figure: "43 per 100,000 (West Virginia 79, US 32)"
    publisher: County Health Rankings (March 2026 supplemental release)

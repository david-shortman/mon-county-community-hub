gaps:
  - No one page walks an adult through the steps to a high school equivalency diploma, from the first class to the free test.
  - The county's reading and math estimates are from surveys done from 2012 to 2017, so how many adults need help today is not known.
topics: [work, family]
rank: 13
rank_why: "Score 9 of 12: severity 2, reach 3 (16% of adults read at the lowest level), agreement 2 (the two measures are separate, but the newest county skills estimate is from 2012 to 2017 and the hospital assessment names education only together with jobs, for six counties), room to help 2 (free classes and tutoring exist, but a website reaches adults who read with difficulty mostly through the people who help them). Last among the 9s because it had the fewest 211 requests."

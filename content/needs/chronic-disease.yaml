title: Obesity, diabetes and heart health
slug: chronic-disease
summary: About 1 in 3 adults in Mon County has obesity and about 1 in 3 has high blood pressure. Obesity was the second top health problem in a 2025 hospital survey, and both local hospitals list chronic disease as a priority.
evidence:
  - url: https://www.countyhealthrankings.org/sites/default/files/media/document/analytic_data2025_v3.csv
    checked: 2026-10-31
    shows: The share of adults with obesity.
    figure: "36.7% (West Virginia 41.5%, US 33.5%)"
    publisher: County Health Rankings (2025 release)
  - url: https://data.cdc.gov/d/swc5-untb
    checked: 2026-10-31
    shows: CDC estimates the share of adults with high blood pressure and with diagnosed diabetes. These are model-based estimates, not counts.
    figure: "31.9% high blood pressure; 10.8% diabetes"
    data_date: "2023"
    publisher: CDC PLACES (2025 release)
  - url: https://wvumedicine.org/wp-content/uploads/2026/01/J.W.-Ruby-Memorial-Hospital-2025-Community-Health-Needs-Assessment-1162025.pdf
    checked: 2026-10-31
    shows: Obesity was the second most named health problem in the 2025 community survey (page 22), and obesity with related chronic disease is one of the hospital's prioritized needs (page 3).
    figure: "57% of respondents"
    data_date: "2025"
    publisher: J.W. Ruby Memorial Hospital, 2025 Community Health Needs Assessment

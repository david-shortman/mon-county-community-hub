severity: medium
severity_why: Without internet at home, it is harder to apply for benefits and jobs, do schoolwork, or see a doctor by video.
trend: unknown
working_on:
  - org: wv-office-of-broadband
  - org: morgantown-public-library-system
  - name: Lifeline (Universal Service Administrative Company)
    url: https://www.lifelinesupport.org/
gaps:
  - Internet companies' own low-cost plans for Mon County are not on this site yet.
  - No local program that gives or sells low-cost computers for home use is listed.
  - People in places that are funded but not built yet cannot easily tell when service will reach them.
topics: [moving]
rank: 9
rank_why: "Score 10 of 12: severity 2, reach 3 (about 1 in 10 households), agreement 3 (three separate sources), room to help 2 (a discount, free library Wi-Fi and a speed test exist, but the monthly cost and places not built yet are things a website cannot change). Last among the 10s: as serious as child care and loneliness, and the 2025 assessment's 211 table has no internet category."

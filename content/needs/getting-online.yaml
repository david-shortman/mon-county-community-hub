title: Getting and keeping internet at home
slug: getting-online
summary: About 1 in 10 households in Mon County has no broadband internet at home. Most homes in the county can get service, but fewer households have it. Some places, mostly in the western part of the county, are still waiting for service to be built. Many forms for help, jobs and health care are online.
evidence:
  - url: https://www.countyhealthrankings.org/sites/default/files/media/document/analytic_supplement_20260325%5B1%5D.csv
    checked: 2026-11-14
    shows: The share of households with a broadband internet subscription. 40,252 of 44,629 households have one, so about 4,377 do not.
    figure: "90.2% (West Virginia 86.1%, US 91.0%)"
    data_date: "2020 to 2024"
    publisher: County Health Rankings (March 2026 supplemental release)
  - url: https://broadband.wv.gov/wp-content/uploads/2026/09/County-availability-Sept2026.pdf
    checked: 2026-11-14
    shows: "Of 38,428 homes and businesses that could have broadband, 36,466 have service by cable, fiber or wireless. 1,819 have funding to be connected but are not served yet, and 143 are unserved or underserved with no funding (page 31 of the PDF). The map shows most of these places in the western part of the county."
    figure: "1,962 of 38,428 places not served yet"
    data_date: "December 31, 2025"
    publisher: West Virginia Office of Broadband, Monongalia County Broadband Availability Summary (FCC data)
  - url: https://wvumedicine.org/wp-content/uploads/2026/01/J.W.-Ruby-Memorial-Hospital-2025-Community-Health-Needs-Assessment-1162025.pdf
    checked: 2026-11-14
    shows: In the hospital's 2025 survey of Mon and Marion County residents, 6% of the 164 people who answered said they have no high-speed internet at home, and another 6% said theirs is not reliable or fast enough for a video doctor visit (page 31 of the PDF). The survey says it is not a representative sample.
    figure: "12% no or unreliable home internet"
    data_date: "2025"
    publisher: J.W. Ruby Memorial Hospital, 2025 Community Health Needs Assessment
affected:
  estimate: "about 1 in 10 households"
  description: Households in Monongalia County without a broadband internet subscription (9.8%, from County Health Rankings' count of 40,252 of 44,629 with one).

title: Wages that cover the basics
slug: wages-and-cost-of-living
summary: Many working households here earn more than the poverty line but not enough for a basic budget. United For ALICE counts about half of single adults, two thirds of single mothers, and most householders under 25 in Mon County below that line.
evidence:
  - url: https://www.monhealth.com/Uploads/Public/Documents/2025%20MHMC%20Community%20Benefit%20Needs%20Assessment%20and%20Implementation%20Strategies.pdf
    checked: 2026-10-31
    shows: United For ALICE figures for Monongalia County give the share of each household type below the ALICE Threshold, the income needed for housing, child care, food, transportation, health care, a phone and taxes (page 16 of the PDF). Many householders under 25 are college students.
    figure: "49% of single or cohabiting adults without children; 67% of single mothers; 83% of householders under 25; 48% of householders 65 and older"
    data_date: "2023"
    publisher: Mon Health Medical Center, 2025 Community Health Needs Assessment
  - url: https://www.monhealth.com/Uploads/Public/Documents/2025%20MHMC%20Community%20Benefit%20Needs%20Assessment%20and%20Implementation%20Strategies.pdf
    checked: 2026-10-31
    shows: North Central West Virginia Community Action's 2022 needs assessment ranked employment second for Monongalia County, naming a lack of good paying and full time jobs with benefits (page 56 of the PDF). West Virginia 211 logged 444 employment and income requests from the county in one year (page 62).
    figure: "444 employment and income requests"
    data_date: 2022 and August 2024 to August 2025
    publisher: Mon Health Medical Center, 2025 Community Health Needs Assessment
  - url: https://www.countyhealthrankings.org/sites/default/files/media/document/analytic_supplement_20260325%5B1%5D.csv
    checked: 2026-11-14
    shows: Income inequality, the income at the 80th percentile divided by the income at the 20th percentile.
    figure: "6.2 (West Virginia 5.0, US 4.9)"
    data_date: "2020 to 2024"
    publisher: County Health Rankings (March 2026 supplemental release)

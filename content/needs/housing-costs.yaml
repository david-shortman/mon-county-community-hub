gaps:
  - Housing voucher and subsidized housing wait lists are not posted in one plain place.
  - Rent help, eviction steps, repairs and vouchers are on separate pages of this site, with no single starting page for housing yet (issue 202).
  - Local Fair Market Rent figures still need checking on HUD's own page (issue 740).

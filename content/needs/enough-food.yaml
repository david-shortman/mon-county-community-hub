gaps:
  - Pantry days and hours change often, and sources disagree on several of them (issue 932).
  - There is no one place to see which pantry is open on a given day in the county.
  - We have no public count of how many people local pantries serve each month.
topics: [food]
rank: 1
rank_why: "Score 12 of 12: severity 3, reach 3 (about 13,370 people), agreement 3 (four sources), room to help 3 (pantries, SNAP and WIC exist but are hard to line up). Tie broken by a county-wide official estimate."
questions: [q02, q04, q45]
issues: [60, 570, 922, 932]

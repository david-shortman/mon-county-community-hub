# Morgantown City Council election (wave 19, #529). A city election: only
# voters who live inside Morgantown city limits vote in it, so /vote/ says so
# and names the City Clerk, not the County Clerk. Dates the City has not
# posted yet (registration deadline, early voting, absentee deadline, canvass)
# stay off until an official page states them; see the needs-verification
# issue linked in the PR. results_until is when /vote/ stops showing it.

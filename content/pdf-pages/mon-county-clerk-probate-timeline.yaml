# The County Clerk's "Full Probate Overview and Timeline" (part of #393), a
# two-page PDF linked on the Clerk's Probate Office page for estates without
# a will (read 2026-11-01). No date is printed on it; the file was saved
# November 16, 2021. Steps, days and fees are quoted.
#
# The $32 for opening matches the Clerk's newer "Opening Probate Forms and
# Instructions" PDF (saved November 14, 2025: $12 Application of Fiduciaries
# and $20 Notice of Administration). The $12 appraisement and $17 closing
# fees appear only in this 2021 PDF, and the page says so.

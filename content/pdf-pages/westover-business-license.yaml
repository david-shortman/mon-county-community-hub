        lines: ["\"SEE CITY HALL FOR RATES\""]
      - name: "Business Licence Application"
        lines: ["One page: the fee list and the form."]
        links:
          - label: "Business Licence Application (PDF)"
            url: https://www.westoverwv.org/_files/ugd/d2114f_50052056caff40fc91000a6134690e2d.pdf
            date: "4/27/2023"
  - heading: B&O tax rates
    id: b-and-o
    note: The B&O (business and occupation) tax is figured on gross sales. The return lists one rate for each kind of business, as a dollar figure and a multiplier.
    items:
      - name: "Companies Gas Utility"
        lines: ["$3.00 { X .0300}"]
      - name: "Retailers, Restaurants"
        lines: ["$0.50 { X.0050 }"]
      - name: "Electric, Power Company"
        lines: ["$4.00 { X.0400 }"]
      - name: "Contracting"
        lines: ["$2.00 { X .0200 }"]
      - name: "Service and All Other"
        lines: ["$0.75 {X .0075 }"]
      - name: "Rents, Royalties or Fees"
        lines: ["$1.00 { X .0100}"]
      - name: "Banking and Other Financial"
        lines: ["$0.50 { X .0050}"]
      - "How to figure it, from the instructions: \"Determine your taxes due by multiplying the gross sales amount by the rate multiplier. Example: $10,000 in retail gross sales multiplied by the rate multiplier of .0050 equals a B&O tax due of $50.\""
      - "\"Gross sales is the total revenue received before any deductions or allowances.\""
  - heading: B&O tax due dates and penalties
    id: b-and-o-due
    items:
      - "\"DUE DATE: All returns are due 30 days after the end of the applicable filing period.\" The quarters end March 31, June 30, September 30 and December 31."
      - "No sales this quarter? \"To avoid delinquent notices and tax assessments, indicate on the return if no reportable activity ($0.00 gross sales) occurred during the filing period and return by the due date.\""
      - "\"Add Penalty: 5% or $10.00,whichever is greater for the 1st month late filing.\""
      - "\"Add penalty: 5% for each additional quarter late on net amount of tax due.\""
      - "\"If your return is received after the due date, you will be sent a letter for penalties and interest due.\""
      - "\"Mail payments to: City of Westover, 500 Dupont Road, Westover, WV 26501.\""
      - "The form says the office is open \"MONDAY THROUGH FRIDAY FROM 8:00 AM TO 4:30 PM, EXCEPT HOLIDAYS\"."
      - name: "Business and Occupation (Gross Sales) Tax Return"
        lines: ["Two pages: the return and the instructions."]

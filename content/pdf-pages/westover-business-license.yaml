sections:
  - heading: The license rules
    id: rules
    items:
      - "The license is yearly. The form asks for the \"Fiscal Year Ending: June, 30\"."
      - "\"A COPY OF YOUR STATE LICENCE MUST BE ATTACHED\""
      - "\"Any business not listed please inquire at City Hall.\""
      - "Deadline: \"Failure to secure a new license before August 1st makes you liable to punishment for operating without a license and subject to a maximum penalty of per day after notification by the City Clerk.\" The form does not print the penalty amount. Ask the city."
      - "The form asks for the business name, physical address, phone, the owner's name, phone and email, the corporation's name, address and phone if there is one, and the number of employees at this location."
  - heading: Yearly license fees
    id: fees
    note: Each business type and fee as the form prints it.
    items:
      - name: "GENERAL STORE"
        lines: ["$15"]
      - name: "CLASS A & B: RETAIL INTOXICATION LIQUOR"
        lines: ["$1000"]
      - name: "NON INTOXICATION BEER: Class A & B, Retail, Restaurants, Bar, Grocery"
        lines: ["$150"]
      - name: "DISTRIBUTOR- PRIVATE LIQUOR CLUBS"
        lines: ["$1000"]
      - name: "FRATERNAL /VETERANS ORGANIZATIONS"
        lines: ["$375"]
      - name: "CLUB HAVING LESS THAN 1,000 MEMBERS"
        lines: ["$500"]
      - name: "WINE RETAILER [GROCER]"
        lines: ["$150"]
      - name: "ATTORNEY"
        lines: ["$5"]
      - name: "AUCTIONEER"
        lines: ["$15"]
      - name: "BARBER, BEAUTICIAN, MANICURIST"
        lines: ["$25"]
      - name: "CHIROPRACTOR"
        lines: ["$100"]
      - name: "COLLECTION AGENCY"
        lines: ["$100"]
      - name: "DENTIST"
        lines: ["$20"]
      - name: "DENTAL CORPORATION"
        lines: ["$50"]
      - name: "EMPLOYMENT AGENCY"
        lines: ["$200"]
      - name: "ENGINEER"
        lines: ["$30"]
      - name: "FORTUNE TELLER, PALMIST, MEDIUM"
        lines: ["$200"]
      - name: "FUNERAL ESTABLISHMENT"
        lines: ["$75"]
      - name: "HEARING AID DEALER"
        lines: ["$40"]
      - name: "INSURANCE AGENT/BROKER"
        lines: ["$25"]
      - name: "INSURANCE COMPANY"
        lines: ["$50"]
      - name: "LANDSCAPERS"
        lines: ["$50"]
      - name: "MEDICAL CORPORATION"
        lines: ["$300"]
      - name: "PAWNBROKER"
        lines: ["$100"]
      - name: "PHYSICAL THERAPIST"
        lines: ["$35"]
      - name: "REAL ESTATE AGENT"
        lines: ["$25"]
      - name: "REAL ESTATE BROKER"
        lines: ["$50"]
      - name: "BILLIARD TABLES"
        lines: ["The form says \"FIRST $25, ADD$15 EA,ADDITION\" and leaves the fee column blank."]
      - name: "LAUNDROMAT/CARWASH"

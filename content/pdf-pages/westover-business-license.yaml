# The City of Westover's "Business Licence Application" and "Business and
# Occupation (Gross Sales) Tax Return" (part of #393), both linked on its New
# Businesses page (read 2026-11-14). Both PDFs have a text layer; each fee
# and rate was also checked against the page image. Every business type, fee
# and rate is copied as printed, including the form's spelling "LICENCE".
#
# The license form leaves the amount of the late penalty blank ("a maximum
# penalty of per day"). The page quotes it as printed and does not guess.
# See docs/discoveries/2026-11-14-westover-license-penalty-blank.md.
slug: westover-business-license
title: Business Licence Application and Business and Occupation (Gross Sales) Tax Return, City of Westover
publisher: City of Westover
found_on: https://www.westoverwv.org/new-businesses
intro: The City of Westover's yearly business license fees and its B&O (business and occupation) tax rates, from its two PDF forms. Labels, fees and rates are copied as printed. The parts in quotes are the city's own words.

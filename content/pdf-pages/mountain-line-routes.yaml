# Every Mountain Line route on one phone page (#924, part of #393).
# Days, first and last runs, run times and stops are copied from each route
# page on busride.org (read 2026-10-31). "First run" and "last run" are when
# the route starts its first and last trip, as Mountain Line uses them. The
# dates on the PDF links are the "Effective" or "Vigente" dates printed on
# each PDF. Timetables are left off: the PDFs are dated 2016 to 2025, two
# disagree with their route page on hours (said on the page), and five more
# (Blue, Brookhaven, Crown, Eastern Circulator, Pink) give a different run
# time (checked 2026-10-31), see #393 and #407.
slug: mountain-line-routes
title: Mountain Line route schedules
publisher: Mountain Line Transit Authority
intro: Each route links its full schedule PDF from Mountain Line, with the date printed on that PDF. Some PDFs are several years old, so check the date.

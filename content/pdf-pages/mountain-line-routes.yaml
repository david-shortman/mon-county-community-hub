  - heading: "RideMon vans: Mountain Heights and Grafton Road"
    id: ridemon
    items:
      - name: "RideMon"
        lines:
          - "Vans you request with an app, for people along the Mountain Heights (Rt. 14) and Grafton Road (Rt. 15) routes. If you do not have a smartphone or computer to use the app, Mountain Line says a friend or family member with the app can request rides for you."
          - "The vans go within the service area, or to one of three places to connect with a bus: Hornbeck Road Walmart, Mountaineer Mall and Sabraton Goodwill."
          - "Questions: call 304-291-RIDE (7433)."
        links:
          - label: "RideMon page"
            url: https://www.busride.org/RideMon

# The health department's "Food Establishment Plan Review Application"
# packet (part of #393), linked on its Environmental Health page (read
# 2026-11-01). 24 pages: the plan review steps and fee table, a check-off
# list, the plan review questions, the permit application, manager and food
# worker training sign-ups, and the county's Clean Indoor Air Regulation
# (scanned, pages 19 to 24, left off here). No date is printed on it; the file
# was saved January 15, 2026. Steps and fees are quoted.
#
# The packet's fee table has a "Liquor License" column of $150, but its
# footnote says "add $125 to the Permit Fee". The 2026-2027 fee form says
# "ABCC Lic. Add $150". The page says who says what. See
# docs/discoveries/2026-11-01-monchd-abcc-fee-125-or-150.md and #1271.
slug: monchd-food-plan-review
title: Food Establishment Plan Review Application
publisher: Monongalia County Health Department
pdf: https://cdn.sanity.io/files/95aan9ec/production/314943135511dce2b9e78860326f3f7924614741.pdf
pdf_date: "no date is printed on it (the file was saved January 15, 2026)"
found_on: https://www.monchd.org/departments-programs/environmental-health
intro: Opening, buying or remodeling a restaurant, coffee shop, bakery or other food place in Mon County starts with a plan review by the health department. These are the steps, fees and papers from its packet. The parts in quotes are its own words.
recheck_days: 180
sources:

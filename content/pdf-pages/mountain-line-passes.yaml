# Mountain Line's half-fare and property tax bus pass programs (#955, part
# of #393), from the three PDF forms and the program pages that link them
# (all read 2026-10-31). The program pages are quoted first; the forms add
# what to bring. Where they differ (where to turn in the half-fare forms),
# the page says who says what. No form prints a date, so file save dates
# are given.
slug: mountain-line-passes
title: Mountain Line half-fare and property tax bus passes
publisher: Mountain Line Transit Authority
intro: Here are three of Mountain Line's pass programs. Each one uses a form. Here is who each is for, what it costs and how to apply, in Mountain Line's words. Questions? Call 304-291-RIDE (304-291-7433).

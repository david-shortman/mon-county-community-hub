sections:
  - heading: What happens after you report a property problem
    id: complaint-steps
    note: "The city's eight steps, \"from start to finish\":"
    items:
      - "1. \"Code Enforcement Receives a Complaint\""
      - "2. \"Staff Determines the Nature of the Complaint\": \"Does the complaint deal with property maintenance, commercial property, residential property, or an electrical issue?\""
      - "3. \"Complaint is Assigned\": \"The appropriate compliance officer, building inspector, housing inspector, or electrical inspector is assigned the complaint to investigate.\""
      - "4. \"On-site Review Performed\": \"Within 24 hours of the complaint, an officer makes an on-site review.\" If the complaint is found valid, the owner gets an official notice. The time to fix it \"can vary from immediate for an emergency, anything that threatens life, health or property, to 20 days for a non-emergency.\""
      - "5. \"Citation is Issued\": if the time runs out and the work is not done, the owner gets a citation. \"The court date given for the citation is 21 days from the issuance.\""
      - "6. \"Request for an Extension/Conflict with Court Date\": on or before the court date, the owner \"may be given up to another 20 days to address and fix the violation.\""
      - "7. \"Court Date\": \"a judge may grant the requested extension of 20 days.\""
      - "8. \"Larger Fines Administered\": \"If the owner still has not fixed the violation, a judge will issue more, and often larger, fines.\""
      - "The sheet ends: \"Many complaints appear as if they are not addressed, but Code Enforcement always uses this process to take the necessary steps and move the violation through the legal system.\""

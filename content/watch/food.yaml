# Food pantry and meal pages the daily Source check watches closely (#166).
# How it works and what to do when one changes: docs/plans/2026-10-31-pantry-watch.md
#
# This is a watch list, not a listing. Nothing here shows on the site.
# Fields:
#   name     the group or program
#   org      its record in content/orgs, if there is one
#   kind     page, pdf, facebook (a person checks it), none (no web source:
#            goes to the call queue, #156) or blocked (sends robots away; a
#            person checks it in a browser)
#   url      the most specific page that gives the hours
#   start, end  short text just before and just after the hours on the page.
#            Only the text between them is compared, digits included.
#   quote    the hours exactly as the page says them, on the checked date
#   checked  when a person or agent last read the page against this entry
#   note     conflicts and anything a re-checker should know
# A quote here is proof of what the page said, not a confirmed fact for the
# site. Hours go on the site only through a record and a PR (food PRs wait for
# David).
group: food
title: Food pantry and meal pages
issue_title: Food pantry or meal page changed

# Winter warming shelter sources the daily Source check watches, November 1 to
# March 31 only (#863). How it works and what to do: docs/plans/2026-10-31-shelter-watch.md
#
# This is a watch list, not a listing. Nothing here shows on the site, and the
# check never changes the site. A person reads the source and updates
# content/tonight/warming-shelter.yaml (once #862 merges) or the dated line on
# /stay-tonight/ in a PR. Shelter PRs wait for David.
#
# Fields are the same as content/watch/food.yaml, plus:
#   season  month-day range, Morgantown dates. Outside it the list is skipped.
#   words   phrases to point out. On the first check of the season a page that
#           mentions one opens the issue, and every change shows the lines
#           that mention them.
#   todo    what the person should do, shown at the top of the issue.
#   plan    the doc that explains this list.
group: shelter
title: Winter warming shelter sources
issue_title: Warming shelter source changed
season: 11-01 to 03-31
plan: docs/plans/2026-10-31-shelter-watch.md
words:
  - warming shelter
  - warming center
  - warming station
  - code blue
  - cold weather shelter
  - open tonight
  - now open
todo: >-
  What to do: open each page and read it. If it says the warming shelter is
  open, or gives a date, place, hours or rules, confirm it with a same-day
  source (the operator, 211, or a same-day news report), then update
  content/tonight/warming-shelter.yaml (once #862 merges) or the dated warming
  shelter line on /stay-tonight/ in a PR with the source and a new checked date.
  Shelter PRs wait for David. If nothing about the shelter changed, close this
  issue. Never copy text from this issue onto the site, and never mark the
  shelter open from a news story alone that is not from today.
entries:
  - name: Dominion Post, warming shelter stories
    kind: page
    url: https://www.dominionpost.com/tag/warming-shelter/
    start: "TAG: warming shelter"
    end: Trending
    checked: 2026-10-31
    note: Local news. A story is a lead to confirm, not a source to quote. Credit the outlet if a story is the only source (writing rules, rule 1).

  - name: Dominion Post, Hazel's House of Hope stories
    kind: page
    url: https://www.dominionpost.com/tag/hazels-house-of-hope/
    start: "TAG: Hazel's House of Hope"
    end: Trending
    checked: 2026-10-31
    note: The planned shelter site for this winter, per August 2026 reports.

  - name: WAJR, warming shelter stories
    kind: page
    url: https://wajr.com/?s=warming+shelter
    start: 'You are here: Home Results for "warming shelter"'
    end: WVRC Media
    checked: 2026-10-31
    note: Local radio news search results, newest first. robots.txt allows it.

  - name: City of Morgantown News Flash
    kind: page
    url: https://www.morgantownwv.gov/CivicAlerts.aspx
    start: More Tools View Archive RSS Feed News Flash
    end: Website News
    checked: 2026-10-31
    note: Every new city press release changes this list. The Mentions lines show whether a release is about the shelter. The city asks robots to wait 10 seconds between requests; the Source check does.

  - name: Catholic Charities WV, Grace Shelter
    kind: blocked
    url: https://www.ccwva.org/programs/grace-shelter/
    checked: 2026-10-31
    note: The planned operator. The site resets automated connections, so a person checks it in a browser.

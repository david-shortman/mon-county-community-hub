todo: >-
  What to do: open each page and read it. For a new dated public event at a
  place in content/places/, add content/calendar/<place>-<event>-<date>.yaml
  with venue and topic community (event facts only, with a link, never copied
  text, no event without a confirmed year, no volunteers' names or numbers).
  For changed hours, dues, prices or status, update the place file and its
  checked date. Do it in one PR, then close this issue. If nothing new, close
  it. If a place seems closed or moved, open a needs-verification issue.

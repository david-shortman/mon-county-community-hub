sells: Free professional clothes that students choose and keep. Private rooms are also available for virtual job interviews.
takes: Professional clothing, left at the Davis College Success Center. The biggest needs are mid-range sizes and men's shoes. The center is open Monday to Thursday, 8 a.m. to 9 p.m., and Friday, 8 a.m. to 5 p.m.
goods: [clothes]
buys_from_you: false

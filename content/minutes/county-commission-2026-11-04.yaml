body: county-commission
meeting: Regular session
date: 2026-11-04
minutes_url: https://monongaliacountyclerk.com/index.php/21-additional-info/48-commission-meetings-minutes-draft
minutes_status: Draft
read: 2026-11-13
actions:
  - item: "3. Consent and Approval"
    motion: "for the Commission to give their consent and approval to the following agenda items: a) Erroneous Assessments (attached) b) Minutes – October 28, 2026 c) Pay Vouchers d) Miscellaneous Bonds, etc. e) Budget Revisions f) Vacancies for Boards and Authorities g) Fiduciary Orders"
    result: unanimously carried
  - item: "4a. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] and [name] as full-time Deputy Sheriffs for the Monongalia County Sheriff’s Department at a rate of $5,041.67 per month effective November 16, 2026, with a health insurance eligibility date of December 1, 2026."
    result: unanimously carried
  - item: "4b. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] as a part-time Sheriff Utility Officer/Court Security for the Monongalia County Sheriff’s Department at a rate of $18.91 per hour effective November 16, 2026 and the employment of [name] as a full-time Process/ Transport Officer for the Monongalia County Sheriff’s Department at a rate of $3,333.34 per month effective November16, 2026, with a health insurance eligibility date of December 1, 2026."
    result: unanimously carried
  - item: "6. Proclamation – National Hospice and Palliative Care Month"
    motion: "to proclaim November 2026 as National Hospice and Palliative Care Month."
    result: unanimously carried
  - item: "7. Receipt of sealed bids and bid opening for the Monongalia County Health Department Renovations"
    motion: "to accept the bids as presented and direct Silling to do a complete review of the bids to make sure everything is completely responsive and come back to the Commission with a suggestion as far as contracted work."
    result: unanimously carried
  - item: "11a. New Business"
    motion: "to approve Requisition No. 44 for the University Town Centre Series 2023 A Property Tax District Administrative Expense Fund in the amount of $5,325.00."
    result: unanimously carried
  - item: "11b. New Business"
    motion: "to approve Requisition No. 128 for the University Town Centre Excise Tax District Administrative Expense Fund in the amount of $6,362.50."
    result: unanimously carried
  - item: "11c. New Business"
    motion: "to approve a request by Main Street Morgantown for $600.00 to record and televise the Annual Christmas Parade on December 2, 2026."
    result: unanimously carried
  - item: "14. Adjournment"
    motion: "to adjourn at 10:35 A.M."
    result: unanimously carried
note: These minutes are a draft until the Commission approves them. The County Clerk posts only the newest draft on its page, so the link may show a later meeting. We read the November 4 draft on November 13, 2026. The Commission's draft minutes of November 10, 2026 record these minutes as approved, under Consent and Approval. The approved copy is not posted online, so this list is still from the draft.

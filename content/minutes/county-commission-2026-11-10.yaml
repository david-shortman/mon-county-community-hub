minutes_status: Draft
read: 2026-11-14
actions:
  - item: "3. Consent and Approval"
    motion: "for the Commission to give their consent and approval to the following agenda items: a) Erroneous Assessments (attached) b) Minutes – November 4, 2026 c) Pay Vouchers d) Miscellaneous Bonds, etc. e) Budget Revisions f) Vacancies for Boards and Authorities g) Fiduciary Orders"
    result: unanimously carried
  - item: "4a. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] and [name] as full-time Telecommunicators for the Monongalia County Homeland Security and Emergency Management Agency/MECCA 9-1-1 at a rate of $3,704.00 per month effective December 1, 2026, with a health insurance eligibility date of December 1, 2026."
    result: unanimously carried
  - item: "4b. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] as a full-time Sheriff Utility Officer/Transport Officer for the Monongalia County Sheriff’s Department at a rate of $3,333.34 per month effective November 16, 2026, with a health insurance eligibility date of December 1, 2026."
    result: unanimously carried
  - item: "4c. Introduction of new employees/personnel changes"
    motion: "to approve correcting the name of the personnel approved at last week’s meeting for the Monongalia County Sheriff’s Department to reflect his correct name of [name]."
    result: unanimously carried
  - item: "4d. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] as a full-time Human Resources Generalist for the Monongalia County Commission at a rate of $63,200.00 per year effective November 16, 2026, with a health insurance eligibility date of December 1, 2026."
    result: unanimously carried
  - item: "5. Comments from the Public"
    motion: "to approve moving the Public Comments section to the end of the meeting."
    result: unanimously carried
  - item: "6a. Grants"
    motion: "to approve the request for reimbursement for the Community Development Block Grant in the amount of $981.24."
    result: unanimously carried
  - item: "6b. Grants"
    motion: "to approve the grant contract and supporting documents for the Victims of Crime Act (VOCA) Grant in the amount of $137,226.00."
    result: unanimously carried
  - item: "9a. New Business"
    motion: "to approve the award with Lombardi Development Company for renovations for the future home of the Monongalia County Health Department for the lowest bid of $7,150,000.00."
    result: unanimously carried
  - item: "9b. New Business"
    motion: "to approve moving the Monongalia County Commission Meeting scheduled for Wednesday, November 25, 2026, to Tuesday, November 24, 2026."
    result: unanimously carried
  - item: "12. Adjournment"
    motion: "to adjourn at 10:44 A.M."
    result: unanimously carried
note: These minutes are a draft until the Commission approves them. The County Clerk posts only the newest draft on its page, so the link may show a later meeting. We read the November 10 draft on November 14, 2026. This meeting was on a Tuesday, not the usual Wednesday.

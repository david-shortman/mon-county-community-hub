minutes_status: Draft
read: 2026-11-24
actions:
  - item: "3. Consent and Approval"
    motion: "for the Commission to give their consent and approval to the following agenda items: a) Erroneous Assessments (attached) b) Minutes – November 10, 2026 c) Pay Vouchers d) Miscellaneous Bonds, etc. e) Budget Revisions f) Vacancies for Boards and Authorities g) Fiduciary Orders"
    result: unanimously carried
  - item: "3g. Fiduciary Orders"
    motion: "to direct [name], Co-Executor for the Estates of [name] and [name], to file appraisements to bring these estates in compliance before objections can be considered."
    result: unanimously carried
  - item: "4a. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] as a part-time Sheriff Utility Officer/Court Security for the Monongalia County Sheriff’s Department at a rate of $18.91 per hour effective November 23, 2026."
    result: unanimously carried
  - item: "6. Grants"
    motion: "to approve requests for reimbursements for the Community Corrections Grant ($21,178.48), Sexual Assault Kit Initiative (SAKI) Grant ($23,782.83), and the Victims of Crime Act (VOCA) Grant ($8,261.77)."
    result: unanimously carried
  - item: "9a. New Business"
    motion: "to approve a Consultant Agreement with MuniCap, Inc. under which MuniCap would complete an updated study of the Harmony Grove TIF District and prepare an updated Revenue Report and debt service coverage calculations in connection with proposed modifications to the terms of TIF Bonds previously issued by the County Commission for the Harmony Grove TIF District."
    result: unanimously carried
  - item: "9b. New Business"
    motion: "to approve AIA B253 Agreement for Furniture, Furnishings and Equipment Design Services as a supplement to the Owner-Architect Agreement dated July 14, 2026 with Silling Associates, Inc. for the Monongalia County Health Department Project for a budget of $618,876.00, with Silling Associates Inc. receiving a $30,000.00 fee."
    result: unanimously carried
  - item: "9c. New Business"
    motion: "to approve the additional compensation in the amount of $15,000.00 for the Assessor of Monongalia County as indicated by the letter received from Matthew Irby, WV State Tax Commissioner, that the Assessor has substantially completed the additional duties pursuant to WV Code §7-7-6b."
    result: unanimously carried
  - item: "9d. New Business"
    motion: "to approve Requisition No. 120 for the University Town Centre Economic Opportunity Development District Subaccount in the amount of $1,170,536.46."
    result: unanimously carried
  - item: "9e. New Business"
    motion: "to certify the results of the 2026 General Election and endorse the documents as presented to send to the West Virginia Secretary of State’s Office."
    result: unanimously carried
  - item: "13. Adjournment"
    motion: "to adjourn at 11:03 A.M."
    result: unanimously carried
note: These minutes are a draft until the Commission approves them. The County Clerk posts only the newest draft on its page, so the link may show a later meeting. We read the November 18 draft on November 24, 2026. Private people's names are shown as [name].

body: county-commission
meeting: Regular session
date: 2026-10-28
minutes_url: https://monongaliacountyclerk.com/index.php/21-additional-info/48-commission-meetings-minutes-draft
minutes_status: Draft
read: 2026-10-31
actions:
  - item: "3. Consent and Approval"
    motion: "for the Commission to give their consent and approval to the following agenda items: a) Erroneous Assessments (attached) b) Minutes – October 21, 2026 c) Pay Vouchers d) Miscellaneous Bonds, etc. e) Budget Revisions f) Vacancies for Boards and Authorities g) Fiduciary Orders"
    result: unanimously carried
  - item: "4a. Introduction of new employees/personnel changes"
    motion: "to approve the employment of [name] as a full-time Process/Transport Officer for the Monongalia County Sheriff’s Department at a rate of $3,333.34 per month effective November 1, 2026, with a health insurance eligibility date of December 1, 2026."
    result: unanimously carried
  - item: "7. Presentation of the 2025 Delinquent Tax List"
    motion: "to accept the 2025 Delinquent Taxes Certification to the West Virginia State Auditor’s Office to include the suspensions/inclusions as follows: the suspension list listing, which includes the listing of tax tickets as presented, which are pending redemption, pending deed obtained, condemnation, prior bankruptcy, deed conflict classification correction and the listing of interest in oil and gas tickets and the addition of listing of tax tickets being removed from prior year’s suspension."
    result: unanimously carried
  - item: "8. Grants"
    motion: "to approve the grant contract and supporting documents for the Sexual Assault Kit Initiative (SAKI) grant ($288,366.00)."
    result: unanimously carried
  - item: "11a. New Business"
    motion: "to approve an order establishing a program to permit 16–17-year-old student or students to be appointed as an election official pursuant to House Bill 4865 and West Virginia Code §3-1-28."
    result: unanimously carried
  - item: "11b. New Business"
    motion: "to approve a Letter of Engagement from The Arbitrage Group, Inc., as recommended by the County’s bond counsel for calculation of the 2026 University Town Centre Property and Excise Tax District Bonds."
    result: unanimously carried
  - item: "11c. New Business"
    motion: "to approve refunding surplus funds in the amount of $12,314.94 from Certificate of Sale Number 2024C000136 to the Petitioner as requested."
    result: "carried (with Commissioner Arnett abstaining)"
  - item: "14. Adjournment"
    motion: "to adjourn at 10:53 A.M."
    result: unanimously carried
note: These minutes are a draft until the Commission approves them. The County Clerk posts only the newest draft on its page, so the link may show a later meeting. We read the October 28 draft on October 31, 2026.

date: 2026-11-01
item: WV Invests Grant, on the Get training or school paid for page
page: /pay-for-training/
kind: fact
found_by: our-check
what: We said the grant was only for U.S. citizens. The state's How It Works page says U.S. citizens and non-citizens who can get federal student aid can both qualify, if they lived in West Virginia for at least 1 year before applying. The listing now says this.

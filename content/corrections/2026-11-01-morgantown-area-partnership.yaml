date: 2026-11-01
item: Morgantown Area Partnership, on the Morgantown Area Partnership listing
kind: fact
found_by: our-check
what: We quoted an older description and said the Partnership includes the Morgantown Area Economic Partnership. Its website now calls itself "a dynamic public/private alliance" and lists four partner groups, its Chamber of Commerce, the Monongalia County Development Authority, Main Street Morgantown and the Campus Neighborhoods Revitalization Corporation. The listing now uses the current wording and list.

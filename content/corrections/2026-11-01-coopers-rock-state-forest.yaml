item: Coopers Rock State Forest, on the Coopers Rock State Forest listing
kind: fact
found_by: our-check
what: We said the cabins and the two campgrounds are open April to November. The state parks site says the cabins are open year-round, and only the campgrounds are open April to November, weather permitting. The listing now says that.

note: The County posted an amended agenda on November 25, 2026, and this guide follows it. Under New Business, item 9, the agenda lists four items, shown here as 9a to 9d. The agenda gives the time but not the room. The Commission's page says its meetings are held at the Courthouse. On this agenda, public comment comes near the end, after reports.

  - number: "8a"
    title: Consideration to approve Requisition No. 14 for the Mon General-Maple Drive Series 2016 C Administrative Expense Fund
    kind: vote
    line: A vote on a request to pay money from the administrative expense fund for the Mon General-Maple Drive Series 2016 C bonds.
  - number: "8b"
    title: Consideration to approve Requisition No. 26 for the Series 2021 B Harmony Grove Phase 1 Administrative Expense Fund
    kind: vote
    line: A vote on a request to pay money from the administrative expense fund for the Series 2021 B Harmony Grove Phase 1 bonds.
  - number: "8c"
    title: Consideration to approve Requisition No. 45 for the University Town Centre Series 2023 A Property Tax District Administrative Expense Fund
    kind: vote
    line: A vote on a request to pay money from the administrative expense fund for the University Town Centre Series 2023 A property tax district.
  - number: "8d"
    title: Consideration to approve Requisition No. 128 for the University Town Centre Excise Tax District Administrative Expense Fund
    kind: vote
    line: A vote on a request to pay money from the administrative expense fund for the University Town Centre excise tax district.
  - number: "8e"
    title: To consider approval of the University Town Centre Economic Opportunity Development District Annual Statutory Report
    kind: vote
    line: A vote on the yearly report that state law requires for the University Town Centre Economic Opportunity Development District.
  - number: "8f"
    title: "Consideration to approve the request by the Monongalia County Abandoned & Dilapidated Property Enforcement Agency to move the following properties to the complaint stage in accordance with County Ordinance 2004-01:"
    kind: vote
    line: A vote on moving properties on Tyrone Road and Sunrise Village Road to the complaint stage under the county's abandoned and dilapidated property ordinance. The agency that enforces that ordinance asked for this.

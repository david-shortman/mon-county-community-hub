      - Budget Revisions
      - Vacancies for Boards and Authorities
      - Fiduciary Orders
  - number: "4"
    title: Introduction of new employees/personnel changes
    kind: personnel
    line: The Commission is introduced to new staff. The agenda lists, by name, one full-time telecommunicator for MECCA 9-1-1 and five people for the Sheriff's office. They are school safety officers (one full-time, one part-time), two full-time process and transport officers, and one part-time utility officer.

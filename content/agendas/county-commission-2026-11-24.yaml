    title: "[name] – Grants"
    kind: presentation
    line: An item about grants, led by a person the agenda names. The agenda gives no more detail.
  - number: "6"
    title: Correspondence
    kind: correspondence
    line: Letters the Commission has received. The agenda lists one, from the WV DHHR Office of Emergency Medical Services, about the county allocation under House Bill 5168.
  - number: "7"
    title: Unfinished Business
    kind: other

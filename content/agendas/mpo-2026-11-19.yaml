  - number: "5"
    title: 2026 November - TIP Amendments and Administrative Adjustments
    kind: other
    line: Proposed changes to the MPO's Transportation Improvement Program (TIP), at the request of the state Division of Highways. The packet lists new phases and amounts for projects that include the Chaplin Hill Road improvements, flyover and trail, the Blue Horizon Bridge and the Harmony Grove interchange, plus schedule and funding changes. The packet says the public comment period on the amendments runs November 4 to 18, 2026.
  - number: "6"
    title: TAM Targets 2027
    kind: vote
    line: A vote on whether to endorse the state's 2027 Transit Asset Management (TAM) targets, which set measures for the useful life of transit vehicles, buildings and equipment. The packet says federal law requires these targets.
  - number: "7"
    title: 2027 Meeting Dates
    kind: other
    line: The MPO's proposed 2027 meeting dates. The packet lists Policy Board meetings on the third Thursday of January, March, May, August, October and November.

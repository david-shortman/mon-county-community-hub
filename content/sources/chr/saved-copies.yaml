# Saved copies of the County Health Rankings & Roadmaps (CHR&R) files this
# site reads or cites (#1906). CHR&R says its website "will stay up through
# December 2026". Its terms do not let us re-host the files in this repo (see
# README.md here), so this list records each file exactly and points to a copy
# the Internet Archive's Wayback Machine already holds.
#
# Each saved copy was downloaded on the read date and its SHA-256 matched the
# live file byte for byte. scripts/update-chr-indicators.mjs reads the saved
# copy when the live file is gone, and refuses it if the checksum differs.
#   url: the live address the site cites
#   file_name: the name CHR&R gives the file
#   bytes, sha256: of the live file on the read date
#   last_modified: the date CHR&R's server gives for the file
#   saved_copy: the Wayback Machine capture, for people
#   saved_copy_raw: the same capture as the original bytes, for scripts

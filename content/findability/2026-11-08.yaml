# Findability run results
#
# One run of the question set in questions.yaml, scored with the rubric in
# docs/scoreboard.md. Each result is the best answer a resident could reach
# with a plain web search and a phone. Scores are 0 to 3 on each dimension.
# Compute totals with: python3 content/findability/score.py <this file>
#
# search_top_results: domains of the first three search results.
# orgs: the organizations whose work answers the question.
# gap: what is missing, for questions scoring 9 or less (and some others).
# hub_page: the page on our site that directly answers this question, or null.
# hub_in_results: whether one of our pages showed up in the plain or reworded
#   search. Our page counts toward the score only when this is true (or an
#   official page links to it). See docs/scoreboard.md (#110).
#
# Weekly Sunday run, 2026-11-08 (evening, Eastern). All 65 questions, by six
# parallel testers using one rubric. q63 to q65 are scored for the first time.
# Testers used one reworded search each, named in the note, and scored
# "not found" only when neither search reached any correct local page.
# Our site: https://everythingmorgantown.org.


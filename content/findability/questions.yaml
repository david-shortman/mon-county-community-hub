# Findability question set
#
# Realistic questions a Monongalia County resident might have. Each findability
# run tries to answer every question the way a resident would (plain web search,
# then following links on a phone) and scores the best answer it finds.
# Method and scoring: docs/scoreboard.md. Results: content/findability/<date>.yaml.
#
# Keep ids stable so runs can be compared over time. To retire a question, mark
# it `retired: <date>` instead of deleting it. New questions get new ids.
#
# kind: urgent (a need right now), everyday (a routine task), civic (taking part)
# search: the plain words used for the first web search. Keep these fixed across
# runs so scores stay comparable.

version: 1

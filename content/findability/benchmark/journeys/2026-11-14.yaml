# Source benchmark: first whole-journey baseline and the ninth need (#1050)
#
# Two parts:
#   needs:    q29 (a ride to a medical appointment), scored the same way as the
#             weekly runs, so the next Sunday run can carry it forward.
#   journeys: the whole trip to the key fact, from two starting points:
#             from_home   our home page (everythingmorgantown.org)
#             from_search a plain web search with the findability `search`
#                         text for that need (questions.yaml), top result first
# Method and the minutes formula: "Whole journey" in the Source benchmark
# section of docs/scoreboard.md. Score with:
#   python3 content/findability/benchmark/score.py content/findability/benchmark/journeys/2026-11-14.yaml
#
# from_home uses the links on the live home page read 2026-11-14 and each
# page's words_before_answer from the 2026-11-08 run (q29 from today's
# measure.js). calls is 1 when our page's must_call is true.
# from_search is not scored this run: for q29 the top result
# (wrc.wvu.edu/resources/basic-needs/transportation) answered our robots.txt
# check with a 403, so under docs/operations/automated-reads.md it was not read.
# The other eight were not run today; the next Sunday run does all nine.


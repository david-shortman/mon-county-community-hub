# Checked again 2026-11-22 (HEAD request and a hash of a download to a scratch
# folder, deleted after): unchanged, so outside sources are not re-scored. The
# PDF is not stored in the repo.
#
# facts: confirmed true = matches the provider's page at that URL today;
# false = does not match (why says how); null = could not check this run.
# Facts on our pages were checked 2026-11-22 against the provider's own page,
# read with curl (phone User-Agent) after a robots.txt check of each site, or
# with the WebFetch tool where noted. Never against a second-hand list.
# scored: false = the source refused our tools, or (journeys) the start gave no
# way to reach the key fact, so it is left out instead of guessed.
#
# 2026-11-22: the q25 fact found wrong on 2026-11-15 is resolved. Our page
# changed on 2026-11-18 (#1824): it now says Legal Aid's online applications
# were closed November 10 to 19 and that you can apply online after that. Legal
# Aid's Apply for Help page today shows the online intake questions again, under
# the same "closed November 10-19, 2026" notice, so online applying is back. The
# official q25 source is carried forward from 2026-11-01 and was not re-checked.
#
# journeys: the whole trip to the key fact (docs/scoreboard.md, "Whole journey").
# from_home uses the links on the live home page read 2026-11-22 and today's
# words_before_answer. from_search uses the findability `search` text
# (questions.yaml) in one plain web search on 2026-11-22, top result first,
# read at 390px with a Playwright script in a scratch folder after a robots.txt
# check of each site. Words count the visible page text up to the key fact.


# Source benchmark run (#183, #184)
#
# Weekly run (not the first Sunday of the month): only our pages were re-measured
# and re-scored. Outside sources (frn-guide, city-pathways, official) are carried
# forward with their old checked dates: q01 to q26 scored 2026-11-01, and q29
# scored 2026-11-14 (journeys/2026-11-14.yaml, #1050). Automatic numbers (auto:)
# come from content/findability/benchmark/measure.js --hub-only, run 2026-11-22;
# everything else was scored by reading each page, as the "Source benchmark"
# section of docs/scoreboard.md describes. Score with:
#   python3 content/findability/benchmark/score.py content/findability/benchmark/2026-11-22.yaml
#
# frn-guide: the 2025 resource guide PDF, 11 pages, 331,504 bytes,
# Last-Modified Wed, 19 Feb 2025 20:13:54 GMT,

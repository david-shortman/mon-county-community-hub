# Simulated resident tasks for pages added on October 31 and November 1, 2026
# (#529, sprint wave 8). Same format and rules as tasks.yaml. These are
# made-up tasks, not real residents or real feedback.
#
# Paths are the taps we judged a resident would take from the home page,
# using the home page's own words. Where a related page a resident is likely
# to open first does not link to the new page, the task says so in `note`
# and uses the shortest path that works, so the score shows the cost.
- id: n01
  task: I applied for SNAP last week. What happens now?
  who: Parent who just applied for food help
  group: parents-young-kids
  need: enough-food
  searches: [applied for snap what happens next, snap interview]
  targets: [{url: /after-you-apply/snap/, marker: "interview", path: [/money/, /after-you-apply/snap/]}]
- id: n02
  task: My unemployment got denied. Can I fight it?
  who: Worker who lost a job
  group: job-seekers
  need: wages-and-cost-of-living
  searches: [unemployment denied appeal, appeal unemployment]
  targets: [{url: /after-you-apply/unemployment/, marker: "8 calendar days|appeal", path: [/money/, /after-you-apply/unemployment/]}]
- id: n03
  task: I applied for heating help a month ago and haven't heard back.
  who: Renter with a high heating bill
  group: renters
  need: utility-bills
  note: The home page's "Heat, water or power bill" link leads to /utility-bills/, which does not link to this guide.
  searches: [lieap application status, heating assistance applied]
  targets: [{url: /after-you-apply/lieap/, marker: "30 days|decision", path: [/money/, /after-you-apply/lieap/]}]
- id: n04
  task: Social Security turned down my disability claim.
  who: Adult with a disability
  group: disability-caregivers
  need: null
  searches: [disability denied, ssdi appeal]

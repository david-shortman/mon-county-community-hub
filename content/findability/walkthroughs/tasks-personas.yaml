# the persona's findability question (content/findability/questions.yaml),
# its search words (first search) and one shorter plain phrase (second),
# and the persona's landing page as the first target. A second target is the
# page that answers the question when the landing page sends people on.
# Paths use the words on the home page and door pages, the way a resident
# would tap. Same format and scripts as tasks.yaml (walk.js, score.py).
# after_path: the persona's new landing page after #1540, measured in the after run.

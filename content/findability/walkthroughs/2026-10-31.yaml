# findability questions). Script: walk.js, at 390 by 844, on the built site.
# Scores: score.py (each score is 0 to 3 and names its rubric criterion in
# docs/rubrics/). Write-up: docs/reviews/2026-10-31-simulated-walkthroughs.md.
#
# before: main at f971492 plus merges up to the evening of October 31.
# after: the same main plus the fix PRs #1153 (search), #1156 (links),
# #1160 (jobs link) and #1163 (child care), built together locally. Those
# PRs were open, not live, when this was measured. #1171 (door choices) came
# after this run and is not in the after numbers.
#
# Recompute the summary with: python3 content/findability/walkthroughs/score.py summary <this file>


# Simulated resident tasks for the walkthrough check (#529, sprint wave 6).
# These are made-up tasks, not real residents or real feedback. Each comes
# from a resident group (docs/groups/), a need on the needs register
# (content/needs/), or a findability question.
#
# searches: two things a stressed resident might type in the site search.
# targets: the page that answers the task. marker is a regular expression for
#   the answer's first words on that page. path is the links tapped from the
#   home page, in order. A door page link counts 3 taps when it sits behind
#   the "pick what is going on" list (tick, Show my steps, tap the link).
# need: the needs register entry (content/needs/), if any.
# answer: all (every target is needed) or any (one target is enough).
# after_path: a shorter path that a fix PR adds, measured in the after run.
- id: w01
  task: My power gets shut off Friday and I can't pay.
  who: Renter with a shutoff notice
  group: renters
  need: utility-bills
  searches: [power shut off friday, shutoff notice]
  targets: [{url: /utility-bills/, marker: "shut ?off|shutoff", path: [/utility-bills/]}]

# Findability run results
#
# One run of the question set in questions.yaml, scored with the rubric in
# docs/scoreboard.md. Each result is the best answer a resident could reach
# with a plain web search and a phone. Scores are 0 to 3 on each dimension.
# Compute totals with: python3 content/findability/score.py <this file>
#
# search_top_results: domains of the first three search results.
# orgs: the organizations whose work answers the question.
# gap: what is missing, for questions scoring 9 or less (and some others).
# hub_page: the hub page that directly answers this question, or null if none.
# hub_in_results: whether a hub page showed up in the plain or reworded search.
#   A hub page counts toward the score only when this is true (or an official
#   page links to it). Field names follow issue #110.
#
# End-of-sprint recheck (#529): after the October 30 to 31 backlog sprint, when
# the site had grown to about 118 pages. q01 to q32 compare with 2026-10-28b.yaml;
# q33 to q45 were added during the sprint (q43 to q45 first scored in
# 2026-10-30-centers.yaml, q33 to q42 first scored here). Our site moved to https://everythingmorgantown.org.


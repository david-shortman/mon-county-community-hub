# Site search test set (#529, wave 6)
#
# Words residents actually type into the site's own search box (/search/), and
# the page that should come back. `npm run search-test` in site/ builds the
# search index, runs each query the same way the search page does, and checks
# whether an expected page is in the top 3. Results go to
# content/findability/search-runs/<date>.json. How it works and how to read it:
# docs/operations/search-test.md.
#
# q: what the person types, as typed (misspellings on purpose).
# expect: routes that fully answer it. The first is the best page; any of them
#   in the top 3 counts as a hit.
# kind: everyday (plain words and slang), short (an acronym or short form),
#   misspelled, question (a full question, many from questions.yaml).
#
# Keep queries stable so runs can be compared. Add new ones at the end of their
# section. Never put a private person's words or searches here: these are
# written by us, not collected from visitors (the site logs no searches).


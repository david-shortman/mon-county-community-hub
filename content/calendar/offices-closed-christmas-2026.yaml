title: County offices close for Christmas
slug: offices-closed-christmas-2026
starts: 2026-12-24
ends: 2026-12-25
org_name: Monongalia County Commission and State of West Virginia
who_it_is_for: People with business at Monongalia County offices or West Virginia state offices.
what_to_do: County offices are open a half day on Thursday, December 24, and closed Friday, December 25. State offices are closed December 25. The county list does not say which half of December 24 is off, so call first.

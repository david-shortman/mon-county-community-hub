title: "Heating bill help (LIEAP): pre-LIEAP applications"
slug: lieap-pre-application-2026-27
starts: 2026-11-02
ends: 2026-11-25
org_name: WV Department of Human Services
who_it_is_for: This is for you if your household needs help paying winter heating bills. The WV Department of Human Services (DoHS) mails pre-LIEAP applications for the Low Income Energy Assistance Program to households that got regular LIEAP last season and those who have a child under age 6, are 60 or older, or have a disability. Income limits apply (for example, $2,550 a month for 1 person and $3,335 for 2). See the full rules at the link.
what_to_do: DoHS mails applications starting Monday, November 2. The last day is Wednesday, November 25. Return the application by mail, drop it off at a local DoHS office, or apply online at WV PATH. Include a current utility bill, or proof from your fuel supplier and a receipt if you heat with bulk fuel. Funding is limited and first come, first served, so apply early.

who_it_is_for: This is for you if you want to follow how bus routes, schedules and fares are decided. The Transit Authority board meets at noon on the third Wednesday of each month, and the meeting is open to the public.
what_to_do: Go to the Mountain Line Transit Depot in Westover. The city's Agenda Center has the board's agendas and minutes. To learn other ways to speak up, see Have your say on this site.

who_it_is_for: Anyone. General admission is $10, and children 2 and under get in free. Parking is free.
what_to_do: A walk-through holiday light display. It is open 21 nights between November 27 and December 23, not every night, so check its calendar for your night. Hours are 5:30 p.m. to 9:30 p.m. Sunday to Thursday and 5:30 p.m. to 10 p.m. Friday and Saturday. Pick your night when you buy a ticket. Special nights include a Sensory-Friendly Night on Monday, December 14, and a Pet Night on Wednesday, December 16.

title: WV Invests Grant priority deadline for 2027-28
slug: wv-invests-priority-deadline-2027
starts: 2027-04-15
org_name: West Virginia Community and Technical College System
who_it_is_for: People who want the WV Invests Grant to pay for a certificate or two-year degree at a West Virginia public college in 2027-28.
what_to_do: File the 2027-28 FAFSA and the WV Invests Grant application by April 15. You can still apply after that date. Awards go out on a rolling basis.

title: County offices close for New Year's
slug: offices-closed-new-years-2027
starts: 2026-12-31
ends: 2027-01-01
org_name: Monongalia County Commission and State of West Virginia
who_it_is_for: This is for you if you have business at Monongalia County offices or West Virginia state offices.
what_to_do: County offices are open a half day on Thursday, December 31, and closed Friday, January 1. New Year's Day is also a state holiday under state law. The county list does not say which half of December 31 is off, so call first.

title: Sign up for 2027 health insurance on the Marketplace
slug: marketplace-open-enrollment-2027
starts: 2026-11-01
ends: 2027-01-15
org_name: HealthCare.gov (U.S. Centers for Medicare & Medicaid Services)
who_it_is_for: People who need health insurance for 2027 and do not get it through a job, Medicaid, or Medicare.
what_to_do: Apply, renew, or change your plan at HealthCare.gov between November 1 and January 15. For coverage that starts January 1, the last day is Tuesday, December 15.

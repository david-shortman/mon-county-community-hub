title: Farmers market registration and vendor permit forms due to the state
slug: wvda-farmers-market-forms-2027
starts: 2027-03-01
org_name: WV Department of Agriculture
who_it_is_for: Farmers markets in West Virginia, which must register each year, and vendors who want to sell canned acidified foods (like salsa, pickles or sauces) at a market. Fresh uncut produce does not need the vendor permit. See the full rules at the link.
what_to_do: Send the market registration form or the vendor permit application to the Department of Agriculture. The last day is Monday, March 1. Market registration is free. The vendor permit is $35 a year. Questions go to farmersmarkets@wvda.us.
url: https://agriculture.wv.gov/divisions/regulatory-and-environmental-affairs/farmers-market/
phone: 304-558-3550

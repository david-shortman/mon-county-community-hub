what_to_do: A yearly holiday sale on a working farm in Masontown, Preston County. Barns and sheds are set up as small shops with vintage Christmas items, antiques, repurposed furniture, folk art and handmade goods. Hours are noon to 8 p.m. Thursday through Saturday, and 10 a.m. to 4 p.m. Sunday. Cash or check only. Please leave pets at home. The organizer asks you to follow the directions on its website, not your GPS.

title: Medicare Open Enrollment for 2027
slug: medicare-open-enrollment-2027
starts: 2026-10-15
ends: 2026-12-07
org_name: Medicare (U.S. Centers for Medicare & Medicaid Services)
who_it_is_for: This is for you if you have Medicare and want to change your coverage for 2027, such as joining, dropping or switching a Medicare Advantage Plan or a drug plan.
what_to_do: Medicare says Open Enrollment "is the time each year when you can make changes to your coverage." Changes you make start January 1. The last day is Monday, December 7. WV SHIP gives free help comparing plans at 1-877-987-4463.

start_time: "08:30"
end_time: "16:30"
org_name: Monongalia County Clerk
who_it_is_for: Voters in Monongalia County who have an absentee ballot and want to bring it in instead of mailing it.
what_to_do: Bring it to the County Clerk's office, 243 High Street, Room 123, Morgantown. The last day is Monday, November 2. Mailed ballots must be postmarked by Election Day, Tuesday, November 3. One person may not deliver more than two voters' ballots.

title: Second half of property taxes due, with a discount for paying on time
slug: property-tax-second-half-2027
starts: 2027-03-01
ends: 2027-04-01
org_name: Monongalia County Sheriff's Tax Office (dates set by West Virginia law)
who_it_is_for: People who owe Monongalia County real estate or personal property taxes.
what_to_do: To get a 2.5% discount, the last day to pay is Monday, March 1. Unpaid taxes become late on Thursday, April 1. These dates come from state law (W. Va. Code 11A-1-3), so confirm with the Sheriff's tax office.

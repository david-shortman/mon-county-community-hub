title: Last day to apply for MTEC high school programs
slug: mtec-high-school-application-fall-2026
starts: 2026-11-29
start_time: "15:00"
org_name: Monongalia County Technical Education Center (MTEC)
who_it_is_for: Students now in 9th, 10th or 11th grade who want two years of hands-on job training at MTEC, in health jobs, building trades, culinary, graphic design, law and public safety, and more.
what_to_do: Apply online on MTEC's recruiting site and list your top three programs. MTEC's site says the application window closes November 29 at 3 p.m. An interview with the program teacher comes next. Free for full-time Mon County Schools students. Questions, call 304-291-9240.

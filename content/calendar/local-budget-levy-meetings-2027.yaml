title: "Local budget season: cities and the County Commission set next year's levy estimates"
slug: local-budget-levy-meetings-2027
starts: 2027-03-07
ends: 2027-03-28
org_name: West Virginia Legislature (state law)
who_it_is_for: Anyone who wants to follow or comment on the city or county budget for the year that starts July 1, 2027.
what_to_do: State law says each local levying body, such as City Council and the County Commission, holds its levy estimate meetings between March 7 and March 28. Watch City Council and County Commission agendas in March for the budget items. Each body sets its own meeting dates.

org_name: Mountain Line Transit Authority
who_it_is_for: This is for you if you ride Mountain Line buses.
what_to_do: Mountain Line says all of its services except the Grey Line are closed on New Year's Day, Friday, January 1, 2027. The Grey Line to Pittsburgh runs every day of the year. Plan rides for another day.

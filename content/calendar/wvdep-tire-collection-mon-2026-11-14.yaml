title: Free tire drop-off in Morgantown
slug: wvdep-tire-collection-mon-2026-11-14
starts: 2026-11-14
start_time: "08:00"
end_time: "12:00"
org_name: West Virginia Department of Environmental Protection (REAP)
who_it_is_for: West Virginia residents with old car or light truck tires. Tires from businesses are not accepted.
what_to_do: Bring your tires, taken off the rims, to 200 M-Tec Dr, Morgantown, from 8 a.m. to noon, and have your WV ID ready. The state DEP page says the limit is 10 tires per person. The county Solid Waste Authority's events page says 12.

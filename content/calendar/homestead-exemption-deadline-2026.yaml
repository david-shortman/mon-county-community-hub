title: Deadline to apply for the homestead property tax exemption
slug: homestead-exemption-deadline-2026
starts: 2026-12-01
org_name: Monongalia County Assessor (deadline set by West Virginia law)
who_it_is_for: Homeowners who are 65 or older, or permanently and totally disabled, own and live in the home, and have lived in West Virginia for the two years before the tax year.
what_to_do: New applicants file with the Monongalia County Assessor between July 1 and December 1. The last day is Tuesday, December 1. Go to Room 335 of the county courthouse, 243 High Street, Morgantown, Monday to Friday, 8:30 a.m. to 4:30 p.m., or call 304-291-7222. The Assessor's Real Estate page has the form and a link to file online. The Assessor's taxpayer guide says the exemption subtracts $20,000 from your home's assessed value before your tax is figured.
url: https://www.assessor.org/2205/Real-Estate
topics: [taxes, housing, money]

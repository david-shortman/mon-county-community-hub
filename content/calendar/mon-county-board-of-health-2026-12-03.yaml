who_it_is_for: This is for you if you want to follow how local health rules and Health Department services are decided. The Board of Health usually meets on the last Thursday of odd months. The Health Department's agenda page lists December 3 as the next meeting, since the usual November date falls on Thanksgiving.
what_to_do: Go to the MCHD Training Center (MCHD is the Monongalia County Health Department) at 453 Van Voorhis Road. The Health Department says dates can change, so check its Board of Health agenda page before you go. To learn other ways to speak up, see Have your say on this site.

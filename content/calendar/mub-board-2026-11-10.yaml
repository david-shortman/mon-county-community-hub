who_it_is_for: This is for you if you want to follow how water, sewer and stormwater service and rates are decided. The MUB board meets at 5:30 p.m. on the second Tuesday of each month, and the meeting is open to the public.
what_to_do: Go to the MUB office. MUB posts the agenda a few days before the meeting on its agendas and minutes page. To learn other ways to speak up, see Have your say on this site.

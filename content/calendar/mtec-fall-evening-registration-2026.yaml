title: Last day to register for MTEC fall evening classes
slug: mtec-fall-evening-registration-2026
starts: 2026-11-07
org_name: Monongalia County Technical Education Center (MTEC)
who_it_is_for: Adults who want evening classes in computer, health jobs, technical skills, cooking, arts and crafts, or fitness.
what_to_do: Register online from MTEC's adult evening class page. MTEC's calendar shows fall registration open until 7 p.m. on Saturday, November 7. Classes and books cost money; see the fall flyer. Questions, call 304-291-9243.

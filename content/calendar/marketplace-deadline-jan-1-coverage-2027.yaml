who_it_is_for: This is for you if you buy your own health insurance through the Marketplace (HealthCare.gov, the federal site for health plans you buy yourself) and want your 2027 plan to start on January 1, 2027.
what_to_do: Enroll in or change your plan at HealthCare.gov. The last day is Tuesday, December 15.

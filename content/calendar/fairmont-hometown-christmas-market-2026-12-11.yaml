what_to_do: A two-day outdoor and tent market with local vendors, held with the Feast of the Seven Fishes as part of Fairmont's Hometown Holiday Celebration. The market opens at 10 a.m. Vendor spaces are sold out, but vendors can join a waitlist through the application on the organizer page.

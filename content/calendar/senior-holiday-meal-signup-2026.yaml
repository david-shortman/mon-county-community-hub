title: Last day to sign up for the senior holiday meal delivery
slug: senior-holiday-meal-signup-2026
starts: 2026-11-12
org_name: United Way of Monongalia and Preston Counties
who_it_is_for: People 65 and older in Monongalia County. The United Way also works with senior housing to include residents.
what_to_do: Sign up with the United Way's online form, or call 304-322-2064. The last day is Thursday, November 12. Sign-ups opened October 12. Meals are delivered the morning of December 9.

title: New Medicaid work and community rules start for some adults
slug: medicaid-community-engagement-start-2027
starts: 2027-01-01
org_name: WV Department of Human Services, Bureau for Medical Services
who_it_is_for: Some West Virginia Medicaid members ages 19 to 64 in the Adult Expansion Group, unless they are excluded. Applicants for January 2027 may have to meet the rules in December 2026. Current members face them at their regular renewal, starting with renewals due in March 2027.
what_to_do: Update your address, phone and email in WV PATH or at 1-877-716-1212, and read your mail. If DoHS asks for information, answer within 30 days. See the full rules at wvmedicaidhelp.org.
url: https://wvmedicaidhelp.org/
topics: [health]
phone: 877-716-1212
phone_label: the DoHS Customer Service Reporting Center

start_time: "09:00"
org_name: United Way of Monongalia and Preston Counties and Christian Help
who_it_is_for: Food is for anyone, first come, first served, with no sign-up. Toys are only for families who signed up with Christian Help from October 19 to 30.
what_to_do: Come to the Morgantown Readiness Center (Armory) at 90 Army Band Way. Food comes from Mountaineer Food Bank while it lasts. The United Way lists 9 a.m. to 4 p.m., and Christian Help lists pickup from 9 a.m. to 3 p.m., so come early. Questions? Call Christian Help at 304-296-0221.

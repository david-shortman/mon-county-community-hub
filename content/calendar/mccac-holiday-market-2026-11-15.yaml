org_name: Monongalia County Child Advocacy Center
who_it_is_for: Open to everyone. Local vendors, holiday activities and a quarter auction. Money raised supports the center's work with children and families.
what_to_do: Just show up at the Mon County Center at Mylan Park. The center's page lists the whole event as 11 a.m. to 5 p.m. The Dominion Post listing says the vendor market runs 11 a.m. to 3 p.m., with donations welcome at the door. The quarter auction starts at 3 p.m. and costs $10 to enter.

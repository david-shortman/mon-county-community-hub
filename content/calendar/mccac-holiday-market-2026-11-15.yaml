who_it_is_for: Open to everyone. Local vendors, holiday activities and a quarter auction. The center's page lists 11 a.m. to 5 p.m. The Dominion Post listing says the market runs 11 a.m. to 3 p.m. with donations welcome at the door, and the quarter auction starts at 3 p.m. with a $10 entry.
what_to_do: Just show up at the Mon County Center at Mylan Park. Money raised supports the center's work with children and families.

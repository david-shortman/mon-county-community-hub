title: Free electronics recycling event (e-cycle)
slug: mon-swa-ecycle-2026-10-31
starts: 2026-10-31
org_name: Monongalia County Solid Waste Authority
who_it_is_for: Monongalia County residents only. Businesses are not eligible. Bring ID to show you live in the county.
what_to_do: Drop off old electronics at Sam's Club at UTC, Morgantown, from 8 a.m. to noon. Old tube-style (CRT) TVs and monitors are not accepted, and only one flat screen TV per household. The full list of accepted items is a PDF on the event page.

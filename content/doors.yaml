# The five doors and the lanes around them (#248). The build reads this file
# to make door lists, the Topics page and breadcrumbs. Names are a first
# guess, tested in #254. Adding, renaming or removing a door changes the
# site's shape, so it is David's call. A topic that fits no door waits for
# that call instead of becoming a new menu item.
#
# `page` is the door's own page, once it has one; its steps and situations
# live in content/doors/<slug>.yaml. Until then the door links to its section
# of the Topics page.
#
# `icon` names an icon in site/src/components/Icon.astro. `examples` are the
# problems shown on the home page door buttons, in residents' words, each
# linking straight to its page (a door page link can pre-pick a situation,
# like /money/?pick=rent). An example shows only once its page exists.
#
# `topics` maps each topic tag used in content/ entries and on pages to the
# door it belongs to, with the label people see. Every topic belongs to
# exactly one door. `npm run check-content` checks this.
doors:
  - slug: this-month
    name: Get through this month
    page: /money/
    hint: Can't pay a bill, behind on rent, short on food, need cash fast
    icon: receipt
    examples:
      - text: Can't pay a bill
        href: /money/?pick=bill
      - text: Heat, water or power bill
        href: /utility-bills/
      - text: Behind on rent
        href: /money/?pick=rent
      - text: Short on food
        href: /help/food/
    topics:
      money: Bills and money
      food: Food
      housing: Rent and housing
      legal: Legal help
      taxes: Taxes
      poverty: Getting by
  - slug: care
    name: Get care
    page: /care/
    hint: A dentist, help paying for medicine, Medicaid in 2027, shots
    icon: health
    examples:
      # Ranked by local need (#475). Each shows once its page exists.
      - text: Need mental health help
        href: /mental-health/
      - text: Can't afford a doctor or medicine
        href: /no-insurance/
      - text: Keep my Medicaid in 2027
        href: /medicaid-2027/
      - text: Flu or COVID shot
        href: /flu-shots/
        from: "09-01"
        until: "12-31"
      - text: Turning 65 or on Medicare
        href: /turning-65/
      - text: Staying healthy each year
        href: /staying-well/
    topics:
      health: Health and care
  - slug: living-here
    name: Living here
    page: /living-here/
    hint: New here, who serves my address, trash and recycling, buses
    icon: pin
    examples:
      - text: Trash pickup day
        href: /living-here/?pick=pickup
      - text: Trash and recycling
        href: /recycling/
    topics:
      moving: Moving here
      recycling: Trash and recycling
      voting: Voting
  - slug: family
    name: Family and life changes
    page: /family/
    hint: Kids and school, work and training, disability and aging, veterans, language help
    icon: people
    examples:
      - text: Find a job or training
        href: /family/?pick=job
      - text: Reading or English lessons
        href: /family/?pick=read
      - text: Veterans
        href: /veterans/
    topics:
      family: Kids and family
      veterans: Veterans
      work: Work and learning
      disability: Disability and aging
  - slug: community
    name: Your community
    hint: City or county, meetings, how we're doing, give or start something
    icon: hall
    topics:
      community: Community life
      government: City and county government

# Lanes are not doors. Help now is the urgent lane on every screen. Dates is
# the one calendar. About holds pages about the project itself. A page tagged
# with a lane needs no topic.
lanes:
  - slug: help-now
    name: Help now
    page: /stay-tonight/
  - slug: dates
    name: Dates
    page: /calendar/
  - slug: about
    name: About this site
    page: /about/

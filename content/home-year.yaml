    title: Last day to apply for the homestead property tax exemption
    org_name: Monongalia County Assessor (dates set by West Virginia law)
    who_it_is_for: Homeowners in Monongalia County, WV, who are 65 or older, or permanently and totally disabled, and live in the home they own.
    what_to_do: New applicants file with the Monongalia County Assessor between July 1 and December 1. The last day is December 1. You only need to apply once. The Assessor's Real Estate page has the form and a link to file online.

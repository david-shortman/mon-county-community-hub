  - slug: well-water-test
    kind: tip
    month: 3
    day: 15
    title: Test your well water this year
    org_name: U.S. Environmental Protection Agency
    who_it_is_for: Homes in Monongalia County, WV, that get water from a private well.
    what_to_do: The EPA says to test a private well every year for total coliform bacteria, nitrates, total dissolved solids and pH. This yearly reminder comes in March; pick any date that works for you.
    url: https://www.epa.gov/privatewells/protect-your-homes-water
    topics: [home]
    sources:
      - url: https://www.epa.gov/privatewells/protect-your-homes-water
        checked: 2026-11-01

  - slug: last-spring-frost
    kind: tip
    month: 4
    day: 23
    title: Last spring frost is often around now
    org_name: NOAA National Centers for Environmental Information
    who_it_is_for: Gardeners in Monongalia County, WV.
    what_to_do: At the Morgantown airport weather station (Hart Field), half of years have their last spring frost (32°F) after April 23. In 3 of 10 years it comes after May 1, and in 1 of 10 after May 14. These are 1991 to 2020 averages, and your yard may differ. Wait to set out plants that frost can harm, or be ready to cover them.
    url: https://www.ncei.noaa.gov/products/land-based-station/us-climate-normals
    topics: [home, growing]
    sources:
      - url: https://www.ncei.noaa.gov/access/services/data/v1?dataset=normals-annualseasonal-1991-2020&stations=USW00013736&format=json&dataTypes=ANN-TMIN-PRBLST-T32FP50,ANN-TMIN-PRBLST-T32FP30,ANN-TMIN-PRBLST-T32FP10&includeStationName=true
        checked: 2026-11-01

  - slug: first-fall-frost
    kind: tip
    month: 10
    day: 11
    title: First fall frost can come soon, so put away hoses
    org_name: NOAA National Centers for Environmental Information and the American Red Cross
    who_it_is_for: Anyone in Monongalia County, WV, with outdoor faucets, hoses or a garden.
    what_to_do: At the Morgantown airport weather station (Hart Field), 1 in 10 years has its first fall frost (32°F) by October 11, and half of years by October 24 (1991 to 2020 averages). Before it freezes, the Red Cross says to drain and store outdoor hoses, close the inside valves that feed outdoor faucets, and open the outdoor faucets so they drain.
    url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/winter-storm/frozen-pipes.html
    topics: [home, growing]
    sources:
      - url: https://www.ncei.noaa.gov/access/services/data/v1?dataset=normals-annualseasonal-1991-2020&stations=USW00013736&format=json&dataTypes=ANN-TMIN-PRBFST-T32FP50,ANN-TMIN-PRBFST-T32FP10&includeStationName=true
        checked: 2026-11-01
      - url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/winter-storm/frozen-pipes.html
        checked: 2026-11-01

  - slug: septic-check
    kind: tip
    month: 9
    day: 1
    title: Is your septic system due for a check?
    org_name: U.S. Environmental Protection Agency
    who_it_is_for: Homes in Monongalia County, WV, on a septic system.
    what_to_do: The EPA says to have a septic system inspected by a professional at least every 3 years, and that most household tanks are pumped every 3 to 5 years. Put the date of your own last pumping in your phone's reminders; this calendar does not know it.
    url: https://www.epa.gov/septic/how-care-your-septic-system
    topics: [home]
    sources:
      - url: https://www.epa.gov/septic/how-care-your-septic-system
        checked: 2026-11-01

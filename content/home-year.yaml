  - slug: spring-fire-season
    kind: season
    month: 3
    day: 1
    end_month: 5
    end_day: 31
    title: Spring forest fire season (outdoor burning only 5 p.m. to 7 a.m.)
    org_name: West Virginia Division of Forestry (dates set by state law)
    who_it_is_for: Anyone in Monongalia County, WV, who burns leaves, brush or yard waste outdoors.
    what_to_do: From March 1 through May 31, state law lets you burn outdoors only between 5 p.m. and 7 a.m., and the fire must be out by 7 a.m. Clear a strip at least 10 feet wide around the pile first. A burning ban can stop all burning. Towns may have their own rules.
    url: https://code.wvlegislature.gov/20-3-5/
    topics: [home, safety]
    sources:
      - url: https://code.wvlegislature.gov/20-3-5/
        checked: 2026-11-01

  - slug: fall-fire-season
    kind: season
    month: 10
    day: 1
    end_month: 12
    end_day: 31
    title: Fall forest fire season (outdoor burning only 5 p.m. to 7 a.m.)
    org_name: West Virginia Division of Forestry (dates set by state law)
    who_it_is_for: Anyone in Monongalia County, WV, who burns leaves, brush or yard waste outdoors.
    what_to_do: From October 1 through December 31, state law lets you burn outdoors only between 5 p.m. and 7 a.m., and the fire must be out by 7 a.m. Clear a strip at least 10 feet wide around the pile first. A burning ban can stop all burning. Towns may have their own rules.
    url: https://code.wvlegislature.gov/20-3-5/

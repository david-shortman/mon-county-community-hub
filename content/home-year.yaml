# Home and adulting calendar (#1051): dates that come back every year.
#
# Each rule turns into its next date in the coming 12 months on the Dates
# page, calendar.ics and home.ics (see site/src/lib/home-year.mjs). Only add
# a rule when a current official page or state law gives the date. Write the
# text in our own words.
#
# Fields:
#   slug: unique. The dated entry gets "<slug>-<year>". A hand-written file in
#     content/calendar/ with that same slug wins (for example a year with an
#     odd date or extra detail), so the date is never listed twice.
#   kind: due (a deadline or a window that opens), season (a date range) or
#     tip (upkeep advice on a date we picked as a reminder).
#   month, day: when it happens each year. end_month, end_day: last day of a
#     season (it can run into the next year).
#   title: no "Due:", "Season:" or "Tip:" prefix; the build adds it.
#   topics: always include home. Never housing, money or food here: those
#     are high stakes and go through a hand-written calendar file instead.
#   sources: every source with the date a person or session last read it.
#     A rule with any source checked more than 13 months ago is left out of
#     every feed and flagged in the build output until someone re-checks it.
#
# Nothing personal goes here: no plate month, no "last pumped" date. Those
# belong in the reader's own phone reminders.
rules:
  - slug: property-tax-first-half
    kind: due
    month: 9
    day: 1
    title: First half of property taxes, with a discount for paying on time
    org_name: Monongalia County Sheriff's Tax Office (dates set by West Virginia law)
    who_it_is_for: People who owe real estate or personal property taxes in Monongalia County, WV.
    what_to_do: Pay the first half on or before September 1 to get 2.5% off. Unpaid first-half taxes become late on October 1, and state law then adds 9% interest a year. These dates come from state law (W. Va. Code 11A-1-3), so confirm with the Sheriff's tax office.
    url: https://monongaliasheriff.gov/tax/index.php
    topics: [home, taxes]
    sources:
      - url: https://code.wvlegislature.gov/11A-1-3/
        checked: 2026-11-01

  - slug: property-tax-second-half
    kind: due
    month: 3
    day: 1
    title: Second half of property taxes, with a discount for paying on time
    org_name: Monongalia County Sheriff's Tax Office (dates set by West Virginia law)
    who_it_is_for: People who owe real estate or personal property taxes in Monongalia County, WV.
    what_to_do: Pay the second half on or before March 1 to get 2.5% off. Unpaid second-half taxes become late on April 1, and state law then adds 9% interest a year. These dates come from state law (W. Va. Code 11A-1-3), so confirm with the Sheriff's tax office.
    url: https://monongaliasheriff.gov/tax/index.php
    topics: [home, taxes]
    sources:
      - url: https://code.wvlegislature.gov/11A-1-3/
        checked: 2026-11-01

  - slug: personal-property-returns-open
    kind: due
    month: 7
    day: 1
    title: Personal property returns open (vehicles and more)
    org_name: Monongalia County Assessor
    who_it_is_for: People in Monongalia County, WV, who own vehicles or other personal property that is taxed.
    what_to_do: You can file your personal property return with the Monongalia County Assessor from July 1 to October 1. File online from the Assessor's page, or call 304-291-7222 and choose option 1.
    url: https://assessor.org/2155/Personal-Property-Assessment-Returns
    topics: [home, taxes]
    sources:
      - url: https://assessor.org/2155/Personal-Property-Assessment-Returns
        checked: 2026-11-01

  - slug: personal-property-returns-due
    kind: due
    month: 10
    day: 1
    title: Last day for personal property returns (vehicles and more)
    org_name: Monongalia County Assessor
    who_it_is_for: People in Monongalia County, WV, who own vehicles or other personal property that is taxed.
    what_to_do: Online filing with the Monongalia County Assessor ends October 1. To renew a vehicle registration in West Virginia, the DMV asks for your personal property tax receipt, so this return matters for your car or truck too.
    url: https://assessor.org/2155/Personal-Property-Assessment-Returns
    topics: [home, taxes]
    sources:
      - url: https://assessor.org/2155/Personal-Property-Assessment-Returns
        checked: 2026-11-01
      - url: https://dmv.wv.gov/vehicle-services/vehicles/registrations
        checked: 2026-11-01

  - slug: homestead-exemption-opens
    kind: due
    month: 7
    day: 1
    title: Homestead property tax exemption applications open
    org_name: Monongalia County Assessor (dates set by West Virginia law)
    who_it_is_for: Homeowners in Monongalia County, WV, who are 65 or older, or permanently and totally disabled, and live in the home they own.
    what_to_do: New applicants can file with the Monongalia County Assessor from July 1 to December 1. You only need to apply once. The Assessor's Real Estate page has the form and a link to file online.

name: Monongalia County Planning Commission
slug: county-planning-commission
org: monongalia-county-commission
section: county
created: Set up in 1999 under WV Code 8A-2-4.
who_can_serve: 5 to 15 county residents qualified in matters of development. At least three fifths must have lived in the county for 3 years, and members should represent different areas of interest.
meets: 2nd Wednesday of each month, 6 p.m., MCPC office, Room 110, old Monongalia County Courthouse

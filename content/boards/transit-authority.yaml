name: Mountain Line Transit Authority board
slug: transit-authority
org: city-of-morgantown
section: services
decides: Sets bus fares, routes and schedules for Mountain Line. Under state law it must hold a public hearing before it starts a new fare or raises one.
meets: "Sources differ. The city's page says the 3rd Wednesday of each month at noon at the Mountain Line depot in Westover. The county's page says the 2nd Wednesday of each month at 6 p.m. at the transit station in Westover, and also says it meets quarterly. Check with Mountain Line before you go."
open_seats: 1
open_note: 1 seat
who_can_serve: City residents (a joint city and county seat). The board has seven members, three named by the County Commission, three by the City of Morgantown and one both agree on.

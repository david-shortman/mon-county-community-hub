name: MECCA Policy Board
slug: county-mecca-policy-board
org: monongalia-county-commission
section: county
created: Set up in 1987 under WV Code 24-6-5.
decides: The policy board for MECCA, the county's 9-1-1 emergency call center.
who_can_serve: At least six members appointed by the County Commission for 3 year terms, including people from fire, police, ambulance and other emergency services, and from the county or a city. It has twelve members now.
meets: The first Tuesday of January, March, May, July, September and November, 9 a.m., at the 9-1-1 Center

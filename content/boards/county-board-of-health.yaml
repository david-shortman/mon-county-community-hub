created: Set up in 1958 under WV Code 16-2A-2.
who_can_serve: Five members appointed by the County Commission for 5 year terms. No more than three can belong to the same political party, and no more than two can live in the same magisterial district.
meets: Usually the last Thursday of January, March, May, July, September and November, 9 a.m., at the County Health Department

name: Land Reuse and Preservation Agency
slug: land-reuse-and-preservation-agency
org: city-of-morgantown
decides: Buys, manages and passes on property so it can be put to use, such as for conservation, public space, affordable housing or businesses. City Council set it up in 2018.
meets: 4th Thursday of each month, 4 p.m., Council Chambers. Meetings stream online.
who_can_serve: Seven members appointed by City Council, each with experience in real estate, property development, public lands, or land conservation. Most must live in the city.

name: Planning Commission
slug: planning-commission
org: city-of-morgantown
decides: Advises the City Manager and City Council on land use planning and development. The public can speak at its public hearings, for up to 5 minutes each.
meets: 2nd Thursday of each month, 6:30 p.m., Council Chambers. Meetings stream live on the city's YouTube channel.
who_can_serve: City residents. Each seat stands for a ward. The open seat is for a 7th Ward resident.
open_seats: 1

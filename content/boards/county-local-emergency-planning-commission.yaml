name: Local Emergency Planning Commission
slug: county-local-emergency-planning-commission
org: monongalia-county-commission
section: county
created: Set up in 1987 under WV Code 15-5A-7.
decides: Prepares the county's emergency response plan and sends it to the state. The county's Office of Emergency Services runs it.
who_can_serve: Members come from state and local government, police, fire, first aid, health, hospitals, transportation, the news media, community groups and businesses covered by the law. The County Commission president or someone they pick also serves.
meets: The last Tuesday of January, March, May, July, September and November, 7:30 a.m., at the 9-1-1 Center

name: Urban Landscape Commission
slug: urban-landscape-commission
org: city-of-morgantown
decides: Recommends standards for how public and private property looks, keeps a plan for the city's landscape, and reviews city projects that involve landscaping. Works with the Tree Board.
meets: 4th Wednesday of every month, 3:30 p.m., City Council Chambers
who_can_serve: City residents with a background in landscape design, horticulture, plant health, urban planning or civil engineering.
open_seats: 2

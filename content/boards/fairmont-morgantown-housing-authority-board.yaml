name: Fairmont-Morgantown Housing Authority board
slug: fairmont-morgantown-housing-authority-board
org: city-of-morgantown
section: services
decides: Its commissioners run the business of the Fairmont-Morgantown Housing Authority. Under state law they adopt its bylaws and rules and hire its staff. The authority runs public housing in Fairmont and Section 8 Housing Choice Vouchers.
apply_note: The city's form may not be the way to apply for this seat. Ask the Fairmont-Morgantown Housing Authority how to apply.
meets: The authority's site does not list board meetings. Call the authority to ask.
open_seats: 1
open_note: 1 seat
who_can_serve: A resident of public housing or a voucher user in the City of Fairmont. The board has five members with five year terms, two named by Fairmont, two by Morgantown, and one resident of public housing or the voucher program.

name: Morgantown Utility Board (MUB)
slug: morgantown-utility-board
org: city-of-morgantown
section: services
decides: The board over MUB, which runs water, wastewater and stormwater service. At its meetings it votes on items like bids for water, sewer and stormwater projects.
meets: The 2nd Tuesday of each month at 5:30 p.m., per the city's page. The October 2026 meeting was at 278 Greenbag Road. Meetings stream live on MUB's site, and the October agenda had a public portion.
open_seats: 1
open_note: 1 seat
who_can_serve: Residential customers of the Utility Board (some limits apply).

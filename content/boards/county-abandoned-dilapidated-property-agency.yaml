created: Set up by county ordinance. It enforces the county rules on abandoned and run-down property outside cities and towns.
who_can_serve: Two at-large members appointed by the County Commission for 2 year terms, along with county officials such as the Sheriff and the Litter Control Officer.
meets: 1st Thursday of each month, 10 a.m., County Commission meeting room, Courthouse

    source: https://www2.census.gov/geo/tiger/TIGER2024/POINTLM/
    note: Court House is the county courthouse at 243 High St and Public Safety Building is at 300 Spruce Street, both in downtown Morgantown (content/orgs/monongalia-county-clerk.yaml, content/orgs/morgantown-parking-authority.yaml).
    label: s
    stops: [Downtown, Court House, Court House (High St.), Public Safety Building]

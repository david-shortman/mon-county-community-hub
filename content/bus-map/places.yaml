# Places for the bus trip planner and map on /bus-routes/ (#1656).
#
# Each place is a point on the map and a list of Mountain Line stops that are
# at or in it. Stop names are spelled exactly as in
# content/pdf-pages/mountain-line-routes.yaml (after the spelling joins in
# site/src/lib/bus-network.mjs); a test fails when a name is not on a route.
#
# Where the points come from (all public domain or official):
#   census-point: U.S. Census Bureau TIGER/Line 2024 point landmarks (populated
#     places and neighborhoods, tl_2024_54_pointlm).
#   census-area: TIGER/Line 2024 area landmarks (tl_2024_54_arealm), the
#     landmark's internal point.
#   census-town: Census 2024 Gazetteer, places file for West Virginia, the
#     town's internal point.
#   address: the address on the official page in `source`, placed with the
#     Census Geocoder (geocoding.geo.census.gov, Public_AR_Current).
# https://www2.census.gov/geo/tiger/TIGER2024/
# https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_gaz_place_54.txt
#
# Why a stop is in a place: its name names the place ("Sabraton Goodwill"),
# or the official page in `source` says so. Stops we could not place are left
# off the map and the planner (see docs/discoveries/2026-11-03-bus-stops-without-places.md).
# `label` is where the name sits beside the dot: n, s, e or w.
checked: 2026-11-03
places:
  - id: pifer
    name: Pifer Terminal
    kind: hub
    point: [39.63242, -79.97421]
    from: address
    address: 691 Fairmont Road
    source: https://www.busride.org/WestoverTerminal
    note: Mountain Line's "Westover Terminal" page gives this address for Pifer Terminal.
    label: s
    stops: [Pifer Terminal]
  - id: downtown
    name: Downtown Morgantown

# The Your community door page, /community/ (#252, #462). Shape and rules:
# see doors/care.yaml and site/src/components/DoorPage.astro. A situation
# with no steps shows as a "Start here" link to its page. The choices cover
# what the door promises on the home page: city or county, meetings, how
# we're doing, give or start something (content/doors.yaml hint).

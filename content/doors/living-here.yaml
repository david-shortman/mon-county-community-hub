# The Living here door page, /living-here/ (#252). Shape and rules: see
# doors/care.yaml and site/src/components/DoorPage.astro. More situations
# come as their pages ship: new here and who serves my address (#204),
# getting around (#61), and registering to vote.
door: living-here
lede: Moving in, trash, recycling and the everyday things of living in Mon County. Pick what is going on, and we put the steps in order.
steps:
  power-water-gas:
    when: week
    resource: mub-start-service
    text: Ask your landlord or the seller which companies serve the home, then start water, power and gas service a few days before you move.
  swa:
    when: today
    resource: mon-swa-ask-about-trash
    text: Call the Monongalia County Solid Waste Authority and ask who picks up trash at your address and which day.
  drop-off:
    when: today
    resource: mon-county-recycling-drop-off
    text: Take recycling to the county drop-off center on Olin Street.
    action: Check hours
  hard-items:
    when: opens
    resource: mon-swa-ask-about-trash
    text: Tires and electronics go to collection days. Check "Dates for this" on this page, or call the Solid Waste Authority to ask about the next one.
  dmv-office:
    when: week
    resource: wv-dmv-morgantown-office
    text: Read the DMV's rules for new residents, then walk in or make an appointment at the Morgantown DMV office.
situations:
  - id: moving
    label: I'm moving here and need to start power, water, gas or trash
    page: /moving-here/
    steps: [power-water-gas, swa]
  - id: pickup
    label: When is my trash pickup day?
    page: /recycling/#pickup
    steps: [swa]
  - id: recycle
    label: Where can I drop off recycling?
    page: /recycling/#drop-off
    steps: [drop-off]
  - id: hard
    label: I have tires or electronics to get rid of
    page: /recycling/#hard-items
    steps: [hard-items]
  - id: license
    label: I need a West Virginia driver's license or plates
    page: /drivers-license/
    steps: [dmv-office]
also:
  - text: Can't pay a water or power bill
    href: /utility-bills/

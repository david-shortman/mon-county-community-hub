# The Family and life changes door page, /family/ (#252). Shape and rules:
# see doors/care.yaml and site/src/components/DoorPage.astro. More
# situations come as their pages ship: families and kids (#225) and language
# help (#229). Disability and aging situations came in sprint wave 17 (#248).
door: family
lede: Young kids, work, learning, disability and aging, and life as a veteran in Mon County. Pick what is going on, and we put the steps in order.
steps:
  birth-to-three:
    when: week
    resource: wv-birth-to-three-referral
    text: Call WV Birth to Three if you are worried about how your baby or toddler is growing.
  starting-points:
    when: week
    resource: starting-points-family-programs
    text: Call Starting Points about playgroups, the baby pantry and other free family programs.
  story-time:
    when: week
    resource: mympls-story-times
    text: Find a library story time near you.
  prek:
    when: opens
    resource: mcs-prek-and-head-start
    text: Apply for Pre-K or Head Start on the county schools' application site when applications open.
  crisis-line:
    when: today
    resource: veterans-crisis-line
    text: Veteran in crisis, or worried about one? Call the Veterans Crisis Line, then press 1.
  homeless-line:
    when: today
    resource: va-homeless-veterans-line
    text: Call the VA's line for veterans who are homeless or may lose their housing.
  va-enroll:
    when: week
    resource: va-health-care-apply
    text: Not signed up for VA health care yet? Apply online or call VA's toll-free line.
  va-clinic:
    when: week
    resource: monongalia-county-va-clinic
    text: Call the Monongalia County VA Clinic about health care.
  vet-center:
    when: week
    resource: morgantown-vet-center
    text: Call the Morgantown Vet Center to set up confidential counseling.
  workforce:
    when: week
    resource: workforce-wv-morgantown-office
    text: Call or visit WorkForce West Virginia for job leads and job training.
  literacy:
    when: week
    resource: lvmpc-adult-literacy
    text: Call or text Literacy Volunteers to start free reading, writing or English lessons.
  age-certificate:
    when: week
    resource: wv-teen-age-certificate
    text: If you are 14 or 15, get an age certificate from the state before you start a job.
  career-connections:
    when: week
    resource: region-vi-career-connections
    text: Ages 16 to 24 and out of school? Call Career Connections about job and training help.
  child-care-help:
    when: week
    resource: child-care-resource-center-morgantown
    text: Call the Child Care Resource Center to ask about child care near you and help with the cost.
  school-enroll:
    when: week
    resource: mcs-enroll-and-find-your-school
    text: Look up your address on the district's map to find your school, then contact that school to enroll.
  school-bus:
    when: week
    resource: mcs-school-buses
    text: Find your child's bus times, and fill out the bus form to get delay alerts.
  independent-living:
    when: week
    resource: liveability-morgantown
    text: Call LiveAbility, the independent living center in Morgantown, about living more on your own.
  home-changes:
    when: week
    resource: liveability-clsp
    text: Call LiveAbility and ask about its program for ramps, grab bars, van lifts and other changes.
  disability-job:
    when: week
    resource: drs-morgantown-office
    text: Call the state's Division of Rehabilitation Services office in Morgantown about job help.
  care-options:
    when: week
    resource: wv-adrc-region-1
    text: Call the Aging and Disability Resource Center for free help finding long-term care and caregiver services.
  in-home-care:
    when: week
    resource: senior-monongalians-in-home-care
    text: Call Senior Monongalians' nurse's office to ask which in-home help program fits.
situations:
  - id: baby-growth
    label: I'm worried about how my baby or toddler is growing
    page: /families-and-kids/
    steps: [birth-to-three]
  - id: prek
    label: My child will be 3 or 4 and could start Pre-K or Head Start
    page: /families-and-kids/
    steps: [prek]
  - id: little-kids
    label: I want things to do with my young child
    page: /families-and-kids/
    steps: [starting-points, story-time]
  - id: child-care
    label: I need child care, or help paying for it
    page: /families-and-kids/#child-care
    steps: [child-care-help]
  - id: school-age
    label: My child is starting school, or needs a bus or after-school program
    page: /school-age/
    steps: [school-enroll, school-bus]
  - id: job
    label: I need a job or job training
    page: /work-and-learning/
    steps: [workforce]
  - id: read
    label: I want to read, write or speak English better
    page: /work-and-learning/
    steps: [literacy]
  - id: teen
    label: I'm a teen, or the parent of one, and want a first job
    page: /teens/
    steps: [age-certificate, career-connections]
  - id: vet-health
    label: I'm a veteran and need health care
    page: /veterans/
    steps: [va-enroll, va-clinic]
  - id: vet-talk
    label: I'm a veteran and need someone to talk to
    page: /veterans/
    steps: [crisis-line, vet-center]
  - id: vet-housing
    label: I'm a veteran and could lose my housing
    page: /veterans/
    steps: [homeless-line]
  - id: disability-living
    label: I have a disability and want help living on my own
    page: /disability-and-aging/
    steps: [independent-living]
  - id: home-changes
    label: I need a ramp, grab bars or other changes to my home or car
    page: /disability-and-aging/#home-changes
    steps: [home-changes]
  - id: disability-job
    label: I have a disability and want help finding or keeping a job
    page: /disability-and-aging/#jobs
    steps: [disability-job]
  - id: help-at-home
    label: An older family member needs help at home
    page: /help-at-home/
    steps: [in-home-care, care-options]
  - id: caregiving
    label: I'm caring for a family member who is older or has a disability
    page: /caregivers/
    steps: [care-options]
  - id: death
    label: Someone in my family died
    page: /when-someone-dies/
also:
  - text: Short on money this month
    href: /money/
  - text: Health care and shots
    href: /care/
  - text: "Pages by who you are: parents, teens, job seekers and more"
    href: /for/

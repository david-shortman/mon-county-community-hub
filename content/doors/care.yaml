# The Get care door page, /care/ (#235, the pilot door for #248).
# Every door page has the same shape (site/src/components/DoorPage.astro):
# a can't wait strip, "What's going on? Pick all that fit", one set of steps
# for everything picked (Today, This week, When it opens), what often goes
# with it, dates for this door, and a person to talk to.
#
# Steps state no facts of their own, only the action: each one points to a record in
# content/resources/ for its phone number, link, source and checked date.
# A situation shows only once its page exists. Situations run in the ranked order from #475, with the evidence in docs/playbook/care-needs.md. `when` is today, week or opens.
door: care
# The lede and the hint in doors.yaml name only topics whose pages exist (#487).
# When a new care page ships, add it to both in the same PR.
lede: Mental health help, help with drugs or alcohol, care with no insurance, a dentist, help paying for medicine, keeping your Medicaid in 2027, a new baby, birth control, shots, Medicare and staying healthy in Mon County. Pick what is going on, and we put the steps in order.
cant_wait:
  text: Thinking about suicide, or in a mental health crisis? Call or text 988, any hour. In danger right now? Call 911.
  resource: 988-lifeline
  sms: "988"
  emergency: true
steps:
  talk:
    when: today
    resource: valley-crisis-services
    text: Need to talk to someone today? Call Valley HealthCare's 24/7 crisis line, or walk in to its Scott Avenue office on a weekday.
  counseling:
    when: week
    resource: valley-counseling
    text: Call Valley HealthCare to set up counseling. Ask about the sliding fee if money is tight.
  freeclinic:
    when: week
    resource: health-right-clinic
    text: Low income and no insurance? Call Milan Puskar Health Right to become a patient at the free clinic.
  applycoverage:
    when: week
    resource: apply-for-medicaid-wv
    text: Apply for Medicaid or WVCHIP on WV PATH, or call DoHS.
  pregcoverage:
    when: week
    resource: wv-medicaid-pregnancy
    text: Pregnant and need coverage? Apply for Medicaid or WVCHIP on WV PATH, or call DoHS.
  wic:
    when: week
    resource: monchd-wic
    text: Call WIC to ask about healthy food and breastfeeding help.
  repro:
    when: week
    resource: monchd-reproductive-health
    text: Call the health department to book a pregnancy test, birth control or STI testing.
  naloxone:
    when: today
    resource: monchd-free-naloxone
    text: Get free naloxone (Narcan) from the health department, or any hour from the vending machine at Wise Path in Westover.
  treatment:
    when: week
    resource: valley-substance-use-treatment
    text: Call Valley HealthCare to talk about treatment options.
  ride:
    when: week
    resource: wv-medicaid-rides
    text: On Medicaid or WVCHIP? Call Modivcare at least 5 business days before your visit to book a ride.
  bus:
    when: today
    resource: mountain-line-medical-trips
    text: Plan a bus trip to your visit with Mountain Line.
    action: Routes
  dietitian:
    when: week
    resource: monchd-nutrition-counseling
    text: Ask your doctor for a referral, then call the health department to see a dietitian.
  trails:
    when: today
    resource: mon-river-rail-trails
    text: Walk, run or bike the rail-trails.
    action: Trail maps
  quitline:
    when: today
    resource: wv-tobacco-quitline
    text: Call the West Virginia Tobacco Quitline. A coach helps you make a plan to quit.
  shot:
    when: week
    resource: monchd-flu-and-covid-shots
    text: Call the Monongalia County Health Department to book a flu or COVID shot.
  dentist:
    when: week
    resource: monchd-dentistry
    text: Call the health department's dental clinic for a checkup.
  healthright:
    when: week
    resource: health-right-clinic
    text: No insurance and low income? Call Milan Puskar Health Right for a phone screening to become a patient at the free clinic.
  medicaid2027:
    when: today
    resource: wv-medicaid-2027-help-line
    text: On Medicaid? Update your address, phone and email in WV PATH or by phone, and answer any letter from DoHS within 30 days.
  ship:
    when: week
    resource: wv-ship-medicare-counseling
    text: Call the West Virginia State Health Insurance Assistance Program (WV SHIP) for help choosing a Medicare plan or checking your costs.
situations:
  - id: mental
    label: I need mental health help
    page: /mental-health/
    steps: [talk, counseling]
  - id: medicaid2027
    label: I want to keep my Medicaid in 2027
    page: /medicaid-2027/
    steps: [medicaid2027]
  - id: noinsurance
    label: I have no insurance or can't afford a doctor
    page: /no-insurance/
    steps: [freeclinic, applycoverage]
  - id: drugs
    label: I need help with drugs or alcohol, or free Narcan
    page: /drugs-and-alcohol/
    steps: [naloxone, treatment]
  - id: dentist
    label: I need a dentist, or help paying for medicine
    page: /dental-and-prescriptions/
    steps: [dentist, healthright]
  - id: baby
    label: I'm pregnant or have a new baby
    page: /pregnant-or-new-baby/
    steps: [pregcoverage, repro, wic]
  - id: birthcontrol
    label: I need birth control, a pregnancy test or STI testing
    page: /birth-control-and-testing/
    steps: [repro]
  - id: ride
    label: I need a ride to a medical visit
    page: /medical-rides/
    steps: [bus, ride]
  - id: diabetes
    label: I want help with diabetes, blood pressure or weight
    page: /diabetes-and-weight/
    steps: [dietitian, trails]
  - id: medicare
    label: I'm turning 65 or on Medicare
    page: /turning-65/
    steps: [ship, shot]
  - id: shots
    label: I need a flu or COVID shot
    page: /flu-shots/
    steps: [shot]
  - id: healthy
    label: I want to stay healthy this year, or quit tobacco
    page: /staying-well/
    steps: [quitline, trails, shot, dentist]
also:
  - text: Short on food
    href: /help/food/
  - text: Can't pay a bill
    href: /money/
  - text: A place to stay tonight
    href: /stay-tonight/

# Weekly, monthly and seasonal checklist for the Make it better pages (#793).
# How it works: site/scripts/checklists.mjs
id: make-it-better
title: Make it better pages
issue_title: Weekly checklist, Make it better
tracking: 793
intro: >-
  Re-read each page and change only what it now says. Set `checked` to today's
  Morgantown date only for the sources you actually re-read. When two official
  pages disagree, keep both and say who says what. A date that is not posted
  yet stays "next date not announced". Anything that needs asking a person
  becomes a for:david issue. Where each fact lives and what to update:
  docs/operations/make-it-better-checks.md
items:
  - text: City vacancy list. Open seats per board, who can serve, the apply links (`open_seats` in content/boards/).
    url: https://www.morgantownwv.gov/210/Volunteer-Opportunities
  - text: City Council agendas. Trees, murals, landscape plans, the downtown plan, budget lines, board appointments.
    url: https://www.morgantownwv.gov/AgendaCenter/City-Council-3
    how: The site's /meetings/ page lists every agenda. Read only those posted since last week's run. The city's site often drops the first connection; try again.
  - text: Agenda Center for the Urban Landscape Commission, Tree Board, Cultural Arts Commission and Historic Landmarks Commission (links on each board's page).
    url: https://www.morgantownwv.gov/AgendaCenter
  - text: Each board's own page (links in content/boards/). Meeting day, time and place; vacant seats shown on the page.
    when: month

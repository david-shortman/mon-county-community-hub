# Weekly checklist for the community centers and halls section (#752).
# The pages with a fixed address are watched daily (content/watch/centers.yaml).
# This list is for what a robot cannot read. How it works: site/scripts/checklists.mjs
id: centers
title: Community centers and halls
issue_title: Weekly checklist, community centers
tracking: 752
intro: >-
  Read each source below and add any dated public event at a place in
  content/places/ as content/calendar/<place>-<event>-<date>.yaml with venue
  and topic community. Event facts only, with a link, never copied text. No
  event without a confirmed year. No volunteers' names or numbers. Update a
  place file when hours, dues, prices or status change. One PR for the week,
  or a "no change" comment on #752 with the date. Plan:
  docs/plans/2026-10-30-centers-watch.md
items:
  - text: >-
      Dominion Post, this week's "Events and opportunities" listing (a new
      address each week, find it from the Community section): dinners, bingo,
      bazaars and festivals at a listed place.
    url: https://www.dominionpost.com/
    how: >-
      The Community section does not list it. Addresses look like
      dominionpost.com/2026/10/30/events-opportunities-25/ and the number goes
      up by one each issue (about twice a week). Search content/ for
      "events-opportunities-" to find the last one read, then try the next.
      The same listing covers the sale dates checklist.
  - text: >-
      Dominion Post, this week's "Senior news" column: Westside, Clay-Battelle
      and Senior Monongalians dated events, hours, dues or lunch days.
    url: https://www.dominionpost.com/
    how: >-
      Runs on Fridays at dominionpost.com/2026/10/30/senior-news-13/, the
      number going up by one each week. Search content/ for "senior-news-" to
      find the last one read. The monthly Senior Post is a page image with no
      text, so skip it.
  - text: >-
      Smithtown Community and Senior Center calendar (a Google Calendar, whose
      robots.txt asks robots to stay out). Leave times off: some are wrong.
    url: http://www.smithtowncommunity.com/calendar.html
    person: true
  - text: >-
      Cheat Lake VFD events calendar (a Google Calendar shown on the page).
      Public events only; skip rentals, "Not Available" and anything marked
      private. The page's own text around the calendar, with event details,
      can be read normally.
    url: https://www.cheatlakefire.org/events
    person: true
  - text: >-
      Monongalia Arts Center calendar (a Google Calendar shown on the center's
      site, whose robots.txt asks robots to stay out). Its feed used to fill
      the calendar on its own and was turned off on 2026-11-01. Add dated
      public classes, concerts and markets at the center.
    url: https://www.monartscenter.com/
    person: true
    how: >-
      Saved feed events still show until their dates pass, with the day they
      were checked. Before adding one, search content/calendar/ and
      site/src/lib/feeds/snapshots/monongalia-arts-center.json so it is not
      listed twice.
  - text: >-
      City of Morgantown calendar: public events at city parks, centers and
      halls. Since 2026-10-21 the city's robots.txt asks robots to stay out of
      its iCalendar feed, so the site keeps only the saved feed events.
    url: https://www.morgantownwv.gov/calendar.aspx
    person: true
    how: >-
      Search content/calendar/ and
      site/src/lib/feeds/snapshots/morgantown-city.json first so an event is
      not listed twice.
  - text: >-
      If a "Community center or park event page changed" issue is open (label
      source-changed), work through it too.

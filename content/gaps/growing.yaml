# Growing gaps (#444): things a grower in Mon County would want that we looked
# for and could not find on a current page. Shown in the "Help wanted" box on
# /grow/. Describe the gap; never promise to fill it. A gap leaves this list
# once a checked source is found, and that source becomes a listing.
#
# Each gap: `what` (what's missing, in residents' words), `why` (one line),
# optional `guide` (a "start one here" link, only a page we have read), and
# `checked` (the Morgantown date we last looked).
topic: growing
gaps:
  - what: A posted way to sign up for a community garden plot
    why: Renters and people with no yard need a place to grow. Some groups run gardens here, but we found no page that says how to get a plot.
    checked: 2026-10-30
  - what: A seed swap page that says who runs it and how it works
    why: Swaps are a free way to start and to share. The Solid Waste Authority's events page lists a Community Seed Swap at the Mon County Center on November 7, 2026, but we found no page that says who runs it or how to take part.
    checked: 2026-10-30
  - what: A garden club or plant help line that posts how to join or when it meets
    why: A local person to ask is often the fastest help when a plant is in trouble.
    checked: 2026-10-30
  - what: Farmers market days on a current official page
    why: Growers and shoppers need to know when and where markets open.
    checked: 2026-10-30

# "Also called" (#529): other plain words people use for what a page covers.
# Each page listed here shows one line near its end, "Also called: ...", and
# the site search (Pagefind) finds the page by those words too.
#
# Rules:
# - Only words a reader would use for what the page really covers. If the page
#   does not answer it, fix the page or leave the word off.
# - Short: 2 to 6 entries, each a few words. No misspellings (those go in
#   SPELLING in site/src/lib/search-plan.mjs) and no group or brand names.
# - Each key is a page's web path. Keep keys in alphabetical order.
# - Pages about shelter, safety lines, food or benefits wait for David, like
#   any change to what those pages show (docs/COORDINATION.md).
# Test the effect with `npm run search-test` in site/ (docs/operations/search-test.md).
/accessible-parking-placard/: [handicap placard, handicap parking permit, disability parking]
/birth-control-and-testing/: [STD testing, family planning, sexual health]
/caregivers/: [respite care, caregiver support]
/drugs-and-alcohol/: [rehab, addiction treatment, substance use]
/families-and-kids/: [daycare, day care, early childhood]
/find-your-people/: [clubs, groups to join, hobby groups]
/for/older-adults/: [seniors, senior citizens, retirees]
/have-your-say/: [speak at a meeting, school board meeting, public comment]
/help-at-home/: [home health aide, home care, senior meals]
/help-in-your-language/: [Spanish, interpreter, translation]
/holidays/: [Christmas help, toy drive, winter coats]
/legal-help/: [lawyer, attorney, small claims court]
/life-events/child-delay-or-disability/: [developmental delay, speech delay, special needs]
/life-events/lost-my-job/: [laid off, fired, job loss]
/medical-rides/: [medical transportation, ride to the doctor]
/meetings/agendas/: [school board agenda, board of education agenda, meeting agendas]
/mental-health/: [counseling, therapy, depression]
/no-insurance/: [free clinic, sliding scale, uninsured]
/parks/: [swimming pools, pools, playgrounds]
/pets/: [spay and neuter, pet adoption]
/recycling/: [garbage pickup, trash day, rubbish]
/snap/: [food stamps, EBT, EBT card]
/snow-and-ice/: [snow removal, snow plowing]

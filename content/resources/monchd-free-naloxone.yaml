title: Free naloxone (Narcan) and training from the Mon County Quick Response Team
slug: monchd-free-naloxone
org: monongalia-county-health-department
topics: [health]
who_it_is_for: Any person, group or organization in Mon County that wants naloxone, the medicine that reverses an opioid overdose, or training to use it.
what_to_do: Call the health department's Quick Response Team at 304-225-0264 to ask for free naloxone or training. Naloxone is also free any hour from a vending machine at Wise Path Recovery Center in Westover. The Quick Response Team's peer recovery staff aim to meet with anyone who overdoses within 72 hours, to connect them to counseling and services.
contact:

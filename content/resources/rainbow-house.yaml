title: Rainbow House, emergency shelter
slug: rainbow-house
org: project-rainbow
topics: [housing]
who_it_is_for: "People experiencing homelessness. The City's page says it serves people regardless of sexual orientation or gender identity."
what_to_do: Call Project Rainbow at 304-292-7414 to ask about a bed and how to get there. The City of Morgantown's resource page says the Rainbow House has 22 beds and is open 24/7. It does not give the address.
hours: Open 24 hours, every day
contact:
  phone: "304-292-7414"
  url: https://www.projectrainbowwv.com/
what_happens: Project Rainbow offers each person case management, help finding housing, help with benefits, and connections to health care, behavioral health and substance use treatment, and jobs.
sources:
  - url: https://www.morgantownwv.gov/708/PATHWAYS-to-Help
    checked: 2026-11-15
    quote: "(304)-292-7414 info@projectrainbowwv.com Project Rainbow opened the Rainbow House in 2023 to provide safe, affirming, low-barrier emergency shelter for people experiencing homelessness. The Rainbow House is a 22-bed shelter that operates 24/7"

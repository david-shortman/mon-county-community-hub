title: West Virginia Family Tax Credit
slug: wv-family-tax-credit
org: wv-tax-division
topics: [taxes, money]
who_it_is_for: The state's form says "A Family Tax Credit is available to certain individuals or families that may reduce or eliminate their West Virginia personal income tax. You may be entitled to this credit if you meet certain income limitations and family size." People who file with zero exemptions, and people who pay the federal alternative minimum tax, cannot claim it.
what_to_do: Fill out Schedule FTC-1 and attach it to your West Virginia return, Form IT-140. The form says "If this schedule is not enclosed with Form IT-140, the credit will be disallowed." As of October 31, 2026, the newest schedule posted is for tax year 2025.
contact:

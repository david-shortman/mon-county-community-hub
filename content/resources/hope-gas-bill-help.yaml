title: Hope Gas bill help and the Hope Cares discount
slug: hope-gas-bill-help
org: hope-gas
topics: [money]
who_it_is_for: "Hope Gas customers who need help with a gas bill. Hope Cares takes 25% off the monthly gas bill. Hope Gas says to qualify you must meet all of these: be a residential heat customer, have income up to 200% of the poverty guidelines, and have applied for LIEAP."
what_to_do: Call Hope Gas customer service at 1-800-688-4673, Monday to Friday, 8 a.m. to 5 p.m. Ask about a payment plan if you have fallen behind, budget billing, or signing up for Hope Cares.
contact:
  phone: "1-800-688-4673"
  url: https://hopegas.com/my-account-information/help-with-my-bill
cost: free

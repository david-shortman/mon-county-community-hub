title: Free West Virginia living will and medical power of attorney forms
slug: wv-advance-directive-forms
org: wv-center-for-end-of-life-care
topics: [health, legal]
who_it_is_for: "Any adult. The Center says advance directives are \"recommended for everyone 18 years of age and older including mature and emancipated minors.\" You do not need a lawyer: \"Anyone can create a WV advance directive without the assistance of a lawyer.\""
what_to_do: "Download the West Virginia forms from the Center's Forms and Resources page, or call the Center to get free forms. There are four: a Living Will, a Medical Power of Attorney (you name a person to make health care decisions for you if you are too sick to make them), a Combined Living Will and Medical Power of Attorney, and a Mental Health Advance Directive. The Center says most West Virginians who fill one out use the combined form."
steps:
  - "Pick your form and talk with the person you want to name. The Center says: \"Choose someone who knows your values and wishes, and whom you trust to make decisions for you.\" Do not name your health care clinician."
  - "Sign it and have it witnessed and notarized. The form has lines for two witnesses and a notary. The Center says witnesses \"must be at least 18 years of age and not related to you by blood or marriage.\" Do not choose people who will inherit from you, the person you named, or your clinician."
  - "Keep the original in a safe place that is easy to find, and give copies to your loved ones, the person you named, and your clinicians. The Center says \"A copy of your advance directive is legally valid.\""
  - "If you want your forms on file for hospitals and EMS, mark the \"Opt-In\" box and send a copy to the WV e-Directive Registry (see below)."
what_happens: "The form only takes effect when you cannot make decisions for yourself. The Center says: \"As long as you can do this, you make your own decisions.\" You can change it any time by filling out a new form."
contact:
  phone: "304-293-0695"
  url: https://wvendoflife.org/resources/
  url_label: Get the forms
cost: Free forms. A notary may charge; state law caps most notary fees at $10 each.

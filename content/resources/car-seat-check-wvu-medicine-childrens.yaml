title: Free car seat check at WVU Medicine Children's
slug: car-seat-check-wvu-medicine-childrens
org: wvu-medicine
topics: [family]
who_it_is_for: Anyone who wants a child car seat checked. The state says seats are checked free of charge by a Safe Kids certified Child Passenger Safety Technician. The station is the WVU Medicine Children's Injury Prevention and Safety Program.
what_to_do: Call or email the fitting station to set up an appointment. The state asks people not to reach fitting stations through social media.
contact:
  phone: "304-554-8519"
  email: wvumchildrensinjuryprevention@wvumedicine.org
  url: https://dmv.wv.gov/cps-seat-fitting-stations
  url_label: State list of fitting stations
  place: "1 Medical Center Drive, Morgantown, WV 26506"
cost: free
sources:
  - url: https://dmv.wv.gov/cps-seat-fitting-stations
    checked: 2026-10-30

title: Volunteer to prepare free tax returns (IRS VITA and TCE)
slug: irs-tax-volunteer
org: irs
topics: [community]
who_it_is_for: Anyone who wants to help neighbors file their taxes for free. The IRS trains you, online or in a classroom, and you work at a local free tax site through its VITA or TCE programs.
what_to_do: Fill out the IRS volunteer sign-up form. The IRS shares it with groups near you that run free tax sites, and one of them follows up to set up training. Sites are generally open nights and weekends, and hours are flexible.
contact:
  url: https://freetaxassistance.for.irs.gov/s/sign-up-form
  url_label: IRS volunteer sign-up form
sources:

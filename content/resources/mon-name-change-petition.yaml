title: Change your name through the court
slug: mon-name-change-petition
org: monongalia-county-circuit-clerk
topics: [legal, family]
who_it_is_for: People who want to change their own legal name, or their child's, through a court. State law says you ask the circuit court or family court of the county where you live. It also lists things you must swear to in the petition, such as how long you have lived in the county and that the change is not to avoid debts or the law.
what_to_do: The Monongalia County Circuit Clerk has name change packets for adults and for children on its Packets page. Fill them out by hand in print, have them notarized, and file them at the Circuit Clerk's office at the Monongalia County Justice Center, 75 High Street, Suite 12. Questions go to the Circuit Clerk at 304-291-7240.
steps:
  - Fill out the packet by printing clearly. All papers must be notarized before you file.
  - File them with the Circuit Clerk and pay the filing fee. Bring a self-addressed, stamped envelope.
  - A Circuit Judge sets a hearing at least 30 days out. You get an order with the date and a notice for the newspaper.
  - Take the notice to the newspaper. It must run as a legal ad at least 10 days before the hearing. Bring the newspaper's certificate to the hearing.
  - After the hearing, take a copy of the final order to the Monongalia County Clerk's office to record it.
hours: Monday to Friday, 8:30 a.m. to noon and 1 p.m. to 5 p.m.

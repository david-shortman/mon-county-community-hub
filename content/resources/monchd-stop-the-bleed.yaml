title: Stop the Bleed class from the health department
slug: monchd-stop-the-bleed
org: monongalia-county-health-department
topics: [community]
who_it_is_for: Groups of 5 or more people in the Mon County area, like a workplace, church or club. The class is one hour.
what_to_do: Call the health department's Threat Preparedness program to set up a class for your group. You learn how to spot bleeding that could kill, press on a wound, pack a wound, and put on a tourniquet, including one you make yourself.
notes:
  - The page does not say what the class costs. Ask when you call.

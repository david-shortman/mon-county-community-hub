title: "Indoor swimming at the Peak Health Aquatic Center, Mylan Park"
slug: peak-health-aquatic-center
org: mylan-park-foundation
topics: [outdoors]
who_it_is_for: "Anyone who wants to swim indoors, all year. It has a community pool, a competition pool, a splash pad and a fitness center. The outdoor track next door is open dawn to dusk."
hours: "Monday to Friday 6 a.m. to 8:30 p.m., Saturday 8 a.m. to 6 p.m., Sunday 11 a.m. to 6 p.m."

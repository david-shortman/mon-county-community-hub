title: Morning and Afternoon Adventures (Brookhaven, Cheat Lake, Mountainview, North)
slug: vhs-morning-afternoon-adventures
org: visiting-homemaker-service
topics: [family, money]
who_it_is_for: Children ages 5 to 12, in kindergarten to 5th grade, at Brookhaven, Cheat Lake, Mountainview and North elementary schools.
what_to_do: Before and after school care while parents work. Enrollment is open all year, with no limit and no waitlist. First read and agree to the Parent/Student Handbook on the program's page, then register online for your child's school, or register in person at 382 Broadway Avenue. Questions, call (304) 599-7743.
contact:
  phone: "304-599-7743"
  url: https://www.visitinghomemakerservicewv.org/afternoon-adventures
  url_label: Register
cost: "Daily fees by yearly household income, charged only for days attended: $9 ($0 to $50,000), $10 ($50,001 to $75,000), $11 (over $75,000). Add $3 if a child comes both morning and afternoon. Plus a one-time registration fee per child."
sources:

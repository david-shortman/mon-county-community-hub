who_it_is_for: People with Medicare and their families in West Virginia. Counselors help you choose a plan, review your coverage, understand costs, apply for Extra Help, and file a complaint or appeal.
what_to_do: Call WV SHIP toll free at 1-877-987-4463.
contact:
  phone: "1-877-987-4463"
  url: https://www.wvship.org
cost: free

title: VA burial benefits and memorial items
slug: va-burial-benefits
org: us-department-of-veterans-affairs
topics: [veterans, records]
who_it_is_for: Service members, veterans and their family members. The VA says eligible veterans have earned burial and memorial benefits for themselves, their spouses and qualifying family members.
what_to_do: Start on the VA burial benefits page. It covers burial in a VA national cemetery, the burial allowance to help pay funeral and burial costs, and headstones, markers and other memorial items. To schedule a burial in a national cemetery, call the National Cemetery Scheduling Office at 800-535-1117.

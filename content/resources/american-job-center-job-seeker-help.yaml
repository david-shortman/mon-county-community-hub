title: Free resume, interview and career help at the American Job Center
slug: american-job-center-job-seeker-help
org: region-vi-workforce-development-board
topics: [work]
who_it_is_for: All job seekers in Mon and Preston counties, including veterans and people with disabilities, whatever their schooling, work history or job status.
what_to_do: Go to or call the Morgantown American Job Center at 40 Commerce Drive. Staff help with resumes, getting ready for interviews, career counseling, job searches, skill tests, and finding training and help paying for it.

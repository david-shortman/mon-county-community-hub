title: Water well permit (new, change or closing a well)
slug: monchd-well-permit
org: monongalia-county-health-department
topics: [health, government]
who_it_is_for: Mon County property owners who want to drill a new water well, change a well, or close (abandon) one, for example after connecting to public water.
what_to_do: Start with a certified water well driller. The state keeps a list of certified drillers, linked from the health department page. The driller sends the health department a well application. A health department inspector (a sanitarian) visits to check the well is the right distance from the septic system and buildings. Once approved, the health department issues a construction permit. The driller must send a completion or abandonment report within 30 days after the work is done.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/septic-and-wells
  url_label: Steps and application
cost: "The health department's fiscal year 2026-2027 fee schedule lists $150 for a water well permit."

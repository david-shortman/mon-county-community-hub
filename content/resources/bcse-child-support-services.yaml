title: Child support services from the state (BCSE)
slug: bcse-child-support-services
org: wv-bureau-for-child-support-enforcement
topics: [family, legal]
who_it_is_for: "Parents raising a child, parents who may pay support, and anyone else who has a child living with them. BCSE says it can find a parent, legally establish paternity, set up child support and health coverage, collect payments, enforce a court order, and review and change an order. BCSE does not give advice or represent either parent on custody or visitation."
what_to_do: "Apply online through WV PATH (you need an email address and a Social Security number), or print the paper application and give it to the nearest child support office. The Monongalia County office is at 118 South High Street in Morgantown. BCSE says email to your local office gets the fastest answer: DoHSBCSEMonongalia@wv.gov."
hours: Statewide customer service is open Monday to Friday, 8:30 a.m. to 5 p.m.
contact:
  phone: "304-285-3218"
  url: https://bcse.wv.gov/page/application
  url_label: Apply
  place: 118 South High Street, Morgantown, WV
cost: free
what_to_bring:
  - Certified birth certificates for the children
  - Your child support order, divorce decree or separation agreement, if you have one
  - Records of any child support you got in the past
notes:
  - "BCSE customer service is 1-800-249-3778. For help with WV PATH, call 1-844-451-3515."
  - "If you get WV WORKS for a child, BCSE says you must be referred for child support. It is your choice if you get Medicaid or SNAP. If naming the other parent could put you at risk, BCSE says you can talk to your caseworker about good cause."
  - BCSE says it offers translation for people who do not speak English. A Spanish application is on its Apply page.

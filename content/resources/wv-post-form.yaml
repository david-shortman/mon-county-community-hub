title: POST form and DNR card (medical orders)
slug: wv-post-form
org: wv-center-for-end-of-life-care
topics: [health]
who_it_is_for: "The Center says the West Virginia POST form is \"for the seriously ill or very frail.\" It and the DNR card are medical orders, not advance directives. The Center says EMS can only follow wishes about CPR that are in a medical order: \"Requests related to cardiopulmonary resuscitation (CPR) listed in advance directives cannot be honored by emergency medical service (EMS) providers because they are NOT medical orders.\""
what_to_do: "Ask your health care clinician (MD, DO, APRN or PA). The Center says the clinician \"must complete the order with you\" and you \"should never be provided a blank POST form to complete alone.\" Keep it on your refrigerator if you live at home, and take it to the doctor or hospital."
what_happens: "The current POST form is dated 2026. The Center says older versions \"are still valid and can be utilized.\""

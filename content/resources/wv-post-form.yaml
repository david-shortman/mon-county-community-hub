title: POST form and DNR card (medical orders)
slug: wv-post-form
org: wv-center-for-end-of-life-care
topics: [health]
who_it_is_for: "People who are seriously ill or very frail. The Center says the POST form is \"for the seriously ill or very frail.\" The POST form and the DNR card are medical orders. A living will is not. That matters in an emergency: EMS can follow a medical order about CPR, but not CPR wishes written only in a living will or medical power of attorney. The Center says those wishes \"cannot be honored by emergency medical service (EMS) providers because they are NOT medical orders.\""
what_to_do: "Ask your doctor, nurse practitioner or physician assistant. The Center says they \"must complete the order with you\" and you \"should never be provided a blank POST form to complete alone.\" Keep it on your refrigerator if you live at home, and take it to the doctor or hospital."
what_happens: "The current POST form is dated 2026. The Center says older versions \"are still valid and can be utilized.\""

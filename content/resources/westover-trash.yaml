title: Trash pickup in Westover
slug: westover-trash
org: city-of-westover
topics: [moving, recycling]
who_it_is_for: People who live in the City of Westover. The city picks up garbage, and it is billed on your MUB water bill. Recycling is picked up the same day as garbage.
what_to_do: To start garbage pickup, call 304-292-8443. For a bulk pickup, call Westover City Hall at 304-296-6860.
contact:
  phone: "304-292-8443"
  url: https://www.westoverwv.org/utilities

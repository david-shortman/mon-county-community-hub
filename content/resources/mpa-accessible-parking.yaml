title: Accessible (handicap) parking in Morgantown
slug: mpa-accessible-parking
org: morgantown-parking-authority
topics: [moving, disability]
town: Morgantown
who_it_is_for: People with a state-issued accessible parking permit or a permanent state-issued accessible license plate. The Parking Authority says accessible spaces are in its lots, at street meters, in its garages and in neighborhoods. The person the permit was issued to must be in the vehicle.
what_to_do: Park in a marked accessible space and display your state permit or plate. At a metered accessible space, you still pay the meter. A WVU accessible permit is only good on WVU property. It does not count in city accessible spaces.
cost: You pay the meter, like other parkers.
contact:
  phone: "304-284-7435"
  url: https://www.parkmpa.com/faq/

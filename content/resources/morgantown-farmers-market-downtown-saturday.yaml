title: Morgantown Farmers Market, Saturday downtown market
slug: morgantown-farmers-market-downtown-saturday
org: morgantown-farmers-market-growers-association
topics: [growing, food]
who_it_is_for: Anyone who wants to buy local produce, meats, eggs, baked goods, plants and more. The market says all products are grown or made by vendors within 50 miles of Morgantown.
hours: Saturdays, 8:30 a.m. to noon, April 25 to November 14, 2026.
what_to_do: Go on a Saturday morning in season. Bring cash, or use a credit, debit or SNAP/EBT card at the market manager's table to get market tokens.
contact:
  url: https://www.morgantownfarmersmarket.org/markets.html
  url_label: Market schedule
  place: "Morgantown Market Place Pavilion, 400 Spruce Street, Morgantown, WV"
town: Morgantown
cost: Free to visit.
get_in: walk-in
what_happens: You walk from booth to booth and buy from each farmer. Debit and credit cards get market tokens for a small fee. SNAP/EBT tokens can only be used for SNAP-eligible items.
steps:
  - Check the market schedule page for this season's dates.
  - Bring cash, or swipe a card at the market manager's table for tokens. The market says tokens never expire and every vendor takes them.
  - With SNAP/EBT, the market says it matches SNAP up to $10 per day per customer while funding lasts.

title: Your rights when you plan a funeral
slug: ftc-funeral-rule-your-rights
org: us-federal-trade-commission
topics: [records]
who_it_is_for: Anyone arranging a funeral or cremation. A federal rule, the FTC Funeral Rule, says what funeral homes must do.
what_to_do: You can compare funeral homes before you choose one.
options:
  - You can ask about prices by phone, and the funeral home must answer from its price lists.
  - If you ask in person, you get a printed price list to keep.
  - When you finish making plans, you get an itemized written statement of what you chose.
  - A funeral home cannot make you buy a casket for a direct cremation.

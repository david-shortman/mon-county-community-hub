title: Build with Mon Valley Habitat for Humanity
slug: mon-valley-habitat-volunteer
org: mon-valley-habitat-for-humanity
topics: [community]
who_it_is_for: Anyone. You must be at least 16 to work on a construction site, and volunteers under 18 have some limits, like no roof work. No building experience is needed.
what_to_do: Open Habitat's volunteer page to sign up as a person, a group, or for a committee. Groups should plan ahead.
contact:
  url: https://monvalleyhfh.org/volunteer/
  url_label: Volunteer page
what_to_bring:
  - Work gloves. Habitat provides tools and safety gear.
what_happens: A construction manager trains you on the day's tasks.
sources:

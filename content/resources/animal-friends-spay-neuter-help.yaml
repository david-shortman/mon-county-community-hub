title: Spay and neuter cost help (Animal Friends)
slug: animal-friends-spay-neuter-help
org: animal-friends-of-north-central-wv
topics: [pets]
who_it_is_for: Residents of Monongalia, Preston and Marion counties who cannot otherwise afford to spay or neuter a cat or dog. You must show proof of financial need first.
what_to_do: Call 304-290-4738 (304-290-4PET) and leave a message to ask for details. Someone will call you back.
what_to_bring:
  - A photo ID
  - An active West Virginia Food Stamp (SNAP) card or WV Medicaid card. If you have neither, proof of household income.
contact:
  phone: "304-290-4738"
  url: https://www.animalfriendswv.org/spayneuter/
  url_label: Spay/neuter help
cost: Animal Friends says the program provides free spaying and neutering for pets whose owners qualify.
sources:

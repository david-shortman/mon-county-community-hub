title: Host a trail cleanup with BOPARC
slug: boparc-trail-cleanups
org: boparc
topics: [better]
who_it_is_for: Groups that want to clean up a BOPARC trail or hold an event on one.
what_to_do: Email BOPARC to ask, and a staff member will answer. If your event is open to the public, you need proof of liability insurance before BOPARC approves it.

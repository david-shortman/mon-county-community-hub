title: Adopt from the Animal Friends sanctuary
slug: animal-friends-adopt
org: animal-friends-of-north-central-wv
topics: [pets]
who_it_is_for: People who want to adopt a dog or cat from a no-kill sanctuary. Animal Friends runs an adoption and foster program for dogs and cats.
hours: By appointment only.
get_in: appointment
what_to_do: Look at the pets on the Animal Friends website, then call 304-290-4738 for a visit.
steps:
  - Browse the pets on the Adopt page.
  - Call 304-290-4738 to set up a visit to the sanctuary.
  - Fill out the adoption form.
  - Pay the adoption fee. It is non-refundable.
  - If you cannot keep the pet later, call Animal Friends and it will take the pet back into its foster and adoption program.
contact:
  phone: "304-290-4738"
  url: https://www.animalfriendswv.org/adopt/
  url_label: See pets
  place: 252 Brewer Road, Morgantown, WV 26508
cost: There is an adoption fee. The website does not list the amount, so ask when you call.

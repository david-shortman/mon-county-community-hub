title: Diet help from health department dietitians, for diabetes, weight and heart health
slug: monchd-nutrition-counseling
org: monongalia-county-health-department
topics: [health]
who_it_is_for: Community members with a doctor's referral who want help with a healthy diet. The health department lists conditions like weight management, diabetes, kidney problems and heart problems.
what_to_do: Ask your doctor for a referral, then call 304-598-5181 to make an appointment with a registered dietitian.
contact:
  phone: "304-598-5181"
  url: https://www.monchd.org/services/nutritional-counseling-community
cost: Takes Medicaid and private insurance. Sliding-scale fee for people without insurance.
sources:

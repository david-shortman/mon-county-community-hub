title: WV Birth to Three for babies and toddlers
slug: wv-birth-to-three-referral
org: wv-birth-to-three
topics: [family, health]
who_it_is_for: Children under age 3 who have a delay in their development, or may be at risk of one, and their families. Parents can make a referral themselves. So can doctors, hospitals, other family members and foster parents.
what_to_do: Call 1-866-321-4728 and ask to be connected to your local regional office, or fill out the referral form online. Mon County is served by the Region I office in Wheeling.
contact:
  phone: "1-866-321-4728"
  url: https://www.wvdhhr.org/birth23/referral.asp
cost: No charge for the services in your child's plan (the Individualized Family Service Plan).

who_it_is_for: The state DMV office in Morgantown, for driver's licenses, ID cards, titles and plates. Its page does not list which services this office handles, so call to ask before you go.
hours: Monday to Friday, 8:30 a.m. to 5 p.m.
opening_hours:
  - days: [mon, tue, wed, thu, fri]
    opens: "08:30"
    closes: "17:00"
get_in: walk-in
what_to_do: Walk in, or make an appointment. The office says walk-ins are always welcome, and it also offers appointments, including same-day appointments. Book on the office page, or call 1-800-642-9066 (in West Virginia only) or 304-558-3900. The office is at 1525 Deckers Creek Blvd.

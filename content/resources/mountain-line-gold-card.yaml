title: Half fare on the bus at 62 and older (Mountain Line Gold Card)
slug: mountain-line-gold-card
org: mountain-line-transit-authority
topics: [disability]
who_it_is_for: Riders 62 and older. The Gold Card takes half off cash fares on local trips.
what_to_do: Fill out the Gold Card form on Mountain Line's website, or print it and turn it in. You need a photo ID that shows you are at least 62. Questions? Call 304-291-RIDE (304-291-7433).
contact:
  phone: "304-291-7433"
  url: https://www.busride.org/gold-card-program
  url_label: Gold Card form
cost: Mountain Line's Gold Card page says a 75-cent fare costs 35 cents a trip.
what_to_bring:
  - A photo ID that shows you are 62 or older
sources:
  - url: https://www.busride.org/gold-card-program
    checked: 2026-10-30
  - url: https://www.busride.org/how-to-pay
    checked: 2026-10-30

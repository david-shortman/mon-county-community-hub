title: Morgantown Mosaic neighborhood grants
slug: morgantown-mosaic-grants
org: city-of-morgantown
topics: [better]
who_it_is_for: People who live in a Morgantown neighborhood can apply. So can recognized neighborhood associations, and people with written support from their neighborhood association. People in other neighborhoods inside city limits can also apply, with more review. The grants pay for neighborhood signs and direction signs, beautification and landscaping, public art, gathering spaces, graffiti removal and community gardens.
what_to_do: "Apply on the city's online form. Grants are up to $500, or up to $2,000 for large projects with more review."
notes:
  - "You need a 1 to 1 match, and up to half of it can be volunteer time or donated materials."
  - "A committee scores applications four times a year. Applications that come in less than 3 weeks before a scoring meeting move to the next round. The 2027 scoring dates are not posted yet."

title: Meals brought to your home (Morgantown Area Meals on Wheels)
slug: mamow-home-delivered-meals
org: morgantown-area-meals-on-wheels
topics: [food, disability]
who_it_is_for: People who need meals brought to their home and live within 10 miles of one of its three delivery centers, at Goshen Baptist Church, Rock Forge Presbyterian Church and the Star City Kitchen. It cannot deliver in Pennsylvania. Doctors, hospitals, agencies and families can refer someone.
what_to_do: Call the kitchen at 304-599-1954. If no one answers, leave your name, address and phone number, and the interviewer for your area will call back. You can also email morgantownareamow@gmail.com.
contact:
  phone: "304-599-1954"
  email: morgantownareamow@gmail.com
  url: https://morgantownwvmow.org/get-meals/
  url_label: How to sign up
cost: Meals are not free. You pay at most $6 a meal for regular and diabetic meals, and $7 for special diets like gluten free, low salt or vegan. The price is set by your income and expenses at your first interview.
what_to_bring:
  - The name and phone number of a contact person, like a relative, neighbor or friend
what_happens: An interviewer visits your home to talk about what you can eat and to set your meal price. Meals can usually start within two days. Volunteer drivers bring them between 10 a.m. and noon on the weekdays you pick.

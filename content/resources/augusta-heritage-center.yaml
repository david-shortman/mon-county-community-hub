title: Augusta Heritage Center workshops and retreats, Elkins
slug: augusta-heritage-center
org: augusta-arts-and-culture
topics: [community]
who_it_is_for: Anyone who wants to learn a folk art face to face from a master artist. This is in Elkins, outside Mon County. Summer workshop weeks are in downtown Elkins, no longer at Davis and Elkins College. There are also retreats, dances and a monthly community sing.
what_to_do: See the Augusta website for upcoming retreats and events. Next summer's workshop dates were not posted when we checked. For summer workshops, Augusta offers tuition scholarships and a program where you volunteer in exchange for classes.
contact:
  url: https://augustaartsandculture.org/
  url_label: Augusta website
cost: Summer 2026 workshop tuition was $595, or $625 late. Scholarships are available for tuition.

title: Register a new business with the state (One Stop Business Portal)
slug: wv-one-stop-business-registration
org: wv-secretary-of-state
topics: [work]
who_it_is_for: Anyone starting a business in West Virginia. The state says every person or business must register with the State Tax Department before doing business. Corporations, LLCs and some other types also register with the Secretary of State.
what_to_do: First get a federal Employer Identification Number (EIN) from the IRS. Then create an account on the One Stop Business Portal and register online. One online filing covers the Secretary of State (if your business type needs it), the State Tax Department and WorkForce West Virginia. Paper forms are also available.
contact:
  url: https://sos.wv.gov/register-new-wv-business
  url_label: How to register
cost: "Secretary of State filing fees depend on business type: $100 for an LLC or for-profit corporation, $25 for a nonprofit corporation, plus a $1 online processing fee. The initial Secretary of State fee may be waived for veteran-owned businesses and West Virginia resident young entrepreneurs age 18 to 29. See the full list at the link."

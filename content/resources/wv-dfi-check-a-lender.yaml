title: Check a lender before you borrow
slug: wv-dfi-check-a-lender
org: wv-division-of-financial-institutions
topics: [money]
who_it_is_for: Anyone thinking about a payday loan or another quick loan. The Division says traditional payday lenders are generally prohibited in West Virginia.
what_to_do: Before you borrow from anyone, call the Division at 304-558-2294 and ask if the lender is allowed to lend in West Virginia.
contact:
  phone: "304-558-2294"
  url: https://dfi.wv.gov/consumers
cost: free
sources:

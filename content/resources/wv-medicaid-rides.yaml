title: Rides to medical care for Medicaid and WVCHIP members
slug: wv-medicaid-rides
org: modivcare
topics: [health]
who_it_is_for: West Virginia Medicaid and WVCHIP members going to a service that Medicaid or WVCHIP covers. The state says members "may be eligible."
what_to_do: Call 1-844-549-8353 to book, Monday to Friday, 7 a.m. to 6 p.m. Book at least 5 business days ahead. You can also book in the Modivcare Trip Manager app or at member.modivcare.com. To cancel or ask a question, call 1-844-549-8354, any hour.
hours: Reservations Monday through Friday, 7 a.m. to 6 p.m. Ride Assistance Line 24/7.
contact:
  phone: "1-844-549-8353"
  url: https://bms.wv.gov/non-emergency-medical-transportation-nemt-information-members

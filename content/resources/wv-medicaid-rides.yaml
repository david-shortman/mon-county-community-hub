title: Rides to medical care for Medicaid and WVCHIP members
slug: wv-medicaid-rides
org: modivcare
topics: [health]
who_it_is_for: West Virginia Medicaid and WVCHIP members going to a service that Medicaid or WVCHIP covers. The state says members "may be eligible."
what_to_do: Call Modivcare's reservation line at 1-844-549-8353, Monday through Friday, 7 a.m. to 6 p.m. Book routine rides at least 5 business days ahead. You can also book in the Modivcare Trip Manager app or at member.modivcare.com. If you live near a bus line, you can ask for bus tickets or passes for you and, if medically needed, one escort. Family or friends who drive you may be able to get mileage paid back. Questions, or to cancel a ride, call the Ride Assistance Line at 1-844-549-8354, open 24/7. Give 24 hours' notice to cancel if you can.
hours: Reservations Monday through Friday, 7 a.m. to 6 p.m. Ride Assistance Line 24/7.
contact:
  phone: "1-844-549-8353"

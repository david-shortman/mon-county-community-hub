title: Free small business coaching (WV SBDC)
slug: wv-sbdc-business-coaching
org: wv-small-business-development-center
topics: [work]
who_it_is_for: People thinking about starting a business, and owners who want to grow one, in West Virginia.
what_to_do: Sign up as a client on the WV SBDC website or call the Ask Me line. Coaches meet one-on-one about business plans, funding, marketing and more. The Morgantown Area Partnership says SBDC coaches see people by appointment at 265 Spruce Street in downtown Morgantown and at the WorkForce WV office at 40 Commerce Drive, Suite 200, in Westover. The SBDC also runs a Business Fundamentals class for people starting out.

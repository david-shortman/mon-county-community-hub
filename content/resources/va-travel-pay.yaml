title: VA travel pay for rides to VA health care
slug: va-travel-pay
org: us-department-of-veterans-affairs
topics: [veterans, health, money]
who_it_is_for: "Veterans who meet at least one VA rule and are traveling to VA health care. It also covers travel to VA-approved care in the community. Examples VA lists include a disability rating of \"30% or higher,\" travel for a service-connected condition, getting a VA pension, or income below the VA pension rate."
what_to_do: File a claim after each appointment, online or with VA Form 10-3542 by mail or in person at the VA facility where you got care. VA says "Plan to file within 30 days," because "claims filed after the 30-day limit are usually denied."
notes:
  - VA says it pays "41.5 cents ($0.415) per mile" for approved travel.
  - A deductible comes out first, "$3 one-way or $6 round-trip for each appointment, up to $18 total each month."
contact:
  url: https://www.va.gov/health-care/file-travel-pay-reimbursement/
cost: free

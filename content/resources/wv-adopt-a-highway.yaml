title: Adopt a state highway or spot
slug: wv-adopt-a-highway
org: wv-department-of-environmental-protection
topics: [better]
who_it_is_for: Individuals, families, churches, businesses, schools, civic groups, government agencies, fraternities and communities. On Adopt-A-Highway, volunteers must be at least 12. Adopt-A-Spot has no age limit, but the state may say no to an unsafe spot for young volunteers.
what_to_do: Adopt 2 miles of a state road (Adopt-A-Highway) or up to a quarter mile (Adopt-A-Spot) for 2 years. Pick up litter at least twice a year, at least 30 days apart. Tell the Division of Highways county garage 3 days before each cleanup, and send a report after. The state gives bags, gloves, safety vests and a sign, and takes away the bagged trash. Apply online or on a paper form.

title: Free GED prep at the MTEC Adult Learning Center
slug: mtec-ged-prep
org: mtec
topics: [work]
who_it_is_for: Adults 16 and older who are not in school and want to earn a West Virginia High School Equivalency Diploma, or build basic skills like reading, math and computers. It is the county's site on the state's adult education class list.
what_to_do: Call 304-291-9226 to set up a time to meet a teacher, or start registration online from the state's class list. The teacher works out a plan with you and gives the official GED practice test when you are ready. The center is in Room 108 of the Pierpont Center on the MTEC campus, 1000 Mississippi Street, Morgantown.
contact:
  phone: "304-291-9226"
  url: https://studentportal.literacypro.com/wv?monongalia-adult-ed-esl
  url_label: Start registration
  place: 1000 Mississippi Street, Morgantown, WV 26501
get_in: appointment
not_posted: [hours]
cost: Free. MTEC says all services at the Adult Learning Center are free.

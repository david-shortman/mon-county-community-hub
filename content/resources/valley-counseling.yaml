title: Counseling and psychiatry at Valley HealthCare, with a sliding fee
slug: valley-counseling
org: valley-healthcare-system
topics: [health]
who_it_is_for: People in Marion, Monongalia, Preston and Taylor counties who want counseling, psychiatry or other ongoing mental health care. Valley says it gives treatment "regardless of your ability to pay."
what_to_do: Call 304-296-1731 and ask for extension 0 to schedule an appointment, or extension 4916 for the Screening Line to talk about services and how to qualify. Bring a photo ID and your insurance card if you have them. The Morgantown office at 301 Scott Avenue also takes walk-ins on the 2nd and 4th Saturday of each month, and the 5th when there is one, 9 a.m. to 4 p.m.
contact:
  phone: "304-296-1731"
  url: https://www.valleyhealthcare.org/faqs
  place: 301 Scott Avenue, Morgantown, WV 26508
cost: Takes Medicare, WV CHIP, traditional Medicaid and some Medicaid plans. A sliding fee based on income can bring the cost to zero; call extension 4131 to see if you qualify.

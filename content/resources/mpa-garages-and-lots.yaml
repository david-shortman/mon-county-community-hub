title: Park in a downtown garage or lot
slug: mpa-garages-and-lots
org: morgantown-parking-authority
topics: [moving]
town: Morgantown
who_it_is_for: Anyone parking downtown. The Parking Authority runs four garages and nine surface lots, open 24 hours a day. The University Avenue, Wharf and Spruce Street garages are gated, with help buttons at each entrance, exit and pay station, answered 24 hours a day.
what_to_do: Pull a ticket at the gate and pay for the time you use at a pay station before you leave. For a long stay, use a long-term lot (up to 10 hours) or a garage (up to 24 hours).
steps:
  - "Spruce Street and Wharf garages: 75 cents an hour."
  - "University Avenue garage: 75 cents an hour from 6 a.m. to 6 p.m., and $1 an hour from 6 p.m. to 6 a.m."
  - The Parking Authority says the University Avenue garage is usually full from about 9:30 a.m. to 1 p.m., and the Spruce Street garage, by the Public Safety Building, usually has 60 to 80 open spaces.
  - Monthly permits are sold for the University, Wharf and Spruce Street garages, first come, first served. Students can buy semester permits. Call the office to ask what is open and what it costs.
  - On jury duty at the Courthouse? Park in the University Avenue, Spruce Street or Wharf garage, keep your gate ticket, and the court gives you a sticker that pays for it.
cost: Garages are 75 cents an hour in the daytime. See the steps for each garage.
contact:

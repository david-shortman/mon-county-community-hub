title: Free immigration legal consultations at Mountain State Justice
slug: msj-immigration-legal-help
org: mountain-state-justice
topics: [legal, family]
who_it_is_for: People living in West Virginia who have questions about their immigration status or legal options, or the rights of their loved ones under immigration law. Mountain State Justice says it focuses on West Virginians with low income, and calls to see if you qualify.
what_to_do: Call 304-344-3144 or 800-319-7132 to complete an intake. If it fits, staff will schedule a consultation. Mountain State Justice says it represents people in cases such as family-based visas, asylum, citizenship and naturalization, U and T visas, VAWA petitions, and removal (deportation) defense. Its Morgantown office is at 1029 University Avenue, Suite 101 (304-326-0188). The website has pages in Spanish and Arabic.

title: Ramps, grab bars, van lifts and equipment (LiveAbility CLSP)
slug: liveability-clsp
org: liveability
topics: [disability]
who_it_is_for: People with disabilities who want to live more on their own at home. LiveAbility's state-funded Community Living Services Program lists home changes like a wheelchair ramp, a roll-in shower or grab bars, vehicle changes like a wheelchair lift or hand controls, communication devices and training, and help getting equipment like a shower chair or walker. The page does not say who qualifies or what it costs.
what_to_do: Call LiveAbility's Morgantown office at 304-296-6091 or toll free 844-212-3464, or email info@liveabilitywv.org, and ask about the Community Living Services Program.

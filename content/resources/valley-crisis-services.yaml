title: Valley HealthCare crisis line and walk-in crisis clinic
slug: valley-crisis-services
org: valley-healthcare-system
topics: [health]
who_it_is_for: Anyone in Marion, Monongalia, Preston or Taylor counties having a mental health or substance use crisis. The mobile crisis team is for adults 18 and older.
what_to_do: Call the crisis line at 1-800-232-0020, open 24/7. Or walk in to the Morgantown office at 301 Scott Avenue, Monday through Friday from 9 a.m. until 4 p.m. If you want to see a counselor or psychiatrist after a walk-in visit, staff can set up a future appointment. The crisis team can also come to help calm things in situations that are not life-threatening. In danger right now? Call 911.
hours: Crisis line 24/7. Walk-in crisis clinic Monday through Friday, 9 a.m. to 4 p.m.

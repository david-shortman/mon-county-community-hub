title: Farmers market vendor permit from the WV Department of Agriculture
slug: wvda-farmers-market-vendor-permit
org: wv-department-of-agriculture
topics: [growing]
who_it_is_for: People who want to make and sell canned acidified foods (like salsa, pickles or sauces) at a West Virginia farmers market. The page lists foods that do not need this permit, including fresh uncut produce, honey, breads and jams. See the full rules at the link.
what_to_do: Read the Department of Agriculture's farmers market page and its vendor guide before you sell. Email farmersmarkets@wvda.us to ask whether your product needs a permit. Applications are due March 1 each year.
contact:
  phone: "304-558-3550"
  email: farmersmarkets@wvda.us
  url: https://agriculture.wv.gov/divisions/regulatory-and-environmental-affairs/farmers-market/
  url_label: Read the rules
cost: $35 a year for the vendor permit. Registering a market is free.
sources:
  - url: https://agriculture.wv.gov/divisions/regulatory-and-environmental-affairs/farmers-market/
    checked: 2026-10-30

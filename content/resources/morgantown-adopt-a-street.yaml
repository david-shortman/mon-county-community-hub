title: Adopt a city street in Morgantown
slug: morgantown-adopt-a-street
org: city-of-morgantown
topics: [better]
who_it_is_for: Groups, businesses and individuals who want to keep a street clean. Only streets the City of Morgantown maintains can be adopted.
what_to_do: Sign up through Morgantown 311 by choosing "Adopt a City Street." Do at least 4 cleanups a year to get a sign with your name on the street. Renew each fall, with updated details due by the end of September. Bring your own trash bags. Call Public Works 1 to 2 days before a cleanup so they can pick up the bagged trash at the curb. You can borrow safety vests from the MO.T.O tool lending library.
contact:
  phone: "304-241-3116"
  url: https://www.morgantownwv.gov/adopt-a-street
  url_label: Sign up on 311
cost: free

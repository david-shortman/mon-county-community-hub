title: Septic and well check when a home is sold (home loan evaluation)
slug: monchd-home-loan-evaluation
org: monongalia-county-health-department
topics: [health, government]
who_it_is_for: Buyers, sellers and lenders of a Mon County home with a septic system or well. The health department says many lenders now require this check before they approve a mortgage.
what_to_do: The lender or the current owner fills out the home loan evaluation request on the health department's Septic and Wells page. A sanitarian tests the water for coliform bacteria and puts dye tablets in the drains, then comes back two days later to look for dye on the ground. The home must have been lived in for the last 30 days in a row, and the septic tank must not have been pumped in the last 30 days. If the tank has not been pumped in the last three years, it will need to be pumped after the system passes. Radon testing can be added.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/septic-and-wells
  url_label: Request form
cost: "The health department's fiscal year 2026-2027 fee schedule lists $225 for a home loan evaluation."

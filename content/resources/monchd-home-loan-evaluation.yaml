title: Septic and well check when a home is sold (home loan evaluation)
slug: monchd-home-loan-evaluation
org: monongalia-county-health-department
topics: [health, government]
who_it_is_for: Buyers, sellers and lenders of a Mon County home with a septic system or well. The health department says many lenders now require this check before they approve a mortgage.
what_to_do: The lender or the current owner fills out the home loan evaluation request on the health department's Septic and Wells page. Before you ask, the home must have been lived in for the last 30 days in a row, and the septic tank must not have been pumped in the last 30 days. A health department inspector (a sanitarian) tests the water for germs (coliform bacteria). The inspector also puts dye tablets in the drains and comes back two days later to look for dye on the ground, which would show the septic system is failing. If the tank has not been pumped in the last three years, it must be pumped after the system passes. Radon testing can be added.
contact:

title: Job training in high school at MTEC
slug: mtec-high-school-programs
org: mtec
topics: [work, family]
who_it_is_for: High school students who want hands-on job training during the school day. Programs cover health jobs like dental and medical assisting, building trades like carpentry, electrical and welding, and others like culinary, graphic design and law and public safety. Every program lasts two years. Health programs take only 11th and 12th graders.
what_to_do: Students in 9th, 10th or 11th grade apply online and list their top three programs. Next comes an interview with the program's teacher. The interview score, grades and attendance decide who gets in. MTEC's site says the application window closes November 29, 2026, at 3 p.m. Questions, call 304-291-9240 or ask your school counselor.
what_happens: Students start the day at their home high school and ride a bus to MTEC, or drive or get dropped off. The MTEC day runs from 7:45 a.m. to 2:10 p.m., with breakfast and lunch, and buses go back to the home schools after. Students can still join clubs and after school activities at their home school.
contact:
  phone: "304-291-9240"
  url: https://sites.google.com/boe.mono.k12.wv.us/go-to-mtec/home
  url_label: Apply to MTEC
cost: Free for students enrolled full time in Monongalia County Schools. There is no tuition, and books and supplies are free.

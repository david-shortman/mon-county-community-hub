title: LiveAbility, independent living help for people with disabilities
slug: liveability-morgantown
org: liveability
topics: [disability]
who_it_is_for: People with any kind of disability who want to live on their own terms. Services include advocacy, peer support from people who also live with disabilities, skills training, help finding information, and help with home access and assistive technology. It is not assisted living, and you do not need medical proof to get help.
what_to_do: The Morgantown office is at 601-603 East Brockway Avenue, Suite A. Open Monday to Friday, 8 a.m. to 4 p.m. Call 304-296-6091 or toll free 844-212-3464, or email info@liveabilitywv.org.
contact:

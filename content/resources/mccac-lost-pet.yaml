title: Lost your dog or cat? Check with the county shelter
slug: mccac-lost-pet
org: monongalia-county-canine-adoption-center
topics: [pets]
who_it_is_for: Anyone in Monongalia County whose dog or cat is missing. The Canine Adoption Center is the county pound, so stray dogs picked up by county animal control go there.
what_to_do: Look at the shelter's list of found pets, and report your pet as lost.
steps:
  - Look at Found Pets on the shelter's website. If you see your pet, call 304-291-7267.
  - Report your pet as lost. Make a free account under My Account on the shelter's website and add your pet to the Lost Pets list.
  - Or email lostandfound@monongaliacounty.gov.
  - "To pick up a dog that animal control brought in, bring proof of a current rabies shot and a current county dog license or tag."
contact:
  phone: "304-291-7267"
  url: https://monongaliawv.animalservices.website/shelterpronet/home.spn
  url_label: Lost and found pets
  place: 106 Lockside Rd, Westover, WV 26501
cost: "To get back a dog that animal control picked up: a $20 pick-up fee plus $10 for each day the dog stays. The shelter's site says cash only."
what_to_bring:
  - Proof of a current rabies vaccination
  - Current county dog license or tag
what_happens: If you cannot show proof of a current rabies shot when you pick up your dog, the shelter says you will get a citation and a deadline to get the shot.

title: Free programs for adults at the library
slug: mpls-adult-programs
org: morgantown-public-library-system
topics: [community]
who_it_is_for: Adults in Mon County. The library says it offers free social events and activities, plus help with job hunting and learning a language.
what_to_do: "Look at the library's calendar for events at all its locations, and filter by Adults. Programs on its adult page include the Sci-Fi and Fantasy Book Discussion Group, Adult Craft Night, Dungeons and Dragons for adults, Senior Lunch and Learn, Library Lattes and Laughs, and LEGO Night. With a library card you can also use Mango Languages (more than 70 languages). TutorWV offers free 1-to-1 tutoring from 10 a.m. to 10 p.m."

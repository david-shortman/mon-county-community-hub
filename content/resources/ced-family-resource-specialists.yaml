title: Parent mentors, Parent to Parent and Sibshops (WVU CED)
slug: ced-family-resource-specialists
org: wvu-center-for-excellence-in-disabilities
topics: [family, disability]
who_it_is_for: "Families of children with disabilities or special health care needs, anywhere in West Virginia. The Family Resource Specialists are parents of children with disabilities who were trained to help other families."
what_to_do: "The WVU Center for Excellence in Disabilities runs Paths for Parents and the Family to Family Health Information Center from its Morgantown office. Call 304-293-4692 or email F2FHIC@hsc.wvu.edu."
options:
  - "Advocacy mentoring: help learning to ask for the services your child needs, with sample letters and guidance."
  - "Finding services: connections to special education, early intervention, health care, insurance, Medicaid waivers and other disability services."
  - "Parent to Parent of West Virginia: a match with a trained volunteer parent who has been through something similar. Fill out the short interest form on the CED site."
  - "Sibshops for brothers and sisters ages 7 to 12, and SibTeen for ages 13 to 17, who have a sibling with a disability."
contact:

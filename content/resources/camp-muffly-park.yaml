title: Camp Muffly Park
slug: camp-muffly-park
org: monongalia-county-parks-and-recreation
topics: [outdoors]
who_it_is_for: A county park with historic log cabins.
hours: Open every day, 8 a.m. until dark.
what_to_do: "It has pavilions to rent, pool access, log cabins, a dining hall and an assembly hall. Book through the county parks office. The cabins are not rented outside of scheduled camp programs. For a cabin, the county points you to Chestnut Ridge Park."
get_in: walk-in

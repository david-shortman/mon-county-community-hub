title: Get a marriage license in Monongalia County
slug: mon-county-marriage-license
org: monongalia-county-clerk
topics: [records, family]
who_it_is_for: Couples getting married in West Virginia. A license from this office is only for ceremonies in West Virginia. Both people must come in person and be at least 18. State law allows 16 and 17 year olds only with both parents or legal guardians there to sign, and other rules apply. No licenses are issued to anyone under 16.
hours: Appointments Monday to Friday, 9 a.m. to 3:30 p.m., except holidays.
get_in: appointment
what_to_do: Book an appointment online, fill out and print the application ahead of time, and come to the County Clerk's Office in Room 123 of the Courthouse, 243 High St.
steps:
  - Book an appointment on the County Clerk's page.
  - Fill out and print the application.
  - Both of you come in with your ID and payment. Pay at the start.
  - Use the license within 60 days, or it is void. A new one means a new application and fee.
  - After the ceremony, the person who married you signs the license and it must be returned to the County Clerk's Office. Then you can get a marriage certificate from the office.
contact:
  phone: "304-291-7230"
  url: https://www.monongaliacountyclerk.com/index.php/marriage-license
  url_label: Rules and appointments
  place: 243 High St, Morgantown, WV
cost: "$57, or $37 with signed proof that you finished pre-marital counseling. Cash, money order (payable to the Monongalia County Clerk), or credit or debit card. Cards have a 2.4% fee, at least $1. No checks."
what_to_bring:
  - "ID with your full name and proof of age: a current U.S. driver's license, state ID, U.S. Armed Forces ID, or a certified copy of a U.S. birth certificate. A birth certificate from another country must be translated and authenticated by that country's consulate or State Department."
  - Your Social Security number, or a current U.S. passport, or a current passport from another country with a current visa or stamp
  - The completed application
  - The full names of both your parents, including your mother's maiden name, and where they were born (city, state, country)
  - If you were married before, the exact date of the death, divorce or annulment. For a divorce, it is the date the judge signed the decree.
sources:

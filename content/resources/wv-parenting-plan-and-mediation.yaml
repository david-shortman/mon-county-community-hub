title: Parenting plans and family court mediation
slug: wv-parenting-plan-and-mediation
org: wv-supreme-court-of-appeals
topics: [legal, family]
who_it_is_for: "Parents in a family court case with children under 18. The court's instructions say Family Court requires a parenting plan in every case with minor children."
what_to_do: "Parents who agree can file one joint parenting plan. If you do not agree, each parent can file their own proposed plan with a worksheet. The forms and instructions (SCA-FC-120 and SCA-FC-121) are on the courts' forms page under Parenting Plan. File your plan before your first hearing."
notes:
  - "If parents cannot agree, the courts say the court sends you to a pre-mediation screener, and then to mediation if a mediator may be able to help. The parents make the decisions in mediation, not the mediator."
  - "The courts say mediation may not be required when there is a history of domestic violence, child abuse or neglect, substance abuse, mental illness, or a big power imbalance. Every family court office does a screening first."
contact:
  url: https://www.courtswv.gov/lower-courts/family-courts/mediation
  url_label: Family court mediation
cost: "The forms are free. The courts say parents pay for mediation by the hour, based on their combined yearly income, and many mediators volunteer for parents who cannot pay."

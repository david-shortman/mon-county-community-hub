title: Help paying for conservation work on a farm (AgEP)
slug: mcd-agep-conservation-help
org: monongahela-conservation-district
topics: [growing]
who_it_is_for: Farmers who want to put in conservation practices. Examples on the state page include cover crops, fencing, lime, pollinator plantings and watering systems. Each district picks which practices it offers.
hours: The district office is open Monday to Friday, 8 a.m. to 4 p.m.
opening_hours:
  - days: [mon, tue, wed, thu, fri]
    opens: "08:00"
    closes: "16:00"
what_to_do: Call the Monongahela Conservation District and ask about the Agricultural Enhancement Program, which practices it covers this year, and how to sign up.
contact:
  phone: "304-296-0081"
  url: https://www.wvca.us/agep/
  url_label: About the program
  place: "201 Scott Avenue, Morgantown, WV 26508"
cost: The program gives technical and financial help. The state page does not list payment amounts.

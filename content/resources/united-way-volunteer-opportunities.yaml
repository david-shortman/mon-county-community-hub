who_it_is_for: Individuals, businesses, students and groups. United Way says community members find its opportunities through GivePulse, a volunteer sign-up website, and WVU staff, faculty and students use iServe.
what_to_do: Open United Way's volunteer page and follow the GivePulse link to see what is open. United Way also lists the local programs it funds, which you can contact about volunteering.

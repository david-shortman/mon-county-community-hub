title: Ask the court for custody or child support without a divorce
slug: wv-custody-support-petition
org: wv-supreme-court-of-appeals
topics: [legal, family]
who_it_is_for: "Parents or caregivers who are not filing for divorce but want the Family Court to decide custody (who the child lives with) or to order another person to help support a child."
what_to_do: "The West Virginia courts post a free packet for this (instructions SCA-FC-260, petition SCA-FC-261). It has the petition, a child support application, a financial statement, an income withholding form, a case information statement and a certificate of service. The instructions say you must also take a parent education class. File it at the Circuit Clerk's office."
contact:
  url: https://www.courtswv.gov/sites/default/pubfilesmnt/2026-03/SCA-FC-260.pdf
  url_label: Instructions (PDF)
cost: "The forms are free. The filing fee is $200, the Monongalia Circuit Clerk's fee list and state law say. Each parent also pays a $25 parent education fee. You can ask to have fees waived if you cannot afford them."
notes:
  - "Questions about the parent education class: call the courts' office at 304-558-6831 or email Parent.Education@courtswv.gov."
if_you_want_help: [legal-aid-wv-guided-self-help-forms, legal-aid-wv-civil-legal-help, court-fee-waiver-wv]

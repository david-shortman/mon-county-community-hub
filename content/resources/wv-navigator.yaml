title: Free help signing up for health coverage from West Virginia Navigator
slug: wv-navigator
org: first-choice-services
topics: [health]
who_it_is_for: Anyone in West Virginia looking for coverage through the HealthCare.gov Marketplace, Medicaid or CHIP. For Mon County, federal records list help as virtual only, not in person.
what_to_do: Call 304-356-5834, or fill out the pre-screening form on the Navigator website, to set up a free, confidential, one-on-one appointment.
contact:
  phone: "304-356-5834"
  url: https://wvnavigator.com/
cost: free

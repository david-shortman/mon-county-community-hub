title: Caregiver support through the county senior center (Older Americans Act)
slug: senior-monongalians-caregiver-support
org: senior-monongalians
topics: [disability, family]
who_it_is_for: Family caregivers of people 60 and older. The WV Bureau of Senior Services says county aging providers (senior centers) offer Older Americans Act services, including caregiver support. Services vary by county. Senior Monongalians is the county aging provider for Monongalia County.
what_to_do: Call Senior Monongalians at 304-296-9812 and ask what caregiver support it offers. The state describes caregiver support as help getting information and assistance, support groups, and respite services for caregivers.
contact:
  phone: "304-296-9812"

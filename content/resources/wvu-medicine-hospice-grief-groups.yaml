title: Grief support groups from WVU Medicine Hospice (in Bridgeport)
slug: wvu-medicine-hospice-grief-groups
org: wvu-medicine
topics: [health]
who_it_is_for: Anyone who has lost a loved one, whether or not the person who died used hospice. One group is a general grief group. A second group is for widows and widowers.
what_to_do: Both groups meet in the WVU Medicine Hospice office at United Hospital Center in Bridgeport, Harrison County, not in Morgantown. Call WVU Medicine Hospice at 304-624-2424 and ask for the bereavement counselor to learn the meeting times and to sign up.

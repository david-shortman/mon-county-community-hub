title: Community compost and garden site in Westover
slug: mcswa-community-compost-demo-site
org: monongalia-county-solid-waste-authority
topics: [growing, recycling]
town: Westover
who_it_is_for: "Mon County residents who want to learn to compost or help with a flower and pollinator garden. The Solid Waste Authority runs a small demonstration site in a City of Westover park. Spots are limited, and Westover residents and businesses get the first chance."
what_to_do: Fill out the Solid Waste Authority's interest form to hear about the next information session.
steps:
  - Fill out the interest form on the Solid Waste Authority's composting page. It is not a promise to take part.
  - The authority emails people who sent the form when it holds an information session.
  - After the session, you decide whether to sign up.
notes:
  - To get compost or flowers from the site, you need to volunteer hours with the composting or the gardening.
contact:

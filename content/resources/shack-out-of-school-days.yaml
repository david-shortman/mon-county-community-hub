title: Care on school days off at The Shack (OSE Days)
slug: shack-out-of-school-days
org: the-shack-neighborhood-house
topics: [family, money]
who_it_is_for: School-age children who need care on some days with no school.
what_to_do: The Shack holds Outside of School Environment (OSE) days from 7:30 a.m. to 5 p.m. at 537 Blue Horizon Drive, with STEM, reading and physical activities. You must register ahead. Call (304) 599-5466 to ask which days and how to sign up.
contact:
  phone: "304-599-5466"
  url: https://the-shack.org/child-care/
  place: 537 Blue Horizon Drive, Morgantown, WV
cost: "$25 to $50 per child per day, on a sliding scale by income."
sources:

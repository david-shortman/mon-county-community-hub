title: Veterans and Heroes to Agriculture
slug: wvda-veterans-and-heroes-to-agriculture
org: wv-department-of-agriculture
topics: [growing, veterans]
who_it_is_for: Veterans, active-duty military, firefighters, law enforcement, emergency services workers and first responders who farm or want to start. Some parts also include spouses and family.
what_to_do: Fill out the free program application and email it to vetstoag@wvda.us, or mail it to the address on the page.
contact:
  phone: "304-558-2210"
  email: vetstoag@wvda.us
  url: https://agriculture.wv.gov/ag-business/veterans-and-heroes-to-agriculture/
  url_label: Program page
cost: Free to join.
what_happens: "The state says members can get: up to $600 each fiscal year (ending June 30) back for pre-approved farm classes, workshops, conferences and certifications; a yearly business pitch competition; and use of the WV Grown and Homegrown By Heroes label. For the scholarship, you must apply before you sign up for the class."
sources:

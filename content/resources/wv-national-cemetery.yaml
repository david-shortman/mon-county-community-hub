title: West Virginia National Cemetery, Grafton
slug: wv-national-cemetery
org: us-department-of-veterans-affairs
topics: [veterans]
hours: Grounds open every day, dawn to dusk. Office open Monday to Friday, 8 a.m. to 4:30 p.m.
who_it_is_for: Eligible veterans and their families. It is a VA national cemetery about five miles west of Grafton, in Taylor County, with space for casket and cremation burials.
what_to_do: To plan a burial, the family or funeral home sends the veteran's discharge papers to VA's National Cemetery Scheduling Office (fax 1-866-900-6417), then calls 1-800-535-1117. For other questions, call the cemetery at 304-265-2044.

title: Free civil legal help from Legal Aid of West Virginia
slug: legal-aid-wv-civil-legal-help
org: legal-aid-of-west-virginia
topics: [legal, family]
who_it_is_for: West Virginians with low income, and victims of domestic violence, who have a civil (not criminal) legal problem. Legal Aid says it typically takes cases about protective orders, government benefits, divorce and custody in some situations, bankruptcy and credit problems, expungement and driver's license problems, unemployment, and veterans issues. It does not handle criminal cases, accidents or personal injury. If you are not sure you qualify, Legal Aid says to apply anyway.
what_to_do: Apply by phone at 866-255-4370, or online from the Apply for Help page. Phone applications are taken Monday, Wednesday, Thursday and Friday from 8:30 a.m. to 3:30 p.m., and Tuesday from 8:30 a.m. to 12:30 p.m. If you have a court hearing or deadline in the next 10 days, call instead of applying online. Phone interpreters are available for people who speak little or no English. If you are deaf or hard of hearing, use 7-1-1 WV Relay. Legal Aid's Morgantown office (165 Scott Avenue, Suite 209) serves Monongalia, Marion and Preston counties, but Legal Aid says in most cases you cannot start by walking into an office.
contact:
  phone: "866-255-4370"
  url: https://legalaidwv.org/get-help/apply-for-help/
  url_label: Apply for help
cost: Free. Legal Aid says some court filing fees may still be required.
what_happens: If you apply online, Legal Aid says it will call you 2 to 3 times. If it cannot reach you, it sends a letter or email about how to call back. Have a phone number where staff can reach you.

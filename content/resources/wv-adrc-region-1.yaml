title: Free help finding long-term care and caregiver services (Aging and Disability Resource Center)
slug: wv-adrc-region-1
org: wv-aging-and-disability-resource-center
topics: [disability, health]
who_it_is_for: Older adults, people with disabilities, and their families and caregivers. The ADRC says it helps "whether you are family, a friend, neighbor, a provider, or the one seeking support." The Region I office in White Hall serves Monongalia County.
what_to_do: Call the Region I office at 304-363-1595, or the statewide line at 866-981-2372. A Community Resource Specialist listens to your situation and helps you find programs and apply for them.
what_happens: Staff help you understand the eligibility process and the programs available. They can help with in-home personal care, transportation, home-delivered meals, home changes for access, adult day care, respite care, nursing home care and Medicare counseling.

title: Try, borrow or get a free used device (WVATS)
slug: wvats-device-loans
org: wvu-center-for-excellence-in-disabilities
topics: [disability]
who_it_is_for: Any West Virginia resident, of any age. You do not need proof of a disability. WVATS helps you choose assistive technology before you buy it.
what_to_do: Call WVATS at 800-841-8436 or email wvats@hsc.wvu.edu. You can try a device at the Morgantown office, borrow one for 30 days to use at home, or ask for a donated device that you keep. The website has an online loan library.
contact:
  phone: "800-841-8436"
  email: wvats@hsc.wvu.edu
  url: https://wvats.cedwvu.org/wvats-services/
  url_label: WVATS services
cost: free
sources:

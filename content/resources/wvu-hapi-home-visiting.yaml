title: Home visits and support while pregnant or with a new baby (Healthy Start/HAPI)
slug: wvu-hapi-home-visiting
org: wvu-healthy-start-hapi
topics: [family, health]
who_it_is_for: "People who are expecting or just had a baby, and fathers or partners caring for a young baby, in 11 counties including Monongalia. The program lists who can take part as: an active Right From The Start client; Medicaid, Maternity Services or CHIP coverage; and living in a county it serves. The program decides who is eligible."
what_to_do: Call 1-866-738-HAPI (1-866-738-4274) to ask if you can take part. Social workers and nurses offer home or video visits, check-ins and phone support from pregnancy through after the baby comes. The program also has a fathers' program, group classes on things like breastfeeding and parenting, and screenings for postpartum depression, smoking, substance use, oral health and domestic violence.
contact:

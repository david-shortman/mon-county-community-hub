title: File a civil case for $20,000 or less in Magistrate Court
slug: mon-magistrate-court-civil-claims
org: monongalia-county-magistrate-court
topics: [legal, government]
who_it_is_for: People who want to ask the court for money or property worth $20,000 or less, not counting interest and court costs. Legal Aid of West Virginia gives examples like a security deposit that was not returned, a neighbor who broke a window and won't fix it, or a store that sold a bad product and won't replace it. State law says some cases cannot be filed in Magistrate Court, such as cases about who owns land, or slander and libel.
what_to_do: Go to the Magistrate Clerk's office in the county where the problem happened and ask for a Civil Complaint form. The form is also on the West Virginia courts website (form SCA-M207). In Monongalia County, the Magistrate Clerk is at the Monongalia County Justice Center, 75 High Street, Suite 25, Morgantown. Call 304-291-7296.
steps:
  - Get a Civil Complaint form from the Magistrate Clerk or the courts website.
  - Write your name and address, and the other side's exact name and street address. Legal Aid says a P.O. Box will not work, because the papers must be delivered.
  - In short sentences, say why you think they owe you, and what you want the court to do.
  - File it with the Magistrate Clerk. If you cannot afford the filing fee, ask the clerk for a fee waiver form.
  - Watch your mail. Legal Aid says if you have no hearing notice within six weeks, check with the Magistrate Clerk.
contact:
  phone: "304-291-7296"
  url: https://legalaidwv.org/legal-information/going-to-magistrate-court-how-to-file-your-own-civil-case/
  url_label: Legal Aid's step-by-step guide
  place: 75 High Street, Suite 25, Morgantown, WV 26505
cost: There is a court filing fee. Ask the Magistrate Clerk how much. You can ask to have the fee waived if you cannot afford it.
what_to_bring:
  - The other side's exact name and street address
  - Proof, such as photos, receipts, repair estimates, leases, contracts, texts and emails
what_happens: Legal Aid says the Sheriff's Office delivers your complaint to the other side, and they have time to answer. Then the court sets a trial date and mails both sides a notice. Witnesses must come to the hearing in person, because written statements from witnesses cannot be used.

title: "Coopers Rock State Forest"
slug: coopers-rock-state-forest
org: wv-state-parks
topics: [outdoors]
who_it_is_for: "A state forest less than 15 miles from Morgantown, with canyon overlooks, historic sites, about 50 miles of trails, sandstone cliffs for climbing and bouldering, and cross-country ski terrain."
hours: "9 a.m. to 5 p.m."
what_to_do: "Get the free trail map from the forest's page. Cabins and two campgrounds are open April to November, weather permitting. To fish at Messinger Lake you need a West Virginia fishing license. Licensed hunters may hunt in season in set areas, not near the recreation areas."

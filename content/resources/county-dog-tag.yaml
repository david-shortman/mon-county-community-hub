title: Get a county dog tag (dog license)
slug: county-dog-tag
org: monongalia-county-assessor
topics: [pets, government]
who_it_is_for: Anyone in Monongalia County who owns or keeps a dog 6 months old or older. State law says the county assessor collects a yearly dog tax and gives a tag for each dog. Trained guide and support dogs for people with disabilities do not pay the tax, but must still be registered.
hours: Monday to Friday, 8:30 a.m. to 4:30 p.m.
what_to_do: Buy your dog tag from the Monongalia County Assessor, at the office or online at assessor.org. The Assessor says to buy them with your personal property return, which is due October 1.
steps:
  - State law says to register a new dog, or a dog that turns 6 months old, with the assessor within 10 days.
  - Tags are good until June 30 each year.
  - The county leash law says your dog's county tag and rabies tag must be on its collar.
contact:
  phone: "304-291-7222"
  url: https://www.assessor.org/
  url_label: County Assessor
  place: 243 High Street, Room 335, Morgantown, WV 26505
cost: State law sets a $3 tax per dog. The county's leash law sheet says dogs in Morgantown, Westover, Star City and Granville pay $3 more. Call the Assessor to confirm the current amount.

title: Report an abandoned or falling down building outside city limits
slug: mon-county-dilapidated-property-complaint
org: monongalia-county-commission
topics: [government]
who_it_is_for: Anyone reporting an abandoned or run-down property in the county, outside any city or town. The county calls these areas unincorporated.
what_to_do: Fill out the county's online complaint form. The county's Abandoned and Dilapidated Property Enforcement Agency handles these complaints.

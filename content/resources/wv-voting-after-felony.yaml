title: Voting after a felony conviction
slug: wv-voting-after-felony
org: wv-secretary-of-state
topics: [voting, legal]
who_it_is_for: People in West Virginia with a felony conviction who want to vote again.
what_to_do: "The Secretary of State says a person convicted of a felony cannot vote until the whole sentence is done, including being \"off papers\" from any parole or probation. Then the right to vote comes back, but registration does not restart on its own. You must register again."
notes:
  - "\"Off papers\" means you no longer have any conditions from parole or probation, the Secretary of State says."
  - "A person in jail for a misdemeanor can ask for an absentee ballot by mail, or vote in person if they are able, the Secretary of State says."
  - To register online you need a West Virginia driver's license or ID card number. Without one, you can register by mail or in person.
contact:

title: WV Future Workforce Grant (short trainings)
slug: wv-future-workforce-grant
org: wv-higher-education-policy-commission
topics: [work]
who_it_is_for: West Virginia students with financial need who are in a certificate, credential or skill program for a job that is in demand in West Virginia.
what_to_do: Fill out the FAFSA and the state's HEAPS Workforce application as soon as you can after July 1. The grant pays up to $2,000 for tuition, required tests and required supplies that other aid does not cover. Money is limited and goes first come, first served.
contact:
  phone: "877-987-7664"
  email: workforce@wvhepc.edu
  url: https://www.cfwv.com/financial-aid/workforce/
  url_label: About the grant
cost: free

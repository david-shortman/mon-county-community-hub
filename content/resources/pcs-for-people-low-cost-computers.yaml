title: Low-cost refurbished computers by mail (PCs for People)
slug: pcs-for-people-low-cost-computers
org: pcs-for-people
topics: [work]
who_it_is_for: "People with lower income. In its words, buyers \"must generally meet the 80% Area Median Income (AMI) guideline or participate in a qualifying assistance program.\" Programs it lists include SNAP, Medicaid, SSI, LIHEAP, Head Start, free or reduced-price school lunch, Section 8 and Pell Grants."
what_to_do: Order from its online store. Before the order is complete, you send a photo ID and proof that you qualify. It does not ask for proof of citizenship.
what_to_bring:
  - "A photo ID with your name, a photo and an expiration date, like a driver's license, state ID or passport"
  - "Proof you get an assistance program, or proof of your household income. It must show your full name and be dated in the last 12 months, or show current benefits. Handwritten papers are not accepted."
contact:
  phone: "877-450-8585"
  url: https://www.pcsforpeople.org/eligibility/
  url_label: See if you qualify
cost: "Low cost, not free. Prices are on its online store. In its words, all orders \"include shipping within the U.S. (excludes PO Boxes, AK, HI, and PR)\" and computers come with a one-year warranty."
notes:
  - It has no store in West Virginia, so orders come by mail to a street address, not a PO box.
sources:

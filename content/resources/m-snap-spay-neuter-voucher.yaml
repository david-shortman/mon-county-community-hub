title: Free spay and neuter vouchers (M-SNAP)
slug: m-snap-spay-neuter-voucher
org: m-snap
topics: [pets]
who_it_is_for: Monongalia County residents who honestly do not have the money to get their dog or cat fixed. M-SNAP says its help is not meant for people who chose to buy a dog or cat, or who adopted from a shelter or rescue covered by the WV Spay Neuter Act. It also helps people who care for feral cat colonies in the county.
what_to_do: "Call 304-985-0123 and leave your name, phone number and the best time to reach you in mailbox #1."
steps:
  - Call 304-985-0123 and leave one message in mailbox #1. The voicemail is open 24 hours a day.
  - Make sure your phone can take messages. After three missed tries, M-SNAP closes your call and you must call again.
  - "Feral cat colony caregivers: leave a message in mailbox #2. You will need to sign up for the TNR program."
  - "A visibly pregnant dog or cat: leave a message in mailbox #5."
  - M-SNAP does not give vouchers by email or Facebook.
  - The voucher is used at one of the local vet clinics on M-SNAP's Veterinary Partners page.
contact:
  phone: "304-985-0123"
  url: https://www.m-snap.org/fix/
  url_label: Fix your pet
cost: M-SNAP says it fixes at-risk pets at no cost to the owner. When it runs out of money, it keeps a wait list.

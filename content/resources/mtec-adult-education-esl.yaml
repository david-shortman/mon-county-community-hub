title: Adult education and English classes at MTEC
slug: mtec-adult-education-esl
org: mtec
topics: [work]
who_it_is_for: Adults who want to finish a high school equivalency diploma, build reading and math skills, or learn English. It is the county's site for the state's adult education program.
what_to_do: MTEC is at 1000 Mississippi Street, Morgantown. Call 304-291-9226, or start registration online from the state's class list. The state's adult education hotline is 800-642-2670.
contact:
  phone: "304-291-9226"
  url: https://wvde.us/academics/adult-education/wvadulted-class-locations
  url_label: Class locations
cost: "Free. The state says adult education services are available at no cost to adult learners. Ask whether there is a fee for the GED exam itself."

title: Lower the lead in your tap water
slug: epa-reduce-lead-in-tap-water
org: us-environmental-protection-agency
topics: [home, safety]
who_it_is_for: Anyone worried about lead in their drinking water. EPA says the most common sources are lead pipes, faucets and fixtures, and lead pipes are more likely in homes built before 1986.
what_to_do: Use cold water for drinking and cooking, run your water before you drink it, and ask your water utility whether the pipe to your home is lead.
options:
  - Use only cold water for drinking, cooking and making baby formula. Boiling water does not remove lead.
  - Run your water before drinking. Running the tap, a shower, laundry or dishes flushes your pipes. Ask your water utility how long to run it.
  - Use a filter certified to remove lead, and change the cartridge on time. Do not run hot water through it.
  - Clean the screen on your faucet (the aerator) often.
  - Ask your water utility if the pipe from the water main to your home (the service line) is lead, and ask about having your water tested.

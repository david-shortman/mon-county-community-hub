title: Free Northstar computer skills lessons through the library
slug: mpls-northstar-digital-literacy
org: morgantown-public-library-system
topics: [work, community]
who_it_is_for: Library patrons who want to build computer skills and are not sure where to start. The library says Northstar is free to library patrons, from its partner Generation WV.
what_to_do: Northstar is a set of lessons you do at your own pace, on basic computer skills, common software and everyday life online. At a Northstar info session, the library's Digital Navigator and Generation WV answer questions and help you sign up. Look for "Northstar" on the library's events calendar.
notes:
  - You can take a test with a proctor (someone who watches the test) to earn a certificate for your new skills. The library says the tests are optional.

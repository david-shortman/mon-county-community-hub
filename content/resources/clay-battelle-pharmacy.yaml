title: Clay-Battelle Pharmacy in Blacksville
slug: clay-battelle-pharmacy
org: clay-battelle-health-services-association
topics: [health]
who_it_is_for: Anyone with a prescription. The pharmacy takes prescriptions from any medical provider, and has discounts for uninsured patients of the Clay-Battelle Community Health Center.
what_to_do: The pharmacy is next to the Clay-Battelle Community Health Center in Blacksville, in western Mon County. Call 304-432-8211 to ask about a prescription or the discount for uninsured patients.
hours: Monday to Friday, 9:30 a.m. to 6 p.m. Saturday, 9 a.m. to 1 p.m.
contact:
  phone: "304-432-8211"
  url: https://cbhealthwv.org/services/pharmacy/

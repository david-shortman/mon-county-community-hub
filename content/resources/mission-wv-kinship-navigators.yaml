title: Kinship Navigators for relatives raising a family member's child
slug: mission-wv-kinship-navigators
org: mission-west-virginia
topics: [family]
who_it_is_for: Relatives, such as grandparents, aunts and uncles, when a child has been placed in their care. Navigators work with families during the first 90 days of placement. Legal Aid of WV describes this help for kinship caregivers of a child placed by CPS due to an abuse and neglect case.
what_to_do: Call Mission West Virginia at 304-562-0723 or email mwv@missionwv.org. The program serves all of West Virginia, including Morgantown.
what_happens: A navigator does a needs assessment, connects the family to community resources, and explains the CPS, court and home study process. Navigators can also help families get supplies for their homes.

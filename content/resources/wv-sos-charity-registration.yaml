title: Register with the state before asking the public for donations
slug: wv-sos-charity-registration
org: wv-secretary-of-state
topics: [community]
who_it_is_for: Groups that ask the public for charitable donations in West Virginia. The state says they must register unless they are exempt, which means the law leaves them out. The list of exemptions comes from WV Code §29-19-6 and is on the Secretary of State's site.
what_to_do: Register with the Secretary of State's Charities Division. Registration lasts one year. You can renew it each year. If you think your group is exempt, the state says you can write to the Secretary of State about your group and how it raises money.
contact:
  url: https://sos.wv.gov/charities-frequently-asked-questions
  url_label: Charities questions and answers
cost: "$15 a year if your group collects under $1 million. $50 a year if it collects over $1 million. $50 a year for a main group that registers its local branches together. These fees are on top of any annual report fee."
sources:

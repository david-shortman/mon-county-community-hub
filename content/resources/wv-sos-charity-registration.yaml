title: Register with the state before asking the public for donations
slug: wv-sos-charity-registration
org: wv-secretary-of-state
topics: [community]
who_it_is_for: Groups that ask the public for charitable donations in West Virginia. The state says they must register unless they are exempt. Exemptions are set by WV Code §29-19-6 and listed on the Secretary of State's site.
what_to_do: Register with the Secretary of State's Charities Division. Registration lasts one year and can be renewed each year. If you think your group is exempt, the state says you can write to the Secretary of State about your group and its fundraising.
contact:
  url: https://sos.wv.gov/charities-frequently-asked-questions
  url_label: Charities questions and answers
cost: "$15 a year for a single organization collecting under $1 million. $50 a year for one collecting over $1 million, or for a parent organization registering its affiliates together. These are on top of any annual report fee."
sources:

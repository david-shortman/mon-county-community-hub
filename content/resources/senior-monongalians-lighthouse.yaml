title: In-home help for people 60 and older not on Medicaid (Lighthouse)
slug: senior-monongalians-lighthouse
org: senior-monongalians
topics: [disability, health]
who_it_is_for: People 60 and older whose income or savings are too high for Medicaid. An aide helps with personal care, getting around, meals and housekeeping, up to 60 hours a month, based on need and whether aides are available. A Senior Monongalians nurse decides who can get it.
what_to_do: Call the Senior Monongalians nurse's office at 304-296-2503.
contact:
  phone: "304-296-2503"
  url: https://www.seniormons.org/blank-1
  url_label: In-home help
cost: Mostly paid by state grants. You pay an hourly co-pay based on household income, billed monthly.
sources:

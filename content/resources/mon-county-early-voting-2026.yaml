title: Early voting in Mon County, 2026 general election
slug: mon-county-early-voting-2026
org: monongalia-county-clerk
topics: [voting]
who_it_is_for: Registered voters in Monongalia County who want to vote in person before Election Day.
hours: Monday to Saturday, 9 a.m. to 5 p.m., from October 21 to October 31, 2026. Closed Sundays.
what_to_do: Vote from 9 a.m. to 5 p.m. (Monday to Saturday) at either place. Mountaineer Mall, 5000 Greenbag Road, Morgantown (use the parking lot in front of Mylan and Anybody Fitness). Or Mason Dixon Park, 79 Buckeye Road, Core (in the red barn). Bring a valid photo ID. The last day is Saturday, October 31.

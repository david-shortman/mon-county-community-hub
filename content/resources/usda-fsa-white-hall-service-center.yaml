who_it_is_for: Farmers in Monongalia County. USDA's locator lists the Marion County Farm Service Agency, at the White Hall Service Center, as the FSA office for Monongalia County.
what_to_do: Call the White Hall Service Center to ask about farm loans and farm programs. USDA's locator page also links an FSA office locator for booking an appointment.

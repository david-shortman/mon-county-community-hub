title: Low cost clinic at the Monongalia County Health Department
slug: monchd-clinical-services
org: monongalia-county-health-department
topics: [health]
who_it_is_for: People of all ages. The clinic gives shots, reproductive health care, STI and HIV testing, breast and cervical cancer screening, physical exams and more. It is not a regular family doctor's office.
what_to_do: Call 304-598-5119 to ask about a service and its price. The health department says some services are free or low cost, others have sliding-fee pricing based on income, most insurance can be billed, and West Virginia Medicaid is accepted.
contact:
  phone: "304-598-5119"
  url: https://www.monchd.org/departments-programs/clinical-services
cost: Some services free or low cost; sliding fee based on income for others. Takes WV Medicaid and most insurance.

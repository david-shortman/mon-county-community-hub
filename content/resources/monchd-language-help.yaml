title: Free interpreters at the Monongalia County Health Department
slug: monchd-language-help
org: monongalia-county-health-department
topics: [health]
who_it_is_for: Patients and clients who speak a language other than English, or who have trouble hearing or speaking.
what_to_do: Tell a staff member that you need an interpreter. You can also set it up ahead of time. The Health Department says it offers qualified interpreters, sign language, readers and translators. Its main number is 304-598-5100.
contact:
  phone: "304-598-5100"
  url: https://www.monchd.org/accessibility
cost: free
sources:

who_it_is_for: "People affected by someone else's drinking. Alateen is for teens. Al-Anon says if you are concerned about someone's drinking, you may attend any Al-Anon meeting."
what_to_do: "Use Al-Anon's meeting finder to find a face-to-face, phone or online meeting. At your first meeting you can talk, ask questions, or just listen."

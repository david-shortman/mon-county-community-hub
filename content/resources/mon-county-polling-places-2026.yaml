who_it_is_for: Registered voters in Monongalia County voting on Tuesday, November 3, 2026.
hours: Tuesday, November 3, 2026, 6:30 a.m. to 7:30 p.m.
what_to_do: The County Clerk's election page lists precincts with their polling places and sample ballots. Precinct 30 has moved from the Marilla Recreation Center to Mountainview Elementary School, 661 Green Bag Road. Not sure of your precinct? Look yourself up on the state's polling place search, or use the county's precinct map.

title: Mason-Dixon Historical Park
slug: mason-dixon-park
org: monongalia-county-parks-and-recreation
topics: [outdoors]
who_it_is_for: A 295 acre county park near Core, with meadows, woods and a stream valley.
what_to_do: "Walk more than six miles of trails, including the Fairy Door Trail. See the Mason-Dixon survey marker on Brown's Hill. The park has picnic areas, pavilions and halls to rent, sports fields and an overnight cabin."

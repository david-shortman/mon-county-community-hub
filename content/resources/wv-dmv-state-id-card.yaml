title: Get a West Virginia ID card or REAL ID
slug: wv-dmv-state-id-card
org: wv-dmv
topics: [records, moving]
who_it_is_for: "West Virginia residents who need a state photo ID card, or want to switch to a REAL ID. There are two kinds of card. A REAL ID has a gold star. The DMV says a card marked \"Not for Federal Identification\" can no longer be used to board a plane or enter some federal buildings since May 7, 2025."
what_to_do: Apply at a DMV regional office. You leave with a temporary card that is good for 60 days, and your card comes in the mail. If you already have a WV license or ID that is not a REAL ID, you can upload your documents ahead of time with REAL ID Headstart, then book an appointment. The DMV says this can cut your time in the office by up to half.
contact:
  phone: "1-800-642-9066"
  url: https://dmv.wv.gov/driver-services/drivers/drivers-licenses-and-id-cards
  url_label: ID card rules
cost: "State law says an ID card is free if you are 65 or older, legally blind, or need it as ID to vote. A REAL ID costs $10 more than the regular card. For the regular fee, call the DMV."
what_to_bring:
  - "If this is your first card, or your card has been expired more than 3 years: one proof of identity, one proof of Social Security number, two proofs of WV residency with your name and street address, and proof of any legal name change"
  - "Proof of identity can be a U.S. birth certificate (original or certified copy, not a hospital certificate), a valid U.S. passport or passport card, or certain immigration documents"
  - "Proof of Social Security number can be your Social Security card, an original W-2 or pay stub with your full number, or a 1099 form"
  - "Proof of WV residency can be things like a WV utility bill no more than 60 days old, a lease, a bank statement, or a WV vehicle registration. No P.O. boxes, and no more than one from the same company"
  - "Proof of a name change can be a certified marriage certificate (for each marriage), a court order, or a certified divorce decree. Call 1-800-642-9066 to ask which ones you need"
if_you_want_help: [wv-dmv-morgantown-office]

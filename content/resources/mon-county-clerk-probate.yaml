title: Record a will or settle an estate (probate) at the County Clerk
slug: mon-county-clerk-probate
org: monongalia-county-clerk
topics: [records, legal]
who_it_is_for: Families of someone who died while living in Monongalia County. Probate is done in the county where the person lived. The County Clerk's Probate Office handles wills, small estates and full probate.
hours: Office open Monday to Friday, 8:30 a.m. to 4:30 p.m. Probate appointments Monday to Friday, 9 a.m. to 3:30 p.m., and can take up to an hour.
get_in: appointment
what_to_do: Start on the Probate Office page and choose "the decedent left a will" or "did not leave a will." Forms can be sent by certified or overnight mail, dropped off at the front desk, or brought to an appointment. Book online or call (304) 291-7230 x7270.
steps:
  - If there is a will, bring or mail the original to the Courthouse to be recorded. The Clerk's page says West Virginia law says to record it within 30 days of death.
  - If the person's personal property (bank accounts, vehicles, household goods) was under $50,000, a Small Estate Affidavit may be an option. Real estate or oil and gas interests in the person's name only need full probate.
  - "Otherwise, open full probate. It has three parts: opening the estate and getting Letters of Administration, the appraisement and notice to creditors, and the final settlement."
  - Probate takes at least four months, and can take much longer.
what_to_bring:
  - The original death certificate or a copy of the temporary death record from the funeral home
  - The original will, if there is one
  - The filled-out, notarized forms from the Clerk's website
contact:
  phone: "304-291-7230"
  url: https://www.monongaliacountyclerk.com/index.php/fiduciary-probate
  url_label: Probate Office
  place: 243 High St, Courthouse Room 123, Morgantown, WV 26505
cost: "Fees the Clerk lists include $12 to record a will of up to 4 pages ($1 per extra page), $12 for a Small Estate Affidavit of up to 5 pages, and, to open probate, $12 for the Application of Fiduciaries and $20 for the Notice of Administration. Extra Letters of Administration are $2.50 each. The Clerk takes cash, check, money order or credit card ($2 card fee)."

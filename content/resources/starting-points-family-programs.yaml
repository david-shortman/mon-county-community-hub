title: Free programs for parents and young children at Starting Points
slug: starting-points-family-programs
org: starting-points-family-support-center
topics: [family, food]
who_it_is_for: Families with young children. The playgroup meets twice a week for children under 3, and a parent must come. Happy School is a Pre-K style class for children 3 to 5, with a group for their parents. A drop-off program on Fridays, 10 a.m. to 1 p.m., gives parents a break.
what_to_do: Call 304-599-5466 or email SPfsc@the-shack.org. Starting Points is at 537 Blue Horizon Drive, Pursglove, open Monday to Friday, 9 a.m. to 5 p.m. The baby pantry is open Wednesdays, 9 a.m. to noon. The food pantry is by appointment only.

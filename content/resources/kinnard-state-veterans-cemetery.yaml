title: Donel C. Kinnard Memorial State Veterans Cemetery, Dunbar
slug: kinnard-state-veterans-cemetery
org: wv-department-of-veterans-assistance
topics: [veterans]
who_it_is_for: Veterans who died on active duty or were discharged under conditions other than dishonorable, and their spouses. Some children may also be eligible. It is West Virginia's only state veterans cemetery, near Charleston.
what_to_do: Call the cemetery at 304-746-0026. It is at 130 Academy Drive, Dunbar.
contact:
  phone: "304-746-0026"
  url: https://veterans.wv.gov/facilities/donel-c-kinnard-memorial-state-veteran-cemetery
  url_label: Cemetery page
  place: 130 Academy Drive, Dunbar, WV
cost: No cost for an eligible veteran, including the grave or niche, the headstone and perpetual care. A fee of $780 for a spouse or other eligible family member.

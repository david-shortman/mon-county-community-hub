title: Monongalia County Day Report Center
slug: mon-day-report-center
org: monongalia-county-commission
topics: [legal, health]
who_it_is_for: "Adults ordered to the program by Magistrate, Circuit or Family Court, before trial or after sentencing, as an alternative to jail. It is not a walk-in program."
hours: Monday to Thursday, 8 a.m. to 5:30 p.m. Friday, 8 a.m. to 4:30 p.m. Closed daily from noon to 1 p.m.
what_to_do: "The Day Report Center is the county's community corrections program. It says it offers supervision plus substance use treatment, peer recovery, counseling, anger management, groups, and drug and alcohol education in its own office. It is in the Justice Center, the same building as the probation office and home confinement."

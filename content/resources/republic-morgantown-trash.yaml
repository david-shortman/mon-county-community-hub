who_it_is_for: People who live inside Morgantown city limits. Republic Services picks up trash and recycling there.
what_to_do: To see your pickup day, open Republic's Morgantown page and use the "View my service schedule" button. It takes you to Republic's national site, where you enter your address to see your pickup and holiday schedule. For a missed pickup or a question about service, call 304-366-8900, Monday to Friday 7 a.m. to 5 p.m. or Saturday 8 a.m. to 1 p.m., or email MorgantownWVMuni@republicservices.com.

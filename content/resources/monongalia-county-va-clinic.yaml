title: Monongalia County VA Clinic
slug: monongalia-county-va-clinic
org: us-department-of-veterans-affairs
topics: [veterans, health]
who_it_is_for: Veterans in VA health care. The clinic offers primary care and specialty care, including mental health care, tests, X-rays and shots.
what_to_do: The clinic is at 40 Commerce Drive, Suite 101, Westover. Open Monday to Friday, 8 a.m. to 4:30 p.m. Call 304-292-7535. For care this clinic does not offer, VA Clarksburg's main medical center is at 1 Medical Center Drive, Clarksburg, 304-623-3461.

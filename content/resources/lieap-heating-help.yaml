title: LIEAP, help with winter heating bills
slug: lieap-heating-help
org: wv-department-of-human-services
topics: [money]
who_it_is_for: West Virginia households that need help paying for winter heat. It depends on household income, household size and whether you pay for your own heat.
what_to_do: Apply online at wvpath.wv.gov, at your local DoHS office, or by mail, once this season's applications open. Have a recent utility bill, or a fuel receipt if you heat with propane or oil. As of the checked date, 2026-27 dates were not announced, so call 800-642-8589 to ask.
contact:
  phone: "800-642-8589"
  url: https://www.wvpath.wv.gov

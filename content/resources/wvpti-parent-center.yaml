who_it_is_for: "Parents of children with disabilities, including children in special education. The national Parent Center Hub lists WVPTI as West Virginia's Parent Training and Information center. The state Department of Education also lists it for families."
what_to_do: "Call toll-free 800-281-1436 or 304-997-8316, or email wvpti@aol.com. The office in Weston is open Monday to Friday, 9 AM to 5 PM. Call before you visit."

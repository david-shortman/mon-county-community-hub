who_it_is_for: "Parents of children with disabilities, including children in special education. The national Parent Center Hub lists WVPTI as West Virginia's Parent Training and Information center, and the state Department of Education lists it in its resources for families."
what_to_do: "Call 304-472-5697 or toll-free 800-281-1436, or email wvpti@aol.com. Their website may not open for everyone, so calling is the surest way to reach them."

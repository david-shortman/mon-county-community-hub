title: Child Tax Credit
slug: irs-child-tax-credit
org: internal-revenue-service
topics: [taxes, money]
who_it_is_for: Parents and guardians who file a federal tax return. For the 2025 tax year, the IRS says the child generally must "Be under 17 at the end of the tax year." The full credit is for income "not more than $200,000 ($400,000 if filing a joint return)."
what_to_do: Claim it when you file your federal tax return. The free tax help sites on this page can help.
notes:
  - The IRS says "The Child Tax Credit is worth up to $2,200 per qualifying child."
  - If you owe little or no federal income tax, part of it can still come back as a refund, called the Additional Child Tax Credit, "up to $1,700 per qualifying child." The IRS says "You must have earned income of at least $2,500 to be eligible for the ACTC."

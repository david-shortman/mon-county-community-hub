title: Help with your rights as a person with a disability (Disability Rights of WV)
slug: drwv-intake
org: disability-rights-of-west-virginia
topics: [disability]
hours: Monday to Friday, 8:30 a.m. to 4:30 p.m.
who_it_is_for: People with mental health, developmental, intellectual or physical disabilities, or a brain injury, when the problem is about their rights as a person with a disability. Anyone who calls gets information and referrals. Not every request gets an advocate or lawyer. It does not take divorce, custody, child support, personal injury, wills, property, Social Security denials or criminal cases.
what_to_do: Call 304-346-0847 or 800-950-5250, or email contact@drofwv.org. The person with the disability, or their parent or legal guardian, should make the call. Intake answers within three business days, sooner for urgent problems like services ending within 7 days.
contact:
  phone: "800-950-5250"
  email: contact@drofwv.org
  url: https://www.drofwv.org/intake-process
  url_label: How to ask for help
cost: free
what_happens: An intake specialist calls you back. They will try to reach you three times, by phone if they can.

title: Sign up as an organ, eye and tissue donor
slug: wv-organ-donor-registry
org: wv-dmv
topics: [records]
who_it_is_for: Anyone 18 or older, the Secretary of State says. The DMV offers everyone getting or renewing a West Virginia driver's license or ID card the chance to sign up. You can also sign up when you register to vote or buy a hunting or fishing license, or online at any time.
what_to_do: Say yes on your license or ID card application at the DMV, on your voter registration (online or on the paper form), or on your hunting or fishing license. Or sign up, change or remove your choice online through Donate Life, the site the DMV links to. The national registry form says signing up is a legal gift, and you can remove it or add details at any time.

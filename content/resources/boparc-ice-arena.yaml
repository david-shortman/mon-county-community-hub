  place: 1001 Mississippi Street, Morgantown, WV
cost: "As the page shows today: ages 3 and under free, youth (17 and under) $6, adults $7, seniors (55 and over) $6, skate rental $3. The Wednesday and Friday noon sessions are $7 with skates included. Everyone age 4 and over pays admission to go in, even if they are not skating."

title: Granville business license and B&O tax
slug: granville-business-license
org: town-of-granville
topics: [work]
who_it_is_for: Any business providing goods or services in the Town of Granville.
what_to_do: The town says the first step is getting a town business license (or a contractor license). Download the application from the town's Business page. Granville also charges a business and occupation (B&O) tax on gross receipts. For tax rates and questions, call the finance office.
contact:

title: Special education at Monongalia County Schools
slug: mcs-special-education
org: monongalia-county-schools
topics: [disability, family]
who_it_is_for: Parents and guardians of Monongalia County students who have, or may have, a disability and need special education.
what_to_do: Call the district's Special Education Department at 304-291-9210, extension 1512. Its office is at 1715 Earl L Core Road, Morgantown. The department's site has a Parents/Guardians section and a Special Education Handbook.

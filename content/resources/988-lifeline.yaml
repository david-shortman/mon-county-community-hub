title: Call or text 988 in a mental health or emotional crisis
slug: 988-lifeline
org: 988-suicide-and-crisis-lifeline
topics: [health]
who_it_is_for: Anyone having a hard time, including thoughts of suicide, emotional distress, a mental health crisis, or worries about alcohol or drug use. You can also call about someone else.
what_to_do: Call or text 988, or chat at chat.988lifeline.org. It is free, confidential, and open 24 hours a day, every day. If someone is in danger right now, call 911.
contact:
  phone: "988"
  url: https://988lifeline.org/
cost: free
sources:

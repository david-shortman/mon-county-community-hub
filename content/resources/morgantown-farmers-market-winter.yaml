title: Morgantown Farmers Market, indoor winter market
slug: morgantown-farmers-market-winter
org: morgantown-farmers-market-growers-association
topics: [growing, food]
who_it_is_for: Anyone who wants to buy local food in the colder months. The market says winter vendors bring storage vegetables, meats, eggs, baked goods, canned items and more.
hours: Every other Saturday, 10 a.m. to noon, from November 21, 2026 into April 2027.
what_to_do: Check the market's calendar for the exact Saturdays, then go to the Mon County Center at Mylan Park.
contact:
  url: https://www.morgantownfarmersmarket.org/markets.html
  url_label: Winter dates
  place: "Monongalia County Center, 270 Mylan Park Ln, Morgantown, WV 26501"
cost: Free to visit.
get_in: walk-in
what_happens: The market moves indoors to the Mon County Center. The same token system for cards and SNAP/EBT is described on the market's site.

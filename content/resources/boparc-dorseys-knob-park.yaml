title: Dorsey's Knob Park
slug: boparc-dorseys-knob-park
org: boparc
topics: [outdoors]
who_it_is_for: A city park with a view from the Sky Rock viewing platform.
what_to_do: "It has grass trails, a disc golf course, a glass mosaic mural, a nature playground, picnic areas, Dorsey's Knob Lodge and seasonal restrooms. A pavilion for about 100 people rents by the day. BOPARC does not rent pavilions the same day."
cost: The pavilion rents for $125 per day.

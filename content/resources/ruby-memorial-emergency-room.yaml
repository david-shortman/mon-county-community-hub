title: Emergency room at J.W. Ruby Memorial Hospital
slug: ruby-memorial-emergency-room
org: wvu-medicine-ruby-memorial
topics: [health]
who_it_is_for: Anyone with a serious illness or injury. WVU Medicine says to get emergency care or call 911 right away for severe chest pain, trouble breathing, bleeding that will not stop, sudden confusion, fainting, signs of a stroke like a drooping face or weakness, or severe, sudden pain.
hours: Open 24 hours
opening_hours: always
get_in: walk-in
what_to_do: Go to the emergency room at 1 Medical Center Drive, or call 911 if you cannot get there safely yourself. Children up to 18 go to the Children's Emergency Department at WVU Medicine Golisano Children's Hospital, on the same campus. Lots D and E are closest to the Children's Emergency Department.
notes:
  - Ruby is home to the Jon Michael Moore Trauma Center, the area's only Level 1 trauma center.
what_to_bring:
  - Photo ID
  - Your insurance card, and your Medicare or Medicaid card if you have one
  - A list of your medicines, with doses, and any vitamins or supplements
  - A list of your allergies
  - Phone numbers for your doctor and family

title: Grief counseling for families of service members and veterans
slug: morgantown-vet-center-bereavement
org: us-department-of-veterans-affairs
topics: [veterans, health]
who_it_is_for: "Families who have lost a service member or veteran. The Morgantown Vet Center page says its bereavement (grief) services are for families when the service member or veteran died while serving on active duty, was using Vet Center services at the time of death, or died by suicide. See the full rules at the link."
hours: Monday to Friday, 8 a.m. to 4:30 p.m. Some other hours change from time to time. Call to confirm.
what_to_do: Call the Morgantown Vet Center at 304-291-4303 or stop by during office hours. It is at 34 Commerce Drive, Suite 101, Morgantown. You do not need to be enrolled in VA health care. Staff can also connect you with VA burial and survivor benefits. After hours, the Vet Center call center answers 24/7 at 877-927-8387.
notes:
  - "VA's national Vet Center page also lists Reserve and National Guard members who die while on duty."
contact:
  phone: "304-291-4303"
  url: https://www.va.gov/morgantown-vet-center/
  place: 34 Commerce Drive, Suite 101, Morgantown, WV 26501
cost: free

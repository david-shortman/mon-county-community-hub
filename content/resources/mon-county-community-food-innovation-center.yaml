title: Shared commercial kitchen at the Mon County Center
slug: mon-county-community-food-innovation-center
org: monongalia-county-commission
topics: [growing, work]
who_it_is_for: People and groups who need a kitchen to make products or meals to sell or serve somewhere else. The county calls it a shared kitchen with most of the appliances and tools needed, and says it can run 24 hours a day.
what_to_do: Call the Mon County Center director's office to ask about rates or to schedule a tour.

title: Business Fundamentals class (WV SBDC)
slug: wv-sbdc-business-fundamentals
org: wv-small-business-development-center
topics: [work]
who_it_is_for: People who are thinking of starting a business, or who have had a business for one year or less.
what_to_do: The City of Morgantown says the WV SBDC offers Business Fundamentals classes regularly in Morgantown. Each class is a 3-hour seminar on how to apply for a business loan, writing a business plan, and choosing a legal structure. The SBDC also offers the class online and in other places around the state. Find dates and sign up on the WV SBDC training calendar.

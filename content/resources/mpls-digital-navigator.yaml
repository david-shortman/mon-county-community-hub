who_it_is_for: "Anyone. The library lists \"online forms and applications\" among the things you can ask about, along with phones and computers, email and online accounts, and online safety and scams."
what_to_do: "Stop by the first floor of the Morgantown Public Library during drop-in hours. The library holds them on set days, from 10 a.m. to 5 p.m. Check the library's events calendar for the next date."

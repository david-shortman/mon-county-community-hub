title: Lunch with others, or meals at home, for people 60 and older (Senior Monongalians)
slug: senior-monongalians-meals
org: senior-monongalians
topics: [food, disability]
who_it_is_for: People 60 and older. Lunch with others is served at the Mountaineer Mall senior center Monday to Friday, 11:30 a.m. to 12:30 p.m., and at a second site on Tuesdays. Home-delivered meals are for people 60 and older who cannot get to a meal site because of illness, disability or trouble getting around.
what_to_do: Call Senior Monongalians at 304-296-9812 to join a lunch or to ask about meals at home. For home-delivered meals, you will do a short assessment first.
contact:
  phone: "304-296-9812"
  url: https://www.seniormons.org/blank
  url_label: Meal options
  place: 5000 Greenbag Road, Suite A5, Morgantown, WV
cost: Lunch with others has no set fee. A donation is suggested. The page does not say what home-delivered meals cost.

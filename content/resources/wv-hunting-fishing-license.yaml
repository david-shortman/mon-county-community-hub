title: "Buy a West Virginia hunting or fishing license"
slug: wv-hunting-fishing-license
org: wv-division-of-natural-resources
topics: [outdoors]
who_it_is_for: "Anyone who wants to hunt or fish in West Virginia."
what_to_do: "Buy online at WVhunt.com. First time? Choose Enroll today! and fill in your residency, ID and contact details. Bought one before but forgot your login? Choose Look up your Account. Questions: call the DNR, Monday to Friday, 8:30 a.m. to 5 p.m."
contact:
  phone: "304-558-6200"
  url: https://wvdnr.gov/buy-a-license
  url_label: How to buy
cost: "2026 prices from the DNR's fishing rules summary: resident fishing license (Class B) $19, Conservation Stamp $5, trout stamp $10, five-day fishing license $8. Licenses are good for the calendar year, so you buy new ones each January."

title: Start water service with Clay Battelle Public Service District
slug: cbpsd-start-service
org: clay-battelle-psd
topics: [moving]
who_it_is_for: People moving into a home that gets water from Clay Battelle Public Service District (CBPSD). Its pages do not list the areas it serves, so ask your landlord or the seller, or call the office.
what_to_do: Call the office first to ask what the fees are. Then fill out a service application and bring it to the drive-thru window, or leave it in the 24-hour drop slot.
steps:
  - Call 304-292-4003 and ask how much the required fees are.
  - Print and fill out the service application. You need a new form for each new address.
  - Bring the form, the fees and a copy of your driver's license or ID card to the drive-thru window, Monday to Thursday, 8 a.m. to 2 p.m. Or put them in the 24-hour drop slot.
notes:
  - Renters may be asked for a copy of the lease.
  - Any past due amount in your name must be paid before new service starts.
hours: Office, Monday to Thursday, 8 a.m. to 2 p.m., and Friday, 8 a.m. to noon. Drive-thru only.
what_to_bring:
  - "The completed, signed service application"
  - "The required fees (call the office first to ask the amount)"
  - "A copy of your driver's license or ID card"
  - "If you rent, a copy of your lease, which may be required"
contact:
  phone: "304-292-4003"
  url: https://cbpsdwater.com/new-service-request
  url_label: New service request
  place: 28 Sable Lane, Core, WV 26541
cost: The fees are not posted. Call the office to ask before you go.

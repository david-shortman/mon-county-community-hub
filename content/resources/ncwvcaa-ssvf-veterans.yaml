title: Housing help for veteran families (SSVF)
slug: ncwvcaa-ssvf-veterans
org: ncwvcaa
topics: [veterans, housing]
who_it_is_for: Veteran households in Monongalia and eight other counties. North Central West Virginia Community Action lists three rules. "Head of Household or Spouse must be a Veteran." "Household income cannot exceed 50 % of the Area Median Income." And the household is in permanent housing, is homeless and about to move into permanent housing, or recently left permanent housing.
what_to_do: Call North Central West Virginia Community Action at 304-363-2170 and ask about Supportive Services for Veteran Families (SSVF). The program offers case management and help getting VA and other benefits, which its page says "may include" temporary financial assistance, housing counseling and legal services. The page does not say what the financial help pays for, so ask.
contact:
  phone: "304-363-2170"
  url: https://ncwvcaacorp.net/programs/vet-services/
cost: free

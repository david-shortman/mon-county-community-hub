title: Rabies shots for dogs and cats
slug: pet-rabies-shots
org: monongalia-county-health-department
topics: [pets, health]
who_it_is_for: Every dog and cat owner in West Virginia. State law requires rabies shots for dogs and cats.
what_to_do: "State law says dogs and cats must get a rabies shot by 6 months old, a booster one year later, and then one every 3 years. A vet or a low cost shot clinic can give the shot. For questions about rabies, call the Monongalia County Health Department's Rabies Control program at 304-598-5131."

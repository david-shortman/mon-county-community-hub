title: Children's Crisis and Referral Line, for kids and teens up to 21
slug: wv-childrens-crisis-line
org: first-choice-services
topics: [health, family]
who_it_is_for: Children and youth up to age 21 in West Virginia who are having a mental health or behavior crisis, and their families.
what_to_do: Call or text 1-844-HELP4WV (1-844-435-7498), or chat online, any hour. Staff can give crisis counseling, parenting support and local resources. A small mobile crisis team can help over the phone or come quickly to calm a crisis.
hours: 24 hours a day, every day
contact:
  phone: "1-844-435-7498"
  text: "1-844-435-7498"
  url: https://www.help4wv.com/ccrl
  url_label: Chat online

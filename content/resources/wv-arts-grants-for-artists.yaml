title: State arts grants for individual artists
slug: wv-arts-grants-for-artists
org: wv-department-of-arts-culture-and-history
topics: [community]
who_it_is_for: Individual artists in West Virginia. Two state grants are for artists, not groups. Creative Aging for Lifelong Learning (CALL) for Individual Artists gives up to $7,500. Living Traditions, Folk Arts Project Support for Individual Artists, gives up to $5,000. Both say "Not Currently Open."
what_to_do: "Check the grants page for when they open. You apply online through the state's grant website, called GOapply. First you must sign up with the state as a vendor, which means a business or person the state can pay. You also need a W-9 tax form on file and direct deposit set up with the state. The State Auditor's Office can answer questions about the payment setup."

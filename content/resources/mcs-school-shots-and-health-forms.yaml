title: Shots and health forms for Monongalia County Schools
slug: mcs-school-shots-and-health-forms
org: monongalia-county-schools
topics: [family, health]
who_it_is_for: Families with a child in Monongalia County public schools. Students entering 7th or 12th grade need certain shots. Students in Pre-K, kindergarten, 2nd, 7th and 12th grade need a health check form and a dental form each year.
what_to_do: Bring proof of your child's shots to the school before the first day. Students without the required 7th or 12th grade shots are sent home until the school gets proof, and those days count as unexcused absences. Get the health check form at your doctor's office. The dental form is on the schools' health forms page. Questions? Call your child's school or the district office at 304-291-9210.
contact:
  phone: "304-291-9210"
  url: https://www.boe.mono.k12.wv.us/o/mcs/page/health-forms
cost: Free to file. Shots and checkups may cost money; see the health department for free shots for children who qualify.

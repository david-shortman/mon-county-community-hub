title: Chestnut Ridge Park and Campground
slug: chestnut-ridge-park
org: monongalia-county-parks-and-recreation
topics: [outdoors]
who_it_is_for: A county park about 10 miles east of Morgantown, off I-68 at Exit 15 (Coopers Rock).
what_to_do: "Camp at more than 30 tent sites, 14 RV sites or seven cabins. Fish in two ponds (no license needed, catch and release only), swim at the pond beach, hike into the WVU Forest, or go snow tubing in winter. Do not use Darnell Hollow Road to get there. The park says it is not passable."
hours: "The park's FAQ says park hours are 8 a.m. to dusk, and office hours are 9 a.m. to 5 p.m. and change with the seasons. The main park page says daytime activities are open dawn to dusk, weather permitting. Tent areas are closed November through March."
contact:
  phone: "304-594-1773"
  url: https://www.monongaliacounty.gov/departments/parks_and_recreation/chestnut_ridge_park_and_campground/index.php
  url_label: Park page
  place: 346 Chestnut Ridge Camp Road, Bruceton Mills, WV
cost: "The park says daytime and winter activities are free. Camping and cabins are booked and paid for separately."

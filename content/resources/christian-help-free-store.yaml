title: Christian Help Free Store, free clothing and shoes
slug: christian-help-free-store
org: christian-help
topics: [family]
who_it_is_for: Everyone. Christian Help says there are "no income restrictions, demographic criteria, or affiliation requirements."
what_to_do: Stop by during service hours. The Free Store has clothing for men, women, children and babies, and "footwear for all seasons," plus kitchen and household items. You can shop once every seven days.
hours: Monday, Tuesday and Thursday, 9 a.m. to 4 p.m. Friday, 9 a.m. to 2 p.m. Wednesday is for dropping off donations only. Hours can change around events.

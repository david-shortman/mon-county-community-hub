title: Volunteer at the Morgantown Public Library
slug: morgantown-library-volunteer
org: morgantown-public-library-system
topics: [community]
who_it_is_for: Anyone who wants to help at the library. Roles include helping with children's programs and shelving books. The library takes volunteers when it needs them, so there may not be a spot right away.
what_to_do: Watch the library's social media and newsletter for calls for volunteers, or check the volunteer page for open roles. Some roles need a background check and a paper application that you turn in at the library. WVU students can look for library shifts on iServe.

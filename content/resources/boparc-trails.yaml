title: "City park trails: hiking and mountain biking"
slug: boparc-trails
org: boparc
topics: [outdoors]
who_it_is_for: "Anyone who wants to walk, hike or ride a mountain bike on wooded trails in Morgantown."
what_to_do: "BOPARC lists trails at White Park (shared by hikers and mountain bikers), Krepps Park, Marilla Park, Dorsey's Knob Park, and the Whitemoore Park Trail, a footpath from Woodburn to the Deckers Creek Trail. Trails are shared, so bikes yield to people on foot. Dogs must be on a leash at all times (a city law). Stay on the official trails."

title: If you can't keep your pet
slug: mccac-rehoming-your-pet
org: monongalia-county-canine-adoption-center
topics: [pets]
who_it_is_for: Pet owners in Monongalia County who are thinking about giving up a pet. The county shelter says giving a pet to a shelter should be a last resort, and many problems can be solved with help.
what_to_do: Look at the options on the shelter's Rehoming Your Pet page first. If none work, call the shelter to talk about surrender.
steps:
  - Try to find the pet a new home yourself. The shelter suggests Rehome by Adopt-a-Pet, a website where you make a profile for your pet and screen adopters. Its page gives a code for 90% off the listing fee.
  - "For help paying for spay or neuter, the shelter lists voucher programs: M-SNAP at 304-985-0123, Animal Friends of NCWV at 304-290-4738, and the Monongalia County Humane Society at 304-296-6247."
  - If you are having trouble paying for pet food or care, call the shelter, Monday to Friday, 10 a.m. to 5 p.m.
  - "If you still need to surrender your pet, call 304-291-7267. Space is limited, so surrender may not happen right away, and not every animal can be adopted out."
contact:
  phone: "304-291-7267"
  url: https://monongaliawv.animalservices.website/shelterpronet/home.spn
  url_label: Rehoming options
cost: free

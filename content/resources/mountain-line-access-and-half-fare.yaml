title: Riding the bus with a disability or Medicare (Mountain Line half fare)
slug: mountain-line-access-and-half-fare
org: mountain-line-transit-authority
topics: [disability]
who_it_is_for: Every Mountain Line bus has a wheelchair lift or ramp, and drivers help with lifts and securing wheelchairs. Service animals and portable oxygen are allowed. People with disabilities and Medicare cardholders can sign up for half fare.
what_to_do: For half fare, fill out the form on Mountain Line's Persons with Disabilities page and mail it to 420 DuPont Road, Morgantown, WV 26501. Medicare cardholders can also sign up at the Westover office or by calling 304-291-RIDE (304-291-7433). To ask for a change to how the service works for you, contact Mountain Line's ADA Compliance Officer at 304-296-3680 (TDD 304-291-7467) or ADAOfficer@busride.org.
contact:
  phone: "304-291-7433"
  email: ADAOfficer@busride.org
  url: https://www.busride.org/persons-with-disabilities
  url_label: Half fare form
cost: Mountain Line's half fare page says a 75-cent fare costs 35 cents.

title: Rent an artist studio at the Monongalia Arts Center
slug: mac-artist-studios
org: monongalia-arts-center
topics: [community]
who_it_is_for: Visual artists who want a studio to rent. Most studios are in the arts center's annex. Studios go first come, first served.
what_to_do: Email the arts center to set up a tour of open spaces. Then fill out the studio application on the studios page and send an email. The page does not list a price.

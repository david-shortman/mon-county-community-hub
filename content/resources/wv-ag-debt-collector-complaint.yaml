title: File a complaint with the WV Attorney General, including about a debt collector
slug: wv-ag-debt-collector-complaint
org: wv-attorney-general
topics: [money]
who_it_is_for: "West Virginians who believe a business treated them unfairly. The Attorney General's Consumer Protection Division takes these complaints. They include unfair or deceptive sales practices, billing disputes and mortgage-related issues, among others. Its complaint form has questions for complaints against a debt collector and for purchases that were financed."
hours: Office hours Monday to Friday, 8:30 a.m. to 5 p.m.
what_to_do: File online, by email or by mail, or call the Consumer Protection Hotline at 1-800-368-8808.
steps:
  - Online, fill out the General Consumer Complaint form on the Attorney General's site.
  - Or download the complaint form, fill it out, and email it with your papers in PDF form to consumer.complaint@wvago.gov with the subject line "Consumer Complaint."
  - Or print the form, fill it out by hand, and mail it with copies of your papers to Office of the Attorney General, Consumer Protection Division, PO Box 1789, Charleston, WV 25326-1789.
  - If your complaint is about a debt collector, the form asks for the name, address and phone number of the original creditor.
what_to_bring:
  - A full description of the problem and a timeline of what happened
  - Copies of contracts, receipts, letters and other papers
  - What you already did to try to fix it with the business
  - What you want, such as a refund or canceling a contract
contact:
  phone: "1-800-368-8808"
  email: consumer.complaint@wvago.gov
  url: https://ago.wv.gov/consumer-protection/file-complaint-consumer-protection-division
  url_label: File a complaint
what_happens: The office reviews your complaint, then contacts the business for its response and tries to reach a voluntary agreement between you and the business. It says a pattern of complaints against one business may lead to formal action.

title: Free bus rides for high school students
slug: mountain-line-high-school-id
org: mountain-line-transit-authority
topics: [moving, family]
who_it_is_for: Monongalia County high school students.
what_to_do: Fill out Mountain Line's High School Program form online and attach a close-up photo of your face for your Greater Morgantown Area Youth Commission (GMAYC) ID. Mountain Line says "ID applications take 1-2 weeks to process," and it tells you when to pick the ID up at Westover Terminal. The ID gives "free rides until your graduation."
notes:
  - New students can ride free with their high school ID for the first 30 days of each school year while they wait for the GMAYC ID.
contact:
  url: https://www.busride.org/high-school-program
  url_label: Sign up
cost: free

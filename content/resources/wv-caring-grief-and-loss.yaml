title: Grief support from WV Caring hospice
slug: wv-caring-grief-and-loss
org: wv-caring
topics: [health]
who_it_is_for: Families of people who were in WV Caring hospice care. WV Caring gives the family 12 months of free bereavement support after the death. Its Grief and Loss staff can also tell you about in-person support groups in your local community.
what_to_do: Call the Grief and Loss office in Morgantown. Support can include phone check-ins, counseling, support groups (WV Caring holds holiday groups at different times of the year), reading materials, and referrals to grief therapy and other help.
contact:
  phone: "1-866-275-5677"
  url: https://www.wvcaring.org/hospice-services/
  url_label: Grief and loss
  place: 3433 University Ave, Morgantown, WV 26505
cost: free for families of WV Caring hospice patients, for 12 months

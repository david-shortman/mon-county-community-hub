title: Alcoholics Anonymous (A.A.) meetings in Mon County
slug: aa-meetings-district-16
org: alcoholics-anonymous-area-73
topics: [health]
who_it_is_for: "Anyone who wants to do something about their drinking. A.A. says there are \"no age, education, or religious requirements.\" Family members or close friends may come with you to open meetings only."
what_to_do: "Find a meeting on the District 16 site, which covers Mon County, or call A.A.'s West Virginia line at 1-800-333-5051, any hour. Then show up a little before the start time."
hours: The phone line is open 24 hours a day, 7 days a week.
steps:
  - "District 16 posts its in-person and online meeting lists on its site. Check the notes for cancellations."
  - "You do not have to give your name. If you just want to listen, you can."
notes:
  - "The A.A. Meeting Guide app also lists meetings."
contact:
  phone: "1-800-333-5051"
  url: https://www.district16wv.org/
  url_label: District 16 meetings
cost: "Free. A.A. says it has \"no dues or fees\" but collects voluntary contributions."

title: Make your group a nonprofit corporation in West Virginia
slug: wv-sos-nonprofit-incorporation
org: wv-secretary-of-state
topics: [community]
who_it_is_for: A group that wants to become a nonprofit corporation under West Virginia law.
what_to_do: File Articles of Incorporation (Form CD-1) with the West Virginia Secretary of State. You can file online through the One Stop Business Portal or on the paper form. The form says to file one original. If you plan to ask the IRS for 501(c)(3) status, the form says your articles need extra wording, so read the form's non-profit section and the Secretary of State's charitable organizations page first. Questions, call the Secretary of State.
contact:
  phone: "304-558-8000"
  url: https://sos.wv.gov/sites/default/files/2026-07/cd-1.pdf
  url_label: Form CD-1 (PDF)
cost: "$25 filing fee for a non-profit corporation, per Form CD-1 (Rev. 7/2026). Online filings add a $1 processing fee."

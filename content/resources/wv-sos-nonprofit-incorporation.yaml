title: Make your group a nonprofit corporation in West Virginia
slug: wv-sos-nonprofit-incorporation
org: wv-secretary-of-state
topics: [community]
who_it_is_for: A group that wants to become a nonprofit corporation under West Virginia law. A corporation is a legal body that is separate from the people in it.
what_to_do: File Articles of Incorporation (Form CD-1) with the West Virginia Secretary of State. This is the form that creates the corporation. You can file online through the One Stop Business Portal or on the paper form. The form says to file one original. Some groups also want federal tax-exempt status, called 501(c)(3), from the IRS. If you do, the form says your articles need extra wording. Read the form's non-profit section first. Questions, call the Secretary of State.
contact:
  phone: "304-558-8000"
  url: https://sos.wv.gov/sites/default/files/2026-07/cd-1.pdf
  url_label: Form CD-1 (PDF)
cost: "$25 filing fee for a non-profit corporation, per Form CD-1 (Rev. 7/2026). Filing online adds $1."

title: Free breastfeeding classes and help from WIC
slug: monchd-wic-breastfeeding
org: monongalia-county-health-department
topics: [family, health]
who_it_is_for: Pregnant women and new moms. The classes are free and open to anyone, not only people on WIC.
what_to_do: "Monongalia County classes: first and third Wednesday of the month at 4 p.m., and second Wednesday at 10 a.m. Call (304) 598-5181 first to check the schedule. Moms on WIC can also talk with a breastfeeding counselor by phone, and may be able to borrow or get a breast pump, based on need and what is on hand. Anyone can use a free 24/7 app from the Appalachian Breastfeeding Network."
contact:
  phone: "304-598-5181"
  url: https://www.monchd.org/services/breastfeeding
cost: free

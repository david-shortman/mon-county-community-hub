title: White Park
slug: boparc-white-park
org: boparc
topics: [outdoors]
who_it_is_for: A city park with five miles of wooded trails used by hikers and bikers.
what_to_do: "It has four adult softball fields, two youth baseball fields, a small play area, seasonal restrooms, and a pavilion to rent near South Middle School. The BOPARC ice arena is here too. BOPARC does not rent pavilions the same day."

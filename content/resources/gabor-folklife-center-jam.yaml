title: Traditional acoustic jam at the Gabor Folklife Center, Fairmont
slug: gabor-folklife-center-jam
org: gabor-wv-folklife-center
topics: [community]
who_it_is_for: Anyone who plays or wants to listen to traditional acoustic music. This is in Fairmont, outside Mon County. The center says all its events are free and open to the public.
hours: The last Friday of each month, 6:30 p.m. to 9:30 p.m.
what_to_do: Go to the center on the Fairmont State University campus. See the center's page for its other free events.

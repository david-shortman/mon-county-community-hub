title: WorkForce West Virginia, Morgantown office
slug: workforce-wv-morgantown-office
org: workforce-west-virginia
topics: [work]
who_it_is_for: Anyone looking for a job or job training in Mon and Preston counties. The office also handles help for people with SNAP who need work or training.
what_to_do: The office is at 40 Commerce Drive, Suite 200, Westover. Call 1-800-252-JOBS (5627) or email workforcemorgantown@wv.gov. You can also search jobs on workforcewv.org.

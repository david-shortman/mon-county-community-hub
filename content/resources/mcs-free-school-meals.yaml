title: Free breakfast and lunch for every Monongalia County Schools student
slug: mcs-free-school-meals
org: monongalia-county-schools
topics: [family, food]
who_it_is_for: Every student in Monongalia County Schools in 2026-27.
what_to_do: Nothing to fill out. The district's 2026-27 letter to parents says all students get free breakfast and lunch every day through the federal Community Eligibility Provision, with no meal application. If your child needs a special diet for a medical reason, give the school nurse a medical statement that lists the needed changes. Questions, call the Office of Child Nutrition at 304-291-9210.

title: Behind on a WV Housing Development Fund loan
slug: wvhdf-help-for-borrowers
org: wv-housing-development-fund
topics: [housing, money]
who_it_is_for: "Homeowners whose mortgage is through the West Virginia Housing Development Fund. The Fund says its mortgage help is for its own borrowers only. Other homeowners should call their mortgage servicer."
what_to_do: "Call the Fund's Loan Servicing and Administration Division at 800-933-1272 during business hours. The Fund says its borrowers who are struggling can apply for help, and it can refer you to a certified housing counselor."

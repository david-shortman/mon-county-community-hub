title: Classes for adults 50 and older (OLLI at WVU)
slug: olli-classes-50-plus
org: olli-at-wvu
topics: [community]
who_it_is_for: Adults 50 and older who want to take classes and meet people.
what_to_do: Join online. Classes run in four terms a year. For 2026-27, the winter term is January 19 to March 12, 2027, and the spring term is April 5 to May 28, 2027. Most classes meet at the Mountaineer Mall, with some held around town. Questions, call the office at 304-293-1793 or email olli@hsc.wvu.edu.
contact:
  phone: "304-293-1793"
  email: olli@hsc.wvu.edu
  url: https://olliatwvu.org/get-involved/memberships
  url_label: Memberships
  place: "5000 Green Bag Road, Morgantown, WV"
cost: "Standard membership is $30 a year, plus $40 for each term you take classes. A one-term trial is $45 for first-time members. Some classes have extra fees. OLLI offers scholarships."

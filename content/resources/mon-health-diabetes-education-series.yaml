title: Diabetes classes after a diagnosis (Mon Health)
slug: mon-health-diabetes-education-series
org: mon-health-medical-center
topics: [health]
who_it_is_for: People newly diagnosed with diabetes or who want to learn more about treatment, people with type 1 or type 2 diabetes on complex insulin plans, and pregnant women with gestational diabetes.
what_to_do: Ask your doctor or nurse practitioner for a referral. Questions? Call Mon Health's diabetes educator at 304-598-1403.
what_happens: A registered nurse or dietitian who is a certified diabetes educator teaches the classes. The self-management course is three to six sessions over three months. The gestational diabetes course is two or three sessions.
contact:

who_it_is_for: Monongalia County residents 60 and older who need a ride from home to the Senior Monongalians senior center at the Mountaineer Mall.
what_to_do: Call Senior Monongalians at 304-296-9812 to sign up. Book a day ahead. Seats are limited and go first come, first served.

title: Eldercare Locator (national help line for older adults and families)
slug: eldercare-locator
org: us-administration-for-community-living
topics: [disability]
who_it_is_for: Older adults and their families anywhere in the United States, including caregivers looking for local services.
what_to_do: Call or text 1-800-677-1116 to reach trained staff. You can also chat or email from the website, or search for help by entering a location.
contact:
  phone: "1-800-677-1116"
  email: eldercarelocator@usaging.org
  url: https://eldercare.acl.gov/
  url_label: Eldercare Locator
sources:

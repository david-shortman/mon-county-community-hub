title: Find a student job at WVU (Handshake)
slug: wvu-student-jobs-handshake
org: wvu-career-services-center
topics: [work]
who_it_is_for: WVU students looking for a job on or off campus. That includes Federal Work-Study jobs, regular student jobs and graduate assistantships. You can apply for work-study jobs if your financial aid award letter shows a Federal Work-Study award. If it does not, you can still apply for on-campus jobs that are not work-study.
what_to_do: Log in to Handshake with your WVU login and search for jobs. Every student already has a Handshake account.
steps:
  - Log in to Handshake with your WVU login.
  - Add your resume and the days and times you can work. You need both to apply for a student job.
  - "Use the filters: \"Work Study\" finds work-study jobs, and \"On-Campus\" finds jobs on campus."
  - Apply through Handshake. Some jobs ask you to email or fill out a separate application.
notes:
  - The Career Center says not every on-campus job is posted on Handshake. Also check the websites of campus offices that hire many students.
  - Questions about whether you have a work-study award go to the WVU Hub, through a ticket on its website.

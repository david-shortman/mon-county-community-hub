title: West Virginia low-income earned income exclusion
slug: wv-low-income-earned-income-exclusion
org: wv-tax-division
topics: [taxes, money]
who_it_is_for: "People who had earned income, such as wages or tips, and a low federal adjusted gross income. The state's 2025 instructions say that income must be \"$10,000 or less,\" or \"$5,000 or less\" if married filing separately. \"This exclusion may be taken even if you are claimed as a dependent on someone else's return.\""
what_to_do: When you file your West Virginia return (Form IT-140), fill out the Low-Income Earned Income Exclusion worksheet on page 29 of the state's instructions and put the result on line 5. It lowers the income the state taxes. The free tax help sites on this page can help.

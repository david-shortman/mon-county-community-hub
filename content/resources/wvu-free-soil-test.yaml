title: Free soil test from the WVU Soil Testing Lab
slug: wvu-free-soil-test
org: wvu-soil-testing-lab
topics: [growing]
who_it_is_for: West Virginia residents. The lab says "The basic soil test is free of charge to all West Virginia residents. Additional soil tests are available for a fee."
what_to_do: Fill out the soil test form, one form for each sample. Mail 1 to 2 cups of soil in a labeled zip bag with the form, or drop it off in Morgantown.
contact:
  phone: "304-293-5375"
  url: https://soiltesting.wvu.edu/soil-test-form
  url_label: Get the form
  place: "Agricultural Sciences Building, Room 1309B, Morgantown, WV 26506"
cost: The basic soil test is free for West Virginia residents. Other tests cost extra.
hours: Drop off between 7 a.m. and 3 p.m.
what_to_bring:
  - The filled-in soil test form, one for each sample
  - 1 to 2 cups of soil from each area, in its own labeled zip bag
what_happens: The lab says reports go out by email 5 to 10 business days after your sample arrives, and a copy goes to the county Extension office named on your form. It can take longer in the busy season.

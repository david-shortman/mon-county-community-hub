title: Dental care at the Monongalia County Health Department
slug: monchd-dentistry
org: monongalia-county-health-department
topics: [health]
who_it_is_for: Children and adults. The dental clinic does checkups and cleanings, and repairs teeth when needed. It is taking new patients. It suggests a child's first visit around their first birthday.
what_to_do: Call 304-598-5108 to make an appointment.
contact:
  phone: "304-598-5108"
  url: https://www.monchd.org/departments-programs/mchd-dentistry
cost: Accepts private pay, many insurance plans, WV Medicaid, and WVCHIP (health coverage for children). Without dental insurance, a first visit for adults 18 and older (exam and X-rays) is $125, and the cleaning costs extra. For children 5 and under without insurance, an exam, cleaning and fluoride is $75.
sources:

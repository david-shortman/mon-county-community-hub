title: Free help with a protective order from RDVIC
slug: rdvic-court-advocacy
org: rdvic
topics: [legal, family]
who_it_is_for: People in Monongalia County affected by domestic or sexual violence. It is for those asking a court for protection.
what_to_do: "Call the 24-hour hotline. If you ask, RDVIC says its advocates go with you to emergency and final protective order hearings and divorce hearings. They also refer people to Legal Aid. Its Remote Victim Outreach Program lets you file for court protection and take part in hearings by video from the RDVIC office in Morgantown, on weekdays. You can still file and go to court in person. Legal Aid says an advocate can sit with you at a hearing but cannot speak for you in court."
hours: Hotline answers 24 hours a day. Office Monday to Friday, 9 a.m. to 5 p.m.
contact:

title: Open a restaurant, food truck or food shop (health department plan review)
slug: monchd-food-business-plan-review
org: monongalia-county-health-department
topics: [work]
who_it_is_for: New food establishments and mobile food units (food trucks and hot dog carts), and ones being renovated or changing owners, anywhere in Mon County.
what_to_do: Fill out the plan review application (there is a separate one for mobile food units). Once plans are approved, schedule an inspection with a sanitarian. Every food business needs at least one Certified Food Protection Manager, and all workers need a current food handler's card. The health department offers food safety classes; online food worker training costs $20 for a one-year Mon County card.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/food-and-retail-establishment-permits
  url_label: Plan review and permits
  place: "453 Van Voorhis Road, Morgantown, WV 26505"
cost: "Plan review fees on the health department's 2026-2027 fee form: $250 for 0 to 20 seats, $300 for 21 to 50, $350 for 51 to 79, $400 for 80 or more, $150 for a mobile food unit, and $250 for a retail food store. The permit is a separate fee: $150, $300, $450 or $600 by seats, $150 for a mobile food unit, and $72 for each checkout for retail. Places with an ABCC license add $150."

title: Snow and ice on Morgantown city streets and sidewalks
slug: morgantown-snow-plan
org: city-of-morgantown
topics: [weather]
who_it_is_for: People who live, drive or walk in the City of Morgantown.
what_to_do: "The city plows and treats its streets in order: first major streets and busy collector streets, then low-traffic roads, then side streets and dead ends. Crews start treating the first group before snow is expected. Residents and businesses must clear the sidewalk next to their property within 24 hours after a storm ends, and pile the snow in your yard, not in the street. To report a sidewalk still not cleared after 24 hours, use the city's service request page. Can't shovel because of a health or physical limit? Call Code Enforcement at 304-284-7401 for help. Questions about a city street: call the Streets division at 304-291-7465."
contact:

title: Snow and ice on Morgantown city streets and sidewalks
slug: morgantown-snow-plan
org: city-of-morgantown
topics: [weather]
who_it_is_for: People who live, drive or walk in the City of Morgantown.
what_to_do: The city clears busy streets first and side streets last. You must clear the sidewalk next to your home or business within 24 hours after a storm ends.
steps:
  - "Streets: crews treat major and busy streets before snow is expected, and plow them first. Then they clear low-traffic roads, then side streets and dead ends."
  - "Sidewalks: clear the sidewalk next to your property within 24 hours after the storm ends. Pile the snow in your yard, not in the street."
  - "Driveways: shovel or plow snow to the right side of the driveway as you face the street, so passing plows do not push it back. Never push snow into the road."
  - Sidewalk still not cleared 24 hours after the storm? Report it on the city's service request page.
  - Physically unable to clear your sidewalk, and no neighbor, family or friend can help? Call Code Enforcement at 304-284-7401.
  - "Questions about a city street: call the Streets division at 304-291-7465."
contact:

title: Zoning and permits outside city limits (Mon County Planning Office)
slug: mon-county-planning-permits
org: monongalia-county-planning-office
topics: [work, government]
who_it_is_for: People building or starting a business in unincorporated Mon County, such as Brookhaven or Cheat Lake. Right now only the West Run Planning District, north of Morgantown, is zoned.
what_to_do: Look up your property on the County GIS website to see if it is in a zoned area or a floodplain. In the West Run district, building, adding on or changing the use of a structure needs a Land Use Permit. The county says there is no local building code enforcement; the State Fire Marshal inspects commercial and multi-family buildings. New driveways onto state roads need a Division of Highways permit, and the County Assessor needs a Real Property Improvement Form. Call the Planning Office with questions.

title: VA benefits hotline and the Huntington VA Regional Benefit Office
slug: huntington-va-regional-benefit-office
org: us-department-of-veterans-affairs
topics: [veterans]
hours: Office open Monday to Friday, 8 a.m. to 4 p.m.
who_it_is_for: Veterans, service members and families with questions about VA benefits, like disability pay, education, pensions, home loans and life insurance.
what_to_do: Call the VA benefits line at 800-827-1000 (TTY 711). The office is at 640 4th Avenue, Huntington. Some help is walk-in, but VA prefers you make an appointment online first. Bring a current photo ID.
contact:

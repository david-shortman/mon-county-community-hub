title: WV e-Directive Registry
slug: wv-e-directive-registry
org: wv-center-for-end-of-life-care
topics: [health]
who_it_is_for: Anyone in West Virginia with an advance directive (like a living will or medical power of attorney) or a medical order (like a POST form or DNR card). The Center says the Registry "makes individuals' wishes available to treating health care professionals 24/7," and West Virginia EMS can reach it.
what_to_do: "Mark the \"Opt-In\" box on your form. If an older form has no box, fill out the Registry's Opt-In form too. Then fax your forms to 844-616-1415, or mail a copy to the WV e-Directive Registry, 64 Medical Center Drive, PO Box 9022 Health Sciences North, Morgantown, WV 26506-9022. Send a copy and keep your original."
what_happens: "The DNR card (the orange card) is automatically opted in. To take forms off the Registry, call 304-293-0695 or send the Advance Directive Revocation form. You can ask for copies of your own Registry forms with the Release of Information Request and a copy of your photo ID; the Center says \"forms cannot be emailed.\""
contact:
  phone: "304-293-0695"
  url: https://wvendoflife.org/wv-e-directive-registry/
  url_label: About the Registry
cost: The Center's pages list no fee.

title: Sign up for BOPARC classes and programs, like Learn to Skate
slug: boparc-program-registration
org: boparc
topics: [family, outdoors]
who_it_is_for: Kids, teens and adults who want to take a class or join a program with Morgantown's parks department.
what_to_do: "Sign up online on BOPARC's registration site (the site charges its own fees for online sign-ups), by phone at 304-296-8356 with a credit card, or in person at a BOPARC customer service desk (see the note on days below)."
notes:
  - "In-person desk days: the Wiles Hill Community Center, 287 Eureka Drive, is open Monday, Tuesday, Thursday and Friday, 8 a.m. to 4 p.m. The Marilla office above Marilla Pool is open Wednesday, 8 a.m. to 4 p.m. Both close for lunch from noon to 1 p.m. BOPARC's sign-up page names only the Marilla office, so call 304-296-8356 first."
  - "One program is Learn to Skate, lessons at the ice arena taught by the Morgantown Figure Skating Club. It costs $150 per skater, plus a separate $20 Learn to Skate USA membership."
contact:
  phone: "304-296-8356"
  url: https://www.boparc.org/programs.html
  url_label: How to sign up
  place: 705 East Brockway Ave, Morgantown, WV

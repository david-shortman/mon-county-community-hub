title: Sign up for BOPARC classes and programs, like Learn to Skate
slug: boparc-program-registration
org: boparc
topics: [family, outdoors]
who_it_is_for: Kids, teens and adults who want to take a class or join a program with Morgantown's parks department.
what_to_do: Sign up online on BOPARC's registration site (the site charges its own fees for online sign-ups), by phone at 304-296-8356 with a credit card, or in person at the customer service office above Marilla Pool. One program is Learn to Skate, lessons at the ice arena taught by the Morgantown Figure Skating Club. It costs $150 per skater, plus a separate $20 Learn to Skate USA membership.

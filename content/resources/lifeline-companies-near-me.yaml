title: Find a phone or internet company that takes Lifeline
slug: lifeline-companies-near-me
org: universal-service-administrative-company
topics: [money]
who_it_is_for: Anyone who has Lifeline or is applying for it, and wants to know which phone or internet companies near them offer it.
what_to_do: Use the Companies Near Me tool on the Lifeline website. Search by ZIP code, or by city and state. To see every company, click "See the list of companies in your state" under the results.
notes:
  - USAC says the list may not show every company near you, and a company that is not listed may still offer Lifeline. Ask the company if it offers Lifeline where you live.

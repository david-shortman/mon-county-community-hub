title: County recycling drop-off center
slug: mon-county-recycling-drop-off
org: monongalia-county-commission
topics: [recycling]
who_it_is_for: Households with single-stream recycling to drop off. The center says it is for residential use only. It is run by the Monongalia County Commission and moved to 34 Olin St., Industrial Park, in August 2025.
hours: Monday to Friday, 7 a.m. to 3:25 p.m. per the center's site (the county Solid Waste Authority's page says 3:30 p.m.). Closed weekends.
what_to_do: Go to 34 Olin St., Industrial Park. The center's own site lists Monday to Friday, 7 a.m. to 3:25 p.m., closed weekends (the county's page says 3:30 p.m.). Check moncountyrecycling.com for closings before you go. Plastic bags are no longer accepted, so bring recyclables in a box or a reusable container.
contact:
  phone: "304-291-5940"
  url: https://www.moncountyrecycling.com/
  place: 34 Olin St, Industrial Park, Monongalia County, WV
cost: free

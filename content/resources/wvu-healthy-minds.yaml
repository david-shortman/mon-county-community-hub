title: WVU Medicine Healthy Minds, including the Chestnut Ridge Center
slug: wvu-healthy-minds
org: wvu-medicine
topics: [health]
who_it_is_for: Children, teens and adults, including seniors, in Monongalia and Marion counties who need care for mental, emotional, developmental or addiction issues.
what_to_do: Call 304-598-4214 to make an appointment. The Chestnut Ridge Center is at 930 Chestnut Ridge Road, Morgantown (304-598-4000). Healthy Minds also has clinics on Canyon Road, Collins Ferry, Scott Avenue and in Westover. In a crisis, call or text 988.

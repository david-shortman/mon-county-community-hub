title: Morgantown Vet Center
slug: morgantown-vet-center
org: us-department-of-veterans-affairs
topics: [veterans, health]
who_it_is_for: Veterans, service members, and their families. Confidential counseling in a non-medical setting, for things like depression, post-traumatic stress (PTSD), and the effects of sexual assault or harassment during military service (military sexual trauma). Staff can also connect you with more help from the VA and the community.
what_to_do: The Vet Center is at 34 Commerce Drive, Suite 101, Morgantown, in the lower level of the WesMon V building. Open Monday to Friday, 8 a.m. to 4:30 p.m. It also has other hours that change from time to time; call to ask. After hours, the Vet Center call center answers 24/7 at 877-927-8387.
contact:

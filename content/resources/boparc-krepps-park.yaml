title: Krepps Park
slug: boparc-krepps-park
org: boparc
topics: [outdoors]
who_it_is_for: A 36 acre city park, about 20 acres of it wooded with trails.
what_to_do: "It has 2 tennis courts (lined for pickleball too), a basketball court, 2 youth ball fields, an outdoor pool, a dog park, a playground, picnic sites and seasonal restrooms. Two pavilions rent by the day. Book by phone, in person or online. BOPARC does not rent pavilions the same day."
cost: Pavilion 1 rents for $125 per day. Pavilion 2 rents for $100 per day.

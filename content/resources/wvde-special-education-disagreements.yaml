title: If you disagree with the school about special education
slug: wvde-special-education-disagreements
org: wv-department-of-education
topics: [family, disability]
who_it_is_for: "Parents of a child in special education, or being checked for it, who disagree with the school about the child's plan (IEP) or services."
what_to_do: "The West Virginia Department of Education offers four ways to work out a disagreement. Your rights are in the state's Procedural Safeguards brochure, in English and Spanish. For help, call the Office of Special Education at 304-558-2696."
options:
  - "A facilitated IEP meeting: a neutral person helps the meeting go well but does not decide anything. Ask the state in writing at least 2 weeks before the meeting. Both sides must agree to it."
  - "Mediation: the state says it pays the whole cost, so it is free to parents. You can ask for it in writing at any time, even after filing a complaint."
  - "A state complaint: about a rule the school broke within the past year. The state says it does not accept complaints by fax or email, so mail or bring it."
  - "A due process complaint: must be filed within 2 years of when you knew or should have known about the problem. The state says a resolution meeting is held within 15 days."
contact:
  phone: "304-558-2696"
  url: https://wvde.us/academics/special-education/general-supervision-system/idea-dispute-resolution
  url_label: Ways to settle a disagreement
cost: Free to parents for mediation and a facilitated IEP meeting.
if_you_want_help: [wvpti-parent-center, drwv-intake]

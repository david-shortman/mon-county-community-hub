title: After-school programs at middle and high schools
slug: mcs-after-school-middle-high
org: monongalia-county-schools
topics: [family]
who_it_is_for: Students at six Monongalia County middle and high schools.
what_to_do: School staff run these programs, with reading and math tutoring, enrichment classes and clubs. There are no programs on Fridays, bad weather days, early dismissal days or days off. To sign up, contact your child's school.

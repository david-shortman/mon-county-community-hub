title: After-school programs at middle and high schools
slug: mcs-after-school-middle-high
org: monongalia-county-schools
topics: [family]
who_it_is_for: Students at six Monongalia County middle and high schools.
what_to_do: "School staff run these programs: reading and math tutoring, enrichment classes and clubs. Clay-Battelle Middle High (CB Time), Tuesday and Thursday, 2:35 to 4:35 p.m. Mountaineer Middle (Mountie Time), Monday to Thursday, 2:35 to 4:05 p.m. South Middle (Stallion Time), Wednesday and Thursday, 2:35 to 4:05 p.m. Suncrest Middle (Suncrest Time), Tuesday and Thursday, 2:55 to 4:25 p.m. Westwood Middle (Prime Time), Monday to Thursday, 2:30 to 4:30 p.m. University High (UTime), Tuesday to Thursday, 2:30 to 5 p.m. There are no programs on Fridays, bad weather days, early dismissal days or days off. To sign up, contact your child's school."
contact:

title: Join Special Olympics
slug: sowv-become-an-athlete
org: special-olympics-west-virginia
topics: [disability, community]
who_it_is_for: Children and adults identified by a medical agency or professional as having an intellectual disability. Athletes compete from age 8, and Young Athletes is for children ages 2 to 7. There is no upper age limit. See the full rules at the link.
what_to_do: Fill out the Athlete Registration Form on the Special Olympics West Virginia website, then contact your county program's director to start training. A medical exam is no longer needed for local or state events.

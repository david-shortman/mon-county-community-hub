title: Give a new toy to Toys for Tots
slug: toys-for-tots-morgantown-donate
org: toys-for-tots-morgantown
topics: [community]
who_it_is_for: Anyone who wants to give a toy for a child in the Monongalia, Marion, Preston or Taylor county area this Christmas.
what_to_do: Check the campaign's list of toy drop-off sites. Each site has its own dates, and many stop taking toys on December 1 or December 10, 2026. The campaign lists December 10 as its last pickup from drop-off sites. You can also give online from the same page.

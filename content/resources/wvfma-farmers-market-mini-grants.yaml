title: Mini-grants for farmers markets
slug: wvfma-farmers-market-mini-grants
org: wv-farmers-market-association
topics: [growing]
who_it_is_for: Farmers markets registered with the WV Department of Agriculture that are also current WV Farmers Market Association members. This includes traditional markets, roadside and on-farm stands, and mobile and online markets.
what_to_do: Watch the WVFMA mini-grant page for the next round. The 2026 round opened August 7 and closed September 18, 2026.
contact:
  phone: "304-398-5214"
  url: https://wvfarmers.org/projects/mini-grants/
  url_label: Mini-grant page
cost: "Grants of up to $5,000 for items a market will own, like coolers, tents, tables, card readers and signs. The grant needs a WVFMA membership: $50 a year for a farmers market."
sources:

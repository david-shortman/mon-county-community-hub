title: Long-Term Care Ombudsman, for problems in a nursing home or assisted living
slug: wv-long-term-care-ombudsman
org: wv-bureau-of-senior-services
topics: [disability, health]
who_it_is_for: Seniors, and people of any age with a disability, who live in a long-term care facility in West Virginia. These include nursing homes, assisted living facilities, residential care communities and other care homes.
what_to_do: Call 1-800-834-0598 to speak with an ombudsman or to request services. The state's coverage list (updated October 4, 2024) shows a regional ombudsman office in Morgantown that covers Monongalia, Harrison, Lewis, Preston and Taylor counties.
contact:
  phone: "1-800-834-0598"
  url: http://www.wvseniorservices.gov/StayingSafe/LongTermCareOmbudsmanProgram/tabid/81/Default.aspx
  url_label: About the program
what_happens: Ombudsmen are not employed by the facilities. They speak up for residents' rights and quality care, make unannounced visits, give residents information and help settle their concerns. The state ombudsman works for the WV Bureau of Senior Services, which pays Legal Aid of West Virginia to run the program day to day.

title: Report a stray, loose or found dog (animal control)
slug: mccac-animal-control-stray-dog
org: monongalia-county-canine-adoption-center
topics: [pets, government]
who_it_is_for: Anyone who finds a dog, or sees a stray or loose dog, in Monongalia County, including inside Morgantown. The City of Morgantown says all domestic animal calls go to the dog warden at the county Canine Adoption Center.
what_to_do: "Call county animal control at 304-291-7267, option 1."
steps:
  - "Stray or loose dog, or a dog you found: call animal control at 304-291-7267 and choose option 1."
  - "A wild animal (not a pet) on your property: call MECCA's non-emergency line at 304-599-6382."

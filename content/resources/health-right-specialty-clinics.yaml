who_it_is_for: Health Right patients. The free clinic serves people with low income who have no insurance or not enough, up to 250% of the federal poverty level, and people with Medicaid.
what_to_do: Health Right holds specialty clinics on diabetes, cardiology (heart), pulmonary (lungs) and more for its patients. To become a patient, call 304-292-8234 or come in to 10 Scott Avenue, Morgantown.

title: Show your work in a Monongalia Arts Center gallery
slug: mac-exhibit-applications
org: monongalia-arts-center
topics: [community]
who_it_is_for: Artists who want a solo or group show. The arts center says it is taking applications for exhibits in 2027, starting with the first few months of the year.
what_to_do: Fill out the exhibit application on the exhibits page. You pick a fee option. With no fee, the gallery keeps 30% of sales. With a flat fee, the gallery keeps no commission.
contact:
  phone: "304-292-3325"
  email: info@monartscenter.com
  url: https://www.monartscenter.com/exhibits
  url_label: Exhibits page
cost: No fee, with 30% of sales to the gallery. Or a flat fee with no commission. $150 in the Benedum Gallery or $100 in the Davis Gallery. $250 or $200 if you want 100 printed invitations or postcards.
sources:

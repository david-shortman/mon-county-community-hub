title: Send a complaint to the CFPB about a bank, lender, collector or credit report
slug: cfpb-submit-a-complaint
org: consumer-financial-protection-bureau
topics: [money]
who_it_is_for: People with a problem with a financial product or service. The CFPB lists checking and savings accounts, credit cards, credit reports, debt collection, debt and credit management, money transfers, mortgages, payday loans, personal loans, prepaid cards, student loans, and vehicle loans or leases.
hours: Phone line Monday to Friday, 9 a.m. to 6 p.m. Eastern, except federal holidays.
what_to_do: Submit online at consumerfinance.gov/complaint, or call (855) 411-2372 if you cannot submit online.
steps:
  - Try the company first, the CFPB suggests. For a wrong item on a credit report, the law says you must first dispute it with the credit reporting company.
  - Write the key facts in your own words, with the most important dates and amounts.
  - Attach papers that support your story, such as statements and letters, up to 50 pages.
  - Pick the company from the list in the form. The CFPB sends your complaint to the company and asks it to respond.
notes:
  - The CFPB says submitting online takes about 7 to 10 minutes, and by phone about 25 to 30 minutes.
  - You generally cannot submit a second complaint about the same problem, so include everything the first time.
  - You will need your name, email, phone number and address.
  - TTY/TDD (855) 729-2372.
contact:
  phone: "855-411-2372"
  url: https://www.consumerfinance.gov/complaint/
  url_label: Submit a complaint
what_happens: The CFPB says most companies respond within 15 days. If another agency can help better, the CFPB sends your complaint to it and lets you know.
sources:

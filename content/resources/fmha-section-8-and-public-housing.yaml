title: Apply for a Section 8 housing voucher or public housing
slug: fmha-section-8-and-public-housing
org: fairmont-morgantown-housing-authority
topics: [housing, money]
who_it_is_for: Households with lower income in Monongalia, Marion, Preston or Taylor county who need help paying rent over time. This is not quick help for rent that is due now.
what_to_do: Get the Section 8 or public housing application from fmhousing.com or at either office, 103 12th Street, Fairmont, or the Morgantown office at 430 Spruce Street, Second Floor. Fill in every part, because an incomplete application can be sent back and delay your place in line. Drop it off, mail it to P.O. Box 2738, Fairmont, WV 26555-2738, or fax every page to 304-366-0469. You are placed on the waiting list by the date and time your application arrives, and you stay on it until they send you a letter. Tell the office about any change in your household while you wait. The office is open Monday to Thursday, closed noon to 1 p.m., and closed Fridays. Call for times. Call 304-363-0860 to ask whether the list is open and how long the wait is.
notes:
  - The Morgantown office is open Tuesday to Thursday, 8 a.m. to 5 p.m., closed noon to 12:30. It is closed Monday and Friday, and follows the City of Morgantown's holiday schedule. Both offices have drop boxes for applications after hours.
  - On November 2, 2026, the housing authority's home page said the Section 8 voucher waiting list opened May 18, 2026, and gave no closing date. It said the public housing one-bedroom list "is currently closed." People already on another list "must apply separately for the Section 8 Waiting List." Call to check before you apply.
what_happens: When your name comes up on the waiting list, the housing authority sends you a letter inviting you to a group orientation meeting, and decides if you qualify after that. Then you have 60 days to find a place with your voucher, and you can ask in writing for more time, up to 120 days in all. Help with rent starts only after the unit passes inspection and the papers are signed.

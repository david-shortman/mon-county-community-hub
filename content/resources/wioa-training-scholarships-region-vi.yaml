title: WIOA training scholarships (Region VI)
slug: wioa-training-scholarships-region-vi
org: region-vi-workforce-development-board
topics: [work]
who_it_is_for: People in Mon and Preston counties who need job training to get or keep a job that pays enough to live on. A career specialist decides if you qualify.
what_to_do: Call the career specialist for Monongalia and Preston counties at 304-844-1666. If you qualify, you pick a training with an approved Region VI training provider, working with the career specialist. The scholarship can pay up to $12,000 of tuition, and up to $25 a week for getting to training. It is not guaranteed. It depends on how much federal money is available.

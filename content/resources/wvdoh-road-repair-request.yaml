title: Ask the state to fix a state road
slug: wvdoh-road-repair-request
org: wv-department-of-transportation
topics: [government]
who_it_is_for: Anyone reporting a problem on a state road, like a pothole. The Division of Highways District 4 office covers Monongalia County.
hours: District 4 office Monday to Friday, 7:30 a.m. to 4 p.m.
what_to_do: Fill out the state's road repair request form with the county, the road name or route number, and a landmark. Be as specific as you can. The form is not for emergencies.
contact:
  phone: "304-842-1500"
  url: https://webapps.transportation.wv.gov/swat/
  url_label: Request a repair
cost: free
sources:

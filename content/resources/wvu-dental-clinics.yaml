title: WVU Dental clinics at the School of Dentistry
slug: wvu-dental-clinics
org: wvu-school-of-dentistry
topics: [health]
who_it_is_for: People looking for a dentist in Morgantown. At the Student Clinic, dental students treat patients under the direct supervision of faculty dentists. It offers exams, fillings, extractions and dentures.
hours: Student Clinic, Monday through Friday, 9 a.m. to noon and 1 to 5 p.m.
what_to_do: Call 304-293-6208 to make an appointment. The first visit is a full assessment with x-rays and takes about three hours. Arrive 20 minutes early and bring your insurance card or WV Medicaid card, a written list of your medicines, and any recent dental x-rays. Later visits are every two to three weeks, when your assigned student is available.
contact:
  phone: "304-293-6208"
  url: https://wvudentalcare.org/locations/health-sciences-campus/student-clinic/
  url_label: Student Clinic
  place: "1 Medical Center Drive, Morgantown, WV 26506"
cost: "At the Student Clinic, a $124 minimum fee is collected at check-in for the first assessment, which WVU Dental estimates at $124 to $150. It says fees are lowered because patients help with teaching. Payment is due at each visit. WVU Dental files dental insurance as an out-of-network provider, so you pay the difference."

title: Home weatherization to lower heating and cooling bills
slug: ncwvcaa-weatherization
org: ncwvcaa
topics: [money, housing]
who_it_is_for: Low-income households in Monongalia County and other counties the agency serves. Homes with children, older adults or people with disabilities get priority points. Renters can apply, but the landlord must sign the agency's Landlord Agreement. The agency's pages do not list an income limit.
what_to_do: Download the application from the agency's Weatherization page, or ask the Monongalia County office in Westover (304-363-4367). Fill out every form. Incomplete applications are denied. Mail it to the address on the application, or drop it off at any NCWVCAA county office. Approved homes go on a waitlist and are served in order, and the agency contacts you as you near the top, so keep your phone number up to date with them. A trained energy auditor visits the home first. Some homes are put off (deferred) because of problems like moisture, big roof leaks, clutter or sewer leaks. The agency gives you a year to fix them before the application is denied.
what_to_bring:
  - Written proof of income for everyone in the home over 18, such as pay stubs or Social Security, retirement or pension award letters. Bank statements are not accepted.
  - A notarized zero-income form for anyone over 18 with no regular income
  - A recent heating bill and electric bill, or a recent receipt if you heat with propane or fuel oil
  - Proof of home ownership, such as a deed or title, a property tax record, mortgage papers or insurance papers
  - If you rent, the Landlord Agreement filled out and signed by your landlord
what_happens: Weatherization can include insulating the attic, walls, water heater, water lines and ducts, sealing air leaks, cleaning, repairing or replacing the heating system, and replacing an old refrigerator. It does not replace roofs, fix septic systems or porches, or do major remodeling.

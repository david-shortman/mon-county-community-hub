title: Dollar Energy Fund hardship help for Mon Power customers
slug: dollar-energy-fund-mon-power
org: dollar-energy-fund
topics: [money]
who_it_is_for: Mon Power customers with a recent financial hardship. Mon Power says the fund opens October 1 and stays open until the money runs out.
what_to_do: Apply through a local agency. Call 800-683-7036 or use the agency finder on the Dollar Energy Fund site.
contact:
  phone: "800-683-7036"
  url: https://www.dollarenergy.org

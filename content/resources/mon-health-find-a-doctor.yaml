who_it_is_for: Anyone looking for a doctor or other provider with Mon Health. The online list lets you search by keyword, specialty, practice name and gender.
what_to_do: Search the Find a Doc list, then call the office you pick. The list does not show which providers are taking new patients, so ask when you call.

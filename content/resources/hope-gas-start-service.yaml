title: Start gas service with Hope Gas
slug: hope-gas-start-service
org: hope-gas
topics: [moving]
who_it_is_for: People moving into a home with Hope Gas service. The Town of Granville lists Hope Gas for the area.
what_to_do: If the home already has gas, call 1-800-688-4673 (1-800-688-HOPE) to set up service. An adult 18 or older must be there if the meter is inside or blocked. If the home has no gas line yet, call 1-877-587-8570 and pick "Service Order."
what_to_bring:
  - "Your full address, with city, state and ZIP code"
  - "Your Social Security number, and your spouse's"
  - "The current occupant's name or the meter number, if gas is on now"
what_happens: Hope Gas schedules a service appointment. It cannot promise a date, so call as early as you can. The worker tests your appliances, so have your other utilities on first. Hope Gas may ask for more proof of who you are.
contact:
  phone: "1-800-688-4673"
  url: https://hopegas.com/my-account-information/start-stop-or-transfer-service
cost: A $30 connection fee on your first bill. A security deposit may or may not be required.
sources:

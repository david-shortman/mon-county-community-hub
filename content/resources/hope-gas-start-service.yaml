title: Start gas service with Hope Gas
slug: hope-gas-start-service
org: hope-gas
topics: [moving]
who_it_is_for: People moving into a home with Hope Gas service. The Town of Granville lists Hope Gas for the area.
what_to_do: If the home already has gas, call 1-800-688-4673 (1-800-688-HOPE) to set up service. Have the full address, your Social Security number, and the current occupant's name or the meter number. An adult 18 or older must be there if the meter is inside or blocked. If the home has no gas line yet, call 1-877-587-8570 and pick "Service Order."
contact:
  phone: "1-800-688-4673"
  url: https://hopegas.com/my-account-information/start-stop-or-transfer-service
cost: A $30 connection fee on your first bill. A security deposit may or may not be required.

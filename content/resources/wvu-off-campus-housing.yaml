title: WVU Off-Campus Housing office
slug: wvu-off-campus-housing
org: wvu-campus-and-community-life
topics: [housing]
who_it_is_for: WVU students moving from the residence halls into the Morgantown community.
what_to_do: The office helps students find housing and roommates, and has information on apartment shopping, moving in and out, subleasing, and renters' rights and responsibilities. It holds housing fairs in the fall and spring with local landlords, utility companies and moving companies. Its FAQ answers common questions, like breaking a lease.

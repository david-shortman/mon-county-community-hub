title: Junior Volunteer program at The Shack
slug: shack-junior-volunteers
org: the-shack-neighborhood-house
topics: [family]
who_it_is_for: Young people who want to volunteer for the summer at The Shack Neighborhood House. The program page does not list ages or dates, so call to ask.
what_to_do: Apply online. Junior Volunteers help with jobs like counselor's aide, kitchen assistant, swim instructor assistant, maintenance helper and the concession stand. They also do community service, like nursing home visits, park and trail cleanups and community gardens. Spots are first come, first served, and you are not on the list until the fee and all paperwork are in. To get the program's incentives, you need at least 25 service hours. Questions, call (304) 599-5466, Monday to Friday, 9 a.m. to 5 p.m.
contact:
  phone: "304-599-5466"
  url: https://the-shack.org/civicrm/jv-application/
  url_label: Apply online
cost: "$75, one time, for the whole summer."
sources:

title: Report abuse or neglect of an adult (Adult Protective Services)
slug: wv-adult-abuse-neglect-hotline
org: wv-department-of-human-services
topics: [disability, health]
who_it_is_for: "Anyone may report. Call if you think a vulnerable adult in West Virginia faces abuse, neglect, financial exploitation, or any emergency. It also covers a resident of a nursing home or other facility."
hours: 24 hours a day, 7 days a week
what_to_do: Call 1-800-352-6513, any time. If it is an emergency, call 911. State law says to report right away, and no more than 48 hours after you suspect it. Some people, like health workers and nursing home employees, are required by law to report.
contact:
  phone: "1-800-352-6513"
  url: https://bss.wv.gov/centralized-intake-abuse-and-neglect
  url_label: About reporting
what_happens: Reports go to the state's Centralized Intake for Abuse and Neglect. People who report in good faith are protected from civil and criminal liability under state law.

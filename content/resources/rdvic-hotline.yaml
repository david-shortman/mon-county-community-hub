title: 24-hour hotline for domestic or sexual violence
slug: rdvic-hotline
org: rdvic
topics: [housing, health, family]
who_it_is_for: Anyone affected by domestic or sexual violence in Monongalia, Preston, or Taylor County.
what_to_do: Call the hotline any time, day or night. Emergency shelter is one of the services they offer.
hours: Hotline answers 24 hours a day
contact:
  phone: "304-292-5100"
  url: https://fris.org/centers/rdvic/
what_happens: RDVIC says its services are free and confidential. Besides the hotline, it offers counseling, emergency shelter, and advocates who can support you at the hospital and in civil and criminal court. It also has a free cell phone program.
sources:
  - url: https://fris.org/centers/rdvic/
    checked: 2026-11-01

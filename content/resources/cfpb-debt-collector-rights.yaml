title: Your rights when a debt collector contacts you
slug: cfpb-debt-collector-rights
org: consumer-financial-protection-bureau
topics: [money]
who_it_is_for: Anyone a debt collector is contacting, whether or not they think they owe the debt.
what_to_do: Do not ignore the collector. Read the validation notice, and answer in writing. The CFPB has sample letters you can use.
steps:
  - Look for the validation notice. The CFPB says a collector must give you facts about the debt when they first contact you or within five days. This includes the creditor's name, the amount owed, and how to dispute it.
  - If you do not think you owe it, dispute it in writing within 30 days. The notice gives the end date. The CFPB says the collector then cannot contact you to collect until they send proof of the debt.
  - If you want the collector to stop contacting you, write them a letter saying so. The CFPB says they must stop, except to tell you there will be no more contact or that they may take other legal steps, such as a lawsuit.
  - Keep copies of every letter, and write down the date and time of each call. The CFPB says certified mail with a return receipt gives you proof they got your letter.
notes:
  - The CFPB says if the collector does not or cannot give you the facts about the debt, it could be a scam. Do not give money or bank details to a caller until you know they are real.
  - Stopping contact does not make the debt go away. The CFPB says a collector may still sue you or report the debt to a credit reporting company.
  - The sample letters are not legal advice, the CFPB says.

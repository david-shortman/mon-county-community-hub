title: Monongalia County Probation Office
slug: mon-probation-office
org: wv-supreme-court-of-appeals
topics: [legal]
who_it_is_for: People on probation or supervised release from a Monongalia County court. The West Virginia courts say probation officers supervise people sentenced to probation, among other work for the circuit court.
what_to_do: The probation office is in the Monongalia County Justice Center, Suite 16. Call with questions about reporting or the terms of your probation.

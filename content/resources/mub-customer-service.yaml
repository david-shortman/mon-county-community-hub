title: Call the Morgantown Utility Board about a water or sewer bill
slug: mub-customer-service
org: morgantown-utility-board
topics: [money]
who_it_is_for: Morgantown Utility Board (MUB) water and sewer customers.
what_to_do: Call 304-292-8443, Monday to Friday, 8 a.m. to 4:30 p.m. It is staffed around the clock for emergencies. You can also email customer-service@mub.org or visit 278 Greenbag Road. MUB's website does not describe payment plans or shutoff rules, so ask on the phone. If water is shut off, you have to call to get it turned back on.
contact:
  phone: "304-292-8443"
  url: https://mub.org
sources:

title: Ask the County Clerk for a military discharge record (DD-214)
slug: mon-county-clerk-dd214
org: monongalia-county-clerk
topics: [records, veterans]
who_it_is_for: "The form lists who may ask: the veteran, a guardian or conservator, the executor of the veteran's estate, next of kin of a veteran who has died, an attorney or agent for one of these, a government agency doing official work, someone arranging funeral or medical care, and people doing genealogy or research about a veteran who has died."
hours: Monday to Friday, 8:30 a.m. to 4:30 p.m.
what_to_do: Fill out the County Clerk's DD-214 request form and attach a state or federal photo ID. If you are the veteran, you do not need a notary. Anyone else has the form notarized. The office is in Room 123 of the Courthouse, 243 High St.
contact:
  phone: "304-291-7230"
  url: https://www.monongaliacountyclerk.com/index.php/how-to/57-dd214
  url_label: Request form
  place: 243 High St, Morgantown, WV
what_to_bring:
  - The filled-out request form
  - A state or federal photo ID

title: Ask Mon Power for a payment arrangement
slug: mon-power-payment-help
org: mon-power
topics: [money]
who_it_is_for: Mon Power electric customers who cannot pay their bill in full.
what_to_do: Call Mon Power at 800-686-0022 and ask about a payment arrangement, which adds installments to your monthly bill. Mon Power also lists a later due date for customers who are 60 or older, or who get Social Security, a pension or disability benefits, a way to have someone told before a disconnection, and a Critical Care program if someone at home uses electric medical equipment. Keep any shutoff notice.
contact:
  phone: "800-686-0022"
  url: https://www.firstenergycorp.com/help/billingpayments/assistance_serviceprogram/mon_power.html

title: Ask Mon Power for a payment arrangement
slug: mon-power-payment-help
org: mon-power
topics: [money]
who_it_is_for: Mon Power electric customers who cannot pay their bill in full.
what_to_do: Call Mon Power at 800-686-0022 and ask about a payment arrangement, which adds installments to your monthly bill. Mon Power can move your due date to after your check comes if you are at least 60, or you get Social Security, a pension or disability help, and your bill is usually due just before that check. It also lists a way to have someone told before a disconnection, and a Critical Care program if someone at home uses electric medical equipment. Keep any shutoff notice.
contact:
  phone: "800-686-0022"
  url: https://www.firstenergycorp.com/help/billingpayments/assistance_serviceprogram/mon_power.html
what_happens: You can log in to your account online, or call, to see if you can get an installment plan. Mon Power says the installments "help maintain your electric service while you make payments more suited to your financial situation."
sources:

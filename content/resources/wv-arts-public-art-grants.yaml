who_it_is_for: Local governments and nonprofits with 501(c)(3) tax status (registered charities). Schools can also apply for Public Art grants.
what_to_do: Public Art grants, up to $7,500 for murals and sculptures, are not open right now and have no next date posted. Community Arts Mini Grants, up to $1,000 for arts performances and workshops, take applications on a rolling basis.

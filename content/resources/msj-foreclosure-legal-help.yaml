title: Free legal help with foreclosure (Mountain State Justice)
slug: msj-foreclosure-legal-help
org: mountain-state-justice
topics: [housing, legal]
who_it_is_for: "West Virginians with low income who are facing foreclosure on their home or having trouble making mortgage payments. Legal Aid of West Virginia says it does not take foreclosure cases and sends people to Mountain State Justice."
what_to_do: Call 304-344-3144 or 800-319-7132 to see if you qualify and set up an intake.
contact:
  phone: "800-319-7132"
  url: https://mountainstatejustice.org/get-help/
  url_label: Get help
cost: free

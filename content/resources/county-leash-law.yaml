title: County leash law for dogs
slug: county-leash-law
org: monongalia-county-commission
topics: [pets, government]
who_it_is_for: Dog owners in Monongalia County. The county leash law has been in effect since June 22, 1995.
what_to_do: "Keep your dog on your own property or on a leash. The county's rules:"
steps:
  - Do not let your dog run loose in a public place or on someone else's property.
  - Off your property, keep your dog on a leash no longer than 6 feet.
  - Put your name and address, the county license tag and the rabies tag on your dog's collar.
  - Do not take your dog onto someone else's private property without permission, or let it soil or damage their yard, flowers or shrubs.
  - Vaccinated dogs that are lawfully hunting, training, herding or doing other farm work are not covered by the leash rule.
  - The county dog warden or humane officer may pick up a loose dog and take it to the county shelter. Owners can be fined up to $100.

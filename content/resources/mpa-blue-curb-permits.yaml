title: Residential blue curb parking permits
slug: mpa-blue-curb-permits
org: morgantown-parking-authority
topics: [moving]
town: Morgantown
who_it_is_for: People who own or rent a home inside Morgantown city limits on a street with blue curbs. Without a permit, you cannot park there during the posted hours. If you have never had a blue curb permit, call the Parking Authority to check that your address is eligible.
what_to_do: Bring proof that you live there and your vehicle registration to the Parking Authority office at 300 Spruce Street. Permits run July 1 to June 30 and must be renewed each year.
steps:
  - "Owners: bring a recent property tax receipt or the deed. Renters: bring a copy of your signed lease. Bring the current registration for each vehicle."
  - Each home (outside Sunnyside) can get 2 resident permits and 1 visitor permit. A visitor permit is only for guests, and not for more than 3 days in a row for the same car.
  - In Sunnyside, property owners buy up to 3 permits per building for their tenants. There are no visitor passes in Sunnyside.
  - "Restricted hours by area: Elmina 5 p.m. to 7 a.m. daily; Evansdale midnight to 5 p.m. daily; Garrison 5 p.m. to 8 a.m. daily; Greenmont and South Park 7 a.m. to 7 p.m. Monday to Thursday and 7 a.m. to 6 p.m. Friday; McCullough all the time; Parsons 7 a.m. to 3 p.m. weekdays; Pennsylvania 5 p.m. to 9:30 a.m. daily; Sunnyside 7 a.m. to 7 p.m. weekdays; Wiles Hill 7 a.m. to 7 p.m. Monday to Saturday."
  - A permit does not promise you a space.
cost: "$20 a year for each resident permit, visitor permit or caregiver permit. Five-day visitor permits are $5 each time. Sunnyside landlord permits are $50 a year."
contact:

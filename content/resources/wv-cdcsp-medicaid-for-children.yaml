title: Medicaid for a child with a severe disability, whatever the parents earn (CDCSP)
slug: wv-cdcsp-medicaid-for-children
org: wv-department-of-human-services
topics: [disability, health, family]
who_it_is_for: "Children with a severe disability who would not get Medicaid because their parents earn too much. The state says only the child's own income and assets count, as long as the child meets the other rules. The program is for children who can be cared for at home instead of in an institution."
what_to_do: "The state's brochure says you apply with a set of CDCSP forms, and you need a denial notice for SSI first. The child gets a West Virginia Medicaid card. For questions, call the program at 304-356-4867."
contact:
  phone: "304-356-4867"
  url: https://bms.wv.gov/children-disabilities-community-service-program-cdcsp
  url_label: About CDCSP
what_to_bring:
  - A denial notice for Supplemental Security Income (SSI)
if_you_want_help: [ced-family-resource-specialists]

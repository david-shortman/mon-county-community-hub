title: Free legal help for people 60 and older
slug: wv-senior-legal-aid
org: wv-senior-legal-aid
topics: [legal]
who_it_is_for: West Virginians age 60 and older with a civil (not criminal) legal question. The state Bureau of Senior Services says it focuses on seniors with low income, a disability, or who live in rural areas.
what_to_do: Call toll free at 800-229-5068, or email info@seniorlegalaid.org.
contact:
  phone: "800-229-5068"
  url: https://www.seniorlegalaid.org/
cost: Free.

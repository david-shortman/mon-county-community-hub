title: Help paying a Mon Health Medical Center bill (charity care)
slug: mon-health-charity-care
org: mon-health-medical-center
topics: [health]
who_it_is_for: Mon Health Medical Center patients who are uninsured, underinsured, not eligible for government help, or unable to pay. Mon Health's page says it decides case by case. Its posted policy is dated January 29, 2021. It says "Patients who can demonstrate their family income is at or below 200% of the federal poverty level may still be eligible for a 100% discount." People with higher income may get a discount case by case. See the full rules at the link.
what_to_do: Call a financial counselor at 304-598-1560, or stop by their office on the hospital's main floor near Radiology. You fill out a form to apply, and you can ask at any time while you are being billed.
what_to_bring:
  - A completed financial assistance application
  - Proof of income, such as your three most recent pay stubs, unemployment stubs, or proof of Social Security or retirement income. With no income, a signed statement from the person supporting you
  - A copy of your most recent tax return, or a signed statement that you did not file
  - Your Medicaid denial letter
  - Your current checking or savings account statement, if you have one
what_happens: Mon Health tells you in writing if you are approved or denied. You can appeal a denial in writing within 30 days.
contact:
  phone: "304-598-1560"
  url: https://www.monhealth.com/main/financial-assistance
cost: free

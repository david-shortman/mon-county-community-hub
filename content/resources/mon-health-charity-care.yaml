title: Help paying a Mon Health Medical Center bill (charity care)
slug: mon-health-charity-care
org: mon-health-medical-center
topics: [health]
who_it_is_for: Mon Health Medical Center patients who are uninsured, underinsured, not eligible for government help, or unable to pay. Mon Health decides case by case.
what_to_do: Call a financial counselor at 304-598-1560, or stop by their office on the hospital's main floor near Radiology. You will need to fill out a form to apply.
contact:
  phone: "304-598-1560"
  url: https://www.monhealth.com/main/financial-assistance
cost: free

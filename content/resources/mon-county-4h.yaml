who_it_is_for: Young people in Monongalia County. Cloverbuds is for ages 5 to 7. Regular 4-H clubs go up to age 21. Members 18 to 21 need extra paperwork and training.
hours: The Extension office is open Monday to Friday, 8:30 a.m. to 4:30 p.m.
opening_hours:
  - days: [mon, tue, wed, thu, fri]
    opens: "08:30"
    closes: "16:30"
what_to_do: Enrollment starts October 1 and stays open all year. Sign up online through ZSuite, the state 4-H enrollment site. Clubs meet around the county. To ask which club is near you, or about camps, call the WVU Extension office at 304-291-7201. The office is at 270 Mylan Park Lane, Suite 250, Morgantown.

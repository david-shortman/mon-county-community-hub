title: Temporary food permit for fairs, festivals and events
slug: monchd-temporary-food-permit
org: monongalia-county-health-department
topics: [work]
who_it_is_for: Food vendors who set up at a fair, festival, football game or other special event in Mon County.
what_to_do: Send the Temporary Food Establishment application to the health department at least seven days before the event. A sanitarian must inspect your stand before you serve food. All workers need a current food handler's card. The permit is good for up to 14 days at the place it is issued.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/temporary-food-worker-cards
  url_label: Rules and application
  place: "453 Van Voorhis Road, Morgantown, WV 26505"
cost: "$72 for a temporary food establishment permit, per the health department's fiscal year 2026-2027 fee schedule."

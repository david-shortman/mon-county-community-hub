title: Free car seat check at the Sheriff's Department
slug: car-seat-check-sheriff
org: monongalia-county-sheriff
topics: [family]
who_it_is_for: Anyone who wants a child car seat checked. The state says seats are checked free of charge by a Safe Kids certified Child Passenger Safety Technician.
what_to_do: Call the fitting station to set up an appointment. The state asks people not to reach fitting stations through social media.
contact:
  phone: "304-291-7260"
  url: https://dmv.wv.gov/cps-seat-fitting-stations
  url_label: State list of fitting stations
  place: "116 Walnut Street, Morgantown, WV 26505"
cost: free
sources:

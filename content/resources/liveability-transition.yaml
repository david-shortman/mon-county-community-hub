title: Leaving a nursing home, or leaving school (LiveAbility transition help)
slug: liveability-transition
org: liveability
topics: [disability]
who_it_is_for: People with significant disabilities moving from a nursing home or other facility back home, people at risk of having to move into one, and young people with an IEP who are leaving high school. Help can include home or vehicle changes, medical equipment, a housing search and peer support. The page does not say what it costs.
what_to_do: Call LiveAbility's Morgantown office at 304-296-6091 or toll free 844-212-3464, or email info@liveabilitywv.org, and ask about transition services.
contact:

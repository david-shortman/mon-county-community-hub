title: Online support for families after a child dies
slug: compassionate-friends-online-support
org: the-compassionate-friends
topics: [family, health]
who_it_is_for: Parents, grandparents and siblings (over age 18) grieving the death of a child.
what_to_do: Join the live online chats, called "virtual chapters," from the Online Communities page. There are general grief sessions and more specific sessions. The group also has private Facebook groups run by bereaved family members; you answer a few screening questions to join. To look for an in-person chapter, use the chapter locator or call 877-969-0010.
contact:

title: Foster or volunteer with Animal Friends
slug: animal-friends-volunteer
org: animal-friends-of-north-central-wv
topics: [pets, community]
who_it_is_for: People 18 and older who want to help dogs and cats waiting for homes. Animal Friends needs foster families, dog walkers, people to play with and groom the animals, shelter cleaning, drivers (a vehicle is provided), help at its Thrift Shoppe and events, grant writing, training and repairs.
what_to_do: Call the volunteer line and leave a message, or email the address on the How You Can Help page. Ask which jobs are open and how to start.
contact:

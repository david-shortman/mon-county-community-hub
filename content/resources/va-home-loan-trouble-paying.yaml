title: Behind on a VA home loan
slug: va-home-loan-trouble-paying
org: us-department-of-veterans-affairs
topics: [housing, veterans]
who_it_is_for: Veterans and others with a VA-backed home loan who are having trouble making payments.
hours: Monday to Friday, 8 a.m. to 6 p.m. Eastern
what_to_do: "VA says to contact your loan servicer right away. If you'd like VA's help or advice, call a VA loan technician at 877-827-3702 and select 6 (TTY: 711)."
contact:
  phone: "877-827-3702"
  url: https://www.va.gov/housing-assistance/home-loans/trouble-making-payments/
  url_label: Trouble making payments
cost: free

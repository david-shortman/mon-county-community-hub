title: CPR and AED class from the health department
slug: monchd-cpr-class
org: monongalia-county-health-department
topics: [community]
who_it_is_for: Groups of 5 or more people in the Mon County area. Heartsaver is for people who are not health care workers. Basic Life Support (BLS) is for health care workers, first responders, and people training to be one.
what_to_do: Call the health department's Threat Preparedness program to set up a class for your group. Classes take 3 to 4 hours. You practice on adult and infant dolls. If you pass, you get a 2-year CPR card from the American Heart Association.
cost: "Heartsaver is $65 per person. Basic Life Support is $60 per person."
contact:

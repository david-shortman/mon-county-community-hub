title: Return an absentee ballot in Mon County, 2026 general election
slug: mon-county-absentee-ballot-2026
org: monongalia-county-clerk
topics: [voting]
who_it_is_for: Voters in Monongalia County who already have an absentee ballot. The deadline to apply for one was October 28, 2026.
what_to_do: By mail, your ballot must be postmarked by Election Day, Tuesday, November 3, and reach the County Clerk by the start of the canvass. By hand, bring it to the County Clerk's office, 243 High Street, Room 123, Morgantown. The last day to hand deliver is Monday, November 2, the day before Election Day. The office is open Monday to Friday, 8:30 a.m. to 4:30 p.m. One person may not deliver more than two voters' ballots. You can track your ballot on the state's website.

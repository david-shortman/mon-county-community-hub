title: If your employer did not pay you
slug: wv-unpaid-wages
org: wv-division-of-labor
topics: [work, money]
who_it_is_for: "Workers and former workers in West Virginia who think they are owed pay. The Wage and Hour Section of the state Division of Labor handles this. It enforces \"state wage payment laws, minimum wage and overtime requirements.\""
what_to_do: Fill out the Division of Labor's Request for Assistance form and send it to the Wage and Hour Section. The form gives its email, WageandHour@wv.gov, and phone, 304-558-7890.
steps:
  - Download the Request for Assistance form. It asks who you worked for, what work you did, and "What amount of Wages and/or Fringe Benefits are you claiming is due?"
  - Gather what you have. The state rule lists "Copies of pay stubs, work schedules, personal calendars, or other documents" that support the claim.
  - Send the form to the Wage and Hour Section by email, or by mail to 1900 Kanawha Boulevard East, Building 3, Room 200, Charleston, WV 25305. Call 304-558-7890 with questions.
notes:
  - Know the pay rules. The state rule says paydays must come "at least twice each month with no more than 19 days between paydays."
  - If you quit or were let go, state law says your last pay is due "on or before the next regular payday" for the work you did before you left.
contact:
  phone: "304-558-7890"
  url: https://labor.wv.gov/wage-hour-section
cost: free

title: Age certificate for a first job (ages 14 and 15)
slug: wv-teen-age-certificate
org: wv-division-of-labor
topics: [work, family]
who_it_is_for: Teens who are 14 or 15 and have a job offer. They need an age certificate before they start work. Teens who are 16 or 17 do not need one by law, but an employer may ask for one as proof of age.
what_to_do: Get the age certificate form from the Division of Labor's child labor page. The employer, a parent and the school registrar fill out Sections A, B and C. For a home schooled teen, the parent who runs the school work fills out Section C. Then send the form to the Division of Labor, which fills out Section D and issues the certificate if it is approved. Questions, call 304-558-7890 or email wageandhour@wv.gov.
contact:
  phone: "304-558-7890"
  email: wageandhour@wv.gov

title: AARP Foundation Tax-Aide
slug: aarp-tax-aide
org: aarp-foundation
topics: [taxes, money]
who_it_is_for: AARP says Tax-Aide gives tax help "free of charge," with "a special focus on taxpayers who are over 50 and have low-to-moderate income."
what_to_do: As of October 31, 2026, AARP's site locator says it "is now closed" and will be back "in time for the next tax season." The IRS says to use the AARP Site Locator Tool between January and April, or call 888-227-7669.

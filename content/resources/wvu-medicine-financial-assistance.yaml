title: Help paying a WVU Medicine hospital bill (financial assistance)
slug: wvu-medicine-financial-assistance
org: wvu-medicine
topics: [health]
who_it_is_for: WVU Medicine patients, including at J.W. Ruby Memorial Hospital and WVU Medicine Children's Hospital. WVU Medicine's 2026 Plain Language Summary says "Patients with household income at or below 200% of the Federal Poverty Level may qualify for free care on eligible services." Its 2026 table puts 200% at $31,920 a year for 1 person, $43,280 for 2, $54,640 for 3 and $66,000 for 4. The same summary lists other rules, such as not having substantial assets, having applied for and been denied Medicaid, and being a U.S. citizen or permanent resident. The hospital's full policy (revised January 1, 2025) also covers people who are eligible for SNAP, WIC or the state's energy assistance program, unless they can get Medicaid or CHIP. It also names people whose medical bills after insurance are 10% or more of their yearly household income, with income above 200% and up to 300% of the federal poverty guidelines. See the full rules at the link.
what_to_do: Apply through MyWVUChart, or download the application and mail it back. You can apply up to 240 days after your first bill after you leave the hospital. Questions, or help with the form? Call 304-598-6260, Monday to Friday, 8 a.m. to 4 p.m., or visit a financial counselor in person.
what_to_bring:
  - A Medicaid denial letter dated within the last 90 days (the application says this is required)
  - Your most recent federal tax return, or pay stubs for the last 30 days
  - Letters for any other income, such as Social Security, pension, unemployment or Workers' Compensation
  - Your most recent bank statements
  - A copy of your insurance card, if you had insurance other than Medicaid
what_happens: You fill out every section of the form and attach your proof of income. If something is missing, the hospital writes to tell you what it needs. It tells you in writing if you are approved or denied, and you can appeal a denial in writing within 30 days.

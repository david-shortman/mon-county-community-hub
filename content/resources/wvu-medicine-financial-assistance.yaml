title: Help paying a WVU Medicine hospital bill (financial assistance)
slug: wvu-medicine-financial-assistance
org: wvu-medicine
topics: [health]
who_it_is_for: WVU Medicine patients, including at J.W. Ruby Memorial Hospital and the Chestnut Ridge Center. WVU Medicine says patients with household income at or below 200% of the federal poverty level may qualify for free care on eligible services. It also lists other rules, such as not having substantial assets, having applied for and been denied Medicaid, and being a U.S. citizen or permanent resident. See the full rules at the link.
what_to_do: Apply through MyWVUChart, or download the application and mail it back. You can apply up to 240 days after your first bill after you leave the hospital. Questions? Call 304-598-6260.
contact:
  phone: "304-598-6260"
  url: https://wvumedicine.org/billing-and-insurance/financial-assistance/faq/
cost: free

title: Community Maker Space at the Monongalia Arts Center
slug: mac-community-maker-space
org: monongalia-arts-center
topics: [community]
who_it_is_for: Anyone who wants shared art tools and space. Kinds of art include linoleum printing, black and white darkroom photography, painting, drawing and collage.
hours: Tuesday, 6 p.m. to 9 p.m. Wednesday to Friday, 1 p.m. to 7 p.m. Saturday, 10 a.m. to 2 p.m. Hours may change for classes and events. Closed during figure drawing sessions. During summer camps, access may be limited until 4 p.m.
what_to_do: Buy a daily or monthly membership. Most supplies are included, like paints, brushes, inks, drawing tools, the collage library and the darkroom. Paper, canvas and some other supplies cost a small fee, or bring your own. The space is new, so prices and rules may change.
contact:
  phone: "304-292-3325"
  email: info@monartscenter.com
  url: https://www.monartscenter.com/community-maker-space
  url_label: Maker Space page
  place: 107 High Street, Morgantown, WV
cost: $10 a day or $60 a month. Guests of members pay $5 a day. Scholarships are available if cost is a barrier.

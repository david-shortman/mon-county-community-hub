title: Free interpreters at WVU Medicine hospitals
slug: wvu-medicine-language-services
org: wvu-medicine
topics: [health]
who_it_is_for: Patients whose main language is not English. WVU Medicine also offers free sign language interpreting and materials in other formats for people with disabilities.
what_to_do: Tell any staff member that you need an interpreter. To request one ahead of time at J.W. Ruby Memorial Hospital or WVU Medicine Golisano Children's in Morgantown, call 304-598-6100 or 800-982-6277. WVU Medicine says it offers qualified interpreters and information written in other languages.

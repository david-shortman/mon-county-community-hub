title: WVU Plant Diagnostic Clinic
slug: wvu-plant-diagnostic-clinic
org: wvu-plant-diagnostic-clinic
topics: [growing]
who_it_is_for: Homeowners, gardeners, landscapers, growers and farmers with a sick or damaged plant, or a plant they want named.
what_to_do: Ask your county Extension office first. If a sample is needed, mail the plant with the clinic's submission form early in the week.
contact:
  url: https://extension.wvu.edu/lawn-gardening-pests/plant-disease/plant-diagnostic-clinic
  url_label: How to send a sample
what_to_bring:
  - The whole plant if you can, roots included, plus a healthy one to compare
  - The filled-in submission form, in its own plastic bag
what_happens: The clinic diagnoses the problem with WVU experts and suggests ways to treat or prevent it. Its page does not list a cost, so ask the county Extension office before you mail a sample.
sources:
  - url: https://extension.wvu.edu/lawn-gardening-pests/plant-disease/plant-diagnostic-clinic
    checked: 2026-10-31

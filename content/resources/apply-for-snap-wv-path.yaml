title: Apply for SNAP (food stamps) online with WV PATH
slug: apply-for-snap-wv-path
org: wv-department-of-human-services
topics: [food, money]
who_it_is_for: West Virginia households that need help buying food. The same site also takes applications for Medicaid, WVCHIP (health coverage for children), LIEAP (help with heating bills), and the school clothing allowance.
what_to_do: Go to wvpath.wv.gov and make a free account, then sign in and choose Apply. Pick SNAP, add everyone in your household, and answer every question marked with a star. You can save and finish later. Sign by typing your name and birth date, then press Submit. Watch My Messages in your account for next steps. For questions, call DoHS customer service at 1-877-716-1212, Monday to Friday, 8 a.m. to 5 p.m. You can report changes, like a new job or a new person in your home, on WV PATH or at the same number.
contact:
  phone: "1-877-716-1212"
  url: https://www.wvpath.wv.gov/
  url_label: Apply online
cost: free
what_happens: The state's SNAP application says a DoHS worker "will interview you to determine your eligibility." If you are found eligible, benefits count from the date DoHS got your signed application. Some households can get SNAP within seven calendar days. One case the application lists is when "your SNAP household has less than $150 in monthly gross income and liquid resources such as cash, checking or savings accounts are less than or equal to $100." It lists two other cases too.

title: Apply for SNAP (food stamps) online with WV PATH
slug: apply-for-snap-wv-path
org: wv-department-of-human-services
topics: [food, money]
who_it_is_for: West Virginia households that need help buying food. The same site also takes applications for Medicaid, WVCHIP, LIEAP heating help, and the school clothing allowance.
what_to_do: Go to wvpath.wv.gov and make a free account, then sign in and choose Apply. Pick SNAP, add everyone in your household, and answer every question marked with a star. Sign by typing your name and birth date, then press Submit. Watch My Messages in your account for next steps. For questions, call DoHS customer service at 1-877-716-1212.
contact:
  phone: "1-877-716-1212"
  url: https://www.wvpath.wv.gov/
cost: free

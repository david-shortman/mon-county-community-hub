title: 20% off winter gas and electric bills
slug: wv-20-percent-utility-discount
org: wv-department-of-human-services
topics: [money]
who_it_is_for: "Gas and electric customers who get SSI or WV WORKS. It is also for SNAP recipients \"sixty years of age or older.\" State law gives them a lower winter rate. It does not apply to city-owned or cooperative utilities. Mon Power's notice says SSI children under 18 do not qualify."
what_to_do: If you get one of these benefits, the state mails you a letter and an application each fall. Questions about who qualifies, call DoHS at 800-642-8589.
steps:
  - Mon Power says it may enroll you on its own if you had the discount last year, and sends a letter if it does.
  - If you get no letter from Mon Power in October, mail the signed application to Mon Power, 20% Discount, 5001 NASA Boulevard, Fairmont, WV 26554. Do not send it with your bill.
notes:
  - The law sets the discount at "twenty percent less" than the normal rate, for the billing months of December through April.
  - Hope Gas's bill help page also mentions the 20% discount program, next to LIEAP.
contact:
  phone: "800-642-8589"
  url: https://code.wvlegislature.gov/24-2A-1/
  url_label: The state law
cost: free

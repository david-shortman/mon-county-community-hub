title: Free home visits for pregnant women and families with young children
slug: wv-home-visiting
org: wv-home-visitation-program
topics: [family, health]
who_it_is_for: Families who are expecting a baby or have young children. Programs can start during pregnancy and continue until the child is 3 to 5 years old. The family chooses whether to take part.
what_to_do: A trained home visitor comes to your home to talk about things like a healthy pregnancy, sleep, crying, breastfeeding, discipline and how your child is growing, and can refer you to other help. The state's Monongalia County page lists local programs, including Early Head Start, the HAPI Project, Right From The Start and Starting Points. Call the state program at 1-800-642-8522 to ask which one fits your family.
contact:

title: Help at home with bathing, dressing and eating (WV Medicaid Personal Care)
slug: wv-medicaid-personal-care
org: wv-department-of-human-services
topics: [disability, health]
who_it_is_for: People with active West Virginia Medicaid who need help in at least three daily activities, like eating, bathing, moving from a bed or chair, walking and dressing. A trained worker helps at home, at work or in the community. It does not cover housecleaning alone. A nurse's assessment decides medical eligibility.
what_to_do: Fill out and sign the Personal Care Medical Necessity Evaluation Request (PC-MNER) form from the program's website. Give it to your doctor, physician assistant or nurse, who fills it out and sends it in. A nurse from Acentra Health then calls to set up a visit to your home. Questions? Call the Bureau for Medical Services at 304-558-1700.
contact:

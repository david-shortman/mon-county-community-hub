title: Switch your driver's license and car title to West Virginia
slug: wv-dmv-new-resident
org: wv-dmv
topics: [moving]
who_it_is_for: People moving to West Virginia with a driver's license from another state, or a vehicle titled in another state.
what_to_do: The DMV says new residents must have their vehicles titled and registered within 30 days of establishing residency. With a valid, non-expired out-of-state license, you can transfer it. You pass a vision screening, take a brief alcohol awareness course, and give up your out-of-state license. If your license is expired, you take all the tests (vision, written and road skills). Your car insurance must be from a company licensed to sell insurance in West Virginia. See the full rules at the link.
contact:
  url: https://dmv.wv.gov/moving-wv
  url_label: Moving to WV rules
cost: Title fee $15.00. Lien fee (if it applies) $10.00. Regular registration fee $51.50. Moving a motorcycle endorsement to your WV license is $5.00 more. The DMV says the 6% titling tax does not apply to new residents bringing a vehicle already titled in their name in another state, if they apply and pay the fees within 30 days of establishing residency. It does not apply to leased vehicles.
what_to_bring:
  - Your out-of-state driver's license
  - Your out-of-state title, or if a lender holds it, a copy of the title and a letter from the lender
  - A completed Application for Certificate of Title (form DMV-1-TR)
  - A completed Odometer Disclosure Statement (form DMV-TM-1)
  - Your insurance information
sources:

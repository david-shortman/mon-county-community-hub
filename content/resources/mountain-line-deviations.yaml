title: Ask the bus to pick you up off its route (Mountain Line deviations)
slug: mountain-line-deviations
org: mountain-line-transit-authority
topics: [disability]
who_it_is_for: Any rider, with or without a disability. A Mountain Line bus can leave its route by up to three-quarters of a mile to pick you up or drop you off, if it can get there and turn around safely.
what_to_do: First fill out a Deviation Request Form. A supervisor checks the spot, and Mountain Line tells you in writing if it is approved. After that, call 304-291-RIDE (304-291-7433) as little as 15 minutes before you want to be picked up.
contact:
  phone: "304-291-7433"
  url: https://www.busride.org/deviations
  url_label: About deviations
cost: The regular fare plus 50 cents each way. Mountain Line gives the example of $1.25 cash, or 50 cents with a 30-day pass.
sources:
  - url: https://www.busride.org/deviations
    checked: 2026-10-30

title: Domestic violence protective order
slug: wv-domestic-violence-protective-order
org: monongalia-county-magistrate-court
topics: [legal, family]
who_it_is_for: "People being abused by a family or household member, or by someone they dated or had a romantic relationship with. The West Virginia courts say adults and children can get protection. A relative can go to court for a victim who cannot, and a person who saw or reported the abuse can ask for protection if they are being threatened for it."
what_to_do: "A case starts with a form called a petition at Magistrate Court. In Monongalia County, the Magistrate Court is in the Justice Center, Suite 25. The courts' brochure says magistrates are on call 24 hours a day, seven days a week, and that police can take you to court, or you can go on your own. You can bring a support person. A local advocate can go with you, for free."
steps:
  - "Fill out the Domestic Violence Petition (form MDVPETN, also in Spanish). Write the most recent abuse, and any past abuse. Say if the other person has guns or ammunition. You can ask that your own address be kept confidential."
  - "A magistrate asks you questions the same day. If there is an immediate and present danger, the magistrate gives an Emergency Protective Order. The form says to stay at the magistrate office until you get the order."
  - Police deliver the order to the other person. The courts' brochure says this happens within 72 hours.
  - "Family Court holds the final hearing no later than 10 days later. Go to it, or the case may be dismissed. Bring police or medical reports, text messages, photos and other proof. You do not need a lawyer."
  - "The Family Court judge can give a protective order for 90 or 180 days. You can ask to extend it before it ends."
notes:
  - "If the magistrate says no, you can appeal to Family Court within 5 days with form MDVDNYE. The form says there is no filing fee for the appeal, and Family Court must hear it within 10 days."
  - "If you disagree with the Family Court's decision, state law says you can appeal to Circuit Court within 10 days."
  - "In Monongalia County, a court form lets you take part in the final hearing by video from the local advocacy center instead of the courtroom. File it at least 48 hours before the hearing."
  - Protective orders work in every county in West Virginia, and the courts say emergency orders work in other states too.
contact:
  phone: "304-291-7296"
  url: https://www.courtswv.gov/public-resources/court-forms/domestic-violence-forms
  url_label: Domestic violence forms
  place: 75 High Street, Suite 25, Morgantown, WV 26505
cost: "State law says no fees are charged to file or serve the papers until the case is decided. If you cannot afford the costs, you can ask for a fee waiver at the Circuit Clerk's office."
if_you_want_help: [rdvic-court-advocacy, legal-aid-wv-civil-legal-help]

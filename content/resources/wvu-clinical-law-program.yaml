title: Free legal help from WVU law students
slug: wvu-clinical-law-program
org: wvu-college-of-law-clinical-law-program
topics: [legal]
who_it_is_for: "People with low income who qualify, mostly in north central West Virginia. Legal Aid of West Virginia's list of other legal help says the clinic works on family law, Social Security and other public benefits, property, consumer debt, bankruptcy and immigration."
what_to_do: Call the clinic at 304-293-7249 to ask if you qualify. It does not take new cases during holiday or summer breaks, when law students are not in school.
contact:
  phone: "304-293-7249"
  url: https://legalaidwv.org/other-resources-legal-services/
  url_label: Legal Aid's list of other legal help
cost: Free for people who qualify.
sources:

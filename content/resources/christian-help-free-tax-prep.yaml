title: Free tax preparation at Christian Help
slug: christian-help-free-tax-prep
org: christian-help
topics: [taxes, money]
who_it_is_for: Households that earned $67,000 or less in 2025 could get help last season. Ask for this season's limit.
what_to_do: Call 304-296-0221 to book. Trained, IRS-certified volunteers prepare basic returns at Christian Help in downtown Morgantown. Last season it ran Wednesdays, 9 a.m. to 2 p.m., through April 1. As of October 31, 2026, no 2027 dates were posted, and Christian Help's own programs page did not list tax help. Last season's dates were in an article from January 14, 2026, so check again in early January, or call to ask.
what_to_bring:
  - An original photo ID for each person who earned money
  - Social Security numbers for everyone on the return (cards are best), and their birth dates
  - Last year's federal and state returns, if you have them
  - W-2 and 1099 forms from every job, and papers for any other income, such as gig work
  - What you paid for day care, and the day care provider's Social Security number or employer ID number
  - Health insurance forms 1095-A, 1095-B or 1095-C
  - Papers for any deductions, such as gifts to charity
  - For a refund by direct deposit, your bank routing and account numbers, such as a blank check
what_happens: If you file jointly, both spouses come. At the first visit, a volunteer checks that you have every paper and scans them into a secure system. You come back for a second visit to review and approve your return and get a copy.
contact:
  phone: "304-296-0221"

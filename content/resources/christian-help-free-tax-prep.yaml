title: Free tax preparation at Christian Help
slug: christian-help-free-tax-prep
org: christian-help
topics: [taxes, money]
who_it_is_for: Households that earned $67,000 or less in 2025 could get help last season. Ask for this season's limit.
what_to_do: Call 304-296-0221 to book. Trained, IRS-certified volunteers prepare basic returns at Christian Help in downtown Morgantown. Last season it ran Wednesdays, 9 a.m. to 2 p.m., through April 1. The 2027 season dates were not published as of the checked date, so call to ask.
contact:

title: Lost or stolen license plate, registration card or decal
slug: wv-dmv-lost-plate-or-decal
org: wv-dmv
topics: [moving]
who_it_is_for: Owners whose West Virginia license plate, registration card or registration decal was lost or stolen.
what_to_do: If a plate was lost or stolen, tell the West Virginia State Police right away. Then apply for a replacement through DMV Online Services, or with form DMV-32-TR.
steps:
  - You need an insurance certificate or owner's statement of insurance before the DMV issues a new plate.
  - A plate reported lost or stolen gets a new number. For a personalized plate, use form DMV-43-TR to ask for a replica.
cost: "$10.50 for a new plate. $10 for a new decal or registration card."
contact:
  url: https://dmv.wv.gov/vehicle-services/vehicles/registrations
  url_label: Replace a plate or decal
sources:

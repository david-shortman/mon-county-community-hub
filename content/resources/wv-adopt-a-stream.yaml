title: Adopt a stream
slug: wv-adopt-a-stream
org: wv-department-of-environmental-protection
topics: [better]
who_it_is_for: Individuals, families, churches, businesses, schools, civic groups, government agencies, fraternities and communities.
what_to_do: Adopt at least 1 mile of a stream for 3 years. Pick up litter at least once a year. Tell the program 1 week before each cleanup, and send a report after. The state gives bags and gloves and takes away the bagged trash. Apply online, or email or mail the paper form.
contact:
  phone: "1-800-322-5530"
  url: https://apps.dep.wv.gov/ppod/adopt-a-stream.a5w
  url_label: Apply online
  email: depadoptastream@wv.gov
cost: free

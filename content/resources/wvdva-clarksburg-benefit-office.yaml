title: Help filing a VA claim (WVDVA Clarksburg Benefit Office)
slug: wvdva-clarksburg-benefit-office
org: wv-department-of-veterans-assistance
topics: [veterans]
who_it_is_for: "Veterans and families in Monongalia and six other counties: Harrison, Lewis, Marion, Preston, Taylor and Doddridge. The state's Veterans Service Officers give advice on VA benefits. These include disability claims, health care, jobs and housing. The officers are accredited."
what_to_do: Call the Clarksburg office at 304-627-2175. It is at 153 W Main Street, Suite C, Clarksburg. There is no state benefit office in Morgantown.

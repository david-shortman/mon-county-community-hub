title: Ask the court to waive filing fees
slug: court-fee-waiver-wv
org: wv-supreme-court-of-appeals
topics: [legal, government]
who_it_is_for: People who cannot afford court fees in a civil or family case. The courts say the same fee waiver forms work in Magistrate Court, Circuit Court and Family Court. The clerk decides if you qualify, using financial guidelines the state Supreme Court set.
what_to_do: Ask the clerk of the court where you are filing for the fee waiver form, or get it from the West Virginia courts Fee Waiver Forms page. It is called the Financial Affidavit and Application (form SCA-C&M201). Fill it out with your income, bills, debts and property, and attach a pay stub, proof of Social Security or benefits, or another paper that shows your income. The clerk will tell you if you still have to pay. If you think the clerk made a mistake, there is a Motion for Review form (SCA-C&M202) to ask a judge to look at it.
contact:

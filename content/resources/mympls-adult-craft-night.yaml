title: Adult Craft Night at the library
slug: mympls-adult-craft-night
org: morgantown-public-library-system
topics: [community]
who_it_is_for: Adults. The Morgantown and Arnettsville libraries each have a craft night once a month. You make a project and take it home. Past crafts include fabric bookmarks, pet paintings, visible mending and jewelry making.
what_to_do: Check the library calendar for the next date at each library.

title: Jumpstart Savings (save for tools and licenses)
slug: wv-jumpstart-savings
org: wv-state-treasurer
topics: [work]
who_it_is_for: People in the skilled trades, including registered apprentices and journeymen. Also students and graduates of a community and technical college or a career and technical education program.
what_to_do: "Open a Jumpstart Savings account with the State Treasurer's office to save for tools, supplies, equipment, licenses and certifications, and other business costs. Call or email to ask how to open one."
notes:
  - "The state puts in $100 for a West Virginia resident who is under 18, or who joins an approved apprenticeship or training program within 180 days of opening the account."
  - "Money you put in can lower your West Virginia income tax."
contact:
  phone: "681-319-4638"
  email: customerservice@wvjumpstart.gov
  url: https://wvjumpstart.gov/what-is-jumpstart/overview
  url_label: About Jumpstart
cost: No monthly fees or minimum balance, the Treasurer's office says. See its fee schedule for other costs.
sources:

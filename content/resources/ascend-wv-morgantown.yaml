title: Ascend WV, for remote workers moving to the Morgantown area
slug: ascend-wv-morgantown
org: ascend-wv
topics: [moving, work, money]
who_it_is_for: People who live full time outside West Virginia now and work remotely full time for a business based outside the state, or own a business outside the state they can run remotely. You must be 18 or older and a U.S. citizen or green card holder. People who already live in West Virginia cannot apply.
what_to_do: Read the program's terms and FAQ, then apply online. Its site says applications for the Morgantown Area are open now. Check the site before you plan around it, because this can change.
steps:
  - Read the terms and eligibility page and the FAQ on the Ascend WV site.
  - Fill out the online application.
  - The Ascend team reviews applications as they come in. Top-scoring applicants are asked to a video interview before final picks.
  - If you are accepted, you move within 6 months.
options:
  - "$12,000, paid monthly over 24 months."
  - "Or one lump sum, if you buy a home in the area and show it is where you live."
notes:
  - The site also lists free outdoor recreation, free outdoor gear rentals, a welcome trip, free coworking space and social events for people in the program.
  - The payments are taxable. You must live in West Virginia for 2 years in a row to get the full $12,000. If you leave early, you keep what you were paid up to then.
  - This is a private program paid for by a gift, run through WVU. It is not a government benefit.

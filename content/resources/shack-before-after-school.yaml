title: Before and after school care from The Shack (Eastwood, Mylan Park, Ridgedale)
slug: shack-before-after-school
org: the-shack-neighborhood-house
topics: [family, money]
who_it_is_for: Children in kindergarten to 5th grade at Eastwood, Mylan Park and Ridgedale elementary schools.
what_to_do: "Drop-off starts at 7 a.m. and must be by 7:30 a.m. Pick-up is by 5:30 p.m., or 5 p.m. on early release days. The program closes for the school year's holidays and breaks. Apply online or in person at The Shack, 537 Blue Horizon Drive. For 2026-27, online applications for Eastwood are closed; email applications@the-shack.org to get on the waitlist. Questions, call (304) 599-5466, Monday to Friday, 9 a.m. to 5 p.m."
contact:
  phone: "304-599-5466"
  email: applications@the-shack.org
  url: https://the-shack.org/child-care/
what_to_bring:
  - Current shot records (less than 1 year old)
  - A health assessment (less than 2 years old)
  - A copy of the front page of the 2025 federal tax return (Form 1040) for every provider in the household
sources:

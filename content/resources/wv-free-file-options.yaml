title: Free filing for your West Virginia state return
slug: wv-free-file-options
org: wv-tax-division
topics: [taxes, money]
who_it_is_for: The West Virginia Tax Division lists Free File companies that offer free online filing to "qualified West Virginia taxpayers." It says "Each Free File Alliance member sets taxpayer eligibility requirements for its program," such as income, age or military service.
what_to_do: Open the Tax Division's Free File Options page and pick a company from its list, so you get the free offer. The page also says "online filing providers may charge a fee for their service," so read each offer's rules first. The offers change each year, so check the page again in January.

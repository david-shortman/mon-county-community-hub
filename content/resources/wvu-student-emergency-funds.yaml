title: Emergency funds for WVU students
slug: wvu-student-emergency-funds
org: wvu-campus-and-community-life
topics: [money]
who_it_is_for: WVU students who have an unexpected emergency during the academic year, such as a natural disaster, a health concern, or another urgent situation. The funds are not for tuition and fees or standard living expenses, and financial aid can affect whether you get one. See the full rules at the link.
what_to_do: Fill out the application on the Campus and Community Life financial assistance page, then email it to Campuslife@mail.wvu.edu. WVU says applications are reviewed within one business day. Questions, call 304-293-5611 or go to Elizabeth Moore Hall, 1507 University Avenue. Graduate students can also ask about the Stitzel Emergency Fund at 304-293-7173.
contact:
  phone: "304-293-5611"
  email: Campuslife@mail.wvu.edu
  url: https://campuslife.wvu.edu/resource-portal/financial-assistance
  url_label: Apply
  place: "1507 University Avenue, Morgantown, WV 26506"
cost: "Free to apply. WVU says the average award is $500, and in most cases a student can get only one."
sources:

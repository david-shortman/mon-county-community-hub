title: Rental registration and code questions (Town of Star City)
slug: star-city-rental-registration
org: town-of-star-city
topics: [housing]
who_it_is_for: People renting or renting out a home inside Star City town limits.
what_to_do: Star City has a rental registration application that landlords print, fill out and return to the town office. Questions about rental registration go to the town's Code Enforcement Officer during business hours. The town also says anyone who lists a room, apartment or house in Star City for rent on sites like Airbnb must register with the town as a business.
hours: Monday to Friday, 8 a.m. to 4:30 p.m.
contact:

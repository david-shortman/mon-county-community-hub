title: Pre-K and Head Start in Monongalia County Schools
slug: mcs-prek-and-head-start
org: monongalia-county-schools
topics: [family]
who_it_is_for: Children ages 3 and 4. Head Start is free and gives priority to children who are 4 by June 30. Most Head Start families must meet income rules, but some spaces are open to families over the limit. Children with delays, children coming from Early Head Start, and foster children may start at age 3.
what_to_do: Pre-K and Head Start use one application, on the PSTEPS site. For the 2026-27 school year, applications sent between February 4 and April 16, 2026 had an equal chance at a spot, and families heard by July 1. Bring a birth certificate, shot record, one proof of where you live, a well-child checkup and a dental exam report. For Head Start, also bring proof of income, like a tax return, W-2, SSI statement or SNAP card. No internet? Call 304-291-9210, extension 1756, for an appointment, or pick up a packet at 1751 Earl Core Road, Morgantown.
contact:

title: Free 12-week construction pre-apprenticeship (Step Up)
slug: wvww-step-up-construction
org: west-virginia-women-work
topics: [work]
who_it_is_for: Anyone 18 or older who wants to learn new skills and start a career in the trades. It was created with women in mind. No experience is needed.
hours: Classes are Monday to Thursday, 9 a.m. to 4 p.m. Fridays are for study on your own.
what_to_do: Apply online. Classes run in spring and fall and often fill quickly. The training sites are 205 10th Street, Fairmont, and 501 19th Street, Dunbar. The program does not give rides, but staff help find options, and mileage is paid back for in-person days when funds allow. Questions, email info@wvwomenwork.org.

title: Help finding and paying for child care
slug: child-care-resource-center-morgantown
org: catholic-charities-west-virginia
topics: [family, money]
who_it_is_for: Families looking for child care. To get help paying for it, parents must meet income rules and either work or go to school. Some parents in job training may also qualify. See the full rules at the link.
what_to_do: The state's list of child care resource and referral offices shows a Child Care Resource Center office at 20 Scott Avenue, Suite 302, Morgantown, run by Catholic Charities West Virginia. Call 304-292-7357 or 1-888-272-7357 to ask about providers near you and about help with the cost. Working parents should have pay stubs from the last 30 days. Parents in school need their grades and a class schedule stamped and signed by the registrar. You must show all income, including child support. You can also search licensed providers by county on the state's child care provider search.
contact:
  phone: "304-292-7357"
  url: https://www.ccwva.org/programs/child-care-resource-center/
  place: "20 Scott Avenue, Suite 302, Morgantown, WV"
cost: Free to ask. If you get help paying, what you pay is based on your monthly income before taxes and your family size, on a sliding scale.

title: Help finding and paying for child care
slug: child-care-resource-center-morgantown
org: catholic-charities-west-virginia
topics: [family, money]
who_it_is_for: "Families looking for child care. Some families can get help paying for it. The child must be under 13, or 13 to 17 with special needs or under court supervision. Parents \"must be working, going to school, or searching for a job to apply.\" To start, income must meet \"the income guidelines based at 150% of the poverty level\"; once you get help, \"income may raise to 185%.\" For a family of 3, the state fee scale (2024 poverty levels) puts these at $3,228 and $3,981 a month before taxes."
what_to_do: The Child Care Resource Center office is at 20 Scott Avenue, Suite 302, Morgantown, run by Catholic Charities West Virginia. Call 304-292-7357 or 1-888-272-7357 to ask about providers near you and about help with the cost. You can also search licensed providers by county on the state's child care provider search.
what_to_bring:
  - "If you work: pay stubs from the last 30 days."
  - "If you are in school: your grades and a class schedule stamped and signed by the registrar."
  - "Proof of all income, including child support."
get_in: walk-in
not_posted: [hours]
contact:
  phone: "304-292-7357"
  url: https://www.ccwva.org/programs/child-care-resource-center/
  place: "20 Scott Avenue, Suite 302, Morgantown, WV"
steps:
  - "To apply for help paying, go to the office to meet with a case manager. CCRC does not make appointments: intakes are first come, first served, and the last one is no later than 4:15 p.m."
  - "Plan on about 45 minutes. CCRC's families page says 30 to 45 minutes, and its home page says no less than 45."
  - "It is best to have your child's provider picked before you apply, CCRC says."
  - "Bring your proofs if you can. If not, you have 13 days after the intake to turn them in. If you miss that, the application is withdrawn and you would owe the child care program."
notes:
  - "CCRC's families page also says you can call your local CCRC office to ask for an intake by phone."
  - "The Morgantown office has a drop box for papers. Report any change, like a new job or a lost job, to your case manager within 5 days."
cost: Free to ask. If you get help paying, what you pay is based on your monthly income before taxes and your family size, on a sliding scale.

title: Open a business in Morgantown city limits
slug: morgantown-business-license
org: city-of-morgantown
topics: [work]
who_it_is_for: People opening a business inside Morgantown city limits.
hours: Monday through Thursday, 7 a.m. to 5:30 p.m.
opening_hours:
  - days: [mon, tue, wed, thu]
    opens: "07:00"
    closes: "17:30"
what_to_do: "The city lists four steps. 1. Call the Planning Division at 304-284-7431 to check that your location is zoned for your business. 2. Register with the state through the One Stop Business Portal. 3. Apply for a city business license through the Morgantown Access Portal. 4. If your business has a physical location in the city, apply for a Certificate of Occupancy and schedule inspections with Code Enforcement and the Fire Marshal at least one week before opening. The city also charges a B&O tax on gross income and a municipal service fee. Licenses run for a fiscal year and expire June 30. B&O tax questions: BandO@morgantownwv.gov or the Finance Department at 304-284-7408."
contact:
  phone: "304-284-7408"
  url: https://www.morgantownwv.gov/247/Steps-to-Starting-Your-Business
  url_label: City steps and forms
  place: "389 Spruce Street, Morgantown, WV 26505"
cost: "City business license fee: $20 (also $20 for a nonprofit). Certificate of Occupancy application fee: $65. Businesses that sell beer, wine or liquor pay extra city license fees, listed on the application. B&O tax rates are not listed on the city's web page."

title: Bus to Ruby Memorial Hospital
slug: bus-to-ruby-memorial
org: mountain-line-transit-authority
topics: [health]
who_it_is_for: Anyone going to J.W. Ruby Memorial Hospital by bus.
what_to_do: "Take Route 9 Purple Line. It starts at Pifer Terminal, goes through downtown (up Pleasant to Spruce to Wiley) and the Mountainlair, out Stewart Street to Suncrest Town Centre, then Ruby, University Park and Towers."
options:
  - "Monday to Saturday: the first run is 6:30 a.m. and the last run is 7:15 p.m."
  - "Sunday: the first run is 9:30 a.m. and the last run is 9:30 p.m."
notes:
  - "One trip around the route takes 83 minutes, so the time at your stop is different."
  - "Thursday to Saturday evenings and nights during the WVU fall and spring sessions, Route 1 Campus PM also stops at Ruby, 6 p.m. to 3:40 a.m."
contact:
  phone: "304-291-7433"
  url: https://www.busride.org/9-purple-line
  url_label: Purple Line times
  place: "1 Medical Center Drive, Morgantown, WV 26506"
cost: A single ride is $0.75 to $1.00. Free with a WVU ID.

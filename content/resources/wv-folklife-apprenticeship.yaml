title: West Virginia Folklife Apprenticeship Program
slug: wv-folklife-apprenticeship
org: wv-humanities-council
topics: [community]
who_it_is_for: An expert in a traditional art and a person who wants to learn it from them. That can be music, dance, craft, food traditions, storytelling and more. The two apply together for a yearlong, one-on-one apprenticeship. The program pays the mentor and the apprentice a stipend.
what_to_do: The 2026-27 application closed September 18, 2026. The program opens every other year, and the next date is not posted yet. Check the program page for the next round.

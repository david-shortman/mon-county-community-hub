who_it_is_for: Anyone. Christian Help says "No matter your experience or ability, we have a place for you." Groups from work, school or clubs are welcome too.
what_to_do: Fill out the volunteer sign-up. Daily jobs include sorting donations, filling food orders, reviewing resumes, data entry and building upkeep. Christian Help works with your interests and schedule.

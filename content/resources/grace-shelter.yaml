title: Grace Shelter, emergency beds for adults
slug: grace-shelter
org: catholic-charities-west-virginia
topics: [housing]
who_it_is_for: Adults 18 and older who are homeless, about to lose housing, or trying to get away from domestic violence.
what_to_do: Go to 20 Scott Ave, Suite 201, Morgantown. Open 24/7. Beds are first come, first served. There are 19 beds (13 for men, 6 for women). Pets and service animals are not allowed.
hours: Open 24 hours, every day
contact:
  phone: "681-867-1002"
  place: 20 Scott Ave, Suite 201, Morgantown, WV 26508
  url: https://www.ccwva.org/programs/grace-shelter/
cost: free
what_happens: The shelter's goal is to help each guest find permanent housing within 45 days. It does not offer mental health or addiction services in house, but it refers guests to community providers. Partners bring budgeting workshops, job readiness training, rental search help and help getting government benefits to guests.
sources:
  - url: https://www.ccwva.org/programs/grace-shelter/
    checked: 2026-10-31

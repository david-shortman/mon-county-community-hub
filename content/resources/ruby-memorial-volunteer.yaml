title: Volunteer at J.W. Ruby Memorial Hospital
slug: ruby-memorial-volunteer
org: wvu-medicine-ruby-memorial
topics: [community]
who_it_is_for: Adults 18 and older who are not college students can apply at any time. College students apply during set windows; spring 2027 is December 18, 2026 to January 19, 2027.
hours: Volunteer Services, Monday to Friday, 8 a.m. to 4 p.m.
what_to_do: Apply online, then finish an online orientation and an onboarding session. Volunteers need certain shots, and a yearly flu shot to keep volunteering during flu season. They are asked to do at least one shift a week. Shifts include mornings, afternoons, evenings and weekends.

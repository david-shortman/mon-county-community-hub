title: Food permit for a farmers market in Monongalia County
slug: monchd-farmers-market-permit
org: monongalia-county-health-department
topics: [growing]
who_it_is_for: Farmers market vendors in Monongalia County who sell foods that must be kept hot or cold to stay safe, or who make food at the market. The health department says vendors who sell produce and packaged foods that do not need to be kept hot or cold do not need its permit, but those foods may have labeling rules. See the full rules at the link.
what_to_do: Read the health department's farmers market page and vendor guide, then call Environmental Health with questions. The permit only covers farmers markets in Monongalia County. Other events need a temporary food permit.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/farmers-market-vendor-inspections
  url_label: Read the rules

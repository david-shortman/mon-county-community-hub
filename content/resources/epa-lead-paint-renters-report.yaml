title: Renting an older home? Lead paint rules and how to report a problem
slug: epa-lead-paint-renters-report
org: us-environmental-protection-agency
topics: [housing, safety]
who_it_is_for: People who rent a home built before 1978.
what_to_do: If your landlord does work that disturbs paint, they must follow EPA's lead-safe rule. If you think there is a problem, call the National Lead Information Center at 1-800-424-5323 or report it to EPA online.
notes:
  - "West Virginia's lead program says: if you rent, tell your landlord about peeling or chipping paint, and clean up paint chips right away."
contact:
  phone: "1-800-424-5323"
  url: https://www.epa.gov/lead/lead-renovation-repair-and-painting-program

title: How the state clears snow from state roads
slug: wvdoh-snow-priorities
org: wv-division-of-highways
topics: [weather]
who_it_is_for: Anyone driving on state roads in Mon County. Not sure if a road is a state road? The state has a road search map by address.
what_to_do: "The state's snow and ice season usually runs November through March. Crews clear roads in this order: first, interstates, expressways and major routes; second, school bus routes not in the first group; third, local roads; fourth, park and forest roads. While snow is still falling, crews may go back to the first group, which can delay side roads. Mon County is in District 4, based in Clarksburg: call 304-842-1500, Monday to Friday, 7:30 a.m. to 4 p.m. For road conditions, check WV 511."

title: Bus to Mon General hospital
slug: bus-to-mon-general
org: mountain-line-transit-authority
topics: [health]
who_it_is_for: Anyone going by bus to the hospital that Mountain Line's route page calls "Mon General."
what_to_do: "Take Route 47 Northern Circulator from Mountaineer Station. Mountain Line's route list says it leaves Mountaineer Station for Mon General at 26 minutes after the hour."
options:
  - "Monday to Friday: the first run is 5:55 a.m. and the last run is 6:55 p.m."
  - "Saturday: the first run is 7:26 a.m. and the last run is 6:55 p.m."
  - "Sunday: it does not run."
notes:
  - "It goes to Unity House, Riverside Commons, Campus Evolution Villages, Independence Hills, The Villages at West Run, North Hills and Mon General."
  - "To get to Mountaineer Station, you can take the Gold Line or the Red Line and change buses there."
contact:
  phone: "304-291-7433"
  url: https://www.busride.org/47-northern-circulator
  url_label: Route 47 times
cost: A single ride is $0.75 to $1.00. Free with a WVU ID.

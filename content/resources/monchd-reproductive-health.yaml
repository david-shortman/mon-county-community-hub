title: Birth control, pregnancy tests and STI testing at the health department
slug: monchd-reproductive-health
org: monongalia-county-health-department
topics: [health]
who_it_is_for: Any female or male of childbearing age, including teens. Services are confidential.
what_to_do: Call 304-598-5119 for an appointment; the clinic is by appointment only. It offers many kinds of birth control, pregnancy tests with counseling and referrals, prenatal vitamins, yearly exams, Pap tests, and STI testing and treatment. It is part of the West Virginia Family Planning Program.
contact:
  phone: "304-598-5119"
  url: https://www.monchd.org/services/reproductive-health
cost: Free or low cost.
sources:

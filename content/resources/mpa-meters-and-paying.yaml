title: Street meters and how to pay
slug: mpa-meters-and-paying
org: morgantown-parking-authority
topics: [moving]
town: Morgantown
who_it_is_for: Anyone parking at a meter or pay station in downtown Morgantown. The Parking Authority says meters and all city parking rules are enforced 24 hours a day.
what_to_do: Pay at the meter or pay station, or with the ParkMobile app. At a pay station, enter your stall number, then pay by card or coins. You do not need to put the receipt in your car. With ParkMobile, enter your license plate number exactly, because officers check payment by plate.
steps:
  - "Downtown street meters on Brockway, Chancery Row, Chestnut, Fayette, Foundry, High and Walnut are $1 an hour, 24 hours a day."
  - The Green Zone (meters with a green top on High, Walnut, Fayette, Chancery Row, Foundry and Chestnut) has a 2-hour limit per 24 hours.
  - Short-term lots and spaces have a 2-hour limit. You may not keep adding money past the time limit. The Parking Authority says that gets a ticket.
  - Long-term lots allow up to 10 hours at 75 cents an hour.
  - Face the meter or stall number. Do not back in, and stay inside the yellow lines.
  - Red meters and red curbs are loading zones during the posted hours.
cost: Most lots are 75 cents an hour. Downtown street meters are $1 an hour. Some short-term lots cost more at night. Check the meter.
contact:

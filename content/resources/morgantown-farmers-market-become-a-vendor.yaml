title: Become a vendor at the Morgantown Farmers Market
slug: morgantown-farmers-market-become-a-vendor
org: morgantown-farmers-market-growers-association
topics: [growing, work]
who_it_is_for: Farmers and food makers within 50 air miles of Morgantown who grow or make what they sell. The market is producer-only, so products must be grown or made by the vendor, with local farm ingredients in processed foods.
what_to_do: Read the 2026-2027 market rules on the market's vendor page. The market says the board posts new rules and applications in January or February, and applications are due March 1.
contact:
  url: https://www.morgantownfarmersmarket.org/vendors.html
  url_label: Vendor rules and application
cost: "From the 2026-2027 rules: vendor membership is $100 a year for new vendors and $75 for returning vendors. Summer space is $100 per space for the season (Saturday or Wednesday market). Winter space is $10 per space per market. The market also takes a 3% commission on gross sales, and new vendors keep at least $50 in an escrow account."
steps:
  - Read the market rules to see if your products are allowed.
  - Get any state or county permits your products need. The rules have a section on licenses, permits and insurance.
  - Send the application with your product plan and fees by March 1.
sources:

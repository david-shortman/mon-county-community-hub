title: State vehicle inspection sticker
slug: wv-vehicle-inspection
org: wv-dmv
topics: [moving]
who_it_is_for: Every vehicle registered in West Virginia. The DMV says a safety inspection is required every 24 months, and it is illegal to drive without a valid inspection sticker.
what_to_do: Take your vehicle to any official inspection station licensed by the West Virginia State Police. If it passes, the station puts a sticker good for 24 months inside the windshield.
what_to_bring:
  - A valid registration card
  - A current certificate of insurance
steps:
  - New residents have 10 days from the date they title a vehicle in West Virginia to get it inspected. The same goes for a vehicle bought out of state.
  - A vehicle bought in West Virginia without a valid sticker must be inspected within 10 days.
  - "Stickers from Louisiana, Mississippi, Missouri, New Hampshire, New York, Oklahoma, Texas, Utah and Wyoming count in West Virginia until they expire."
contact:

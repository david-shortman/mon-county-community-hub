who_it_is_for: Children at Cheat Lake and Suncrest elementary schools.
what_to_do: A structured program with physical activity and social skills lessons. It does not run on snow days or when schools are closed. Morning care does not run on 2-hour delay days, and after school care does not run on 2-hour early dismissal days. Sign up on Kidematics' page, or call (304) 906-3612 to ask about cost.

title: Reentry Planner workbook, with a chapter on finding a job (DCR)
slug: wvdcr-reentry-planner
org: wv-division-of-corrections-and-rehabilitation
topics: [work, legal]
who_it_is_for: People getting ready to leave a West Virginia prison or jail, people who are already home, and the families and helpers who support them.
what_to_do: Open or print the free planner from the Division of Corrections and Rehabilitation's website. It has pages to fill in for IDs, recovery, family support, money owed, school, work, rides, housing and supervision.
options:
  - "Work chapter (pages 76 to 93 of the planner): how to fill out job applications, and how to talk about a record in a job interview."
  - "Most chapters end with an action plan page you fill in yourself."

title: Reentry Planner workbook, with a chapter on finding a job (DCR)
slug: wvdcr-reentry-planner
org: wv-division-of-corrections-and-rehabilitation
topics: [work, legal]
who_it_is_for: "People getting ready to leave a West Virginia prison or jail. It is also for people who are already home, and for the family and helpers who support them."
what_to_do: Open or print the free planner from the Division of Corrections and Rehabilitation's website. It has pages to fill in for IDs, recovery, family support, money owed, school, work, rides, housing and supervision.
options:
  - "Work chapter (pages 76 to 93 of the planner): how to fill out job applications, and how to talk about a record in a job interview."
  - "Most chapters end with an action plan page you fill in yourself."
notes:
  - "Some pages were written for Nebraska's prison system (NDCS), not West Virginia's. The ID page (page 10) says some costs are \"Covered by NDCS\". The health care pages (31 and 47) describe NDCS care, and the housing page (105) is about Nebraska's landlord and tenant laws."
  - "Those costs and rules may not apply in West Virginia. Ask DCR which ones apply to you. For a West Virginia ID or birth certificate, see Birth certificates, IDs and records on this site."

title: Peer support groups for depression and bipolar disorder (DBSA WV)
slug: dbsa-wv-support-groups
org: dbsa-wv
topics: [health]
who_it_is_for: People living with mood disorders, like depression or bipolar disorder, and their family members, friends, parents and caregivers. Groups are led by peers, people who have lived it, not by counselors.
what_to_do: Call the DBSA WV office at 304-241-1862 to ask about a group. For an online group, ask for the Zoom link. You do not have to live in Morgantown to join the online group.
contact:
  phone: "304-241-1862"
  email: dbsawvmountaineer@gmail.com
  url: https://dbsawv.org/dbsa-wv-support-group-meetings/
  url_label: Group times
  place: 5000 Greenbag Road, Suite E-7, Morgantown, WV 26501
cost: free
hours: Groups meet on set days, listed below. The office is open Tuesday to Friday, 10 a.m. to 3 p.m., and Saturday, 10 a.m. to 2 p.m.
access: The office is inside the Mountaineer Mall, by the ramps.
meetings:
  - name: DBSA Mountaineer group (in person)
    when: 2nd and 4th Wednesday of the month, 2 to 3 p.m., at the DBSA WV office in the Mountaineer Mall.
  - name: Expressive Arts support group (in person)
    when: Every Saturday, 2 to 3:30 p.m., at the DBSA WV office in the Mountaineer Mall.
  - name: Morgantown online group (Zoom)
    when: 1st and 3rd Wednesday of the month, 6:30 to 7:30 p.m.
options:

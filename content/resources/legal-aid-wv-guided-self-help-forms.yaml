title: Free guided forms for divorce and custody (Legal Aid)
slug: legal-aid-wv-guided-self-help-forms
org: legal-aid-of-west-virginia
topics: [legal, family]
who_it_is_for: People in West Virginia who want to file their own divorce or custody case in family court.
what_to_do: "Legal Aid of West Virginia's free online tool asks you questions and makes the court papers for your divorce or custody case. You can save your answers for up to a month. Legal Aid says some family court judges want their own forms, so you may want to ask the Circuit Clerk's office which forms the judge uses."

title: VA help for veterans who are homeless or about to lose housing
slug: va-homeless-veterans-line
org: us-department-of-veterans-affairs
topics: [veterans, housing]
who_it_is_for: Veterans who are homeless or may lose their housing soon, and family, friends or helpers calling for a veteran.
what_to_do: Call 877-424-3838, any time, day or night, or chat online. A trained VA counselor helps you find housing support and VA services near you.
contact:
  phone: "877-424-3838"
  url: https://www.va.gov/homeless/nationalcallcenter.asp
cost: free
what_happens: A trained VA counselor asks a few questions about your situation and any urgent needs. They help you find housing support or VA services near you, and connect you with local VA staff if you need ongoing help. The online chat is free and confidential.
sources:
  - url: https://www.va.gov/homeless/nationalcallcenter.asp
    checked: 2026-11-02

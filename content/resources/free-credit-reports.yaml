title: Get your free credit reports
slug: free-credit-reports
org: consumer-financial-protection-bureau
topics: [money]
who_it_is_for: Anyone who wants to see what Equifax, Experian and TransUnion have on file about them.
what_to_do: Go to AnnualCreditReport.com or call 1-877-322-8228. The CFPB says this is how to get the free credit report authorized by law.
steps:
  - Online, go to AnnualCreditReport.com.
  - Or call 1-877-322-8228 (TTY 1-800-821-7232).
  - Or fill out the Annual Credit Report request form and mail it to Annual Credit Report Request Service, PO Box 105281, Atlanta, GA 30348-5281.
notes:
  - "How often: The CFPB says you can get a free report from each of the three companies once a week at AnnualCreditReport.com, and that you also have the right to one free report from each company every 12 months. USA.gov says that by law you can get a free credit report each year from the three companies."
  - The CFPB warns that some other websites that say they offer free credit reports only give one if you buy something, or bill you later for services you have to cancel.
  - Your credit report usually does not include your credit score, USA.gov says.
  - The CFPB says you may get extra free reports in some cases, for example if you were turned down for credit, insurance or a job because of a credit report (ask within 60 days of the notice), you think your file is wrong because of fraud, you are unemployed and plan to apply for a job within 60 days, or you get public welfare assistance.
contact:

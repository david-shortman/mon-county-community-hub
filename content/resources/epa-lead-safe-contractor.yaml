title: Hire a lead-safe certified contractor for work on an older home
slug: epa-lead-safe-contractor
org: us-environmental-protection-agency
topics: [home, safety]
who_it_is_for: People with a home built before 1978 who plan to renovate, repair or paint. Homes built before 1978 are more likely to have lead-based paint.
what_to_do: Look up a lead-safe certified contractor near you with EPA's search tool before you hire someone.
notes:
  - "EPA's rule says anyone paid to do work that disturbs painted surfaces in homes, child care centers and preschools built before 1978 must be certified, and their workers trained in lead-safe work practices. This includes painters, plumbers, carpenters and electricians."
  - "In general, the rule does not apply to homeowners working on their own pre-1978 home. It does apply if you rent out all or part of your home, run a child care center in your home, or buy, fix up and sell homes for profit."
  - If you do the work yourself, EPA has a guide to lead-safe work practices for do-it-yourself projects.
  - "EPA's Renovate Right booklet explains lead-safe work for homeowners, renters, child care providers and parents."

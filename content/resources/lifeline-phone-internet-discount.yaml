title: Lifeline, a monthly discount on phone or internet
slug: lifeline-phone-internet-discount
org: universal-service-administrative-company
topics: [money]
who_it_is_for: Households where someone gets Medicaid, SNAP, SSI, Federal Public Housing Assistance, a Housing Choice (Section 8) Voucher, project-based rental assistance, or the Veterans Pension and Survivors Benefit. Or households with income at or below 135% of the 2026 federal poverty guidelines, which USAC lists as $21,546 for 1 person, $29,214 for 2, $36,882 for 3 and $44,550 for 4. Only one discount per household. See the full rules at the link.
what_to_do: Apply online at lifelinesupport.org, through a phone or internet company that offers Lifeline, or by mail to Lifeline Support Center, PO Box 1000, Horseheads, NY 14845. Have proof ready, like a benefit letter, or a tax return or three months of pay stubs in a row. After you are approved, sign up with a company that offers Lifeline. You must recertify each year, within 60 days of being asked. If you have a disability and need help applying, or want a paper application mailed to you, call 1-800-234-9473.
contact:
  phone: "1-800-234-9473"
  url: https://www.lifelinesupport.org/how-to-apply/
  url_label: How to apply
cost: Lifeline takes up to $9.25 a month off phone, internet, or bundled service.
what_to_bring:
  - "If you get SNAP, Medicaid, SSI, public housing help or a Veterans Pension: a benefit letter, statement or a screenshot of your online benefits account. It must show your name, the program, who issued it, and a date in the last 12 months or an end date in the future."
  - "If you apply by income: last year's tax return, a yearly income statement from your job, a Social Security or unemployment benefit statement, or three months of pay stubs in a row, dated in the last 12 months"
  - "If asked to prove your birth date: a driver's license, U.S. birth certificate, passport or other government ID that has not expired"
  - "If asked to prove your Social Security number: a Social Security card, an SSA-1099, a W-2 from the last 2 years, or last year's tax return"
what_happens: Lifeline says it will contact you if it needs more papers and tell you how to send them. After you are approved, you sign up with a phone or internet company that offers Lifeline.

title: Substance use treatment at Valley HealthCare
slug: valley-substance-use-treatment
org: valley-healthcare-system
topics: [health]
who_it_is_for: People in Marion, Monongalia, Preston and Taylor counties who want help with alcohol or drug use.
what_to_do: Call 304-296-1731 to talk about options, including intensive outpatient treatment, medication treatment, and peer recovery support. For a substance use crisis, call the 24/7 crisis line at 1-800-232-0020. To ask about short-term crisis care at Valley's Crisis Residential Unit, call 304-225-2280.

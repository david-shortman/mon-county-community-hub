title: Monongalia County Department of Human Services (DoHS) office
slug: monongalia-county-dohs-office
org: wv-department-of-human-services
topics: [money, food, health]
who_it_is_for: "Anyone in Mon County applying for or asking about state help in person. Health: Medicaid, WVCHIP for children, Medicaid for long-term care, help paying Medicare costs, and rides to medical visits. Food: SNAP. Money: heating bill help (LIEAP), emergency help, cash help for families (TANF), and the school clothing allowance."
what_to_do: The office is at 114 South High Street, Morgantown. Open Monday to Friday, 8:30 a.m. to 5 p.m. Call 304-285-3175. You can also apply for most of these programs online at WV PATH.
contact:
  phone: "304-285-3175"
  url: https://dohs.wv.gov/offices/monongalia-county-dohs-office
cost: free

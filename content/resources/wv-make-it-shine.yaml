title: Make It Shine spring cleanup
slug: wv-make-it-shine
org: wv-department-of-environmental-protection
topics: [better]
who_it_is_for: Volunteers, businesses, community groups and local governments that want to hold a cleanup in West Virginia.
what_to_do: The statewide cleanup runs each April. Groups apply ahead of time, and once approved, the state gives gloves, bags and litter grabbers, and covers hauling and landfill fees. In 2026 the cleanup ran April 6 to 19 and applications were due March 6. The 2027 dates are not posted yet.

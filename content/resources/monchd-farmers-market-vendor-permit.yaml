title: Farmers market vendor food permit
slug: monchd-farmers-market-vendor-permit
org: monongalia-county-health-department
topics: [work, growing]
who_it_is_for: Farmers market vendors in Monongalia County who sell foods that must be kept cold or hot to be safe (like cheesecake), or who cook food at the market. Vendors who sell only produce and packaged foods that do not need temperature control do not need this permit, but may have labeling rules.
what_to_do: Apply to the health department for a Food or Retail Permit for a Farmer's Market. There are three types, retail, consignment and food service. Food service vendors need a Certified Food Protection Manager. The permit works only at farmers markets in Mon County. For other events, get a temporary food permit. For labeling rules, see the Farmers Market Vendor Guide or call the WV Department of Agriculture at 304-558-3550.

title: WIC at the Monongalia County Health Department
slug: monchd-wic
org: monongalia-county-health-department
topics: [family, food]
who_it_is_for: Pregnant women, women breastfeeding a baby up to the baby's first birthday, women up to six months after a pregnancy ends, babies, and children up to their fifth birthday, with household income no more than 185% of the federal poverty guidelines. Families on Medicaid, TANF or SNAP qualify on income automatically. A nutrition check is done at the WIC clinic. See the full rules at the link.
what_to_do: Call WIC at 304-598-5181 or 1-800-675-5181, or apply online. The Morgantown office is at 1311 Pineview Drive, White Birch Tower II, Suite 400. WIC gives nutrition and breastfeeding counseling, health checks and healthy foods. Anyone can take its free breastfeeding classes.
hours: Monday through Friday, 8:30 a.m. to 4:30 p.m. The first Tuesday of the month, 11 a.m. to 7 p.m.
contact:

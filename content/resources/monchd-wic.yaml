title: WIC at the Monongalia County Health Department
slug: monchd-wic
org: monongalia-county-health-department
topics: [family, food]
who_it_is_for: Pregnant women, women breastfeeding a baby up to the baby's first birthday, women up to six months after a pregnancy ends, babies, and children up to their fifth birthday, with household income no more than 185% of the federal poverty guidelines. Families on Medicaid, TANF or SNAP qualify on income automatically. A nutrition check is done at the WIC clinic. See the full rules at the link.
what_to_do: Call WIC at 304-598-5181 or 1-800-675-5181, or apply online. The Morgantown office is at 1311 Pineview Drive, White Birch Tower II, Suite 400. WIC gives nutrition and breastfeeding counseling, health checks and healthy foods. Anyone can take its free breastfeeding classes.
hours: Monday through Friday, 8:30 a.m. to 4:30 p.m. The first Tuesday of the month, 11 a.m. to 7 p.m.
contact:
  phone: "304-598-5181"
  url: https://www.monchd.org/departments-programs/wic
  place: 1311 Pineview Drive, Morgantown, WV 26505
cost: free
what_to_bring:
  - "ID for the parent: a photo driver's license or state ID, a Social Security card, a state birth certificate or a marriage license"
  - "ID for each child: a photo state ID, a Social Security card or a state birth certificate"
  - "For a baby: a state birth certificate, crib card or hospital discharge papers"
  - Proof of address, such as a rent receipt or a utility bill
  - Proof of household income, such as pay stubs, a TANF or SNAP letter, or a Medicaid card
  - If you are pregnant, proof of pregnancy from a doctor, the health department or a family planning clinic
  - Shot records for babies and children
  - Custody or foster papers, if you have them
  - A dry diaper may also help
what_happens: Call to set up an appointment. State WIC says to plan on about an hour. Staff look over your papers and health history, do a short health check for each person, talk with you about eating habits, and then tell you if you can get WIC.

title: Christian Help Food Pantry
slug: christian-help-food-pantry
org: christian-help
topics: [food]
who_it_is_for: "Everyone. Christian Help says there are \"no income restrictions, demographic criteria, or affiliation requirements.\" Each household can get one food order every 30 days."
what_to_do: Pick up your food order in person at 219 Walnut Street during store hours. Call 304-296-0221 with questions.
hours: Monday, Tuesday and Thursday, 9 a.m. to 4 p.m. Friday, 9 a.m. to 2 p.m. Wednesday is for dropping off donations only. Hours can change around events.
opening_hours:
  - days: [mon, tue, thu]
    opens: "09:00"
    closes: "16:00"
  - days: [fri]
    opens: "09:00"
    closes: "14:00"
notes:
  - "An order is about a 3 to 5 day supply, based on the size of your household. It can include canned and boxed food and baby items such as formula, plus toiletries and pet supplies, depending on donations."
  - "Before Thanksgiving, Christmas and Easter, Christian Help says to stop by for a holiday meal while supplies last."
not_posted: [get_in]

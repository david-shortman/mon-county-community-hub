title: Police non-emergency line for Mon County (MECCA)
slug: mecca-non-emergency
org: mecca
topics: [moving]
who_it_is_for: Anyone in Mon County who needs police for something that is not an emergency. Star City and Westover point residents to this line, and Morgantown lists it too.
what_to_do: Call 304-599-6382, any hour, day or night.
contact:
  phone: "304-599-6382"

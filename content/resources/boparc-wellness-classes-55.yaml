title: Yoga, tai chi, ballet and line dancing for adults 55 and over (BOPARC)
slug: boparc-wellness-classes-55
org: boparc
topics: [disability, community]
who_it_is_for: Drop-in classes made for adults 55 and over. Adults of any age can come.
what_to_do: Go to the Wiles Hill Community Center, 287 Eureka Drive, at class time. Tai Chi is Mondays at 9 a.m. or 3:45 p.m. for beginners, and 10 a.m. for the next level. Line Dancing is Thursdays, 10:30 a.m. to noon. Yoga for Seniors is Fridays at 9 a.m., and Ballet Basics is Fridays at 10 a.m. Each class is about an hour. Questions? Call BOPARC at 304-296-8356.
contact:
  phone: "304-296-8356"
  url: https://www.boparc.org/wellness-classes.html
  url_label: Class times
  place: 287 Eureka Dr, Morgantown, WV
cost: Yoga and Ballet Basics are $5.35 a class. BOPARC's page lists Tai Chi as "$5:35" a class, so ask to confirm. Line Dancing is free with membership; ask BOPARC which one. The center's fitness room membership for people 50 and over is $15 a year (2024 prices).
hours: Classes Monday, Thursday and Friday mornings, and Monday afternoon.
get_in: walk-in

title: Grey Line bus to Pittsburgh and the Pittsburgh airport
slug: grey-line-pittsburgh
org: mountain-line-transit-authority
topics: [moving]
who_it_is_for: Anyone traveling between Clarksburg, Fairmont, Morgantown and the Pittsburgh area. A WVU ID does not cover the Grey Line.
what_to_do: Reserve a seat on the Grey Line page or call 304-296-3869. If you plan to pay cash when you board, call first to make sure a seat is open. Stops include Fairmont, Clarksburg, Mountaineer Station, Waynesburg PA, Washington PA, Pittsburgh International Airport (lower level, door 9) and the Pittsburgh Greyhound Station. For trips home and back at college breaks and holidays, Mountain Line says to book a few weeks ahead. To change or cancel a ticket, call at least 24 hours before you leave. A change or cancellation costs $5. The Grey Line runs 365 days a year.
what_to_bring:
  - One small carry-on bag, up to 25 pounds
  - Checked bags up to 50 pounds each
contact:
  phone: "304-296-3869"
  url: https://www.busride.org/29-grey-line
  url_label: Grey Line page
cost: "Morgantown to Pittsburgh or the Pittsburgh airport: $15. Morgantown to Washington PA: $10. Morgantown to Waynesburg PA: $5. Morgantown to Fairmont: $3."

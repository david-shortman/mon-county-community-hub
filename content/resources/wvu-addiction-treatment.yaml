title: Addiction treatment at WVU Medicine's Chestnut Ridge Center
slug: wvu-addiction-treatment
org: wvu-medicine
topics: [health]
who_it_is_for: Adults with alcohol or drug problems, and their families, plus teens with substance use problems. The inpatient unit is for adults with an urgent mental health need who are having problems because of alcohol or drugs, and also treats women who are pregnant.
what_to_do: Call 304-598-4214. Programs include an intensive outpatient program (groups three days a week, usually about 12 weeks), an 11-bed inpatient unit with safe detox, an opioid treatment program (COAT), and the PREVENT clinic for teens.

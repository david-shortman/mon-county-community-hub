title: City dog parks
slug: boparc-dog-parks
org: boparc
topics: [outdoors]
who_it_is_for: Dog owners. Dogs must be over six months old, licensed and vaccinated.
what_to_do: "There are two. Stanley's Spot is on the Deckers Creek Rail-Trail between the Walnut Street and Pleasant Street bridges. Krepps Dog Park is in Krepps Park, behind the lower pavilion. Clean up after your dog, keep it under voice control, and keep a leash where people can see it. No staff watch the dog parks."

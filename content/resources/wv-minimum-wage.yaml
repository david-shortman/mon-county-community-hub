title: West Virginia minimum wage
slug: wv-minimum-wage
org: wv-division-of-labor
topics: [work, money]
who_it_is_for: Most workers in West Virginia. The Division of Labor says "the state minimum wage of $8.75 will apply whenever there are six (6) or more non-exempt employees working at any one separate, distinct and permanent work location." Some jobs are not covered, so ask the Wage and Hour Section about yours.
what_to_do: If you think you are paid less than the minimum wage, call the Wage and Hour Section at 304-558-7890 or send a Request for Assistance (see the card "If your employer did not pay you").
contact:
  phone: "304-558-7890"
  url: https://labor.wv.gov/wage-hour/jobs-act/minimum-wage
cost: free

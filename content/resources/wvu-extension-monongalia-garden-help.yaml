title: Garden and plant questions at WVU Extension, Monongalia County
slug: wvu-extension-monongalia-garden-help
org: wvu-extension-monongalia-county
topics: [growing]
who_it_is_for: Gardeners and growers in Monongalia County. WVU says an Extension agent or Extension Master Gardener can diagnose many common plant and insect problems, and county offices help with soil tests.
hours: Monday to Friday, 8:30 a.m. to 4:30 p.m.
what_to_do: Call the county office with your question. Ask for help reading a soil test, or with sending a plant sample to the WVU Plant Diagnostic Clinic.

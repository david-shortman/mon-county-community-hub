title: Support groups and a 24/7 Helpline for dementia caregivers
slug: alz-wv-caregiver-groups
org: alzheimers-association-west-virginia
topics: [disability, health]
who_it_is_for: Unpaid family members or friends caring for someone with Alzheimer's disease or another dementia. The groups are not for professionals or paid caregivers. There are also early-stage groups for people who have a diagnosis.
what_to_do: Call the Helpline at 800-272-3900, any time, day or night, to find a group and register. Groups meet in person or online. The chapter's current list shows no in-person group in Monongalia County, so ask about online groups.
contact:

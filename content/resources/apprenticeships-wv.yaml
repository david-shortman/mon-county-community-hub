title: Apprenticeships (paid on-the-job training)
slug: apprenticeships-wv
org: workforce-west-virginia
topics: [work]
who_it_is_for: People who want to learn a trade or job while getting paid. You work alongside a mentor and take classes. Apprenticeships are in construction, manufacturing, health care, technology and more, and they often lead to a full-time job.
what_to_do: Search for openings near Morgantown with the U.S. Department of Labor's Apprenticeship Job Finder at apprenticeship.gov, or ask the WorkForce West Virginia office on Commerce Drive.
contact:
  url: https://www.apprenticeship.gov/apprenticeship-job-finder
cost: You are paid while you learn.
sources:

title: Tween and teen programs at the Morgantown Public Library
slug: mympls-teen-programs
org: morgantown-public-library-system
topics: [family]
who_it_is_for: Tweens and teens. Teens can read books and manga, borrow video games, get homework help and come to programs.
what_to_do: Teen programs include Teen Anime Club, Teen Hangout, Dungeons and Dragons groups, a Trading Card Game Group and NASA's AstroCamp. Tweens have Tween Time, Minecraft Hour and Tween D&D. Check the library calendar for days and times, or call 304-291-7425.

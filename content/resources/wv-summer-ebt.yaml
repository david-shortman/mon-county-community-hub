title: Summer EBT, grocery money for school kids in summer
slug: wv-summer-ebt
org: wv-department-of-human-services
topics: [food, family]
who_it_is_for: "School-age children in households with lower income. Free meals for every student at school do not sign a child up for Summer EBT. The state's Summer EBT page says students who attend Community Eligibility Provision (CEP) schools \"may still be eligible for Summer EBT, but they must apply, unless they receive a qualified benefit.\""
what_to_do: Watch for the 2027 application in the spring. In 2026, the first deadline was May 15, and the state took applications through August 20. "There is no online application option." Get a paper form from the state's Summer EBT page or a local DoHS office. Not sure if your child is signed up automatically? Call 1-877-716-1212.
notes:
  - The state's education department says "The total benefit per eligible child is $120."
  - The 2027 dates were not announced when we last checked.
what_happens: "Many children are signed up without applying. The state puts the money on a family's EBT card if it gets SNAP or WV WORKS, or mails a new EBT card if a child has Medicaid or is in foster care, homeless or in Head Start. If you apply on paper, the state says it decides most applications within 15 business days of getting a complete one. If it asks you to prove something, usually pay, you have 15 calendar days to send it or the application is denied."
contact:
  phone: "1-877-716-1212"
  url: https://bfa.wv.gov/summer-ebt
cost: free

title: Start water and sewer service with the Morgantown Utility Board
slug: mub-start-service
org: morgantown-utility-board
topics: [moving]
who_it_is_for: People moving into a home with Morgantown Utility Board (MUB) water or sewer. Star City and Granville send residents to MUB for water, sewer or trash billing.
what_to_do: Apply on MUB's start service page. You need a Visa, MasterCard or Discover card to finish the request. For a brand new building, call 304-292-8443, Monday to Friday, 8 a.m. to 4:30 p.m. The office is at 278 Greenbag Road.
contact:
  phone: "304-292-8443"
  url: https://mub.org/start-service
cost: A $125 security deposit for all new customers, paid at the end of the application.

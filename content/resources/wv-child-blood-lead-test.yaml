title: Get your young child a blood lead test
slug: wv-child-blood-lead-test
org: wv-childhood-lead-poisoning-prevention-project
topics: [health, family]
who_it_is_for: "Young children in West Virginia. A state rule says all children shall get a screening test at one year and again at two years of age, and children 36 to 72 months old if they have not been tested before."
what_to_do: Ask your child's doctor or your local health department for a blood lead test. Call the state program to find out how to get your child tested.
steps:
  - Ask for the test at a well child visit. The state says children are tested at places like community health centers, doctors' offices and local health departments.
  - The test uses a small blood sample from a finger or a vein in the arm.
  - If the test shows a problem with lead, more testing will be done.
notes:
  - "The state also advises a yearly test for children up to age 6 who live, play or spend time in a home built before 1978 with chipping or peeling paint or recent remodeling, who live with someone who works with lead or has a hobby that uses lead, or who live near heavy traffic or a business that uses lead. See the full list at the link."
  - People with high lead levels often do not seem sick. A blood test is the only way to know.
  - Adults who think they were around too much lead should also be tested.

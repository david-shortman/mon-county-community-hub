title: Reentry help and peer mentors (The REACH Initiative)
slug: reach-reentry-help
org: reach-initiative
topics: [work, legal]
who_it_is_for: People coming home from jail or prison in West Virginia, and their families.
what_to_do: "Call 855-WV-REACH (855-987-3224) to do an intake screening. REACH says it does not give money directly, but it looks for free or low cost programs to help until you can support yourself."
options:
  - "Peer Reentry Navigator Program: a mentor who has been through reentry. Call 855-987-3224 and choose option 3."
  - "Backpack Program: a backpack with things to get you through the first week home. Ask your probation or parole officer, or call REACH directly."
  - "Monongalia, Marion and Preston reentry council: meets on Zoom the 4th Tuesday of each month at 10 a.m. Open to community members, service providers, employers and anyone who wants to help. Email councils@wvreentry.org."
contact:
  phone: "855-987-3224"
  url: https://wvreentry.org/

title: Selling your own eggs (small producer registration)
slug: wvda-small-egg-producer-registration
org: wv-department-of-agriculture
topics: [growing]
who_it_is_for: People who sell eggs from their own hens. The state page says anyone marketing 150 dozen eggs or less of their own production is exempt from permit and inspection fees, but still registers each year.
what_to_do: Get the Egg Distributor Certificate of Authorization (Small Producer) application from the WVDA page and mail it in. Call the WVDA food products office with questions.
contact:
  phone: "304-558-2227"
  url: https://agriculture.wv.gov/licenses/food-products-and-aquaculture-licenses/egg-distributor-certificate-of-authorization-small-producer/
  url_label: Egg registration page
cost: No fee for small producers. The registration runs one year, July 1 to June 30.

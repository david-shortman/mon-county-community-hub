title: Emergency Assistance to stop a utility shutoff
slug: wv-emergency-assistance-utility
org: wv-department-of-human-services
topics: [money]
who_it_is_for: Customers at risk of having their service shut off. Mon Power's page lists it as a one-time payment, open all year.
what_to_do: Bring your disconnect notice to your county Department of Human Services (DoHS) office, or call 304-558-0684.
contact:
  phone: "304-558-0684"
  url: https://www.firstenergycorp.com/help/billingpayments/assistance_serviceprogram/mon_power.html
what_to_bring:
  - Your disconnect notice. Mon Power's page says you must show it at the county office.
what_happens: Mon Power's page says "Emergency Assistance is a one-time payment that is applied to the customer's account."

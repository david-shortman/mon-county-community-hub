title: Back-to-school shots at the Monongalia County Health Department
slug: monchd-school-shots
org: monongalia-county-health-department
topics: [family, health]
who_it_is_for: Children who need the shots required for public school. Children 18 and younger get shots free through Vaccines for Children if they have no insurance, if their insurance does not cover shots, if they have WV Medicaid or WVCHIP, or if they are American Indian or Alaska Native.
what_to_do: Call 304-598-5119 to make an appointment. The health department holds school shot clinics in the summer, and you can book earlier to beat the rush. It is at 453 Van Voorhis Road, Morgantown.
contact:
  phone: "304-598-5119"
  url: https://www.monchd.org/services/immunizations
cost: Free for children who qualify for Vaccines for Children. Most insurance and WV Medicaid are accepted.
sources:
  - url: https://www.monchd.org/services/immunizations
    checked: 2026-10-30

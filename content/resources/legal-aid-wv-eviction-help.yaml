title: Free legal help if you are facing eviction
slug: legal-aid-wv-eviction-help
org: legal-aid-of-west-virginia
topics: [housing, legal]
who_it_is_for: West Virginia renters facing eviction or a problem with a landlord. It is for renters with low income, and for victims of domestic violence. If you are not sure you qualify, Legal Aid says to apply anyway.
what_to_do: Have a court hearing or another deadline in the next 10 days? Call 866-255-4370 right away, instead of using the online form. Phone applications are taken Monday, Wednesday, Thursday and Friday from 8:30 a.m. to 3:30 p.m., and Tuesday from 8:30 a.m. to 12:30 p.m. Legal Aid says online applications are closed for a staff training. They reopen Thursday, November 19, 2026. Until then, call. After that, you can also apply online from the Apply for Help page. Have a phone number where staff can call you back. Legal Aid's website also has free forms for answering an eviction case and for appealing to Circuit Court. If you are deaf or hard of hearing, use 7-1-1 WV Relay. Interpreters are available by phone.
contact:
  phone: "866-255-4370"
  url: https://legalaidwv.org/get-help/apply-for-help/
  url_label: Apply for help
cost: Free. Some court filing fees may still apply.

title: Ask the Solid Waste Authority about trash pickup and recycling
slug: mon-swa-ask-about-trash
org: monongalia-county-solid-waste-authority
topics: [recycling]
who_it_is_for: Anyone in Monongalia County with a question about trash pickup, recycling, or getting rid of hard items. There is no public map or street list of pickup days, so call to ask who serves your address and which day they come.
what_to_do: Call 304-292-3801 or email moncountyswa@gmail.com. The office is at 113 Mathieson Street, Suite 100, Morgantown.
contact:
  phone: "304-292-3801"
  url: https://www.monongaliacountyswa.com
cost: free

title: Job search help for WVU alumni
slug: wvu-career-center-alumni
org: wvu-career-services-center
topics: [work]
who_it_is_for: People who graduated from WVU and are looking for a job or changing careers.
what_to_do: WVU alumni keep their Handshake account after they graduate. Use it to search jobs, sign up for career fairs and events, and book appointments where they are offered. If you can no longer get into your WVU email, email careercenter@mail.wvu.edu and ask them to update your email address. Questions, call 304-293-2221.
contact:

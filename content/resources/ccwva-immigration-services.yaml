title: Refugee resettlement and low-cost immigration legal help from Catholic Charities West Virginia
slug: ccwva-immigration-services
org: catholic-charities-west-virginia
topics: [legal, family]
who_it_is_for: "Catholic Charities lists this program among its services for Monongalia County. Resettlement: it says federal law decides who can get help, and lists refugees, asylees, certain Special Immigrant Visa (SIV) holders, victims of human trafficking, Cuban and Haitian entrants, and certain humanitarian parolees. Legal help: West Virginia residents who need family-based immigration help, such as bringing family members to the United States, or help keeping a lawful immigration status. See the full rules at the link."
what_to_do: "Call 304-343-1036. Catholic Charities says it is the only refugee resettlement agency in West Virginia. For newcomers it lists help with housing and airport pickup before arrival, lessons on life in the community, referrals to services and benefits, getting ID documents, signing up for English classes, enrolling children in school, getting ready for work, and family reunification applications. Its legal help includes preparing family-based and marriage-based visa petitions, consular processing applications, green card applications, work permit applications, DACA renewals, Temporary Protected Status (TPS) applications and renewals, and applications for citizenship."
contact:
  phone: "304-343-1036"
  url: https://www.ccwva.org/programs/west-virginia-immigration-refugee-resettlement-services/
cost: Legal help is low cost. Ask about fees when you call.

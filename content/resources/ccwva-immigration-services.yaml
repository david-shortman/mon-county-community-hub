title: Refugee resettlement and low-cost immigration legal help from Catholic Charities West Virginia
slug: ccwva-immigration-services
org: catholic-charities-west-virginia
topics: [legal, family]
who_it_is_for: "Resettlement help: Catholic Charities says federal law decides who can get it. It lists refugees, asylees (people granted asylum after they came to the United States), certain Special Immigrant Visa (SIV) holders, victims of human trafficking, Cuban and Haitian entrants, and certain humanitarian parolees. Legal help: West Virginia residents who want to bring family members to the United States, or who need help keeping a lawful immigration status. Catholic Charities lists both among its services for Monongalia County. See the full rules at the link."
what_to_do: "Call 304-343-1036. Catholic Charities says it is the only refugee resettlement agency in West Virginia. For newcomers, it helps with housing and airport pickup before arrival. It teaches lessons on life in the community. It helps people get ID documents, sign up for English classes, enroll children in school, get ready for work, and apply to reunite with family. It also refers people to other services and benefits. Its legal help includes preparing visa petitions for family members and spouses, green card applications, work permit applications, and applications for citizenship. It also helps with consular processing applications, DACA (Deferred Action for Childhood Arrivals) renewals, and Temporary Protected Status (TPS) applications and renewals."
contact:
  phone: "304-343-1036"
  url: https://www.ccwva.org/programs/west-virginia-immigration-refugee-resettlement-services/
cost: Legal help is low cost. Ask about fees when you call.

title: Low-cost immigration legal services from Catholic Charities West Virginia
slug: ccwva-immigration-services
org: catholic-charities-west-virginia
topics: [legal, family]
who_it_is_for: West Virginia residents who need help with family-based immigration, such as bringing family members to the United States, or with keeping a lawful immigration status. Catholic Charities lists this program among its services for Monongalia County.
what_to_do: Call 304-343-1036. Catholic Charities says it helps prepare family-based and marriage-based visa petitions, consular processing applications, green card applications, work permit applications, DACA renewals, Temporary Protected Status (TPS) applications and renewals, and applications for citizenship.
contact:
  phone: "304-343-1036"
  url: https://www.ccwva.org/programs/west-virginia-immigration-refugee-resettlement-services/
cost: Low cost. Ask about fees when you call.

title: Free lease review and legal help for WVU students
slug: wvu-student-legal-services
org: wvu-student-legal-services
topics: [legal, housing]
who_it_is_for: Students currently enrolled at WVU who have paid the student activity fee. It cannot help with cases against other students, student groups, WVU faculty or staff, or WVU itself.
what_to_do: Fill out the application for services on the Student Legal Services website (the Appointment tab). Staff will call or email you to set a time. Bring your lease, letters, emails and any other papers about the problem. WVU's Off-Campus Housing office suggests a free lease review with Student Legal Services before you sign a lease. For accommodations, call the office.
contact:
  phone: "304-293-4897"
  email: SLS@mail.wvu.edu
  url: https://studentlegalservices.wvu.edu/apply
  url_label: Apply for help
cost: "No added fees for its services. Students pay service of process and court filing fees if a case goes to court."

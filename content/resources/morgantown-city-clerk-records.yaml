title: City of Morgantown records (City Clerk)
slug: morgantown-city-clerk-records
org: city-of-morgantown
topics: [government]
town: Morgantown
who_it_is_for: "Anyone looking for City of Morgantown records. The city says the City Clerk is the \"Record Keeper of: Council meetings and minutes; Deeds; History of the City; Ordinances; and Resolutions.\""
what_to_do: "Many records are online first: the city's Digital Archives, the City Code, and council agendas and minutes. For other City Clerk records, call or email the Clerk's office at City Hall."
hours: The city lists City Hall office hours as Monday through Thursday, 7 a.m. to 5:30 p.m.
contact:

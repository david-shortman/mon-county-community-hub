who_it_is_for: People looking for a volunteer shift in and around Morgantown. WVU and local groups post ongoing roles and shifts on set dates. United Way says WVU staff, faculty and students connect through iServe.
what_to_do: Open the list and look for shifts that happen on the day you are free. Each listing has its own details.

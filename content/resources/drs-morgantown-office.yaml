title: Job help for people with disabilities (DRS Morgantown office)
slug: drs-morgantown-office
org: wv-division-of-rehabilitation-services
topics: [disability, work]
who_it_is_for: Youth and adults, ages 14 and up, whose disability makes it hard to learn or work. A counselor helps you look at your interests and skills, explore jobs, and make a plan to reach a work goal.
what_to_do: Call the Morgantown branch office at 304-285-3155. It is at Sabraton Plaza, 1415 Earl Core Road, Morgantown. You can also call DRS toll free at 1-800-642-8207.
contact:
  phone: "304-285-3155"
  url: https://wvdrs.org/
cost: Ask the office.

title: Community Tree Grants
slug: wv-community-tree-grants
org: wv-division-of-forestry
topics: [better]
who_it_is_for: West Virginia towns and cities, public schools and nonprofits, for trees on public property in eligible areas. Applicants must be registered vendors with the state.
what_to_do: Grants are up to $50,000 with no local match. Applications are taken at any time while money lasts. Download the instructions and application from the program page. The state asks applicants to email its urban forester while planning a project.

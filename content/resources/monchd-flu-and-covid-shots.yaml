title: Flu and COVID shots at the Monongalia County Health Department
slug: monchd-flu-and-covid-shots
org: monongalia-county-health-department
topics: [health]
who_it_is_for: Anyone 6 months and older. Children 18 and younger get their shots free through Vaccines for Children if they have no insurance, if their insurance does not cover shots, if they have WV Medicaid or WVCHIP, or if they are American Indian or Alaska Native.
what_to_do: Call the clinic at 304-598-5119 to book a shot. Flu shots are offered during flu season. The health department is at 453 Van Voorhis Road, Morgantown, and is open Monday to Friday, 8:30 a.m. to 4:30 p.m.
contact:
  phone: "304-598-5119"
  url: https://www.monchd.org/services/immunizations
cost: Most insurance and WV Medicaid are accepted, and the clinic has lower prices based on income. Free for children who qualify for Vaccines for Children.

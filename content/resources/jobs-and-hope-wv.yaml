title: Jobs & Hope West Virginia
slug: jobs-and-hope-wv
org: jobs-and-hope-wv
topics: [work, health]
who_it_is_for: West Virginia residents 18 and older who want a career and have a barrier to getting one, such as recovery from substance use. You must take part in training or job placement each month, stay in recovery if that applies, and pass drug tests.
what_to_do: Call 833-784-1385 or email JobsAndHope@wv.gov to sign up. A transition agent at a local WorkForce office makes a plan with you, and can help with things like a missing birth certificate, Social Security card or ID.
contact:
  phone: "833-784-1385"
  url: https://jobsandhope.wv.gov/start-your-journey/
cost: free

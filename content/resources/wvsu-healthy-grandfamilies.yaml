title: Healthy Grandfamilies, for grandparents raising grandchildren
slug: wvsu-healthy-grandfamilies
org: west-virginia-state-university
topics: [family]
who_it_is_for: Grandparents raising grandchildren in West Virginia. The program's Monongalia County page lists the county coordinator as "TBA," so contact the statewide project staff.
what_to_do: Call WVSU Extension project staff at 304-204-4078. The program is a series of 9 discussion groups plus up to 6 months of social work support.
what_happens: Discussion group topics include parenting, communication, self-care, stress, legal issues, social media, school programs, family response to addiction and nutrition. Social work support includes an intake assessment, help finding community resources and advocacy.

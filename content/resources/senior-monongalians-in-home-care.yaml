title: In-home help for older adults (Senior Monongalians)
slug: senior-monongalians-in-home-care
org: senior-monongalians
topics: [disability, health]
who_it_is_for: Older adults in Mon County who need help at home. The Lighthouse Program is for people 60 and older whose income or assets are too high for Medicaid. FAIR respite is for caregivers of someone with Alzheimer's or dementia. Senior Monongalians also provides Medicaid Aged and Disabled Waiver services and VA-approved in-home services. See the full rules at the link.
what_to_do: Call the nurse's office at 304-296-2503 to ask which program fits. Lighthouse gives help with personal care, mobility, meals and housekeeping, up to 60 hours a month based on need and caregivers available; a Senior Monongalians nurse decides eligibility. FAIR sends a sitter or companion so the caregiver can rest, up to 16 hours a week, after a doctor's diagnosis and a home visit by the nursing staff. For the Medicaid waiver, start with your doctor and your local DoHS office.
contact:
  phone: "304-296-2503"
  url: https://www.seniormons.org/blank-1
  url_label: In-home programs
cost: "Lighthouse and FAIR have an hourly co-pay based on household income. Private pay care is $25 an hour when workers are available."

title: Rural Rehabilitation Loan Fund (low-interest farm loans)
slug: wvda-rural-rehabilitation-loan-fund
org: wv-department-of-agriculture
topics: [growing, work]
who_it_is_for: New agribusinesses, and existing farms, livestock operations and ag businesses with plans to expand. The state says past loans paid for things like greenhouses, equipment, buildings and farm property.
what_to_do: Fill out the loan application on the WVDA page. Send it with a business plan and a cover letter that explains your loan request and collateral.
contact:
  phone: "304-558-2221"
  url: https://agriculture.wv.gov/divisions/executive/rural-rehabilitation-loan-fund/
  url_label: Loan page and application
cost: A low-interest loan. The page does not list rates.
steps:
  - Download the application from the WVDA page.
  - Write a business plan. The WVDA says its Ag Business staff can help with the plan.
  - Email the finished PDF to the loan program coordinator (address on the page), or call to ask for a paper application by mail.
sources:
  - url: https://agriculture.wv.gov/divisions/executive/rural-rehabilitation-loan-fund/
    checked: 2026-11-01

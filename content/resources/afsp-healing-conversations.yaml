title: Healing Conversations, a talk with someone who has also lost a loved one to suicide
slug: afsp-healing-conversations
org: american-foundation-for-suicide-prevention
topics: [health]
who_it_is_for: People who have lost someone to suicide, whether the loss was recent or years ago.
what_to_do: Fill out the short online form to ask for a visit. AFSP asks a few questions about your loss, then matches you with a trained volunteer who has also lost someone to suicide. The volunteer reaches out to set up one meeting, by phone, video or in person, at a time that works for you. Questions go to healingconversations@afsp.org.
contact:
  email: healingconversations@afsp.org
  url: https://afsp.org/healing-conversations
  url_label: Ask for a visit

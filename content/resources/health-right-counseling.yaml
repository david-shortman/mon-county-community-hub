title: Free counseling at Milan Puskar Health Right
slug: health-right-counseling
org: milan-puskar-health-right
topics: [health]
who_it_is_for: Health Right patients. The clinic serves West Virginians with income up to 250% of the federal poverty level, and people with Medicaid. If you are unsure, the clinic says to call.
what_to_do: Licensed therapists give individual, couples or family counseling for needs like anxiety, depression, trauma and substance use. The clinic also has a medication program for opioid use disorder. To become a patient, call 304-292-8234 or come in to 10 Scott Avenue, Morgantown.

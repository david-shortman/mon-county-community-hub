title: Find a lawyer for a first meeting of $25 or less
slug: wv-lawyer-referral-service
org: west-virginia-state-bar
topics: [legal]
who_it_is_for: Anyone looking for a private lawyer in West Virginia. The State Bar's Lawyer Referral Service lists local lawyers by practice area, such as family law, consumer and small claims, criminal law, estate planning, employment and landlord-tenant.
what_to_do: Pick the practice area you need on the Lawyer Referral Service website, then search for a lawyer near you. Contact the lawyer and say you found them through the WV State Bar Lawyer Referral Service. The lawyer may agree to a first 30-minute consultation for no more than $25. You do not have to hire the lawyer after that meeting.
contact:
  phone: "304-553-7220"
  url: https://wvlawyerreferral.org/
  url_label: Search for a lawyer
cost: No more than $25 for the first 30 minutes. After that, the lawyer's own fees apply, and the State Bar says the meeting will help you learn what those would be.

title: Sports, swimming and recreation for people with disabilities (SteppingStones)
slug: steppingstones-recreation
org: steppingstones
topics: [disability, community]
who_it_is_for: Children and adults with intellectual and physical disabilities, from birth and up. The center at Mylan Park has a gym and two heated pools. The indoor pool is open all year. It also has rooms for cooking, computers, art and calm sensory play.
what_to_do: New to SteppingStones? Stop by the office Monday to Friday, 8 a.m. to 4 p.m., for a tour and a new participant application. Once your application is on file, call 304-983-7837 to sign up for programs.
contact:

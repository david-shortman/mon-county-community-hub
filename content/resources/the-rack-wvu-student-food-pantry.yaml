title: The Rack student food pantry at WVU
slug: the-rack-wvu-student-food-pantry
org: wvu-student-engagement-and-leadership
topics: [food]
who_it_is_for: Students currently enrolled at WVU.
what_to_do: Fill out the 2025-2026 intake form before your first visit. Then go to Morgan House, 660 N. High Street, Morgantown (ground level, use the side entrance), Monday to Friday, 8:15 a.m. to 4:45 p.m.. Bring your WVU student ID and a bag. Hours may change during university breaks, and it is closed on university holidays.

title: The Rack student food pantry at WVU
slug: the-rack-wvu-student-food-pantry
org: wvu-student-engagement-and-leadership
topics: [food]
who_it_is_for: Students enrolled on WVU's Morgantown campus.
what_to_do: Register on PantrySoft before your first visit. The link is on The Rack's page. You do not need an appointment. Then go to Morgan House, 660 N. High Street, Morgantown (ground level, use the side entrance), Monday to Friday, 8:15 a.m. to 4:45 p.m. Check in at the front desk with your WVU ID card. You can visit once a day. Bring a reusable bag. Summer hours are shorter, hours may change during university breaks, and it is closed on university holidays.

title: Free clinic, prescriptions and dental referrals at Milan Puskar Health Right
slug: health-right-clinic
org: milan-puskar-health-right
topics: [health]
who_it_is_for: West Virginia residents with low income who have no health insurance or not enough, up to 250% of the federal poverty level. It also accepts Medicaid.
what_to_do: The clinic gives primary care and helps patients get their medicines; it fills more than 55,000 prescriptions a year. It also arranges referrals for dental care, eye care, lab work and some specialty care. To become a patient, call 304-292-8234 for a phone screening. The clinic is at 10 Scott Avenue, Morgantown, open Monday to Friday, 8 a.m. to 4:30 p.m. In an emergency, call 911.
contact:

title: Story times at the Morgantown Public Library System
slug: mympls-story-times
org: morgantown-public-library-system
topics: [family]
who_it_is_for: Babies, toddlers and preschoolers, with a parent or caregiver.
what_to_do: Story times run at the main library on Spruce Street and at branches. The branches post weekly times. At the main library, story times are on some Tuesdays, Wednesdays and Thursdays, so check the library calendar for exact dates. Questions, call 304-291-7425.

title: Monongalia County Family Court
slug: mon-family-court
org: monongalia-county-circuit-clerk
topics: [legal, family]
who_it_is_for: "People with a divorce, custody, child support, paternity or grandparent visitation case in Monongalia County. The West Virginia courts say family court judges hear divorce, annulment, separate maintenance, paternity, grandparent visitation, parenting time and family support cases. Monongalia and Preston counties share one family court circuit."
hours: Circuit Clerk's office, Monday to Friday, 8:30 a.m. to noon and 1 to 5 p.m.
what_to_do: "Family Court is in the Monongalia County Justice Center at 75 High Street in Morgantown. You file your papers with the Circuit Clerk's office (Suite 12), which keeps the family court records and takes the fees. The clerk's office says it takes cash or money order only, not personal checks. The court's instructions say clerks and family court staff are not allowed to give legal advice or check your forms."
contact:
  phone: "304-291-7240"
  url: https://www.courtswv.gov/public-resources/court-information-county/monongalia_county
  url_label: Court contacts for Mon County
  place: 75 High Street, Morgantown, WV 26505
cost: "The fee to file for divorce is $135. Mailing the papers to the other person by certified mail is $20. You can ask to have court fees waived if you cannot afford them."

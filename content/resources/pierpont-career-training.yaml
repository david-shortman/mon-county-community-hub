title: Short career trainings at Pierpont
slug: pierpont-career-training
org: pierpont-community-and-technical-college
topics: [work]
who_it_is_for: Adults who want a job certificate quickly, without a full degree. Trainings include computer and IT certificates (CompTIA), industrial mechanic, electrical and automation technician, medical assistant, EKG (heart test) technician, emergency medical technician (EMT), drawing blood (phlebotomy), surgical technology, and prep for the TEAS nursing school entrance test.
what_to_do: Pierpont's Career and Corporate Training office runs these as open enrollment classes, online, in person or a mix. Call or email to ask about start dates and cost. Pierpont says some people pay with federal student aid (the FAFSA form), the WV Future Workforce Grant, or a job training scholarship from the Region VI Workforce Development Board. The college is based in Fairmont.

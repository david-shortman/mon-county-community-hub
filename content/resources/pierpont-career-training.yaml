title: Short career trainings at Pierpont
slug: pierpont-career-training
org: pierpont-community-and-technical-college
topics: [work]
who_it_is_for: Adults who want a job certificate quickly, without a full degree. Trainings include CompTIA computer certifications, industrial mechanical technician, electrical and automation technician, clinical medical assistant, EKG, EMT-Basic, phlebotomy, surgical technology, and TEAS test prep.
what_to_do: Pierpont's Career and Corporate Training office runs these as open enrollment classes, online, in person or a mix. Call or email to ask about start dates and cost. Pierpont says some people pay with the FAFSA, the WV Future Workforce Grant, or a WIOA training scholarship through the Region VI Workforce Development Board. The college is based in Fairmont.

title: Free legal help with debt collectors, loans and unsafe work
slug: msj-consumer-debt-legal-help
org: mountain-state-justice
topics: [legal, work]
who_it_is_for: West Virginians with low income. Mountain State Justice says it focuses on people who are being harassed by debt collectors, have unfair charges on loans or credit accounts, were lied to when getting a loan, are having trouble with car payments, bought a defective car or mobile home, are forced to work in unsafe conditions, or faced retaliation for complaining about unsafe work.
what_to_do: Call 304-344-3144 or 800-319-7132 to see if you qualify and to schedule an intake. For an education or criminal justice issue, Mountain State Justice says to call 304-326-0188.
contact:
  phone: "304-344-3144"
  url: https://mountainstatejustice.org/get-help/
  url_label: Get help
cost: free
get_in: call-first
sources:

title: West Virginia's outdoor burning rules (forest fire seasons)
slug: wv-outdoor-burning-rules
org: wv-division-of-forestry
topics: [safety]
who_it_is_for: "Anyone in West Virginia burning leaves, brush, grass or other yard debris outdoors. State law says \"March 1 through May 31, and October 1 through December 31 are designated as forest fire seasons.\""
what_to_do: "During those seasons, burn only at night. The law says you may burn \"only between 5 p.m. and 7 a.m., at which time the fire must be extinguished.\" Before you light it, clear a safety strip around the pile."
steps:
  - "Check the date. Fall forest fire season is October 1 through December 31, and spring season is March 1 through May 31."
  - "Burn only between 5 p.m. and 7 a.m., and put the fire out by 7 a.m."
  - "Clear a safety strip. The law says to \"remove all flammable material from the area immediately surrounding the material to be burned,\" and \"this safety strip shall in no event be less than 10 feet wide.\""
  - "Do not burn during a burning ban. The law lets the state Division of Forestry, with the Governor's approval, ban fires in an area, even the ones it usually allows."
what_happens: "Two kinds of attended fires are allowed at any hour during fire season, unless a burning ban is in effect: a small fire for cooking, light or warmth with all grass, brush and debris cleared for 10 feet around it, and burning when the ground around it is covered by \"one inch or more of snow.\" Breaking the law is a misdemeanor, with a fine of \"not less than $100 and not more than $1,000 for each violation,\" plus a $200 civil penalty."
contact:
  url: https://code.wvlegislature.gov/20-3-5/
  url_label: Read the law
cost: Free for households. The law's $125 burning permit fee is only for businesses like "commercial, manufacturing, public utility, mining" work, and farms do not pay it.

title: Respite and other help while you wait for the I/DD Waiver
slug: wv-idd-waitlist-family-support
org: wv-department-of-human-services
topics: [disability, family]
who_it_is_for: "Families of a child or adult approved for the Intellectual and Developmental Disabilities (I/DD) Waiver who are waiting for a slot. The state says that once you are approved, you get a letter listing the services you may get while you wait. The Family Support Program below has its own rules."
what_to_do: "Call the Developmental Disabilities Division of the state Bureau for Behavioral Health at 304-356-4811 to ask about these programs."
options:
  - "Waitlist Support Grant: for people on the I/DD Waiver list. The state says it can help pay for a break for caregivers (respite), day care in a facility for adults over 18, support at work, behavior support, and changes to a home or vehicle."
  - "Family Support Program (the Waiver site calls it the Family and Community Support Program): the state says it can pay for respite care, rides to services, equipment, health needs insurance does not cover, and changes to make a home easier to use. The Bureau for Behavioral Health says families with a child or adult with a developmental disability living at home can get it. Family income does not decide who qualifies, but families may be asked to share costs. Money is limited. In Mon County, apply through LiveAbility at 304-296-6091."
  - "Private Duty Nursing: a Medicaid program for children under 21 with skilled nursing at home. Call the Bureau for Medical Services at 304-558-1700."
contact:
  phone: "304-356-4811"
  url: https://iddwprogram.wv.gov/
  url_label: I/DD Waiver

title: Get a finger stick lead test at the health department
slug: monchd-lead-test
org: monongalia-county-health-department
topics: [health]
who_it_is_for: "Anyone 1 or older. Some adults might want to think about getting tested. That includes people with jobs like painting, construction, home remodeling, radiator repair or battery or scrap metal recycling. It also includes people who live in older homes with old paint or water pipes."
what_to_do: Call 304-598-5181 to make an appointment. The test is an easy finger stick, given through the health department's WIC program.
cost: "If you have insurance, it is billed. If you do not, a grant from the Centers for Disease Control and Prevention, through the West Virginia Childhood Lead Poisoning Prevention Program, pays for the test."
get_in: appointment
contact:
  phone: "304-598-5181"
  url: https://monchd.org/services/lead-testing/
sources:

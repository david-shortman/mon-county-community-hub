title: Marilla Park
slug: boparc-marilla-park
org: boparc
topics: [outdoors]
who_it_is_for: A city park with the Marilla Recreation Center and BOPARC's customer service office.
what_to_do: "It has the Marilla Skate Park, an outdoor pool with water slides, a wooded trail system, 2 playgrounds, 2 basketball courts, a large grass field with a gaga ball court, and six tennis courts. The Good Bridge leads to the Deckers Creek Trail. Call about renting the pavilion."

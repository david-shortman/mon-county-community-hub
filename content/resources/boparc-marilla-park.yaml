title: Marilla Park
slug: boparc-marilla-park
org: boparc
topics: [outdoors]
who_it_is_for: A city park with the Marilla Recreation Center and BOPARC's customer service office.
what_to_do: "It has the Marilla Skate Park, an outdoor pool with water slides, a wooded trail system, 2 playgrounds, 2 basketball courts, a large grass field with a gaga ball court, and six tennis courts. The pavilion is being replaced as part of the Lower Marilla Park Improvement Project, which BOPARC expects to finish in early 2027. Parts of lower Marilla Park are closed for construction, and the way in from the Deckers Creek Trail across the Good Bridge is closed until the project is done. The park trails stay open."

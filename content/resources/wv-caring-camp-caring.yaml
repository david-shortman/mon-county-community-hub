title: Camp Caring, a grief camp for children
slug: wv-caring-camp-caring
org: wv-caring
topics: [family, health]
who_it_is_for: Children who are grieving the loss of a loved one, and the adults who love them. Grown-ups can come too, with their own sessions on working through grief and helping children through theirs.
what_to_do: Fill out the camper application on the Camp Caring page. Space is limited. The page does not give this year's date or place, so call the Grief and Loss office at 304-599-4200 and ask for grief and bereavement.
notes:
  - After WV Caring gets your application, the camp director contacts you with details and next steps, and may reach out to talk with your child or a trusted loved one first.
contact:
  phone: "304-599-4200"
  email: campcaring@wvcaring.org
  url: https://www.wvcaring.org/camp-caring/

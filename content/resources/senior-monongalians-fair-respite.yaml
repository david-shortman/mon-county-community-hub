title: A break for caregivers of someone with dementia (FAIR respite)
slug: senior-monongalians-fair-respite
org: senior-monongalians
topics: [disability, health]
who_it_is_for: Families caring for someone with a doctor's diagnosis of Alzheimer's or another dementia. An aide sits with your loved one, up to 16 hours a week, so you can rest. The aide does activities like puzzles, games and talking, and helps with the toilet and light meals, but not bathing or grooming. A nurse visits your home first.
what_to_do: Call the Senior Monongalians nurse's office at 304-296-2503.
contact:
  phone: "304-296-2503"
  url: https://www.seniormons.org/blank-1
  url_label: In-home help
cost: Mostly paid by state grants. You pay an hourly co-pay on a sliding scale, billed monthly.

title: Organizational Arts Grants
slug: ycf-organizational-arts-grants
org: your-community-foundation
topics: [better]
who_it_is_for: Local 501(c)(3) nonprofits in good standing that are located in and serve Monongalia County, with an arts mission or an arts project. Schools, universities, libraries, churches and hospitals are not considered right now. Groups without an arts mission can ask for up to $5,000 for a project. See the full rules at the link.
what_to_do: The 2026-27 round is closed. The foundation says to check back in April 2027 for the 2027-28 round. You apply online with a budget. Arts questions go to the Arts Council of Greater Morgantown at info@artsgm.org.

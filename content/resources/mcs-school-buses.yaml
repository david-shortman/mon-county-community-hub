title: School bus schedules and delay alerts
slug: mcs-school-buses
org: monongalia-county-schools
topics: [family]
who_it_is_for: Families with children who ride a Monongalia County Schools bus.
what_to_do: Find your child's 2026-27 morning and afternoon bus times on the Transportation Department's site, by elementary, middle or high school. Fill out the district's online bus enrollment form there, so you get word when a bus is late, a route shuts down or a road is closed. The department is still updating some routes and marks updated ones in orange. Questions, call 304-983-8215.

title: Find a nonprofit or approved credit counselor
slug: find-approved-credit-counselor
org: us-trustee-program
topics: [money]
who_it_is_for: People who want advice on a budget, debts or a payment plan. Anyone who files for bankruptcy must take a credit counseling course from an approved agency before filing, with very limited exceptions.
what_to_do: Look up approved agencies for West Virginia on the U.S. Trustee Program's list, then check any agency with the WV Attorney General before you sign up.
steps:
  - Open the U.S. Trustee Program's list of approved credit counseling agencies and pick West Virginia and your judicial district.
  - Ask each agency what services it offers, what its fees are, and what happens if you cannot pay. The CFPB says to get a price quote in writing.
  - Check the agency with the state attorney general, the CFPB suggests.
notes:
  - The CFPB says credit counselors usually work for nonprofits and never tell you to stop paying your debts. Debt settlement, debt consolidation and credit repair companies are usually for-profit and charge for things you can do yourself for free.
  - The CFPB says to avoid groups that push a debt management plan before they look closely at your money situation, and groups that charge for information.
  - The U.S. Trustee Program says some agencies on its list are in another state but approved to counsel people here, and some counsel only by phone or internet.
  - Questions about the list go to the Credit Counseling Unit, 202-514-4100 or ust.cc.help@usdoj.gov.
contact:
  url: https://www.justice.gov/ust/list-credit-counseling-agencies-approved-pursuant-11-usc-111
  url_label: List of approved agencies
cost: "Fees vary. For the bankruptcy course, the U.S. Trustee Program says services are free or reduced based on what you can pay, and a household with income under 150 percent of the poverty level is presumed to get a fee waiver or reduction. See the full rules at the link."

title: The SOURCE Before and After School Program (Skyview Elementary)
slug: source-before-after-skyview
org: the-source-foundation
topics: [family, money]
who_it_is_for: Children at Skyview Elementary School in Westover.
what_to_do: Before care starts at 7 a.m. at Skyview, 668 River Road, with school breakfast. After care has homework help, games, crafts and STEM, with pick-up by 5:30 p.m. Registration for 2026-27 is open on the program's page. The program charges monthly tuition, due on the fifth of each month; the amounts are in its handbook. It accepts payments from the Child Care Resource Center (CCRC). Questions, call (304) 276-8427.
contact:
  phone: "304-276-8427"
  url: http://www.thesourcewv.org/before-after-school-program
  url_label: Register
cost: "Monthly tuition (see the handbook). An Extra Care Package for early dismissal days and teacher workdays is a one-time $200, with discounts for more than one child."

title: Ask a volunteer lawyer a question online
slug: wv-free-legal-answers
org: aba-free-legal-answers
topics: [legal]
who_it_is_for: West Virginians who qualify and have a civil (not criminal) legal question. The site first asks a few questions to see if you qualify. Topics include family, divorce, custody, housing, consumer rights, money, work, unemployment, health and disability, civil rights, juvenile and education law.
what_to_do: Go to the West Virginia Free Legal Answers website and answer the questions to see if you qualify. If you do, you make an account and type your question. You get an email when a volunteer lawyer answers, then sign in to read it. Register for yourself only, not for someone else.
contact:
  url: https://wv.freelegalanswers.org/
  url_label: Ask a question
cost: free
what_happens: The site says the volunteer lawyers cannot call you and cannot represent you in court. If you already have a court date or other deadline, it cannot promise an answer before that day.
sources:
  - url: https://wv.freelegalanswers.org/
    checked: 2026-10-31

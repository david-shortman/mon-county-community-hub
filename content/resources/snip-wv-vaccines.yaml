title: Low-cost rabies shots and pet vaccines (SNIP WV)
slug: snip-wv-vaccines
org: snip-wv
topics: [pets, health]
who_it_is_for: Dog and cat owners who need rabies shots, other vaccines, microchips or flea and worm treatments. SNIP WV says it has no income or location limits.
hours: Hours change from week to week. SNIP WV posts which days it is open on its social media each week.
get_in: appointment
what_to_do: Book a Preventative Care Appointment on SNIP WV's Make an Appointment page. You can also add shots to a spay or neuter visit.
contact:
  phone: "304-943-7460"
  url: https://www.snipwv.org/services
  url_label: Services and prices
  place: 1470 Earl L Core Road, Morgantown, WV 26505
cost: "A $35 deposit is needed for a preventative care visit, and it covers a nail trim, ear cleaning and a vet exam. One deposit covers more than one pet on the same day. Rabies shot: $20 at a wellness visit, $10 added to a surgery, or $25 for a 3-year shot with proof of an earlier rabies shot. Microchip: $25. Other vaccines are listed on the prices page."

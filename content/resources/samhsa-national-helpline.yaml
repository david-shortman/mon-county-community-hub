title: SAMHSA National Helpline, treatment referrals any hour
slug: samhsa-national-helpline
org: samhsa
topics: [health]
who_it_is_for: People and families facing mental health or substance use problems. SAMHSA says that if you have no insurance or not enough, it will refer you to your state office for state-funded treatment, or to places with a sliding fee or that take Medicare or Medicaid.
what_to_do: Call 1-800-662-HELP (1-800-662-4357), any hour, in English or Spanish. TTY 1-800-487-4889. It is free and confidential, and refers you to local treatment, support groups and community groups.
hours: 24 hours a day, 365 days a year
contact:
  phone: "1-800-662-4357"
  url: https://www.samhsa.gov/find-help/helplines/national-helpline
cost: free
sources:

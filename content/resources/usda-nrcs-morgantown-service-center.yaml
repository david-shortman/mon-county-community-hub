title: USDA conservation help (NRCS) at the Morgantown Service Center
slug: usda-nrcs-morgantown-service-center
org: usda-natural-resources-conservation-service
topics: [growing]
who_it_is_for: Farmers and landowners in Monongalia County. USDA's locator lists this NRCS field office for Monongalia County. The WV Department of Agriculture says a popular USDA program is cost-share for high tunnels, plastic-covered structures that stretch the growing season.
what_to_do: Call the office to ask about conservation programs and cost-share for your land.

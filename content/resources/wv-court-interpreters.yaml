title: Free interpreters in West Virginia state courts
slug: wv-court-interpreters
org: wv-supreme-court-of-appeals
topics: [legal]
who_it_is_for: Anyone with limited or no English who is part of a state court case, including plaintiffs, defendants, petitioners, respondents, witnesses, and parents or guardians when a minor is involved. This covers civil, criminal and family court.
what_to_do: Ask for a Request for Foreign Language Interpreter/Translation Services form at the county clerk's office, fill it out, and turn it in. The courts say you still have a right to an interpreter if you do not use the form, but the court must be told you need one. Family members and friends cannot interpret in court. For questions, call the Circuit and Family Court Services Division at 304-558-0145. A deaf person who needs a sign language interpreter should tell the court one week before the court date.
contact:
  phone: "304-558-0145"
  url: https://www.courtswv.gov/public-resources/accessibility-information/access-justice
  url_label: Court language access
cost: Free. The courts say interpreters are provided at no cost, regardless of ability to pay.
sources:

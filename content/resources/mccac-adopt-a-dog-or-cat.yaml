title: Adopt a dog or cat from the county shelter
slug: mccac-adopt-a-dog-or-cat
org: monongalia-county-canine-adoption-center
topics: [pets]
who_it_is_for: People who want to adopt a dog or cat from the Monongalia County Canine Adoption Center. The shelter says adopters must have all current pets spayed or neutered and up to date on rabies shots, show landlord approval if they rent, pass an adoption application, and have no history of animal cruelty or neglect. People under 18 need a parent or legal guardian. The shelter does not let you adopt an animal as a gift for someone else.
hours: Monday to Friday, by appointment only. Closed weekends and major holidays.
get_in: appointment
what_to_do: Look at the pets on the shelter's website, then call to set up a visit.
steps:
  - See adoptable pets on the shelter's website under Adoptable Pets.
  - Call 304-291-7267 and choose option 2 to make an appointment. The center is open to the public by appointment only.
  - Fill out and pass the adoption application.
  - Pay the adoption fee. The shelter says all adoption fees are non-refundable.
contact:
  phone: "304-291-7267"
  url: https://monongaliawv.animalservices.website/shelterpronet/home.spn
  url_label: See adoptable pets
  place: 106 Lockside Rd, Westover, WV 26501
cost: There is an adoption fee for dogs and a lower one for cats. Ask the shelter for the current amount when you call.
what_happens: Adopted animals are spayed or neutered before they go home. They get a combination vaccine, a dose of dewormer and a flea treatment, and the shelter's site says a microchip is registered in your name. The animals have not been fully checked by a vet, so the shelter says to take your new pet to a vet as soon as you can.

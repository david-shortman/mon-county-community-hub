title: Job search help and a free computer class at Goodwill
slug: goodwill-ncwv-career-and-computer-help
org: goodwill-of-north-central-west-virginia
topics: [work]
who_it_is_for: Anyone looking for a job, changing careers, or wanting to get better with computers. Goodwill says it is not a job placement service. It helps you look for work yourself.
what_to_do: Call or email the Welcome Center. Staff make a plan with you for resumes, job boards and interviews. Goodwill also runs PATH, a free computer and job skills class on Tuesday, Wednesday and Thursday nights. Tuesday and Thursday are online, and Wednesday meets in person at the Goodwill Morgantown Opportunity Center on Hunters Way. Sign up on the PATH page.
hours: The Welcome Center answers Monday to Friday, 9 a.m. to 4 p.m.
contact:
  phone: "1-877-499-3526"
  email: welcome@goodwillncwv.org
  url: https://www.goodwillncwv.org/life-changing-services/education-and-training/path/
  url_label: PATH computer class
cost: The PATH class is free. The career help page does not list a cost.

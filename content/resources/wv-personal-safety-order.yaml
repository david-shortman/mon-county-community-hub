title: Personal safety order (stalking, sexual assault or threats)
slug: wv-personal-safety-order
org: monongalia-county-magistrate-court
topics: [legal]
who_it_is_for: "People who need protection from someone who is not a family or household member and not a current or past romantic partner. Legal Aid of West Virginia says it is for a sexual offense or attempt, stalking or harassment, or repeated believable threats to hurt you. A parent or guardian can file for a child. If the person is family, a household member or a partner, use a domestic violence protective order instead."
what_to_do: "File a Petition for Personal Safety Order (form MPSPTOR, also in Spanish) at Magistrate Court. In Monongalia County, that is in the Justice Center, Suite 25. The form says to stay at the magistrate office until you get the order."
steps:
  - "A magistrate hears the petition and can give a temporary personal safety order."
  - "The final hearing is also before a magistrate, no later than 10 days after the other person gets the temporary order, state law says."
  - "A final order can last up to 2 years."
notes:
  - "In Monongalia County, a court form lets you take part in the final hearing by video from the local advocacy center for a sexual assault or stalking case. File it at least 48 hours before the hearing."
contact:
  phone: "304-291-7296"
  url: https://www.courtswv.gov/public-resources/court-forms/magistrate-court-forms
  url_label: Magistrate Court forms
  place: 75 High Street, Suite 25, Morgantown, WV 26505
cost: "The petition says you do not pay fees or costs when you file. If the petition is denied, you may be charged unless a fee waiver is approved. You can ask for a fee waiver at the Magistrate Court clerk's office."
if_you_want_help: [rdvic-court-advocacy, legal-aid-wv-civil-legal-help]

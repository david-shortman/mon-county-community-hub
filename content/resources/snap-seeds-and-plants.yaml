title: SNAP can buy seeds and plants that grow food
slug: snap-seeds-and-plants
org: wv-department-of-human-services
topics: [growing]
who_it_is_for: People who get SNAP (food stamps). The state's SNAP flyer says "SNAP benefits can be used to purchase any approved food item for human consumption, as well as seeds and plants that produce food."
what_to_do: Use your EBT card for seeds and food plants at stores and farmers markets that take SNAP. Ask the cashier if you are not sure a store takes SNAP for seeds and plants.

title: Get a copy of a West Virginia birth, death or marriage certificate from the state
slug: wv-vital-records-certificate-copy
org: wv-vital-registration
topics: [records, family]
who_it_is_for: "Anyone who needs a certified copy of a birth, death or marriage record from West Virginia. Birth records are not public until they are 100 years old. The state form says these people may order a birth certificate: you (if you are 18 or older), your parents or grandparents, your adult children or grandchildren, adult brothers and sisters, your spouse, and legal guardians or legal representatives. For a death certificate, the form also lists the informant named on the certificate."
what_to_do: Order in person in Charleston, by mail, or online. The state says in person is the fastest way, with same-day service. If you were born in Monongalia County, the County Clerk in Morgantown also sells copies (see the County Clerk listing).
steps:
  - "In person: go to the walk-up counter on the right side of the main lobby at 350 Capitol Street, Charleston. Open Monday to Friday, 8:30 a.m. to 5 p.m., except state holidays. Allow at least 15 minutes. 11:30 a.m. to 1 p.m. is busy."
  - "By mail: fill out the application form, and mail it with a color copy of your ID and a check or money order to Vital Registration Office, 350 Capitol Street, Room 165, Charleston, WV 25301-3701."
  - "Online: the state sends online orders to VitalChek, a private company. It charges its own extra fees, and you must take any problems with your order to that company."
contact:
  phone: "304-558-2931"
  url: https://dhhr.wv.gov/HSC/VR/CR/Pages/default.aspx
  url_label: How to order
cost: "$12 per copy. The fee includes a search fee you do not get back. If the record is not found, the office searches the year you gave, the year before and the year after. More searches are $12 for each three-year period. In person, pay with cash, check or money order. Cards are taken at the walk-up counter with a 4% added fee. By mail, check or money order only. Online companies add their own fees."
what_to_bring:
  - "One of these: a state driver's license (it can be expired), a U.S. or foreign passport, a military ID, or a photo ID card from a government program"
  - "Or two of these: a major credit card, a vehicle registration card, a state social services program card, or a recent utility bill in your name"
  - The application form, filled out ahead of time, to save time
  - Proof of how you are related, if the certificate is not your own

title: Report litter or an illegal dump to the county
slug: mon-county-litter-control
org: monongalia-county-commission
topics: [government, recycling]
who_it_is_for: Anyone who sees littering or an open dump in Monongalia County. The county's Litter Control Officer looks into reports and can write citations.
what_to_do: Fill out the Report a Violation form with where it is and what you saw. Leave your contact details if you want updates, or check the box to stay anonymous. You can also call.
contact:
  phone: "304-291-5940"
  url: https://www.moncountyrecycling.com/report-a-violation.html
  url_label: Report a violation
cost: free

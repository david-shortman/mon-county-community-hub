title: Where to get help with a business plan (state list)
slug: wv-sos-business-plan-assistance
org: wv-secretary-of-state
topics: [work]
who_it_is_for: Anyone writing a business plan for a new or growing business in West Virginia.
what_to_do: The Secretary of State keeps a list of federal, state, university and nonprofit offices that help with business plans. It names the U.S. Small Business Administration, the U.S. Department of Agriculture, the West Virginia Development Office, the WV Small Business Development Center, WVU Extension and others. The state says the list does not mean it endorses them. The page does not list costs, so ask each office.

title: Free year-long class to help prevent type 2 diabetes (Mon Health)
slug: mon-health-diabetes-prevention-program
org: mon-health-medical-center
topics: [health]
who_it_is_for: Adults at high risk for type 2 diabetes. Mon Health lists risk factors like being 35 or older, being overweight, family history, being active fewer than three times a week, having had gestational diabetes or a baby over 9 pounds, or a prediabetes diagnosis. You can join if you are at high risk, a doctor has told you that you have prediabetes, or you had gestational diabetes.
what_to_do: Call 304-599-8802, extension 3017, to pre-register and ask when the next group starts. Space is limited. You do not need a doctor's referral.
what_happens: It is the National Diabetes Prevention Program, a year-long group class.

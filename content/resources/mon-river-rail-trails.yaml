title: Walk, run or bike the Mon River, Caperton and Deckers Creek rail-trails
slug: mon-river-rail-trails
org: mon-river-trails-conservancy
topics: [health, community]
who_it_is_for: Anyone who wants a place to walk, jog, bike or use a wheelchair.
what_to_do: 48 miles of trail are open, with a smooth surface. In Morgantown and Star City, 8 miles are paved. See the trail maps on the Mon River Trails Conservancy site. The trails are not plowed in winter.
contact:
  url: https://montrails.org/rail-trail-info/
cost: The trail group's site lists no fee to use the trails.
sources:
  - url: https://montrails.org/rail-trail-info/

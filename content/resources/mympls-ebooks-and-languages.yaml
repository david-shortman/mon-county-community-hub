title: Free e-books, audiobooks and language lessons with a library card
slug: mympls-ebooks-and-languages
org: morgantown-public-library-system
topics: [community, work]
who_it_is_for: Anyone with a Morgantown Public Library System card. Monongalia County residents can get a digital-only card by email.
what_to_do: "Sign in with your library card number. Libby has e-books, audiobooks and magazines. Hoopla has music, comics, audiobooks and e-books, with no holds and no waiting. Mango Languages teaches more than 70 languages, plus American Sign Language. Learning Express Library has practice tests and lessons in math, reading, writing and science; for its login, call the library. Need help setting up your phone or tablet? The library's Tech Help will show you. Bring your library card number."

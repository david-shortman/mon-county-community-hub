title: Career Connections, job and training help for ages 16 to 24
slug: region-vi-career-connections
org: region-vi-workforce-development-board
topics: [work, family]
who_it_is_for: Young people ages 16 to 24 who live in the region, including Mon County, and are not in school. Other rules apply, and a career specialist checks them at your first appointment.
what_to_do: Call the career specialist for Monongalia and nearby counties at 304-844-1697 to set up an appointment. Depending on what you need, help can include finishing high school, paid or unpaid work experience (including summer jobs), job shadowing, training for a job credential, and a mentor.
contact:

title: Help with rent or a utility bill from Catholic Charities
slug: catholic-charities-emergency-financial-assistance
org: catholic-charities-west-virginia
topics: [housing, money]
who_it_is_for: West Virginia households behind on rent or a utility bill. It helps after a short-term hardship, like a job loss or a medical emergency. Catholic Charities says it is for households "with incomes at or below 150% of the federal poverty level."
what_to_do: Call Catholic Charities' Emergency Financial Assistance line for Monongalia County at 304-292-6597 and ask about help with rent or a utility bill. The program page says help "may include" rental assistance, "Help with rent payments to avoid eviction," and help with a utility bill to prevent a shutoff. Ask what papers to bring.
contact:
  phone: "304-292-6597"
  url: https://www.ccwva.org/programs/emergency-financial-assistance/
cost: free

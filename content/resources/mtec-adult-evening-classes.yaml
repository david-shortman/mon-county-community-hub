who_it_is_for: Adults who want to learn job skills at night, in computer, health jobs, and technical classes. MTEC also runs community classes in cooking, arts and crafts, and fitness.
what_to_do: See the fall class flyer and register online from MTEC's site. Fall registration is open until November 7, 2026. For questions, call 304-291-9243.

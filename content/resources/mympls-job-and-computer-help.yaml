title: Free computers, WiFi and job tools at the library
slug: mympls-job-and-computer-help
org: morgantown-public-library-system
topics: [work]
who_it_is_for: Anyone who needs a computer or the internet to look for work, or wants help with a resume, interviews or skills tests.
what_to_do: Use the free computers and WiFi at any Morgantown Public Library System location. Staff can help you use library tools on your own device. With a library card, you can also use these free online tools. Job and Career Accelerator helps you write a resume and cover letter and practice for interviews. Learning Express Library has practice tests in math, reading and writing. Call 304-291-7425 to get logins for both. TutorWV gives free one-on-one tutoring, test prep and job search help online, 10 a.m. to 10 p.m.
contact:
  phone: "304-291-7425"
  url: https://mympls.org/programs/adults/
  url_label: Library job tools
cost: Computers, WiFi and these online tools are free. Copies cost 10 cents (25 cents color). Faxes cost $1 a page, no more than $5 in all.

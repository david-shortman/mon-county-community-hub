title: Federal bonding for job seekers with a record
slug: federal-bonding-wv
org: workforce-west-virginia
topics: [work]
who_it_is_for: Job seekers who may be passed over because of a past conviction, little work history, or other barriers. A federal bond protects the employer against certain losses, which can make it easier to get hired.
what_to_do: Ask the WorkForce West Virginia office on Commerce Drive about federal bonding, or call 1-800-252-JOBS (5627).
cost: Free to the job seeker and the employer. The program's site says the bond covers the first six months of a job.
contact:
  phone: "1-800-252-5627"
  url: https://workforcewv.org/job-seeker/specialized-services/federal-bonding/

title: Low-interest loan to fix a failing septic system (Wastewater Revolving Loan Fund)
slug: mon-county-wastewater-loan-fund
org: monongalia-county-commission
topics: [money]
who_it_is_for: Owners of record of a Mon County property with a failing septic system. The loan guidelines say any county resident with a failing system may apply, and residents with the lowest incomes get the highest priority. The Health Department must confirm the system is failing first. The loan cannot pay for a repair that is already done, or for plumbing inside the home. See the full rules at the link.
what_to_do: Get the application from the Health Department's Septic and Wells page. Mail it to the Monongalia County Health Department, 453 Van Voorhis Road, Morgantown, WV 26505, with proof of income for everyone in your household, a current copy of your deed, and at least two written quotes from two different West Virginia certified septic installers (estimates are not accepted). Mark the quotes 1 and 2 to show which installer you want. The Health Department then calls you to meet. Call Environmental Services with questions.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/septic-and-wells
  url_label: Loan rules and application
cost: "A loan, not a grant. The guidelines say a loan is no more than $10,000 unless there are special circumstances, at no more than 3% interest, for up to 15 years. A $100 legal fee is added to the loan. A Deed of Trust is put on the property, and the loan must be paid in full before the property can be sold, transferred or inherited."

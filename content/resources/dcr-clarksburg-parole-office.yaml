who_it_is_for: "People on parole in Monongalia County. The state Division of Corrections and Rehabilitation puts Monongalia County in parole Region 6, served by the Clarksburg Parole Office. DCR lists no parole office in Morgantown."
what_to_do: Call the Clarksburg Parole Office with questions about reporting or the terms of your parole.

title: Mountain Line bus fares and passes
slug: mountain-line-fares
org: mountain-line-transit-authority
topics: [moving]
who_it_is_for: Anyone riding a local Mountain Line bus. Children 5 and under ride local routes free with an adult. Mountain Line also lists ride free or half fare programs for Monongalia County high school students, WVU students and staff, riders 62 and older (Gold Card), Medicare cardholders and people with disabilities, military families, and property tax payers. See the full rules at the link.
what_to_do: Pay the fare box with coins or a bill when you get on. The fare box and the driver cannot make change, so you get a change card to use on your next ride. You can also buy passes at Pifer Terminal, which Mountain Line also calls the Westover Terminal, or in the Token Transit app, which needs a credit or debit card and adds a convenience fee. Most local buses stop anywhere along the route. Wait in a safe place on the side of the street the bus is heading, and wave to the driver. The express routes (West Run, Blue & Gold and Beechurst Express) stop only at their marked stops. Local buses do not run on New Year's Day, Memorial Day, the Fourth of July, Labor Day, Thanksgiving or Christmas Day.
contact:
  phone: "304-291-7433"
  url: https://www.busride.org/Fares-Programs
  url_label: Fares and programs
  place: "691 Fairmont Road, Morgantown, WV 26501"
hours: Pifer Terminal depot, Monday to Sunday, 7 a.m. to 8 p.m.
cost: "One ride, one way: $0.75 to $1.00. 15 Ride Pass: $10.00. 30 Day Pass: $38.50, in the Token Transit app only. Monster Pass: $125.00 for one month of local routes plus the Grey Line. In the Token Transit app, a single ride is $0.86."

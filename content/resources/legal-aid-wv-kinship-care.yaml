title: Free legal help line for kinship caregivers (Legal Aid of WV)
slug: legal-aid-wv-kinship-care
org: legal-aid-of-west-virginia
topics: [family, legal]
who_it_is_for: People in West Virginia caring for a relative's child, for example grandparents raising grandchildren.
hours: Hotline open Mondays, 2 to 4 p.m., except holidays.
what_to_do: Call the free kinship care information hotline at 304-414-5449 on Mondays from 2 to 4 p.m. to speak with a kinship care advocate. You can also use the online Kinship Connector for free legal information and help with paperwork for adoption, guardianship and temporary care agreements.
what_happens: Legal Aid says it can help with issues like guardianship, adoption, custody agreements, school special education needs, public benefits, estate planning and student financial aid.
contact:
  phone: "304-414-5449"
  url: https://legalaidwv.org/our-programs/legal-services/kinship-care/
  url_label: Kinship care help
cost: free

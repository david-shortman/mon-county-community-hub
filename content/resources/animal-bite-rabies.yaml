title: After an animal bite or scratch
slug: animal-bite-rabies
org: monongalia-county-health-department
topics: [pets, health]
who_it_is_for: Anyone in Monongalia County who is bitten or scratched by an animal, whose pet bites or is bitten, or who finds a bat in the house.
what_to_do: "Call 911 for a severe bite, any wild animal bite, or an animal that looks like it has rabies. For a bite that is not severe from a stray pet, call MECCA's non-emergency line at 304-599-6382."
steps:
  - "Call 911 if: the bite is severe, a wild animal bit you, or you see an animal showing signs of rabies. Do not go near the animal."
  - "Call MECCA non-emergency, 304-599-6382, if: a stray dog or cat bit you or your pet and it is not severe, a stray on your property is acting sick or has died, or you find a bat in your house."
  - If you do not see a doctor or vet after an animal bite or scratch, tell the Health Department within 24 hours using the form on its Rabies Control page, or call 304-598-5131.
  - If a pet bites someone, the Health Department may ask that it be kept apart at home or at an animal care place for 10 days.
contact:
  phone: "304-598-5131"
  url: https://www.monchd.org/services/rabies-control
  url_label: Rabies Control page
cost: free
what_happens: A Health Department sanitarian will try to reach the owner of the pet that bit, check that it has a current rabies shot, and give a notice to keep the pet apart for 10 days. The Health Department says it will not fine owners or take away pets if a pet bites another animal.
sources:

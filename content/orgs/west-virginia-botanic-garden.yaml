summary: A nonprofit garden on the 82-acre former Tibbs Run Reservoir at 1061 Tyrone Road, Morgantown, with gardens, woods and trails. The grounds are open every day from dawn to dusk. Entry is free, and it asks for a $5 donation per adult. It also runs nature programs and camps.

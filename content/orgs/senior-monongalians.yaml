summary: A nonprofit senior center at the Mountaineer Mall, 5000 Greenbag Road, Suite A5, Morgantown, open Monday to Friday, 8 a.m. to 4 p.m. It serves lunch and home-delivered meals for people 60 and older, and offers rides to the center, in-home care programs and activities.

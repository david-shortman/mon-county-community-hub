summary: A local United Way that raises money each year and funds nonprofit programs in Mon and Preston counties. It works in four areas, Healthy Community, Youth Opportunity, Financial Security and Community Resiliency, and runs programs such as the Imagination Library, Helpful Harvest and the Family Resource Network. Community members find volunteer openings through its GivePulse page; WVU staff, faculty and students use WVU iServe.

summary: A local United Way that raises money each year and funds nonprofit programs in Mon and Preston counties. It works in four areas, Healthy Community, Youth Opportunity, Financial Security and Community Resiliency, and runs programs such as the Imagination Library, Helpful Harvest and the Family Resource Network. To volunteer, community members use its page on GivePulse, a volunteer sign-up website. WVU staff, faculty and students use WVU iServe, the university's volunteer site.

summary: Runs all public parking garages, lots and on-street parking in the City of Morgantown, sells monthly and blue curb permits, and handles its own parking tickets. Its office is in the Public Safety Building at 300 Spruce Street, open Monday to Friday, 8 a.m. to 5 p.m. The night and weekend help line is 304-376-5252.

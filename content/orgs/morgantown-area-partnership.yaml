summary: Describes itself as "a public/private alliance for the betterment of economic, business and community development in the area." It includes four groups, the Morgantown Area Chamber of Commerce, the Monongalia County Development Authority, the Morgantown Area Economic Partnership and the Campus Neighborhoods Revitalization Corporation (Sunnyside Up). Its website also has a page for Main Street Morgantown.

summary: A state center on the WVU Health Sciences campus in Morgantown. It offers free West Virginia advance directive forms (living will, medical power of attorney, and others), explains medical orders like the POST form and DNR card, and runs the WV e-Directive Registry, which makes people's forms available to their health care providers at any hour.

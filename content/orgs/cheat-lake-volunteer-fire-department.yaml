name: Cheat Lake Volunteer Fire Department
slug: cheat-lake-volunteer-fire-department
kind: nonprofit
website: https://www.cheatlakefire.org/
summary: A volunteer fire department and 501(c)(3) charity that covers about 56 square miles around Cheat Lake, from its station at 409 Fairchance Road, Morgantown. Its members are not paid and raise the money for trucks, gear and training. It holds public events, rents its hall, and takes new members, with a junior program for ages 14 to 17. Email contact@cheatlakefire.org.

summary: The county office that assesses property for taxes. It takes personal property returns (including vehicles) and farm applications, and its field staff review parcels. It is in Room 335, 243 High Street, Morgantown, open Monday to Friday, 8:30 a.m. to 4:30 p.m. To pay property taxes, contact the Sheriff's Tax Department instead.

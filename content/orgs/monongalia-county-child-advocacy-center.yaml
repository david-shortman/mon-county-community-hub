summary: A nonprofit at 909 Greenbag Road, Morgantown, that has served children who have been abused or have had other hard experiences, and their families, since 2005. It offers interviews with trained staff, family advocacy, therapy and case management. It works with police, prosecutors, child protection workers and medical and mental health workers. It also runs community education, a program for children Monongalia County Schools identifies, and a program for families affected by substance use. Families have no out-of-pocket cost for these programs.

summary: A group working to clean up and care for the Deckers Creek watershed through acid mine drainage cleanup, trash cleanups, education and events. Its site lists a Paint Exchange program and asks for volunteers. Its office is at 205 Parsons Street, Morgantown, in the former Woodburn Elementary building. Call ahead before you drop by, since staff often work in the field.

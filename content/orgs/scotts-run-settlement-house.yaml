phone: "304-435-5098"   # call or text, per the source
summary: A nonprofit that serves people and families in Monongalia County facing economic hardship. It has two sites, at 750 Fairchance Road, Morgantown and 41 Lady Bug Drive, Osage. Food pantry pickup is by appointment, so call or text 304-435-5098 first. Its Free and Fresh Market, outside both buildings, gives away produce and other items for free, usually set out between noon and 1 p.m. (Monday to Wednesday at Fairchance Road, Thursday and Friday at Osage). Take only what you will use. Call or text the same number to ask what other help is available.
topics: [poverty]

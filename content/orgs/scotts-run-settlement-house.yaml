summary: A nonprofit that serves people and families in Monongalia County facing economic hardship. It has two sites, at 750 Fairchance Road, Morgantown (open Monday to Wednesday, 8:30 a.m. to 4:30 p.m.) and 41 Lady Bug Drive, Osage (open Thursday and Friday, 8:30 a.m. to 4:30 p.m.). Call or text 304-435-5098 to ask what help is available.

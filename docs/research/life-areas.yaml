# Life areas for the tiles on /topics/ (#1040). The data behind the table in
# life-areas-coverage-map.md, kept beside it so the tiles change when the map
# does. Each area: its name, its pages (the first is where the tile links), and
# what is not covered yet, each gap with the open issue or PR that tracks it.
# The tile counts only pages that exist, and the build fails on a page that
# does not (site/test/life-areas.test.mjs). Recheck gaps when the map is
# reviewed (monthly), and remove a gap when its issue or PR closes.
checked: 2026-11-02
areas:

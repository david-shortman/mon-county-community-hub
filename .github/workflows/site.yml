name: Site

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every morning so past dates roll off the calendar.
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read # the group request numbers on Corrections (#523)
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so a pull request can see which files it changed (the e2e scope below).
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check-content
      - run: npm run build
        env:
          # Read-only, to count group requests (#523). The build still works without it.
          GITHUB_TOKEN: ${{ github.token }}
      # Site search test (#529): do the words residents type find the right page?
      # A report on the run's summary page, never a gate. docs/operations/search-test.md
      - continue-on-error: true
        run: node scripts/search-test.mjs --summary search-test.md && cat search-test.md >> "$GITHUB_STEP_SUMMARY"
      # Accessibility scan (#105): axe-core on every page, light and dark, plus 320px reflow.
      # Fails only on serious or critical problems. Free: Chromium comes from npm's Playwright.
      # Pull requests only, so the daily rebuild and deploys never wait on a browser download.
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      # End-to-end tests (docs/operations/e2e-tests.md): the full suite when a PR changes the
      # site, its content or this workflow; a quick smoke subset otherwise.
      - if: github.event_name == 'pull_request'
        id: scope
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(site|content|apps)/|^\.github/workflows/site\.yml$'; then
            echo "suite=e2e" >> "$GITHUB_OUTPUT"
          else
            echo "suite=e2e:smoke" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'pull_request'
        run: npm run check-a11y
      # !cancelled(): still run when the accessibility scan fails, so both results show.
      - if: ${{ !cancelled() && steps.scope.outputs.suite != '' }}
        run: npm run ${{ steps.scope.outputs.suite }}
      # Phone screenshots of the most-used pages for reviewers. Not committed: open the run's
      # summary page and download "phone-screenshots".
      - if: ${{ !cancelled() && steps.scope.outputs.suite == 'e2e' }}
        run: npm run screenshots
      - if: ${{ !cancelled() && steps.scope.outputs.suite == 'e2e' }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: site/e2e-shots/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

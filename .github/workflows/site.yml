name: Site

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every morning so past dates roll off the calendar.
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read # the group request numbers on Corrections (#523)
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check-content
      - run: npm run build
        env:
          # Read-only, to count group requests (#523). The build still works without it.
          GITHUB_TOKEN: ${{ github.token }}
      # Accessibility scan (#105): axe-core on every page, light and dark, plus 320px reflow.
      # Fails only on serious or critical problems. Free: Chromium comes from npm's Playwright.
      # Pull requests only, so the daily rebuild and deploys never wait on a browser download.
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'pull_request'
        run: npm run check-a11y
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Suggest a resource or correction
description: Tell us about a local resource, or something we got wrong
labels: ["type:content", "for:duet"]
body:
  - type: markdown
    attributes:
      value: This is public. Please don't include your name, phone, address or personal story. Public organization contacts are fine.
  - type: input
    id: name
    attributes:
      label: Organization or resource name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website or source link
  - type: dropdown
    id: who
    attributes:
      label: How do you know about this? (optional)
      description: No names needed. Reports from people who work at a place or help others find services are read first.
      options:
        - I work or volunteer at this place
        - I help people find services
        - I used this
        - Other or prefer not to say
  - type: textarea
    id: details
    attributes:
      label: What should we add or fix?
    validations:
      required: true

name: Task
description: A piece of work for David, Duet, or a Claude Code session
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The resident question this answers
      description: In a resident's own words, for example "Where can I get a flu shot this week?"
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How we will know it worked
      description: The scoreboard row or findability question it should move, and when to check (7 or 30 days).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
  - type: textarea
    id: done
    attributes:
      label: Done looks like
  - type: textarea
    id: links
    attributes:
      label: Links and context
